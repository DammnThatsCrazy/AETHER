# =============================================================================
# Aether ML — Docker Compose for local development
#
# Default (no flags): serving API only. ~600 MB RAM, ~10 s to boot.
# Models load lazily from /opt/ml/models on first request.
#
# In production the serving image points at S3 for artifacts and uses
# MLflow in library mode (no MLflow server required). Locally you can
# either mount pre-exported ONNX files into model-data, or spin up the
# optional experiment profile to run a local MLflow server.
#
# Profiles (opt-in):
#   --profile experiment   local MLflow server (experiment tracking)
#   --profile observability prometheus (metrics scraping)
#   --profile notebooks    jupyter lab + mlflow (interactive training)
#   --profile full         everything
#
# Usage:
#   cd docker && docker compose up -d
#   docker compose --profile experiment up -d
#   docker compose --profile notebooks up -d
#   docker compose --profile full up -d
#   docker compose down
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # ML Model Serving API — always on; models load lazily on first request
  # -------------------------------------------------------------------------
  serving:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: serving
    ports:
      - "8000:8000"
    volumes:
      - model-data:/opt/ml/models
    environment:
      - AETHER_ENV=local
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Redis — feature store / prediction cache (experiment profile)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles: ["experiment", "full"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # -------------------------------------------------------------------------
  # MLflow — experiment tracking and model registry (experiment profile)
  # -------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    # Included in `notebooks` so `jupyter` (which depends_on mlflow) can
    # start under `--profile notebooks` without also requiring experiment.
    profiles: ["experiment", "notebooks", "full"]
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow

  # -------------------------------------------------------------------------
  # Prometheus — metrics scraping (observability profile)
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # -------------------------------------------------------------------------
  # Jupyter Lab — interactive exploration and prototyping (notebooks profile)
  # -------------------------------------------------------------------------
  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: training
    profiles: ["notebooks", "full"]
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser
    volumes:
      - ..:/app
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    depends_on:
      - mlflow

volumes:
  model-data:
  redis-data:
  mlflow-data:
