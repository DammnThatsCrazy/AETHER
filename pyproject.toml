# =============================================================================
# Aether Platform — Root Project Configuration
#
# Single source of truth for:
#   - Platform version (used by scripts/bump_version.py)
#   - Python dependencies across all subsystems
#   - Test discovery paths
#   - Linter/formatter settings
#
# Quick start:
#   pip install -e ".[dev]"     # minimal: security + tests
#   pip install -e ".[all]"     # everything: agent, backend, ml, security, dev
#   make setup                  # same as pip install -e ".[all]"
#   make test                   # run all tests
# =============================================================================

[project]
name = "aether"
version = "8.12.0"
description = "Aether Platform — Cross-platform Unified Intelligence Graph"
requires-python = ">=3.10"
license = {text = "Proprietary"}

# Core dependencies shared by security module and basic operation
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
# Security module (extraction defense)
security = [
    "numpy>=1.26.0",
]

# Agent Layer workers (discovery + enrichment)
agent = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

# Agent Layer production queue
agent-celery = [
    "celery[redis]>=5.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

# Backend API server
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Outbound delivery adapters (services/delivery/adapters/{slack,linear,jira,
    # webhook}.py) import aiohttp directly for provider dispatch. It was only ever
    # present transitively (via gremlinpython), so any resolver change or narrower
    # install left the adapters — and their integration tests that patch
    # aiohttp.ClientSession — unable to import it. Declare it explicitly: it is
    # genuine production behavior for the delivery pipeline, not a transitive
    # accident.
    "aiohttp>=3.9",
    "redis>=5.0.0",
    "cryptography>=42.0",
    "aiokafka>=0.10.0",
    "gremlinpython>=3.7.0",
    "prometheus-client>=0.20.0",
    "asyncpg>=0.29.0",
    "PyJWT>=2.8.0",
    "graphql-core>=3.2.0",
    "eth-account>=0.11.0",
    # Ed25519 for SVM reward-signer key validation (credential authority
    # key_derivation_check) and real Solana proof signing (multichain signer).
    "pynacl>=1.5.0",
    # eth-hash (pulled transitively by eth-account -> eth-utils) needs a keccak
    # backend. Without one the interop providers (services/interop/providers/*)
    # fail to import, which (a) flips the generated adapter-certification-matrix
    # to "scaffolded" -> repo-consistency drift, and (b) errors the interop tests
    # at collection -> python-tests. Declaring the backend keeps CI reproducible.
    "pycryptodome>=3.20.0",
    "boto3>=1.34.0",
    "anthropic>=0.25",
    # services/model_runtime/config.py imports pydantic_settings.BaseSettings at
    # import time, and services/noesis/provider.py reaches it through the
    # model_runtime package barrel — so a fresh CI bootstrap that skips the
    # transitive install leaves every backend+noesis test ModuleNotFoundError
    # (it was only ever present locally by accident). Declared explicitly: it is
    # genuine production behavior for the harness control plane, not a
    # transitive accident.
    "pydantic-settings>=2.4.0",
    "croniter>=2",   # jobs platform cron schedules (services/jobs/scheduler.py)
    "tzdata",        # IANA tz database for zoneinfo on slim images
    "alembic>=1.13", # migrations + /v1/ready migrations-head check + RUN_MIGRATIONS
    # Kyber workforce device trust: server-side WebAuthn registration/assertion
    # verification (services/kyber/devices/webauthn.py). Hand-rolling COSE/CBOR
    # attestation parsing and counter checks is a needless security risk, so the
    # maintained library is a declared backend dependency rather than optional.
    "webauthn>=2.0",
]

# Backend with Stripe Billing integration
backend-stripe = [
    "stripe>=10.0.0",
]

# ML model training and serving
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.0",
]

# Development and testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "hypothesis>=6.0",  # property-based invariant tests for the computation substrate
    "ruff>=0.4",
    "PyYAML>=6.0",  # used by scripts/validate_frontmatter.py
    "cyclonedx-bom>=4.0",  # `make sbom` — the supply-chain gate fails closed without it
    "pip-audit>=2.7",  # advisory dependency audit in `make supply-chain-check`
]

# Everything
all = [
    "aether[security,agent,backend,backend-stripe,ml,dev]",
]

# ---------------------------------------------------------------------------
# Pytest — unified test discovery across all subsystems
# ---------------------------------------------------------------------------

# NOTE: "ML Models/aether-ml/tests" is NOT listed here. Both suites ship a
# tests/conftest.py that resolves to the same module path, so a combined
# invocation fails with ImportPathMismatchError. Run the ML suite separately:
#   python -m pytest "ML Models/aether-ml/tests/"
# (make test, scripts/repo_doctor.py, and CI all run the suites separately.)
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = ["."]
markers = [
    "asyncio: async test functions",
    "integration: integration tests requiring backend deps",
]
asyncio_mode = "auto"
addopts = "-n auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "AWS Deployment/mnt/**",
    "Backend Architecture/mnt/**",
    "cicd/**",
    "**/node_modules/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # intentional local imports for optional dependency stubs/path setup
    "E501",  # line length handled by formatter
    "E701",  # legacy compact test doubles; tracked separately from correctness gate
    "E731",  # legacy lambda assignment in auxiliary services
    "E741",  # legacy loop variable names
    "F401",  # package re-exports and optional import availability probes
    "F541",  # legacy placeholder f-strings in operator/deployment scripts
    "F841",  # staged cleanup for unused locals across legacy subsystems
    "I001",  # staged import ordering cleanup across legacy subsystems
]

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["security*"]
