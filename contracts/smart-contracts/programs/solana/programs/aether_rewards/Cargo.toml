[package]
name = "aether-rewards"
version = "0.2.0"
description = "Aether Rewards -- oracle-attested, domain-separated native-SOL reward distribution (observation/coordination; program-owned reward pool)."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aether/aether"

[lib]
crate-type = ["cdylib", "lib"]
name = "aether_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Pin exact versions for reproducible builds (see audit/13-reproducible-build.md).
# Anchor 0.30.1 pairs with the Solana 1.18.x toolchain; adjust in lockstep only.
anchor-lang = "=0.30.1"
aether-domain = { path = "../../domain" }
