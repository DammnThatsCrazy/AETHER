[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.localnet]
aether_rewards = "7pbSKNKWPHqUVPmvkBwogxtyyp57P9n7FdDzRxQUCM2o"

[programs.devnet]
aether_rewards = "7pbSKNKWPHqUVPmvkBwogxtyyp57P9n7FdDzRxQUCM2o"

[programs.testnet]
aether_rewards = "7pbSKNKWPHqUVPmvkBwogxtyyp57P9n7FdDzRxQUCM2o"

[registry]
url = "https://api.apr.dev"

# Provider is resolved from environment / secret references at deploy time.
# NEVER commit a keypair path that points at a real funded key here; the deploy
# scripts export ANCHOR_WALLET / ANCHOR_PROVIDER_URL from the environment.
[provider]
cluster = "Localnet"
wallet = "${ANCHOR_WALLET}"

[scripts]
# `anchor test` entrypoint (spins up a local validator unless --skip-local-validator).
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 12000
shutdown_wait = 4000

[test.validator]
# Ensures the Ed25519 precompile is available (it is native on all clusters).
url = "http://127.0.0.1:8899"
