version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd ../.. && npm ci
        - cd ../.. && npm run build --workspace=packages/shared
        - cd ../.. && npm run build --workspace=packages/sdk/web
    build:
      commands:
        - cd ../.. && npm run build --workspace=apps/aether-web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
