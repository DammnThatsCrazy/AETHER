<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/colors_and_type.css">
  <script src="../_ds/_ds_bundle.js"></script>
  <title>Legal — Olympus Labs</title>
  <meta property="og:type" content="website">
  <meta name="description" content="Privacy and terms for Olympus Labs and Aether.">
  <meta property="og:title" content="Legal — Olympus Labs">
  <meta property="og:description" content="Privacy and terms for Olympus Labs and Aether.">
  <meta property="og:image" content="../assets/og/legal.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; background: #f5f4f1; }
    a { color: #3a6896; }
    a:hover { color: #2d5373; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
  </style>
</helmet>
<div style="min-height: 100vh; background: #f5f4f1; color: #1a1a1e; font-family: var(--font-sans);" data-screen-label="Legal">
  <dc-import name="Site Header" brand="olympus" active="" hint-size="100%,56px"></dc-import>
  <main style="max-width: 720px; margin: 0 auto; padding: clamp(64px, 10vw, 128px) 24px clamp(72px, 10vw, 128px); display: flex; flex-direction: column; gap: 32px;">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px;">
      <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: #6b6a65;">Legal</span>
      <h1 style="font-size: clamp(36px, 5.4vw, 60px); font-weight: 500; letter-spacing: -0.04em; line-height: 1; margin: 0;">{{ doc.title }}</h1>
      <p style="font-size: 17px; line-height: 1.6; color: #4a4945; margin: 0; max-width: 560px;">{{ doc.lead }}</p>
      <div role="tablist" aria-label="Legal documents" style="display: flex; gap: 20px; border-bottom: 1px solid #d8d6d0;">
        <sc-for list="{{ docs }}" as="d" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{ d.sel }}" onClick="{{ d.go }}" style="{{ d.tab }}">{{ d.label }}</button></sc-for>
      </div>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid #d8d6d0;">
      <sc-for list="{{ doc.summary }}" as="s" hint-placeholder-count="3"><li style="display: flex; gap: 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #d8d6d0; font-size: 15px; line-height: 1.5;"><span style="font-family: var(--font-mono); font-size: 12px; color: #9c9b95;">{{ s.g }}</span>{{ s.x }}</li></sc-for>
    </ul>
    <sc-for list="{{ doc.sections }}" as="sec" hint-placeholder-count="6">
      <section id="{{ sec.id }}" style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="font-size: 19px; font-weight: 500; letter-spacing: -0.2px; margin: 0;">{{ sec.title }}</h2>
        <p style="font-size: 15px; line-height: 1.7; margin: 0; color: #4a4945;">{{ sec.x }}</p>
      </section>
    </sc-for>
    <p style="font-size: 14px; color: #6b6a65; margin: 16px 0 0; padding-top: 24px; border-top: 1px solid #d8d6d0; text-align: center;">Questions? <a href="mailto:team@olympuslabsml.com" style="color: #1a1a1e;">team@olympuslabsml.com</a></p>
  </main>
  <dc-import name="Site Footer" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showReviewFlags&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    let d = 'privacy';
    try { d = new URLSearchParams(window.location.search).get('doc') || (window.location.hash.includes('terms') ? 'terms' : 'privacy'); } catch (e) {}
    this.state = { doc: d === 'terms' ? 'terms' : 'privacy' };
  }
  renderVals() {
    const C = { cobalt: ['#3a6896', '#2d5373', 'rgba(58,104,150,0.12)'], sage: ['#6b9a7c', '#4f7a5e', 'rgba(107,154,124,0.15)'], ochre: ['#c9975a', '#8a6433', 'rgba(201,151,90,0.16)'], ember: ['#b5564a', '#a3473c', 'rgba(181,86,74,0.12)'], steel: ['#5a85a8', '#3f6a8c', 'rgba(90,133,168,0.14)'], solar: ['#a88a5a', '#7d6538', 'rgba(168,138,90,0.16)'] };
    const D = {
      privacy: { g: '✓', c: C.sage, title: 'Privacy and data use', label: 'Privacy and data use', updated: 'draft', lead: 'How Olympus Labs handles personal information on its public websites, and how Aether handles customer data on a customer’s behalf.',
        summary: [['✓', C.sage, 'Customers own their data. Aether handles it for them.'], ['⬡', C.cobalt, 'One customer’s data is never shared with another.'], ['■', C.ember, 'Personal information is never sold.']],
        sections: [['scope', 'Scope', 'This notice covers the Olympus Labs and Aether public websites, documentation, status page, and contact forms. What happens inside a customer’s own Aether account is covered by that customer’s agreement.'], ['collect', 'What is collected', 'Information you submit through contact and sign-up forms, and limited site analytics after consent. Aether SDKs added to a customer’s site or app collect only what the customer sets up and what a person agrees to.'], ['use', 'How it is used', 'To answer inquiries, provide the service, secure it, and improve it. Contact details are used only to reply unless you opt in to more.'], ['roles', 'Controller and processor', 'For public-site data, Olympus Labs is the controller. For data inside a customer’s account, the customer decides how it is used and Olympus Labs handles it on their behalf.'], ['share', 'Sharing and sub-processors', 'Shared only with service providers needed to run the service, such as payment processing through Stripe. A sub-processor list is available on request.'], ['retention', 'Retention and deletion', 'Kept only as long as needed. Deleting data removes the raw customer data and stops new data from coming in.'], ['rights', 'Your rights', 'Depending on where you live, you may request access, correction, deletion, or a copy of your information.'], ['contact', 'Contact', 'Send privacy requests to team@olympuslabsml.com.']] },
      terms: { g: '◈', c: C.cobalt, title: 'Terms and use', label: 'Terms and use', updated: 'draft', lead: 'The terms that govern use of the Olympus Labs and Aether websites and, where no separate agreement exists, the Aether service.',
        summary: [['◈', C.cobalt, 'A signed customer agreement overrides these terms.'], ['▲', C.ochre, 'Aether is in private alpha, before public release.'], ['■', C.ember, 'Not allowed: secret monitoring and unlawful targeting.']],
        sections: [['acceptance', 'Acceptance', 'Using the sites or service means accepting these terms. A signed agreement with Olympus Labs replaces them where the two conflict.'], ['service', 'The service', 'Aether is offered as a private alpha, before public release. Features may change, and availability isn’t guaranteed.'], ['accounts', 'Accounts and keys', 'You’re responsible for your account, the keys you create, and what is sent with them. Keep private keys out of website and app code.'], ['acceptable', 'Acceptable use', 'Don’t use the service to secretly monitor people, manipulate politics, add data people didn’t agree to, target people unlawfully, or reach another customer’s data.'], ['data', 'Your data', 'You own the data you send. You grant Olympus Labs the rights needed to process it to provide the service.'], ['billing', 'Billing', 'Paid plans are billed through Stripe according to the plan selected at checkout.'], ['liability', 'Warranties and liability', 'To be supplied by counsel.'], ['changes', 'Changes', 'Material changes will be announced before they take effect.']] },
    };
    const cur = D[this.state.doc];
    return {
      flags: this.props.showReviewFlags ?? false,
      docs: Object.entries(D).map(([k, d]) => { const on = k === this.state.doc; return { label: d.label, g: d.g, sel: on ? 'true' : 'false', go: () => this.setState({ doc: k }),
        gStyle: 'font-family: var(--font-mono); color: ' + (on ? '#f5f4f1' : d.c[1]) + ';',
        style: 'font-family: inherit; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 120ms; ' + (on ? 'background: ' + d.c[1] + '; color: #f5f4f1; border: 1px solid ' + d.c[1] + ';' : 'background: #eceae5; color: #1a1a1e; border: 1px solid #d8d6d0;'),
        hover: on ? 'background: ' + d.c[1] + ';' : 'background: ' + d.c[2] + ';',
        tab: 'font-family: inherit; background: transparent; border: 0; padding: 10px 0; margin-bottom: -1px; cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 2px solid ' + (on ? '#1a1a1e' : 'transparent') + '; color: ' + (on ? '#1a1a1e' : '#6b6a65') + '; transition: color 120ms cubic-bezier(0.22,1,0.36,1), border-color 120ms cubic-bezier(0.22,1,0.36,1);' }; }),
      outline: cur.sections.map(([id, t]) => ({ href: '#' + id, label: t })),
      headChip: 'width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 16px; background: ' + cur.c[2] + '; color: ' + cur.c[1] + ';',
      doc: { g: cur.g, title: cur.title, lead: cur.lead, updated: cur.updated,
        summary: cur.summary.map(([g, c, x]) => ({ g, x, gStyle: 'font-family: var(--font-mono); color: ' + c[1] + ';', style: 'flex: 1 1 200px; display: flex; gap: 10px; align-items: baseline; padding: 14px; border-radius: 12px; background: ' + c[2] + '; border: 1px solid ' + c[0] + '55;' })),
        sections: cur.sections.map(([id, title, x], i) => ({ id, title, x, n: String(i + 1).padStart(2, '0'), nStyle: 'font-family: var(--font-mono); font-size: 12px; color: ' + cur.c[1] + ';' })) },
    };
  }
}
</script>
</body>
</html>
