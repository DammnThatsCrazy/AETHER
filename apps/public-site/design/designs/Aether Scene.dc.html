<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/olympus-aether-design-system-019e2cf9-5780-76be-8adc-67b23658c331/colors_and_type.css">
  <script src="_ds/olympus-aether-design-system-019e2cf9-5780-76be-8adc-67b23658c331/_ds_bundle.js"></script>
  <style>
    @keyframes aeDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes aeFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
    @keyframes aeFade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</helmet>
<div style="position: relative; overflow: hidden; width: 100%; box-sizing: border-box; border-radius: 22px; background: #0d0d10; border: 1px solid rgba(255,255,255,0.08); padding: clamp(12px, 2vw, 20px); font-family: var(--font-sans); color: #e8e6e1;">
  <div style="position: absolute; width: 70%; aspect-ratio: 1; left: -18%; top: -26%; border-radius: 999px; background: radial-gradient(closest-side, rgba(58,104,150,0.62), rgba(58,104,150,0));"></div>
  <div style="position: absolute; width: 62%; aspect-ratio: 1; right: -20%; top: 18%; border-radius: 999px; background: radial-gradient(closest-side, rgba(201,151,90,0.46), rgba(201,151,90,0));"></div>
  <div style="position: absolute; width: 66%; aspect-ratio: 1; left: 12%; bottom: -34%; border-radius: 999px; background: radial-gradient(closest-side, rgba(107,154,124,0.42), rgba(107,154,124,0));"></div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 14px;">
    <sc-if value="{{ controls }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
        <div role="tablist" aria-label="Scenario" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);">
          <sc-for list="{{ stories }}" as="s" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ s.sel }}" onClick="{{ s.go }}" style="{{ s.style }}"><span style="font-family: var(--font-mono);">{{ s.g }}</span>{{ s.label }}</button></sc-for>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: #b4b2ac;"><span style="{{ liveDot }}"></span>{{ liveLabel }}</span>
      </div>
    </sc-if>
    <div ref="{{ wrapRef }}" style="position: relative; width: 100%; aspect-ratio: 600 / 440;">{{ stageEl }}</div>
    <sc-if value="{{ controls }}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4"><button type="button" onClick="{{ st.go }}" aria-pressed="{{ st.sel }}" style="{{ st.style }}"><span style="{{ st.bar }}"></span><span style="display: flex; gap: 6px; align-items: baseline;"><span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.7;">{{ st.n }}</span><span>{{ st.label }}</span></span></button></sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-height: 44px;">
        <span style="font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: -0.01em; color: #f2f0ec; text-wrap: pretty;">{{ caption }}</span>
        <span style="font-family: var(--font-mono); font-size: 11px; color: #b4b2ac;">{{ sub }}</span>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:620},&quot;story&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;customer&quot;,&quot;agent&quot;,&quot;value&quot;],&quot;default&quot;:&quot;customer&quot;,&quot;tsType&quot;:&quot;'customer'|'agent'|'value'&quot;},&quot;stage&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;controls&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;stages&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0,1,2,3&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { story: null, stage: null, hold: false, k: 1 };
  wrapRef = React.createRef();
  componentDidMount() {
    this.reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.props.autoplay && !this.reduce) this.timer = setInterval(() => this.tick(), this.props.interval ?? 4200);
    const fit = () => { const w = this.wrapRef.current && this.wrapRef.current.clientWidth; if (w) this.setState({ k: w / 600 }); };
    fit();
    if (typeof ResizeObserver !== 'undefined' && this.wrapRef.current) { this.ro = new ResizeObserver(fit); this.ro.observe(this.wrapRef.current); }
  }
  componentWillUnmount() { clearInterval(this.timer); this.ro && this.ro.disconnect(); }
  list() { return String(this.props.stages ?? '0,1,2,3').split(',').map(Number); }
  tick() {
    if (this.state.hold || this.props.stage != null) return;
    const L = this.list();
    this.setState(s => {
      const cur = s.stage ?? L[0];
      let i = L.indexOf(cur) + 1;
      let story = s.story ?? (this.props.story ?? 'customer');
      if (i >= L.length) { i = 0; if (this.props.rotate) { const O = ['customer', 'agent', 'value']; story = O[(O.indexOf(story) + 1) % 3]; } }
      return { stage: L[i], story };
    });
  }
  data() {
    return {
      customer: { lens: 'Value lens', g: '●', label: 'Customer',
        close: 'Aether understands that as one connected journey rather than seven unrelated records.',
        subs: ['7 records · 7 systems · no shared identity', '1 profile · 7 relationships', '1 journey · 7 steps · 8h 29m', 'value foregrounded · credit across 4 touchpoints'],
        nodes: [
          ['jane', 'center', 'Aether profile', 'prf_7k2m', 'Sofia Marchetti', [300, 220], null, null, true],
          ['ad', 'system', 'Google Ads', 'clk_88f1', 'Ad impression', [110, 100], '18% credit', '09:01'],
          ['web', 'system', 'Web SDK', 'anon_941', 'Website visit', [300, 64], '27% credit', '09:04'],
          ['app', 'system', 'iOS SDK', 'dev_ios_2c9', 'Mobile app', [490, 100], null, '09:15'],
          ['email', 'system', 'Klaviyo', 'evt_311', 'Email', [505, 252], '31% credit', '11:43'],
          ['agent', 'agent', 'Support agent', 'session_381', 'Agent chat', [400, 372], '24% credit', '14:22'],
          ['buy', 'value', 'Stripe', 'cus_3321', 'Purchase · $149', [200, 372], '$149', '16:08'],
          ['support', 'system', 'Zendesk', 'tkt_5521', 'Support ticket', [95, 252], null, '17:30'],
        ],
        conn: [['jane', 'ad', 1], ['jane', 'web', 1], ['jane', 'app'], ['jane', 'email'], ['jane', 'agent'], ['jane', 'buy'], ['jane', 'support']],
        seq: ['ad', 'web', 'app', 'email', 'agent', 'buy', 'support'] },
      agent: { lens: 'Authority lens', g: '⬡', label: 'Agent',
        close: 'Aether preserves who acted, under whose authority, against what system, and what resulted.',
        subs: ['7 records · 4 logs · no lineage', '1 human · 4 agents · 1 system · 1 outcome', '1 chain · 5 minutes · every handoff recorded', 'authority traced from instruction to outcome'],
        nodes: [
          ['maya', 'human', 'Okta', 'usr_2x8kf', 'Maya Chen', [300, 56], 'full authority', '10:02'],
          ['orch', 'agent', 'Agent runtime', 'agt_orch_01', 'Orchestrator', [300, 152], 'delegated', '10:02'],
          ['research', 'agent', 'Task queue', 'agt_r_14', 'Research agent', [110, 252], null, '10:03'],
          ['data', 'agent', 'Tool calls', 'agt_d_07', 'Data agent', [300, 252], null, '10:04'],
          ['exec', 'agent', 'Agent logs', 'agt_x_22', 'Execution agent', [490, 252], 'scoped access', '10:06'],
          ['api', 'system', 'Stripe API', 'req_9fa', 'Payment API', [490, 356], 'observed', '10:06'],
          ['out', 'value', 'Ledger', 'oc_118', 'Refund · $42', [300, 392], 'recorded', '10:07'],
        ],
        conn: [['maya', 'orch'], ['orch', 'research'], ['orch', 'data'], ['orch', 'exec'], ['research', 'data', 1], ['data', 'exec', 1], ['exec', 'api'], ['api', 'out']],
        seq: ['maya', 'orch', 'research', 'data', 'exec', 'api', 'out'] },
      value: { lens: 'Attribution lens', g: '↑', label: 'Value',
        close: 'Where did this value come from? Every contributing relationship, with its share of credit.',
        subs: ['7 records · 6 systems · no attribution', '1 path from referral to revenue', '9 days · 7 steps', 'credit distributed across 4 contributors'],
        nodes: [
          ['ref', 'human', 'Referral link', 'ref_0x91', 'Referral · Ana R.', [100, 84], '12% credit', 'Mar 02'],
          ['camp', 'org', 'Meta Ads', 'cmp_spring', 'Spring campaign', [300, 84], '34% credit', 'Mar 04'],
          ['email', 'system', 'Klaviyo', 'msg_7731', 'Email · restock', [500, 84], '29% credit', 'Mar 09'],
          ['journey', 'system', 'Aether journey', 'jrn_44a', 'Trial → paid', [500, 226], '25% credit', 'Mar 09'],
          ['person', 'human', 'HubSpot', 'ct_10293', 'Sofia Marchetti', [300, 226], null, 'Mar 10'],
          ['order', 'system', 'Shopify', 'ord_5532', 'Order #5532', [100, 226], null, 'Mar 10'],
          ['val', 'center', 'Stripe', 'ch_3Nf2', '$149 revenue', [300, 370], '100% attributed', 'Mar 11'],
        ],
        conn: [['ref', 'camp'], ['camp', 'email'], ['email', 'journey'], ['journey', 'person'], ['person', 'order'], ['order', 'val'], ['ref', 'person', 1]],
        seq: ['ref', 'camp', 'email', 'journey', 'person', 'order', 'val'] },
    };
  }
  renderVals() {
    const h = React.createElement;
    const D = this.data();
    const L = this.list();
    const storyKey = this.state.story ?? this.props.story ?? 'customer';
    const st = D[storyKey] ? storyKey : 'customer';
    const S = D[st];
    const stage = this.props.stage != null ? Number(this.props.stage) : (this.state.stage ?? L[0]);
    const ease = 'cubic-bezier(0.22,1,0.36,1)';
    const GOLD = '#e0b878';
    const KC = { human: '#9fbad6', agent: '#dcb683', system: '#8fb0cc', value: '#9cc4a9', org: '#c9b088', center: '#9fbad6' };
    const KG = { human: '●', agent: '⬡', system: '○', value: '↑', org: '◈', center: '●' };
    const AE = 'assets/logo-aether-layers.svg';
    const LG = { 'Google Ads': 'googleads', 'iOS SDK': 'apple', 'Klaviyo': 'klaviyo', 'Zendesk': 'zendesk', 'Stripe': 'stripe', 'Stripe API': 'stripe', 'Meta Ads': 'meta', 'HubSpot': 'hubspot', 'Shopify': 'shopify' };
    const AEN = ['Web SDK', 'Aether profile', 'Aether journey', 'Support agent', 'Agent runtime'];
    const logoOf = sys => LG[sys] ? 'assets/brand/' + LG[sys] + '.svg' : AEN.includes(sys) ? AE : null;
    const FR = [[104, 92], [300, 70], [496, 100], [112, 226], [488, 232], [118, 356], [300, 374], [490, 354]];
    const nodes = S.nodes.map(([id, kind, sys, raw, label, conn, tag, t, hideFrag]) => ({ id, kind, sys, raw, label, conn, tag, t, hideFrag }));
    let fi = 0;
    nodes.forEach(n => { n.frag = n.hideFrag ? [300, 220] : FR[fi++]; const k = S.seq.indexOf(n.id); n.time = k < 0 ? [300, 96] : [72 + k * 76, k % 2 ? 336 : 238]; });
    const pos = n => stage === 0 ? n.frag : stage === 2 ? n.time : n.conn;
    const byId = {}; nodes.forEach(n => { byId[n.id] = n; });
    const lensOn = stage === 3;
    const edges = stage === 0 ? [] : stage === 2 ? S.seq.slice(1).map((b, i) => [S.seq[i], b, 0]) : S.conn;
    const edgeEls = edges.map(([a, b, dashed], i) => {
      const A = pos(byId[a]), B = pos(byId[b]);
      const lz = n => n.tag || n.kind === 'center';
      const hi = lensOn && lz(byId[a]) && lz(byId[b]);
      const dim = lensOn && !hi;
      const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1, sg = (a.length + b.length + i) % 2 ? 1 : -1, bow = Math.min(70, len * 0.24) * sg;
      const cx = (A[0] + B[0]) / 2 - dy / len * bow, cy = (A[1] + B[1]) / 2 + dx / len * bow;
      const d = 'M' + A[0] + ' ' + A[1] + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + B[0] + ' ' + B[1];
      const delay = 220 + i * 45;
      const stroke = hi ? GOLD : 'rgba(255,255,255,0.34)';
      const kids = [h('path', { key: 'p', d, pathLength: 1, fill: 'none', stroke, strokeWidth: hi ? 2 : 1.25, strokeLinecap: 'round',
        strokeDasharray: dashed ? '0.014 0.014' : '1',
        style: dashed ? { animation: 'aeFade 320ms ' + ease + ' ' + delay + 'ms both' } : { strokeDashoffset: 0, animation: 'aeDraw 320ms ' + ease + ' ' + delay + 'ms both' } })];
      if (!this.reduce && !dashed && !dim && i < 6) {
        const dS = 'M' + (A[0] + 2000) + ' ' + (A[1] + 2000) + 'Q' + (cx + 2000).toFixed(1) + ' ' + (cy + 2000).toFixed(1) + ' ' + (B[0] + 2000) + ' ' + (B[1] + 2000);
        kids.push(h('circle', { key: 'c', cx: -2000, cy: -2000, r: 2.8, fill: hi ? GOLD : '#cfe0f2', style: { opacity: 0 } },
          h('animateMotion', { dur: '6.4s', begin: (0.8 + i * 0.9) + 's', repeatCount: 'indefinite', path: dS, calcMode: 'spline', keyTimes: '0;1', keyPoints: '0;1', keySplines: '0.22 1 0.36 1' }),
          h('animate', { attributeName: 'opacity', values: '0;0.9;0.9;0', keyTimes: '0;0.2;0.8;1', dur: '6.4s', begin: (0.8 + i * 0.9) + 's', repeatCount: 'indefinite' })));
        kids.push(h('animate', { key: 'br', attributeName: 'stroke-opacity', values: '1;0.55;1', dur: (5 + (i % 3)) + 's', begin: (i * 0.7) + 's', repeatCount: 'indefinite' }));
      }
      return h('g', { key: st + stage + 'e' + i, opacity: dim ? 0.16 : 1, style: { transition: 'opacity 200ms ' + ease } }, kids);
    });
    const BLUR = 'blur(18px) saturate(1.5)';
    const nodeEls = nodes.map((n, i) => {
      const [x, y] = pos(n);
      const isC = n.kind === 'center';
      const w = isC ? 192 : 150, hh = isC ? 62 : 52;
      const hidden = stage === 0 && n.hideFrag;
      const dim = lensOn && !n.tag && !isC;
      const acc = KC[n.kind];
      const title = stage === 0 ? n.sys : n.label;
      const logo = logoOf(n.sys);
      const hot = lensOn && n.tag;
      const chipSz = isC ? 38 : 26;
      const chip = logo
        ? h('span', { key: 'c', style: { width: chipSz, height: chipSz, flexShrink: 0, borderRadius: isC ? 12 : 9, background: 'rgba(255,255,255,0.94)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 1px 2px rgba(0,0,0,0.25)' } }, h('img', { src: logo, alt: '', style: { width: chipSz - 12, height: chipSz - 12, objectFit: 'contain' } }))
        : h('span', { key: 'c', style: { width: chipSz, height: chipSz, flexShrink: 0, borderRadius: 9, background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.16)', color: acc, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-mono)', fontSize: 14 } }, KG[n.kind]);
      const kids = [chip,
        h('span', { key: 't', style: { display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 } },
          h('span', { style: { fontSize: isC ? 14 : 12, fontWeight: 500, letterSpacing: '-0.01em', color: '#f4f2ee', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, title),
          h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 10, color: isC ? '#d5d3cd' : '#b4b2ac', whiteSpace: 'nowrap' } }, n.raw)),
      ];
      if (stage === 0 && !isC) kids.push(h('span', { key: 'x', style: { position: 'absolute', right: 9, top: 9, width: 6, height: 6, borderRadius: 3, background: 'rgba(255,255,255,0.3)' } }));
      if (stage === 2 && n.t) kids.push(h('span', { key: 'tm', style: { position: 'absolute', left: 4, top: -17, fontFamily: 'var(--font-mono)', fontSize: 10, color: '#b4b2ac' } }, n.t));
      if (lensOn && n.tag) kids.push(h('span', { key: 'tag', style: { position: 'absolute', left: '50%', top: hh + 6, transform: 'translateX(-50%)', whiteSpace: 'nowrap', padding: '2px 9px', borderRadius: 999, fontFamily: 'var(--font-mono)', fontSize: 10, fontWeight: 500, color: '#f6e2bf', background: 'rgba(201,151,90,0.3)', border: '1px solid rgba(224,184,120,0.55)', WebkitBackdropFilter: 'blur(10px)', backdropFilter: 'blur(10px)', animation: 'aeFade 200ms ' + ease + ' 200ms both' } }, n.tag));
      return h('div', { key: st + n.id, style: {
        position: 'absolute', left: 0, top: 0, width: w, height: hh, boxSizing: 'border-box', padding: isC ? '0 14px' : '0 8px', display: 'flex', alignItems: 'center', gap: isC ? 10 : 8,
        borderRadius: isC ? 20 : 15,
        background: isC ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.09)',
        border: '1px solid ' + (hot ? 'rgba(224,184,120,0.7)' : isC ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.17)'),
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,' + (isC ? 0.34 : 0.2) + '), 0 10px 28px rgba(0,0,0,0.32)',
        WebkitBackdropFilter: BLUR, backdropFilter: BLUR,
        transform: 'translate(' + (x - w / 2) + 'px,' + (y - hh / 2) + 'px)', opacity: hidden ? 0 : dim ? 0.32 : 1,
        animation: this.reduce ? 'none' : 'aeFloat ' + (5 + (i % 4)) + 's ease-in-out ' + (-i * 1.1) + 's infinite',
        transition: 'transform 240ms ' + ease + ' ' + (i * 10) + 'ms, opacity 200ms ' + ease + ', border-color 200ms ' + ease } }, kids);
    });
    const axis = stage === 2 ? h('line', { key: 'ax', x1: 40, y1: 287, x2: 560, y2: 287, stroke: 'rgba(255,255,255,0.16)', strokeWidth: 1, style: { animation: 'aeFade 320ms ' + ease + ' both' } }) : null;
    const k = this.state.k || 1;
    const svg = h('svg', { key: 'svg', viewBox: '0 0 600 440', width: 600, height: 440, style: { position: 'absolute', left: 0, top: 0, overflow: 'visible' } }, axis, h('g', { key: 'E' }, edgeEls));
    const stageEl = h('div', { role: 'img', 'aria-label': S.label + ' scenario, ' + ['fragmented', 'connected', 'history', S.lens][stage] + ' view', style: { position: 'absolute', left: 0, top: 0, width: 600, height: 440, transformOrigin: '0 0', transform: 'scale(' + k + ')' } }, svg, nodeEls);
    const hold = (patch) => this.setState(Object.assign({ hold: true }, patch));
    const caps = ['Your systems know pieces of the story.', 'Aether understands how those pieces belong together.', 'Then turns activity into history and journeys.', 'Explore the same reality from any perspective.'];
    const names = ['Fragmented', 'Connected', 'History', S.lens];
    return {
      stageEl, wrapRef: this.wrapRef,
      controls: !!this.props.controls,
      stories: ['customer', 'agent', 'value'].map(key => { const on = key === st; return { label: D[key].label, g: D[key].g, sel: on ? 'true' : 'false', go: () => hold({ story: key, stage: 1 }),
        style: 'font-family: inherit; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; font-size: 12px; font-weight: 500; transition: background-color 120ms ' + ease + ', color 120ms ' + ease + '; ' + (on ? 'background: rgba(255,255,255,0.94); color: #111114;' : 'background: transparent; color: #cfcdc7;') }; }),

        bar: 'height: 3px; border-radius: 3px; width: 100%; background: ' + (on ? '#f4f2ee' : 'rgba(255,255,255,0.18)') + '; transition: background-color 200ms ' + ease + ';',
        style: 'font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 0 0 4px; background: transparent; border: 0; cursor: pointer; font-size: 12px; font-weight: 500; color: ' + (on ? '#f4f2ee' : '#b4b2ac') + '; transition: color 120ms ' + ease + ';' }; }),

}
</script>
