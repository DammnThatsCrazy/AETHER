version: 1
applications:
  - appRoot: apps/marketing-olympus
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
        build:
          commands:
            - npm run build --workspace=apps/marketing-olympus
      artifacts:
        baseDirectory: apps/marketing-olympus/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/marketing-aether
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
        build:
          commands:
            - npm run build --workspace=apps/marketing-aether
      artifacts:
        baseDirectory: apps/marketing-aether/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/docs
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=apps/docs
      artifacts:
        baseDirectory: apps/docs/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/status
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=apps/status
      artifacts:
        baseDirectory: apps/status/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/aether-web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
            - npm run build --workspace=packages/sdk/web
        build:
          commands:
            - npm run build --workspace=apps/aether-web
      artifacts:
        baseDirectory: apps/aether-web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/public-site
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
            - npm run build --workspace=packages/sdk/web
        build:
          commands:
            - npm run build --workspace=apps/public-site
            # One app per environment: the product is built under /app and
            # published inside the site's output (aether.<domain>/app).
            - VITE_BASE_PATH=/app/ npm run build --workspace=apps/aether-web
            - test -f apps/aether-web/dist/index.html
            - mkdir -p apps/public-site/dist/app
            - cp -R apps/aether-web/dist/. apps/public-site/dist/app/
      artifacts:
        baseDirectory: apps/public-site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
