version: 1
applications:
  - appRoot: frontend/olympus-marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=frontend/olympus-marketing
      artifacts:
        baseDirectory: frontend/olympus-marketing/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: frontend/aether-marketing
    frontend:
