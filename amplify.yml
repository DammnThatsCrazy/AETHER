version: 1
applications:
  - appRoot: apps/olympus-marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
        build:
          commands:
            - npm run build --workspace=apps/olympus-marketing
      artifacts:
        baseDirectory: apps/olympus-marketing/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/aether-marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
        build:
          commands:
            - npm run build --workspace=apps/aether-marketing
      artifacts:
        baseDirectory: apps/aether-marketing/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/docs
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=apps/docs
      artifacts:
        baseDirectory: apps/docs/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/status
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build --workspace=apps/status
      artifacts:
        baseDirectory: apps/status/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/aether
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
            - npm run build --workspace=packages/web
        build:
          commands:
            - npm run build --workspace=apps/aether
      artifacts:
        baseDirectory: apps/aether/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: apps/site
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run build --workspace=packages/shared
            - npm run build --workspace=packages/web
        build:
          commands:
            - npm run build --workspace=apps/site
            # One app per environment: the product is built under /app and
            # published inside the site's output (aether.<domain>/app).
            - VITE_BASE_PATH=/app/ npm run build --workspace=apps/aether
            - test -f apps/aether/dist/index.html
            - mkdir -p apps/site/dist/app
            - cp -R apps/aether/dist/. apps/site/dist/app/
      artifacts:
        baseDirectory: apps/site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
