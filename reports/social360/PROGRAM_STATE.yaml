key_decisions:
  - id: D-01
    date: 2026-09-03
    decision: Base branch = feat/financial-normalization head (7b69a028), not origin/main.
    reason: projection_engine/ + infrastructure360 + newest registries are branch-only.
    superseded_by: D-03
  - id: D-02
    date: 2026-09-03
    decision: Execute M0 first as an isolated, reviewed slice; no product code until M0 approved.
    reason: blueprint §139 gate; user-selected sequencing.
  - id: D-03
    date: 2026-09-03
    decision: Re-parent M0 onto feat/aether-360-program @ fced2960 (the 360 foundation, S1-S6),
      removing feat/financial-normalization W1-W5 from the branch ancestry. Supersedes D-01.
    reason: Social360 is a 360-family program; financial-normalization is an unrelated domain
      program and keeping it in ancestry would tangle future Social360 PRs with its diff. The
      360 foundation carries all Social360 substrate (projection engine, exploration fabric,
      registries). Pre-reparent HEAD preserved at backup/social360-m0-at-financial-base.
  - id: D-04
    date: 2026-09-04
    decision: "M6<->M7 independence composition = documented future seam, NOT a forced bridge."
    reason: M6 evidence grouping is endpoint-aware (source_entity_id/target_entity_id) while M7
      observations carry no endpoints (built in parallel). M7's own docstring makes M6 grouping
      authoritative; bucketing M7 observations into coarse family/source groups would fabricate an
      independence answer at lower resolution than M6's authoritative grouping -- an honesty
      violation. M7's loader keeps degrading independence-gated dims to UNKNOWN until the reserved
      seam (services.relationship_promotion.evidence_independence::resolve_independent_groups,
      named in M7's M6_EVIDENCE_INDEPENDENCE_MODULE) is filled by the promotion->fidelity runtime
      call chain (post-program / M11-M12 hardening). Fidelity is flag-gated OFF today; no caller
      invokes it.
    superseded_by: D-07    # A&B slice (2026-09-04) fills this seam (resolver + first runtime caller)
  - id: D-05
    date: 2026-09-04
    decision: "Historical-consent evaluation for legacy social reads deferred to surface activation."
    reason: >-
      M4 rewrote services/social/routes.py as a legacy wrapper over the canonical
      IntelligenceAggregator.social_intelligence. The aggregator enforces read permission but not
      the social360.requiresHistoricalConsentEvaluation consent model. Flipping a consent gate on
      now would change legacy API behavior outside the AETHER_SOCIAL360_ENABLED flag; the consent
      model belongs to social360-surface activation (M10 operational / M11). Recorded residual:
      when the social360 surface activates under its flag, gate historical social reads on the
      registered consent model before projection.
  - id: D-06
    date: 2026-09-04
    decision: "Section-154 standalone source-of-truth docs (SOCIAL360,
      RELATIONAL_INTELLIGENCE_SPINE, RELATIONSHIP_FIDELITY, SOCIAL_PROVIDER_CONTRACT,
      RELATIONSHIP_PREDICATE_REGISTRY, RELATIONSHIP_PATH_SEMANTICS, SOCIAL_DATA_RIGHTS)
      recorded as a release-gated residual, NOT authored in M11/M12."
    reason: >-
      The docs are source-linked and drift-governed; their linked sources live on a
      flag-gated, unactivated plane whose projection row is in_flight. Authoring them now
      would document behavior no runtime caller exercises. Authority is currently held
      honestly by docs/blueprints/social360.md (home doc) + this ledger + the M11/M12
      close-out reports. Correct authoring belongs to spine productization when the
      surface leaves in_flight (make release-gate + docs_drift --strict then demand them).
      G067 accordingly stays MISSING with the decision recorded; the docs genuinely do not exist.
  - id: D-OPEN
    date: pending_M0
    decision: "Olympus corpus → tenant overlay projection rule (§14 P0 prerequisite)"
    status: unresolved
    disposition: "must be resolved+documented (or recorded EXTERNALLY_BLOCKED) before
      corpus-derived relationships are written to the tenant-scoped graph"
  - id: D-07
    date: 2026-09-04
    decision: "Address A & B slice (M13) builds the relationship read surface + spine activation seams."
    reason: >-
      Resolves D-04: the reserved seam (services.relationship_promotion.evidence_independence,
      the M6 module M7 names) is FILLED by Wave 1's resolver, and
      services.relationship_intelligence.coordinator is its first runtime caller — proven end to
      end by the hermetic full-plane integration test (tests/relationship_intelligence/
      test_full_plane.py). D-05's consent model now has an enforcement surface
      (services.relationship_intelligence.consent gates the new /v1/relationships read routes
      when AETHER_SOCIAL360_ENABLED is on); the legacy social aggregator is unchanged until
      social360-surface activation. Also lands the relationship read APIs (G046), Noesis
      read-only relationship-spine intents (G048), influence-as-propagation decomposition
      (G043), the six silver_social_*_facts DDL + repositories, and spine-run meters (G059).
      All new behavior stays flag-gated OFF. The B tail (live provider pull + credentials,
      enforce-flag flip, real SLO baselines, D-06 source-of-truth docs at productization) stays
      recorded residual; NO release-readiness claim is made by this slice.

