# Milestone commits (C0-C8 landed via #500/#503; C2-pending + C5/C6/C7/C9 active in the
# completion program).
milestones:
  - id: C0
    name: reconciliation-and-orchestration-control-plane
    status: landed
    lands: [program-ledgers, reuse-map, external-blockers, credential-contracts-registry, architecture-doc, feature-flags-off]
    runtime_behavior_change: false
  - id: C1
    name: continuity-context-sync-contracts
    depends_on: [C0]
    status: landed
    landed: [continuation-contract-twins, sync-event-contract-twins, continuation-persistence-engine, continuation-routes, client-sync-feed]
    deferred_to_later_milestones: [operator-continuation-router (C6/Kyber-mobile), remaining-sync-producers (incremental), deep-link-resolve (C3)]
    note: >
      Core C1 landed: contract twins, the dual-mode continuation persistence engine
      (repositories/continuation_repo.py, alembic 20260820), the tenant continuation
      routes (/v1/continuations, services/continuation/*), and the client-sync feed
      (repositories/client_sync_repo.py, alembic 20260821, /v1/client-sync,
      enqueue_sync_change emitter with continuation_changed as the first wired producer).
      All flag-gated OFF (continuation.enabled, client_sync.enabled) → 404 when disabled;
      no runtime behavior change. 45+ tests (contract parity, repo CAS/idempotency/scope,
      routes, producer→feed integration). The operator (Kyber) continuation router,
      remaining sync producers, and deep-link resolution are reassigned to their owning
      milestones.
  - id: C2
    name: notification-attention-control-plane
    depends_on: [C1]
    status: landed
    landed: [notification-delivery-ts-twins, notification-control-plane-doc, notifications-collision-resolution, producer-coverage-registry]
    pending: [mobile-notification-projection, unsafe-routing-validator]
    note: >
      Landed: notification.ts + delivery-receipt.ts TS twins (13 parity tests;
      NotificationDeliveryAttempt renamed to avoid a TS2308 collision with the interop
      DeliveryAttempt) + NOTIFICATION_CONTROL_PLANE.md.
      COLLISION RESOLVED (was deferred): the legacy services/notification router was
      retired — its one non-shadowed endpoint (POST /webhooks/{id}/test) was migrated
      into notification_intelligence WITH an SSRF guard (both already share
      WebhookRepository), the router was unmounted, and the 5 resolved pairs were
      removed from the route-conflict ratchet (tests/unit/test_route_conflicts.py).
      PRODUCER-COVERAGE REGISTRY landed: services/notification_intelligence/coverage.py
      + GET /v1/notifications/coverage — honest states, NEVER 'healthy' without a
      declared baseline, in-process heartbeat, seeded with real producers at
      required=False (operators declare the baseline). ~20 tests. Remaining C2 (mobile
      notification projection with redacted push, unsafe-routing validator) is picked
      up by M1 of the completion program.
  - id: C3
    name: delivery-providers-installations-push-email-deeplinks
    depends_on: [C2]
    status: landed
    landed: [installation-push-model, mobile-gateway-routes, apns-fcm-webpush-email-adapters, provider-fakes, deeplink-resolve, credentials-inventory-preflight-activation-smoke]
    full_gate_checkpoint: true
    note: >
      C3 landed: installation + push-subscription persistence (alembic
      20260822_mobile_installations, repositories/installation_repo.py), the tenant
      mobile gateway (/v1/mobile installations + subscriptions, services/mobile/*),
      the four provider adapters (apns/fcm/web_push/email) with production-shaped
      request construction + response mapping and provider-shaped LOCAL fakes that
      fail closed outside local/dev (services/delivery/adapters/*, DeliveryChannel.PUSH
      + delivery-receipt.ts twin), the deep-link resolve endpoint
      (POST /v1/mobile/deep-links/resolve, fail-closed, reuses continuation records),
      and the credentials tooling (scripts/credentials_status.py + credentials-inventory
      / credentials-preflight / credentials-activation-smoke). All flag-gated OFF
      (mobile.enabled) or credentialless → externally_blocked; no runtime behavior
      change with flags off. 70+ tests across adapters, deep-link, gateway, credentials.
      Provider live sends and store distribution remain externally_blocked.
  - id: C4
    name: shared-mobile-platform-native-security-build
    depends_on: [C3]
    status: landed
    landed: [packages-mobile-core, mobile-sdk-client, pkce-auth-secure-store, apps-aether-mobile, apps-kyber-mobile, workspace-ci-wiring, mobile-build-check, sdk-permission-inventory, mobile-app-docs]
    externally_blocked: [native-ios-simulator-android-emulator-compile, store-distribution]
    note: >
      C4 landed the VERIFIABLE shared mobile platform: @aether/mobile-core (packages/
      mobile-core) — a platform-agnostic typed SDK (API/continuation/sync/push clients,
      PKCE S256 auth, SecureStore-backed token provider, runtime contract guards),
      wired into npm workspaces + package-lock + the root typecheck chain + bump_version
      + mobile-typecheck/mobile-test gates (typecheck + 9 tests green in make ci-check).
      The two Expo app scaffolds (apps/aether-mobile plane=aether bundle=com.aether.mobile;
      apps/kyber-mobile plane=kyber bundle=com.aether.kyber) consume the SDK with distinct
      bundle ids / audiences / keystores — no Kyber code in the Aether binary. Structural
      invariants (distinct planes/bundles, scaffold completeness, version pin) are enforced
      by scripts/mobile_build_check.py (make mobile-build-check). SDK/permission inventory:
      reports/mobile-productization/mobile-sdk-inventory.json. Docs: AETHER_MOBILE.md,
      KYBER_MOBILE.md. HONEST CEILING: the native iOS-simulator/Android-emulator compile
      needs macOS+Xcode+Android SDK+Expo (absent in this Linux CI container) →
      externally_blocked, runs in hosted (macOS) CI; NOT a 'compiled' claim. Full feature
      screens + governed mobile actions are C5-C7 (staged).
  - id: C8
    name: dsr-compliance-completeness
    depends_on: [C4]
    status: partial-landed
    landed: [mobile-dsr-erasure-end-to-end, dsr-mobile-coverage-gate, apple-privacy-manifests, play-data-safety, privacy-manifest-drift-gate, mobile-compliance-doc]
    externally_blocked: [store-submission]
    note: >
      C8 (verifiable slice) landed the mobile compliance completeness: a data-subject
      erasure now reaches mobile data end-to-end with REAL evidence — the consent.erasure
      job erases continuations/selections, installations/push_subscriptions, and
      sync_change_log by principal and marks 3 new DSR_COMPONENTS
      (continuation_records/mobile_installations/client_sync_records) with real erased-row
      counts, each store isolated + retryable (fixed the gap where the mobile
      erase-by-principal hooks existed + were tested but no DSR flow reached them, and
      client_sync had no erase hook). A fail-closed coverage gate
      (scripts/release/check_dsr_coverage.py, make dsr-coverage-check) binds
      erase-hook↔DSR_COMPONENT↔handler↔storage-policy so no future mobile table silently
      escapes DSR. Each shipping app gained a generated, drift-gated Apple Privacy Manifest
      (PrivacyInfo.xcprivacy) + Play Data Safety (data-safety.json) derived from an auditable
      privacy-data-flows.yaml validated against the 12-purpose consent registry + PII
      classification (scripts/generate_privacy_manifests.py, make privacy-manifest-check).
      ~90 tests. HONEST CEILING: manifest GENERATION + DSR erasure are done + gated; store
      SUBMISSION (App Store / Play review) remains externally_blocked (developer accounts +
      signing). C5/C6/C7/C9 (feature screens, continue-on-phone, governed actions, adversarial
      review) are now ACTIVE in the completion program.
  - id: C5
    name: feature-screens-projections-notification-center
    depends_on: [C8, M2]
    status: active
    lands: [mobile-config-route, distribution-profiles, app-version-registration, mobile-ui-package, offline-cache-framework, mobile-compliance-umbrella, gateway-projections, aether-mobile-screens, desktop-notification-center-aether, preferences-persistence]
    externally_blocked: [native-compile, store-submission]
    note: >
      C5 is the largest remaining milestone: bounded redacted gateway projections
      (today/profile/campaign/alerts/explore) reusing owning services (never re-calculating
      Profile360/Campaign360/graph truth); the mobile platform foundations (GET /v1/mobile/config,
      distribution-profile enum + per-build enforcement, app-version registration, packages/mobile-ui,
      read-only offline cache); Aether Mobile feature screens (Today/Copilot/Explore/Alerts/Account);
      and the Aether desktop notification center + preferences persistence. Driven by M2 (platform/
      config/compliance foundations) + M3 (projections + screens + desktop NC) in the completion
      program. All new surfaces flag-gated OFF or read-only; no runtime behavior change with flags off.
  - id: C6
    name: continue-on-phone-sync-completion
    depends_on: [C5]
    status: active
    lands: [remaining-sync-producers, operator-continuation-router, desktop-continue-on-phone-surfaces, mobile-continue-on-desktop, client-sync-consumption-ui, cross-device-read-ack]
    note: >
      C6 wires the remaining 9 sync producers (notification/saved_view/conversation/watchlist/
      incident/command_receipt/preference_changed/session/installation_revoked) via
      enqueue_sync_change at their owning mutation sites, adds the operator (Kyber) continuation
      router in services/continuation/, and builds the desktop continue-on-phone / recent-activity /
      resume surfaces in both frontends plus mobile continue-on-desktop / resume / send-to-desktop
      and client-sync consumption UI. Cross-device read/ack state propagation (notification opened
      on mobile shows read on desktop) verified by tests. Driven by M5 of the completion program.
  - id: C7
    name: governed-mobile-actions
    depends_on: [C6]
    status: active
    lands: [mobile-action-adapter, kyber-mobile-tier-0-3-ui, mobile-step-up-flow, command-receipt-visibility, mobile-bound-device-attestation]
    note: >
      C7 adds a mobile action adapter on the gateway (exposes action availability + adapts mobile
      step-up challenges to the EXISTING services/kyber/ops command plane — no second command
      plane, no generic mutation channel), Kyber Mobile Tier 0/1/2/3 UI + step-up via the existing
      StepUpService/device_proof, durable command-receipt visibility, and mobile-bound device
      signature/attestation where feasible. No offline mutation. Driven by M6 of the completion program.
  - id: C9
    name: adversarial-review-remediation
    depends_on: [C7, M7]
    status: staged
    lands: [six-lens-review, remediation-commits, final-gate]
    note: >
      C9 is the six-lens adversarial review (architecture/duplication, tenant-operator security,
      data truth/evidence, concurrency/delivery/reliability, mobile privacy/store compliance,
      operational/release honesty) run in parallel with an adversarial refute pass, remediation
      commits, and the final make ci-check + release-gate decision. Driven by M8 of the completion
      program. Not started (staged).

# Wave / architecture rollup (reuse-first). "reuse" = exists complete; "extend" = exists, add surface;
# "build" = net-new this program. Authoritative detail: reports/mobile-productization/repo-baseline.json.
architecture:
  notification_control_plane: extend        # services/notification_intelligence/* exists complete; brand + TS twins + coverage registry + collision fix
  delivery_infrastructure: extend           # services/delivery/* exists complete; add apns/fcm/webpush/email adapters + fakes
  worker_supervisor: reuse                  # services/runtime/{supervisor,specs}.py
  exploration_context: reuse                # shared/exploration/models.py (+ TS twin, parity-tested)
  saved_views: reuse                        # services/exploration/store.py
  noesis_conversations: reuse               # services/noesis/{conversations,conversation}.py (durable one referenced)
  continuation_plane: build                 # NET-NEW: services/continuation/*, alembic, /v1/continuations
  client_sync_feed: build                   # NET-NEW: services/client_sync/*, alembic, /v1/client-sync
  push_provider_adapters: build             # NET-NEW: apns/fcm/webpush/email adapters
  installation_push_model: build            # NET-NEW: extends services/auth/sessions + services/kyber/devices
  kyber_command_plane: reuse                # services/kyber/ops/* (req->dry-run->approve->execute->verify); mobile adapts, no new plane
  kyber_identity_device_trust: reuse        # services/kyber/{identity,devices,sessions,access}/*
  tenant_identity_authz: reuse              # services/auth/*, middleware/middleware.py, services/policy/*
  credential_platform: reuse                # shared/credentials/* (in_memory/local_encrypted/aws_secrets_manager)
  mobile_apps: build                        # NET-NEW: apps/aether-mobile, apps/kyber-mobile (Expo + prebuild)
  mobile_shared_packages: build             # NET-NEW: packages/mobile-* (mobile-ui in M2)
  desktop_notification_center_kyber: reuse  # frontend/kyber/src/features/notifications/* (mobile push = "Architecture-Ready")
  desktop_notification_center_aether: build # NET-NEW: only settings/notifications-section.tsx exists today (M3)
  mobile_notification_projection: build     # NET-NEW: M1 (redacted push title/body/summary; no raw payload in push)
  delivery_safety_validator: build          # NET-NEW: M1 (scripts/release/validate_delivery_safety.py permanent gate)
  mobile_config_release: build              # NET-NEW: M2 (GET /v1/mobile/config + distribution profiles + app-version registration)
  mobile_offline_cache: build               # NET-NEW: M2 (read-only offline cache framework in packages/mobile-core)
  gateway_projections: build                # NET-NEW: M3 (bounded redacted projections reusing owning services)
  operator_continuation_router: build       # NET-NEW: M5 (services/continuation/ operator router)
  mobile_action_adapter: build              # NET-NEW: M6 (gateway adapter -> existing services/kyber/ops, no second plane)
  demo_seed_extensions: extend              # NET-NEW: M7 (notifications/continuations/exceptions/incidents/runs/reviews in demo_seed)
  release_readiness_machinery: reuse        # scripts/production_status.py, repo_doctor.py, deployment_profiles.yaml

# Alembic revision reservation. Single-head invariant is enforced by
# scripts/validate_temporal_integrity.py. Current DB head: 20260822_mobile_installations
# (C1/C3 landed chain 20260820 -> 20260821 -> 20260822 from 20260812_credential_platform).
# Completion-program migrations (M2 app-version on mobile_installations; M6 mobile-bound
# attestation; M7 demo-seed if it needs tables) will be namespaced 20260830+ and registered
# here as they land. down_revision must always re-point to the real single head on rebase.
migration_reservation:
  chain_root_at_start: "20260812_credential_platform"
  reserved:
    - id: "20260820_continuation_plane"      # C1: tables continuations, continuation_selections
      down_revision: "20260813_comms_turnkey"   # re-pointed after merging origin/main (#499) to keep a single alembic head
      owner_milestone: C1
      status: landed
    - id: "20260821_client_sync"             # C1: tables sync_change_log, sync_cursor_counter
      down_revision: "20260820_continuation_plane"
      owner_milestone: C1
      status: landed
    - id: "20260822_mobile_installations"    # C3: tables mobile_installations, push_subscriptions
      down_revision: "20260821_client_sync"
      owner_milestone: C3
      status: landed

