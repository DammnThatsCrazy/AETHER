      status: landed
    - id: "20260821_client_sync"             # C1: tables sync_change_log, sync_cursor_counter
      down_revision: "20260820_continuation_plane"
      owner_milestone: C1
      status: landed
    - id: "20260822_mobile_installations"    # C3: tables mobile_installations, push_subscriptions
      down_revision: "20260821_client_sync"
      owner_milestone: C3
      status: landed
    - id: "20260830_app_version_registration" # M2: app_version + distribution_profile on mobile_installations
      down_revision: "20260817_payment_provider_receipts"   # the real head at M2; chained from 20260817 to keep a single head
