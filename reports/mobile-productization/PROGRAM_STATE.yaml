# Mobile / Continuity / Notification Productization — living program state.
# SINGLE AUTHORITY for work status. Only the orchestrator writes this file.
# Not generated; not source-linked (no drift stamping). Hand-maintained per landing.
# Precedent: docs/integration-control-plane/PROGRAM_STATE.yaml.

program:
  branch: claude/aether-turnkey-productization-iu2qk4
  base_commit: "78562ddae28de01ec0fe3c59e42bb357baaffb1f"   # == origin/main at program start (feat: Unified Integration Control Plane — foundation (#497))
  observed_baseline_in_prompt: "13c377752755de91d42517f8eb74791f232e243e"  # informational; a real ancestor of base_commit
  platform_version: "8.12.0"
  last_landed_checkpoint: C4
  status: active
  delivery_model: orchestrated-swarm            # one orchestrator, bounded specialist packets, serialized milestone commits
  gate: "make ci-check"                          # canonical completion gate (repo_doctor.py --ci)
  session_scope: "C0-C4"                         # owner-selected: foundation baseplate + shared mobile platform. C5-C9 staged.

# Milestone commits (this session = C0-C4). Full app surfaces + governed actions +
# compliance/distribution + adversarial review (C5-C9) are documented, not built this session.
milestones:
  - id: C0
    name: reconciliation-and-orchestration-control-plane
    status: in_progress
    lands: [program-ledgers, reuse-map, external-blockers, credential-contracts-registry, architecture-doc, feature-flags-off]
    runtime_behavior_change: false
  - id: C1
    name: continuity-context-sync-contracts
    depends_on: [C0]
    status: landed
    landed: [continuation-contract-twins, sync-event-contract-twins, continuation-persistence-engine, continuation-routes, client-sync-feed]
    deferred_to_later_milestones: [operator-continuation-router (C6/Kyber-mobile), remaining-sync-producers (incremental), deep-link-resolve (C3)]
    note: >
      Core C1 landed: contract twins, the dual-mode continuation persistence engine
      (repositories/continuation_repo.py, alembic 20260820), the tenant continuation
      routes (/v1/continuations, services/continuation/*), and the client-sync feed
      (repositories/client_sync_repo.py, alembic 20260821, /v1/client-sync,
      enqueue_sync_change emitter with continuation_changed as the first wired producer).
      All flag-gated OFF (continuation.enabled, client_sync.enabled) → 404 when disabled;
      no runtime behavior change. 45+ tests (contract parity, repo CAS/idempotency/scope,
      routes, producer→feed integration). The operator (Kyber) continuation router,
      remaining sync producers, and deep-link resolution are reassigned to their owning
      milestones.
  - id: C2
    name: notification-attention-control-plane
    depends_on: [C1]
    status: in_progress
    landed: [notification-delivery-ts-twins, notification-control-plane-doc]
    pending: [coverage-registry, mobile-notification-projection, notification-make-targets]
    deferred_with_reason:
      collision-resolution: >
        The /v1/notifications legacy router (services/notification/routes.py) is
        mounted after notification_intelligence, which first-match-shadows its
        /webhooks and /alerts paths — EXCEPT one non-overlapping legacy endpoint,
        POST /v1/notifications/webhooks/{webhook_id}/test, which a plain unmount
        would drop. A safe fix must migrate that endpoint or re-prefix the legacy
        router; deferred rather than risk a nuanced change to a production service.
    note: >
      Landed: notification.ts + delivery-receipt.ts TS twins (13 parity tests;
      NotificationDeliveryAttempt renamed to avoid a TS2308 collision with the interop
      DeliveryAttempt) + NOTIFICATION_CONTROL_PLANE.md. Python-only models now have
      drift-guarded TS twins. No backend/runtime change.
  - id: C3
    name: delivery-providers-installations-push-email-deeplinks
    depends_on: [C2]
    status: landed
    landed: [installation-push-model, mobile-gateway-routes, apns-fcm-webpush-email-adapters, provider-fakes, deeplink-resolve, credentials-inventory-preflight-activation-smoke]
    full_gate_checkpoint: true
    note: >
      C3 landed: installation + push-subscription persistence (alembic
      20260822_mobile_installations, repositories/installation_repo.py), the tenant
      mobile gateway (/v1/mobile installations + subscriptions, services/mobile/*),
      the four provider adapters (apns/fcm/web_push/email) with production-shaped
      request construction + response mapping and provider-shaped LOCAL fakes that
      fail closed outside local/dev (services/delivery/adapters/*, DeliveryChannel.PUSH
      + delivery-receipt.ts twin), the deep-link resolve endpoint
      (POST /v1/mobile/deep-links/resolve, fail-closed, reuses continuation records),
      and the credentials tooling (scripts/credentials_status.py + credentials-inventory
      / credentials-preflight / credentials-activation-smoke). All flag-gated OFF
      (mobile.enabled) or credentialless → externally_blocked; no runtime behavior
      change with flags off. 70+ tests across adapters, deep-link, gateway, credentials.
      Provider live sends and store distribution remain externally_blocked.
  - id: C4
    name: shared-mobile-platform-native-security-build
    depends_on: [C3]
    status: landed
    landed: [packages-mobile-core, mobile-sdk-client, pkce-auth-secure-store, apps-aether-mobile, apps-kyber-mobile, workspace-ci-wiring, mobile-build-check, sdk-permission-inventory, mobile-app-docs]
    externally_blocked: [native-ios-simulator-android-emulator-compile, store-distribution]
    note: >
      C4 landed the VERIFIABLE shared mobile platform: @aether/mobile-core (packages/
      mobile-core) — a platform-agnostic typed SDK (API/continuation/sync/push clients,
      PKCE S256 auth, SecureStore-backed token provider, runtime contract guards),
      wired into npm workspaces + package-lock + the root typecheck chain + bump_version
      + mobile-typecheck/mobile-test gates (typecheck + 9 tests green in make ci-check).
      The two Expo app scaffolds (apps/aether-mobile plane=aether bundle=com.aether.mobile;
      apps/kyber-mobile plane=kyber bundle=com.aether.kyber) consume the SDK with distinct
      bundle ids / audiences / keystores — no Kyber code in the Aether binary. Structural
      invariants (distinct planes/bundles, scaffold completeness, version pin) are enforced
      by scripts/mobile_build_check.py (make mobile-build-check). SDK/permission inventory:
      reports/mobile-productization/mobile-sdk-inventory.json. Docs: AETHER_MOBILE.md,
      KYBER_MOBILE.md. HONEST CEILING: the native iOS-simulator/Android-emulator compile
      needs macOS+Xcode+Android SDK+Expo (absent in this Linux CI container) →
      externally_blocked, runs in hosted (macOS) CI; NOT a 'compiled' claim. Full feature
      screens + governed mobile actions are C5-C7 (staged).

# Wave / architecture rollup (reuse-first). "reuse" = exists complete; "extend" = exists, add surface;
# "build" = net-new this program. Authoritative detail: reports/mobile-productization/repo-baseline.json.
architecture:
  notification_control_plane: extend        # services/notification_intelligence/* exists complete; brand + TS twins + coverage registry + collision fix
  delivery_infrastructure: extend           # services/delivery/* exists complete; add apns/fcm/webpush/email adapters + fakes
  worker_supervisor: reuse                  # services/runtime/{supervisor,specs}.py
  exploration_context: reuse                # shared/exploration/models.py (+ TS twin, parity-tested)
  saved_views: reuse                        # services/exploration/store.py
  noesis_conversations: reuse               # services/noesis/{conversations,conversation}.py (durable one referenced)
  continuation_plane: build                 # NET-NEW: services/continuation/*, alembic, /v1/continuations
  client_sync_feed: build                   # NET-NEW: services/client_sync/*, alembic, /v1/client-sync
  push_provider_adapters: build             # NET-NEW: apns/fcm/webpush/email adapters
  installation_push_model: build            # NET-NEW: extends services/auth/sessions + services/kyber/devices
  kyber_command_plane: reuse                # services/kyber/ops/* (req->dry-run->approve->execute->verify); mobile adapts, no new plane
  kyber_identity_device_trust: reuse        # services/kyber/{identity,devices,sessions,access}/*
  tenant_identity_authz: reuse              # services/auth/*, middleware/middleware.py, services/policy/*
  credential_platform: reuse                # shared/credentials/* (in_memory/local_encrypted/aws_secrets_manager)
  mobile_apps: build                        # NET-NEW: apps/aether-mobile, apps/kyber-mobile (Expo + prebuild)
  mobile_shared_packages: build             # NET-NEW: packages/mobile-*
  desktop_notification_center_kyber: reuse  # frontend/kyber/src/features/notifications/* (mobile push = "Architecture-Ready")
  desktop_notification_center_aether: build # NET-NEW: only settings/notifications-section.tsx exists today (C5)
  release_readiness_machinery: reuse        # scripts/production_status.py, repo_doctor.py, deployment_profiles.yaml

# Alembic revision reservation. Single-head invariant is enforced by
# scripts/validate_temporal_integrity.py. Current DB head at program start: 20260812_credential_platform.
# NOTE: PR #498 (unmerged) reserves 20260812_provider_credential_versions + 20260813_payment_webhook_endpoints.
# Our IDs are namespaced 20260820+ to avoid name collision; down_revision must be re-pointed to the
# real single head on any rebase that lands #498 (or other migrations) first.
migration_reservation:
  chain_root_at_start: "20260812_credential_platform"
  reserved:
    - id: "20260820_continuation_plane"      # C1: tables continuations, continuation_selections
      down_revision: "20260812_credential_platform"
      owner_milestone: C1
      status: landed
    - id: "20260821_client_sync"             # C1: tables sync_change_log, sync_cursor_counter
      down_revision: "20260820_continuation_plane"
      owner_milestone: C1
      status: landed
    - id: "20260822_mobile_installations"    # C3: tables mobile_installations, push_subscriptions
      down_revision: "20260821_client_sync"
      owner_milestone: C3
      status: landed

