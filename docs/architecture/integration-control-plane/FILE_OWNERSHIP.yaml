# Unified Integration Control Plane — file ownership map.
# Only the orchestrator writes this file. Frozen at W0; extended only with a lease.
# An agent MUST NOT write outside its owned paths (§29). Hot shared-contract files are
# orchestrator-leased: an agent submits the needed diff as evidence and the orchestrator
# applies it during landing to avoid cross-agent conflicts on the single branch.
#
# Backend root = "services/api/". Paths are relative to it unless
# prefixed with "/" (repo root).

orchestrator:
  owner: orchestrator
  exclusive: true
  paths:
    - /docs/integration-control-plane/**            # all program-state files
    - alembic/versions/**                           # migration id reservation + authoring
    - /config/storage_policies.yaml                 # storage-policy coverage gate
    - config/settings.py                            # control-plane config flag block
    - /CHANGELOG.md

contracts:            # A1 (W1)
  owner: architecture-agent
  paths:
    - shared/integration_contracts/**
  reuse_only:                                       # may read/import, must not restructure
    - shared/certification/**
    - services/api/connectors/integrations/connectors/base.py

credentials:          # A2 (W2)
  owner: credential-agent
  paths:
    - shared/credentials/**
    - shared/providers/key_vault.py
  leased:                                           # scoped edits only, submitted as diff evidence
    - services/api/connectors/integrations/connectors/service.py   # secret store/resolve path only

oauth:                # A3 (W3)
  owner: oauth-agent
  paths:
    - services/api/connectors/integrations/oauth/**

webhooks:             # A4 (W3)
  owner: webhook-agent
  paths:
    - services/api/connectors/integrations/webhook_policy.py
    - services/api/connectors/integrations/webhook_quarantine.py
    - services/api/governance/security/integration_security.py

sync:                 # A5 (W4)
  owner: sync-agent
  leased:
    - services/api/connectors/integrations/connectors/service.py   # sync methods only
  paths:
    - services/api/workers/jobs/**

connector_group_a:    # A6 (W4) — slack, webhook, shopify, stripe, hubspot
  owner: connector-agent-a
  leased:
    - services/api/connectors/integrations/connectors/adapters.py
connector_group_b:    # A7 (W4) — salesforce, klaviyo, segment, posthog, ga4
  owner: connector-agent-b
  leased:
    - services/api/connectors/integrations/connectors/adapters.py
    - services/api/connectors/integrations/connectors/klaviyo.py
connector_group_c:    # A8 (W4) — jira, linear, zendesk, intercom, dune
  owner: connector-agent-c
  leased:
    - services/api/connectors/integrations/connectors/adapters.py

payment_rails:        # A9 (W4)
  owner: payment-rail-agent
  paths:
    - services/api/connectors/integrations/providers/payment_rails/**

gateway_remediation:  # A10 (W4)
  owner: gateway-agent
  paths:
    - shared/providers/categories.py                # streaming/social ProviderResult remediation

tenant_ui:            # A11 (W5)
  owner: tenant-ui-agent
  paths:
    - /apps/aether/src/**

kyber_ui:             # A12 (W5)
  owner: kyber-ui-agent
  paths:
    - /apps/kyber/src/**

deploy_cert:          # A13 (W6)
  owner: deploy-cert-agent
  paths:
    - /tests/contracts/**
    - /tests/e2e/**

# Connector-group agents share adapters.py by lease. Because they touch one hot file,
# the orchestrator serializes their landings (A6 -> A7 -> A8) rather than landing in
# parallel, or splits adapters.py into per-connector modules in W4 before fan-out.

# ============================================================================
# End-User Lifecycle & Integration Management (absorbed program, branch
# feat/enduser-lifecycle-integration). Round 2 workstream leases. The orchestrator
# owns the integration queue over the shared destinations below (router.tsx,
# app-shell.tsx nav, endpoints.ts, settings/). Each WS owns its paths exclusively;
# files not listed are read-only to that WS. Contract files owned by WS-0 freeze
# after R1 (change only via ADR-0008..0013).
# Backend root = "services/api/". Paths relative to it unless
# prefixed with "/" (repo root).
# ============================================================================

r2_ws0_contract_spine:      # R1 (before fan-out); owns shared contracts + endpoints
  owner: ws0
  paths:
    - shared/integration_contracts/**          # extend experience_category + projection types
    - /packages/shared/connector-taxonomy.ts   # provider/category mirror (generate)
  leased:                                      # additive endpoints only (no restructure)
    - services/api/connectors/integrations/connectors/routes.py
    - /apps/aether/src/lib/api/endpoints.ts
    - /apps/aether/src/features/integrations/**

r2_ws1_settings_ia:        # Phase 2 / PR B
  owner: ws1
  paths:
    - /apps/aether/src/pages/settings/**   # extract sections into nested shell
    - /apps/aether/src/features/settings/**
  leased:                                      # submitted as diff evidence to orchestrator
    - /apps/aether/src/app/router.tsx      # /settings/* routes + /integrations redirect
    - /apps/aether/src/components/app-shell.tsx
  reuse_only:
    - /apps/aether/src/pages/connectors/** # moved, not rewritten, in this wave

r2_ws2_advertising_convergence:   # Phase 3 / PR C
  owner: ws2
  paths:
    - services/api/journeys/measurement/connectors/**
    - services/api/journeys/campaign/**                      # source auto-link orchestration (additive)
    - /apps/aether/src/pages/campaigns/campaign-sources-page.tsx
    - /apps/aether/src/features/campaigns/use-campaign-sources.ts
  leased:
    - shared/providers/categories.py            # ad_platform identity/alias only
    - services/api/journeys/campaign/routes.py               # connect/accounts/sync additions only

r2_ws3_activation:         # Phase 4 / PR D
  owner: ws3
  paths:
    - services/api/tenancy/activation/**                    # intent + steps (extend, additive)
    - /apps/aether/src/pages/activation/**
    - /apps/aether/src/features/activation/**
  leased:
    - /apps/aether/src/app/router.tsx       # /activate alias
    - /apps/aether/src/app/tenant-landing.tsx  # post-auth resolver

r2_ws4_readiness_contextual:   # Phase 5+6 / PR E
  owner: ws4
  paths:
    - services/api/graph/readiness_graph/**               # projection additions
    - /apps/aether/src/features/integrations/**  # readiness hooks (after WS-0 types)
  leased:
    - /apps/aether/src/pages/campaigns/**   # contextual CTAs + empty states
    - /apps/aether/src/pages/profile360/**

r2_ws5_public_private:     # Phase 7 / PR F (requires marketing source on base = origin/main)
  owner: ws5
  paths:
    # WS-6-handoff swap DONE @ 7604fb95: connectors.ts is a DERIVED VIEW of
    # packages/shared/connector-taxonomy.ts (CATALOG_ENTRIES project + PUBLIC_COPY
    # marketing overlay). Only the shared_destinations orchestrator touches it now.
    - /apps/aether-marketing/src/content/connectors.ts   # derived view (shared taxonomy) — no longer hand-transcribed
    - /apps/aether-marketing/src/lib/handoff.ts          # intent/provider params (whitelisted)
    - /apps/aether-marketing/src/pages/integrations-page.tsx
  leased:
    - /packages/shared/**                          # vocabulary convergence via WS-0 contracts
  reuse_only:
    - /apps/aether-marketing/src/content/connectors.test.ts

r2_ws6_tail:               # Phase 8 / PR G + spec capture + acceptance
  owner: ws6
  # HANDED OFF FROM R1 (WS-0): generate /packages/shared/connector-taxonomy.ts,
  # the TS provider/category mirror. Deferred out of R1-s2 (63fab756) because
  # the R1 contract spine ended at the FE twin (s4, 95d53f4c). WS-6 tail must
  # generate it from shared/integration_contracts/catalog.py (ALL_MANIFESTS
  # four-group union — connectors / ad-platforms / payment-rails /
  # deferred-credit-bureaus) as a pure derived mirror, never hand-edited, and
  # keep it in step when catalog.py evolves.
  paths:
    - /docs/source-of-truth/**                    # spec capture + stale-taxonomy fixes (review, never blind-stamp)
    - /docs/operations/**
    - /docs/frontend/FRONTEND-ARCHITECTURE.md     # or docs/architecture/FRONTEND-ARCHITECTURE.md as declared source
    - /tests/contracts/**                         # parity/lifecycle contract tests (namespaced)
    - /apps/aether/src/test/e2e/**            # lifecycle suites A-E (playwright)
    - /packages/shared/connector-taxonomy.ts      # generate (derive from catalog.py), never hand-edit
  leased:
    - /apps/aether/src/app/router.tsx         # legacy route deprecations only
    - /docs/plans/**                              # phase ledger updates

shared_destinations:       # orchestrator-owned merge surface (never two WS writers in one wave)
  owner: orchestrator
  paths:
    - /apps/aether/src/app/router.tsx
    - /apps/aether/src/components/app-shell.tsx
    - /apps/aether/src/lib/api/endpoints.ts
    - /apps/aether/src/pages/settings/**
    - /docs/integration-control-plane/**
