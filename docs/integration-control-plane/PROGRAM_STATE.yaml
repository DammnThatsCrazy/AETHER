# End-User Lifecycle & Integration Management — living program state.
# SINGLE AUTHORITY for work status. Only the orchestrator writes this file.
# Not generated; not source-linked (no drift stamping). Hand-maintained per landing.
# Absorbs the prior "unified-integration-control-plane" program (W0-W2 landed,
# ADR-0001..0007 retained as ancestors). See docs/plans/ENDUSER_LIFECYCLE_PHASES.md.

program:
  name: enduser-lifecycle-integration
  branch: feat/enduser-lifecycle-integration
  base_commit: "59a7fb24"                                      # == origin/main at program start (PR #607 marketing shells 9620539f); REBASED onto 59a7fb24 (post-PR-#608 squash of the 4-program financial-normalization stack) 2026-09-05
  absorbs: feat/unified-integration-control-plane           # prior lane, ADR-0001..0007, W0-W2 landed
  last_landed_checkpoint: R4                                # integration waves WS-1..WS-6 + WS-5 taxonomy swap all gated GREEN
  status: active
  delivery_model: contract-first parallel workstreams       # one orchestrator, isolated-worktree specialists, serialized integration queue
  gate: "make ci-check"                                     # canonical completion gate (repo_doctor.py --ci)

# Round schedule (dependency-ordered). R1 (contract spine) is sequential; R2 fans out all phases.
rounds:
  - id: R0
    name: program-control        # lane, baseline, absorb, triage
    parallelism: solo
    depends_on: []
    status: completed
    lands: [lane, absorb-control-files, plan-doc, campaign-source-triage]
  - id: R1
    name: contract-spine         # Phase 0 + PR A: ADR, identity/alias map, experience_category, one-catalog contract, tenant projection endpoints, readiness projection, parity tests
    parallelism: solo (sub-agents within)
    depends_on: [R0]
    status: completed            # make ci-check 72/0 GREEN @ 8905c735 (2026-09-05)
    lands: [s1-experience-alias-87e85193, s2-ad-catalog-63fab756, s3-read-model-endpoints-64877fca, s4-fe-twin-95d53f4c, docs-sync-8905c735]
  - id: R2
    name: fan-out                # WS-1..WS-6 == blueprint Phases 2-8 / PR B-G, all concurrent in isolated worktrees
    parallelism: "6x"
    depends_on: [R1]
    status: completed            # WS-1..WS-6 authored in isolated ws/enduser-ws{1..6} worktrees (shared symlinked env)
    lands: [ws1-settings-ia, ws2-advertising-convergence, ws3-activation, ws4-readiness-contextual, ws5-public-private, ws6-tail]
  - id: R3
    name: integration-waves      # ordered merges WS-1 -> WS-2 -> WS-3 -> WS-4 -> WS-5 -> WS-6; make ci-check each merge
    parallelism: serialized
    depends_on: [R2]
    status: completed            # all six merges + WS-5 taxonomy swap each gated make ci-check 72/0 GREEN (2026-09-05)
    lands: [merge-ws1-6074bc31, merge-ws2-f9c0b504, merge-ws3-55171917, merge-ws4-c0c302b8, merge-ws5-522da08d, merge-ws6-cd0855f2, ws5-taxonomy-swap-7604fb95]
  - id: R4
    name: lifecycle-acceptance   # E2E A-E, a11y/data-truth, spec source-of-truth capture, release-gate only if claimed
    parallelism: solo
    depends_on: [R3]
    status: in_progress          # LANE ACCEPTANCE DELIVERABLE DONE: suites landed + honest-skip verified 12/12 exit 0 (2026-09-05). Full A-E green BLOCKED on the seeded integration env (backend :8000 + E2E_TENANT_EMAIL[_A.._E]/PASSWORD + E2E_CAMPAIGN_UUID + connectors_enabled flag), which is NOT provisioned in this lane. No integration-env claim made.

