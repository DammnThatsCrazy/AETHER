# =============================================================================
# Aether Platform — Docker Compose
#
# Default (no flags): postgres + backend only (~1.5 GB RAM, <2 min cold start).
# ML predict routes are served in-process (ML_SERVING_INLINE=true, E2).
# Cache falls back to in-memory when AETHER_ENV=local (E1).
#
# Profiles (opt-in):
#   --profile streaming      LocalStack SQS+SNS+DynamoDB (prod streaming equivalent)
#   --profile analytics      clickhouse (analytics queries)
#   --profile observability  prometheus + grafana
#   --profile demo           kyber demo frontend
#   --profile notebooks      jupyter lab (ML training image)
#   --profile legacy         redis + standalone ml-serving (pre-E1/E2 rollback)
#   --profile full           everything
#
# Usage:
#   make dev                                      Default minimal stack
#   make dev-streaming                            Add LocalStack SQS+SNS+DynamoDB
#   make dev-notebooks                            Add Jupyter (ML)
#   make dev-full                                 Everything
#   docker compose logs -f
#   docker compose down
# =============================================================================

# ── Shared anchors ──────────────────────────────────────────────────
# The runtime workers and the migration job reuse the backend image and a
# common environment so the local stack mirrors the cloud runtime-role topology
# (AWS Deployment/aether-aws/terraform/modules/ecs → aws_ecs_service.runtime_role
# for_each var.runtime_roles). Same code, same roles, no per-profile source edits.
x-backend-build: &backend-build
  context: .
  dockerfile: "Backend Architecture/aether-backend/Dockerfile"

x-runtime-env: &runtime-env
  AETHER_ENV: ${AETHER_ENV:-local}
  DATABASE_URL: postgresql://aether:aether_dev_password@postgres:5432/aether
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  # Workers/migrations tolerate a dev default so the local runtime profile boots
  # without bootstrap; the API service keeps JWT_SECRET required (fail-closed).
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-staging}
  BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}

services:
  # ── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # E1: DynamoDB On-Demand is the production cache backend. Redis is kept in
    # the legacy profile for rollback and for devs who want a local Redis.
    # Default dev stack uses in-memory cache (AETHER_ENV=local fallback).
    # Also included in integration and staging-ml profiles for extraction-defense
    # rate limiting (db=2) and monitoring state (db=3).
    profiles: ["legacy", "integration", "staging-ml", "streaming", "full"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # LocalStack — local SQS+SNS for streaming development (replaces Kafka in prod).
  # Exposes the AWS SDK-compatible endpoint at http://localhost:4566.
  # Set AWS_ENDPOINT_URL=http://localstack:4566 in service env to route
  # aiosqs / boto3 calls here instead of real AWS.
  localstack:
    image: localstack/localstack:3
    # integration profile adds S3 for ML artifact storage via ARTIFACT_STORE=s3
    profiles: ["streaming", "integration", "full"]
    ports:
      - "4566:4566"
    environment:
      # sqs,sns,dynamodb: streaming profile; s3: integration profile ML artifact store
      SERVICES: sqs,sns,dynamodb,s3
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (+ zookeeper) — the prod streaming broker. LocalStack SQS/SNS is the
  # lightweight default; the streaming/full profiles run real Kafka so the
  # journey-service consumer path matches staging/prod. Cloud equivalent: the
  # `msk` Terraform module (AWS Deployment/aether-aws/terraform/modules/msk).
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: ["streaming", "full"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["streaming", "full"]
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # MLflow tracking server — integration profile only.
  # Artifacts stored in LocalStack S3 (s3://aether-ml-experiments/mlflow).
  # Metadata stored in SQLite at /mlflow/mlflow.db inside the container volume.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    profiles: ["integration"]
    ports:
      - "5000:5000"
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://aether-ml-experiments/mlflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    profiles: ["analytics", "streaming", "full"]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

  # ── Application Services ──────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: "Backend Architecture/aether-backend/Dockerfile"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Optional: bootstrap.sh generates .env for staging. A fresh checkout has
      # none, so `docker compose config` still parses (required vars fail-closed).
      - path: .env
        required: false
    environment:
      AETHER_ENV: ${AETHER_ENV:-local}
      DATABASE_URL: postgresql://aether:aether_dev_password@postgres:5432/aether
      # E1: no REDIS_HOST → cache falls back to in-memory when AETHER_ENV=local.
      # Add --profile legacy to run with Redis, or --profile streaming for LocalStack DynamoDB.
      # E2: ML predict routes served in-process — no separate ml-serving container needed.
      # Set ML_SERVING_INLINE=false in .env when using --profile integration or staging-ml
      # to route ML requests to the standalone ml-serving container instead.
      ML_SERVING_INLINE: "${ML_SERVING_INLINE:-true}"
      ML_SERVING_URL: "${ML_SERVING_URL:-http://ml-serving:8080}"
      # SQS/DynamoDB: point to LocalStack when running --profile streaming.
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run deploy/staging/bootstrap.sh or set manually}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}
      WATERMARK_SECRET_KEY: ${WATERMARK_SECRET_KEY:-}
      CANARY_SECRET_SEED: ${CANARY_SECRET_SEED:-}
      # Demo records are never inserted unless dev-demo sets this flag.
      AETHER_DEMO_SEED_ON_START: ${AETHER_DEMO_SEED_ON_START:-false}
      AETHER_DEMO_TENANT_ID: ${AETHER_DEMO_TENANT_ID:-}
      AETHER_DEMO_SEED_NAMESPACE: ${AETHER_DEMO_SEED_NAMESPACE:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ── Migration job (one-shot) ──────────────────────────────────────
  # Applies alembic migrations to head, then exits. Cloud equivalent: the
  # RUN_MIGRATIONS=1 one-off ECS task run from the deploy workflow. Run with:
  #   docker compose --profile migrate up migrate
  migrate:
    build: *backend-build
    profiles: ["migrate", "workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      RUN_MIGRATIONS: "1"
    # entrypoint.sh runs `alembic upgrade head` when RUN_MIGRATIONS=1, then execs
    # this no-op so the container exits 0 once migrations are at head.
    command: ["python", "-c", "print('migrations applied to head')"]
    restart: "no"

  # ── Runtime-role workers ──────────────────────────────────────────
  # One process per runtime role (services/runtime/roles.py::WORKER_ROLES),
  # each booted via `python -m services.runtime.run_role <role>`. These mirror
  # the dedicated cloud ECS runtime-role services 1:1. Gated behind the
  # `workers` profile so the default minimal dev stack is unchanged.
  outbox-relay:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: outbox-relay
    command: ["python", "-m", "services.runtime.run_role", "outbox-relay"]
    restart: unless-stopped

  stream-worker:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: stream-worker
    command: ["python", "-m", "services.runtime.run_role", "stream-worker"]
    restart: unless-stopped

  identity-worker:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: identity-worker
    command: ["python", "-m", "services.runtime.run_role", "identity-worker"]
    restart: unless-stopped

  graph-writer:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: graph-writer
    command: ["python", "-m", "services.runtime.run_role", "graph-writer"]
    restart: unless-stopped

  measurement-worker:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: measurement-worker
    command: ["python", "-m", "services.runtime.run_role", "measurement-worker"]
    restart: unless-stopped

  # Semantic classification runs in-process here (never over HTTP): this role
  # owns the semantic-classification and semantic-identity-restatement
  # consumers in services/runtime/consumer_specs.py.
  semantic-worker:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: semantic-worker
    command: ["python", "-m", "services.runtime.run_role", "semantic-worker"]
    restart: unless-stopped

  materializer:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: materializer
    command: ["python", "-m", "services.runtime.run_role", "materializer"]
    restart: unless-stopped

  # `maintenance` owns the scheduled/cron jobs (job_scheduler, retention_sweep,
  # billing_overage_cron, notification_sla, …) — this is the local home of the
  # platform's scheduled jobs.
  maintenance:
    build: *backend-build
    profiles: ["workers", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AETHER_ROLE: maintenance
    command: ["python", "-m", "services.runtime.run_role", "maintenance"]
    restart: unless-stopped

  ml-serving:
    # E2: ML predict routes are now served in-process by the backend container
    # (ML_SERVING_INLINE=true). This standalone service is in the legacy profile
    # for rollback; flip ML_SERVING_INLINE=false on the backend to use it again.
    # integration profile: full Redis + LocalStack S3 + MLflow integration testing.
    # staging-ml profile: AETHER_ENV=staging, real Redis/S3 creds from .env required.
    profiles: ["legacy", "integration", "staging-ml", "full"]
    build:
      context: "ML Models/aether-ml"
      dockerfile: docker/Dockerfile
      target: serving
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Optional: bootstrap.sh generates .env for staging. A fresh checkout has
      # none, so `docker compose config` still parses (required vars fail-closed).
      - path: .env
        required: false
    environment:
      AETHER_ENV: ${AETHER_ENV:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_EXTRACTION_DB: ${REDIS_EXTRACTION_DB:-2}
      MONITOR_REDIS_DB: ${MONITOR_REDIS_DB:-3}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-integration-dev-token}
      ARTIFACT_SIGNING_KEY: ${ARTIFACT_SIGNING_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: uvicorn serving.src.api:app --host 0.0.0.0 --port 8080

  journey-service:
    build:
      context: "Backend Architecture/services/journey-service"
      dockerfile: Dockerfile
    # Streaming consumer: needs Kafka + ClickHouse, both profile-gated.
    # Keep this service in the streaming profile so the default stack stays minimal.
    profiles: ["streaming", "full"]
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_started
    env_file:
      # Optional: bootstrap.sh generates .env for staging. A fresh checkout has
      # none, so `docker compose config` still parses (required vars fail-closed).
      - path: .env
        required: false
    environment:
      AETHER_ENV: ${AETHER_ENV:-staging}
      DATABASE_URL: postgresql://aether:aether_dev_password@postgres:5432/aether
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      JOURNEY_CONSUMER_AUTOSTART: "1"
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-}
      ICEBERG_S3_BUCKET:   ${ICEBERG_S3_BUCKET:-aether-snapshots-dev}

  # Jupyter Lab — interactive ML exploration using the training image.
  # Access at http://localhost:8888 (token printed in container logs).
  jupyter:
    build:
      context: "ML Models/aether-ml"
      dockerfile: docker/Dockerfile
      target: training
    profiles: ["notebooks", "full"]
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser --NotebookApp.token=''
    volumes:
      - ./ML Models/aether-ml:/app
      - jupyter_data:/root/.jupyter

  kyber:
    build:
      # Build context is the repo root (npm workspaces monorepo); the app lives
      # at frontend/kyber. Cloud equivalent: the inline `static_frontends.kyber`
      # S3+CloudFront SPA in AWS Deployment/aether-aws/terraform/main.tf.
      context: .
      dockerfile: frontend/kyber/Dockerfile
    profiles: ["demo", "frontends", "full"]
    # Host port 8081 avoids collision with ml-serving on 8080.
    # Container still listens on 8080 internally (nginx default).
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # aether operator/admin SPA — the second static frontend. Cloud equivalent:
  # the inline `static_frontends.aether` S3+CloudFront SPA in the Terraform root.
  # Built from the same monorepo workspace root as kyber.
  aether-frontend:
    build:
      context: .
      dockerfile: frontend/kyber/Dockerfile
      args:
        # Reuses the kyber image recipe; a dedicated frontend/aether/Dockerfile
        # can replace this once the aether SPA ships its own nginx image.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    profiles: ["frontends", "full"]
    ports:
      - "8082:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Monitoring ────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.49.0
    profiles: ["observability", "full"]
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./deploy/staging/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro

  grafana:
    image: grafana/grafana:10.3.0
    # Depends on prometheus, which is in the observability/full profile.
    # Pin grafana to the same profiles so the default stack does not pull it in.
    profiles: ["observability", "full"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/observability/grafana:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  localstack_data:
  jupyter_data:
  mlflow_data:
