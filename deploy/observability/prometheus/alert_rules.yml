groups:
  - name: aether_service_health
    rules:
      - alert: AetherBackendDown
        expr: up{job="aether-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aether backend is down"
          description: "Backend has been unreachable for 2+ minutes."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 2s"
          description: "p95 latency is {{ $value }}s."

      - alert: RateLimitSpike
        expr: rate(http_rate_limited[5m]) > 10
        for: 3m
        labels:
          severity: info
        annotations:
          summary: "High rate limiting activity"
          description: "{{ $value }} requests/sec being rate limited."

  - name: aether_data_health
    rules:
      - alert: LakeIngestionFailure
        expr: rate(lake_bronze_ingested[10m]) == 0 and rate(lake_ingest_api[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lake ingestion receiving requests but not persisting"
          description: "Ingest API is called but Bronze records are not being created."

      - alert: LakeRollbackSpike
        expr: rate(lake_bronze_rollback[5m]) > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Lake rollback detected"
          description: "A source_tag rollback is in progress."

      - alert: ProviderFailureSpike
        expr: rate(provider_request{status="error"}[5m]) / rate(provider_request[5m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} error rate >30%"
          description: "{{ $labels.provider }} is failing at {{ $value | humanizePercentage }}."

  - name: aether_intelligence_health
    rules:
      - alert: ExpectationContradictionSpike
        expr: rate(expectation_contradictions_detected[5m]) > 5
        for: 3m
        labels:
          severity: info
        annotations:
          summary: "High contradiction detection rate"
          description: "{{ $value }} contradictions/sec detected."

      - alert: FraudHeuristicFallback
        expr: rate(rewards_fraud_heuristic_fallback[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rewards using heuristic fallback in {{ $labels.env }}"
          description: "ML serving unavailable — fraud scoring using rule-based heuristics."

      - alert: ExtractionDefenseBlocked
        expr: rate(extraction_defense_blocked[5m]) > 1
        for: 3m
        labels:
          severity: info
        annotations:
          summary: "Extraction defense blocking requests"
          description: "{{ $value }} requests/sec blocked by ML extraction defense."

  # ============================================================
  # Aether Rate Limiting & Quota Alerts (self-serve plans P1-P4)
  # ============================================================
  - name: aether_rate_limiting
    rules:
      # --- Quota alerts ---
      - alert: TenantQuota80Percent
        expr: aether_quota_utilization_ratio > 0.8
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} at {{ $value | humanizePercentage }} of monthly quota"
          description: "Plan {{ $labels.plan_tier }} tenant approaching quota limit."

      - alert: TenantQuotaExhausted
        expr: aether_quota_remaining_gauge == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} ({{ $labels.plan_tier }}) entered overage billing"
          description: "All subsequent requests will be metered at per-service overage rates."

      - alert: TenantOverageSpike
        expr: rate(aether_overage_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} overage rate >100 req/5min on {{ $labels.service }}"
          description: "High overage consumption may indicate misconfigured integration or need for plan upgrade."

      # --- Burst RPM alerts ---
      - alert: BurstRateLimitHigh
        expr: rate(aether_burst_rpm_rejected_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} hitting burst RPM limit frequently"
          description: "{{ $labels.plan_tier }} plan burst limit being hit. May need plan upgrade or client-side throttling."

      # --- Feature gate alerts ---
      - alert: FeatureGateBlocksHigh
        expr: rate(aether_feature_gate_blocked_total[5m]) > 50
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} repeatedly blocked on {{ $labels.service }}"
          description: "Possible upsell signal — tenant is calling services outside their plan."

      # --- System health ---
      - alert: RateLimitRedisFallbackActive
        expr: rate(aether_redis_fallback_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rate limiting Redis fallback active on {{ $labels.layer }}"
          description: "Rate limiting enforcement is degraded. Burst RPM and quota metering may not be functioning."

      - alert: RateLimitMiddlewareLatencyHigh
        expr: histogram_quantile(0.99, rate(aether_middleware_latency_seconds_bucket[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting middleware p99 latency >50ms on {{ $labels.layer }}"
          description: "Middleware overhead is too high. Check Redis connectivity and load."

  # ============================================================
  # SDK Health & Drift Detection Alerts
  # ============================================================
  - name: aether_sdk_health
    rules:
      - alert: SDKFleetSilence
        expr: rate(aether_sdk_heartbeats_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No SDK heartbeats received for tenant {{ $labels.tenant_id }}"
          description: "No SDK instance has checked in for 10+ minutes. Possible fleet-wide outage or SDK crash."

      - alert: SDKReplayStorm
        expr: rate(aether_sdk_drift_incidents_total{drift_type="replay_storm"}[5m]) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "SDK replay storm detected for tenant {{ $labels.tenant_id }}"
          description: "Event replay rate has exceeded the safety threshold. Check for stuck retry loops."

      - alert: SDKStaleVersionSpike
        expr: sum by (tenant_id) (aether_sdk_stale_count) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} stale SDK instances for tenant {{ $labels.tenant_id }}"
          description: "More than 10 SDK instances are running a deprecated version. Prompt upgrade required."

      - alert: SDKDroppedEventSpike
        expr: rate(aether_sdk_dropped_events_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SDK dropped-event rate >100/min for tenant {{ $labels.tenant_id }}"
          description: "High event drop rate may indicate consent misconfiguration, schema mismatch, or backend rejection."

      - alert: SDKHealthScoreDegraded
        expr: aether_sdk_health_score < 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SDK {{ $labels.sdk_id }} health score below 50 for tenant {{ $labels.tenant_id }}"
          description: "SDK composite health score has been below 50 for 5+ minutes. Investigate connectivity, auth, and ingestion."

      - alert: SDKSchemaDriftDetected
        expr: rate(aether_sdk_drift_incidents_total{drift_type="schema_drift"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SDK schema drift detected for tenant {{ $labels.tenant_id }}"
          description: "An SDK instance is reporting an unexpected schema hash. Possible unauthorized modification or version mismatch."

      - alert: SDKPayloadAnomalySpike
        expr: rate(aether_sdk_drift_incidents_total{drift_type="payload_anomaly"}[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SDK payload anomaly rate elevated for tenant {{ $labels.tenant_id }}"
          description: "Multiple SDK instances reporting high event drop rates — possible systematic ingestion failure."

  # ============================================================
  # ML Model Health Alerts
  # ============================================================
  - name: aether_ml_health
    rules:
      - alert: MLModelNotLoaded
        expr: aether_ml_model_loaded{required="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Required ML model {{ $labels.model_id }} is not loaded"
          description: "{{ $labels.model_id }} has been missing for 2+ minutes. Prediction requests will fail or fall back to heuristics."

      - alert: MLPredictionErrorRate
        expr: >
          rate(aether_ml_prediction_errors_total[5m])
          / rate(aether_ml_predictions_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML model {{ $labels.model_id }} error rate >5%"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.model_id }} over the last 5 minutes."

      - alert: MLPredictionLatencyHigh
        expr: >
          histogram_quantile(0.95,
            rate(aether_ml_prediction_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML model {{ $labels.model_id }} p95 latency >500ms"
          description: "p95 prediction latency is {{ $value }}s for {{ $labels.model_id }}."

      - alert: MLFreshnessViolationRate
        expr: >
          rate(aether_ml_freshness_violations_total[10m])
          / rate(aether_ml_freshness_checks_total[10m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ML freshness SLA violation rate >5% for {{ $labels.model_id }}"
          description: "{{ $value | humanizePercentage }} of freshness checks are failing SLA for {{ $labels.model_id }}."

      - alert: MLDriftDetected
        expr: aether_ml_psi_score > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Significant feature drift on ML model {{ $labels.model_id }}"
          description: "PSI score {{ $value }} for {{ $labels.model_id }} exceeds 0.2 (significant drift threshold). Retraining recommended."

      - alert: MLArtifactSignatureFailure
        expr: rate(aether_ml_artifact_signature_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML artifact HMAC signature failure for {{ $labels.model_id }}"
          description: "Artifact integrity check failed for {{ $labels.model_id }}. Model may be tampered — serving blocked."

      - alert: MLExtractionAttackSustained
        expr: >
          rate(extraction_defense_blocked[5m])
          / rate(aether_ml_predictions_total[5m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained ML extraction attack — {{ $value | humanizePercentage }} block rate"
          description: "Extraction defense has blocked >30% of ML prediction requests for 5+ minutes. Possible coordinated extraction attempt."

      - alert: MLModelRolledBack
        expr: increase(aether_ml_rollbacks_total[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "ML model {{ $labels.model_id }} was rolled back"
          description: "A rollback was triggered for {{ $labels.model_id }}. Review promotion audit log for details."

  # ============================================================
  # Measurement Pipeline SLOs
  # Target: p95 dashboard API ≤ 2 s, attribution run ≤ 30 s,
  #         connector sync freshness ≤ 26 h, credit reconciliation ≤ 0.001 drift
  # ============================================================
  - name: aether_measurement_slos
    rules:
      # --- Attribution engine SLOs ---
      - alert: AttributionRunLatencyHigh
        expr: >
          histogram_quantile(0.95,
            rate(aether_attribution_run_duration_seconds_bucket[10m])
          ) > 30
        for: 5m
        labels:
          severity: warning
          slo: "attribution_run_p95_30s"
        annotations:
          summary: "Attribution run p95 latency >30s for tenant {{ $labels.tenant_id }}"
          description: "Attribution engine p95 is {{ $value }}s. SLO target is 30s. Check touchpoint volume and journey complexity."

      - alert: AttributionRunFailureRateHigh
        expr: >
          rate(aether_attribution_run_failures_total[10m])
          / rate(aether_attribution_run_total[10m]) > 0.05
        for: 5m
        labels:
          severity: warning
          slo: "attribution_success_rate_95pct"
        annotations:
          summary: "Attribution run failure rate >5% for tenant {{ $labels.tenant_id }}"
          description: "{{ $value | humanizePercentage }} of attribution runs are failing. Check conversion eligibility and journey data."

      - alert: AttributionCreditReconciliationDrift
        expr: aether_attribution_credit_reconciliation_drift > 0.001
        for: 2m
        labels:
          severity: critical
          slo: "credit_reconciliation_tolerance_0.001"
        annotations:
          summary: "Attribution credit reconciliation drift >0.001 for tenant {{ $labels.tenant_id }}"
          description: "Credit weight sum deviates from 1.0 by {{ $value }}. Financial accuracy guarantee violated."

      # --- Connector freshness SLOs ---
      - alert: ConnectorFreshnessStale
        expr: >
          time() - aether_connector_last_success_timestamp_seconds
          > 93600
        for: 10m
        labels:
          severity: warning
          slo: "connector_freshness_26h"
        annotations:
          summary: "Connector {{ $labels.connector_type }} stale for tenant {{ $labels.tenant_id }}"
          description: "Last successful sync was {{ $value | humanizeDuration }} ago. SLO target is 26h (daily sync + 2h buffer)."

      - alert: ConnectorSyncFailureSpike
        expr: rate(aether_connector_sync_failures_total[30m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Connector {{ $labels.connector_type }} sync failing for tenant {{ $labels.tenant_id }}"
          description: "Connector has been reporting sync failures for 15+ minutes. Spend data may be stale."

      - alert: ConnectorHealthDegraded
        expr: aether_connector_health_status{status="error"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Connector {{ $labels.connector_type }} health check failing for tenant {{ $labels.tenant_id }}"
          description: "Connector credentials may be expired or revoked. Operator action required."

      # --- Gold materialization SLOs ---
      - alert: GoldMaterializationLag
        expr: >
          time() - aether_gold_materialization_watermark_timestamp_seconds
          > 7200
        for: 10m
        labels:
          severity: warning
          slo: "gold_freshness_2h"
        annotations:
          summary: "Gold materialization lag >2h for tenant {{ $labels.tenant_id }}"
          description: "Dashboard data is stale. Last materialization was {{ $value | humanizeDuration }} ago."

      - alert: GoldMaterializationFailure
        expr: rate(aether_gold_materialization_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gold materialization failures for tenant {{ $labels.tenant_id }}"
          description: "ClickHouse write failures are causing materialization to fail. Check ClickHouse connectivity."

      # --- Dashboard API SLOs ---
      - alert: MeasurementDashboardAPILatencyHigh
        expr: >
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{
              route=~"/v1/measurement/.*|/v1/attribution/.*|/v1/conversions/.*"
            }[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          slo: "dashboard_api_p95_2s"
        annotations:
          summary: "Measurement dashboard API p95 latency >2s"
          description: "p95 API latency is {{ $value }}s. SLO target is 2s. Check Gold table query performance and ClickHouse load."

      - alert: MeasurementAPIErrorRateHigh
        expr: >
          rate(http_requests_total{
            status=~"5..",
            route=~"/v1/measurement/.*|/v1/attribution/.*|/v1/conversions/.*"
          }[5m])
          / rate(http_requests_total{
            route=~"/v1/measurement/.*|/v1/attribution/.*|/v1/conversions/.*"
          }[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          slo: "measurement_api_error_rate_1pct"
        annotations:
          summary: "Measurement API 5xx error rate >1%"
          description: "Error rate is {{ $value | humanizePercentage }}. SLO target is <1%."

      # --- Journey compiler SLOs ---
      - alert: JourneyCompilerBacklogHigh
        expr: aether_journey_compiler_queue_depth > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Journey compiler queue depth >1000 for tenant {{ $labels.tenant_id }}"
          description: "{{ $value }} journeys pending rebuild. Attribution latency will increase as backlog clears."

      # --- Spend coverage SLOs ---
      - alert: SpendCoverageGapDetected
        expr: aether_spend_coverage_pct < 0.8
        for: 60m
        labels:
          severity: warning
          slo: "spend_coverage_80pct"
        annotations:
          summary: "Spend coverage below 80% for tenant {{ $labels.tenant_id }}"
          description: "Only {{ $value | humanizePercentage }} of campaign days have spend records. ROAS accuracy is degraded."

  # ============================================================
  # Campaign Intelligence — Registry & Resolution Alerts
  # ============================================================
  - name: aether_campaign_intelligence
    rules:
      - alert: CampaignSpendMissingCanonicalId
        expr: >
          rate(campaign_resolution_total{status="unresolved"}[10m])
          / rate(campaign_resolution_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          slo: "campaign_resolution_unresolved_rate_10pct"
        annotations:
          summary: "Campaign resolution unresolved rate >10% for tenant {{ $labels.tenant_id }}"
          description: "{{ $value | humanizePercentage }} of spend/touchpoint records cannot be resolved to a canonical campaign UUID. Check mapping review queue and connector configuration."

      - alert: CampaignResolutionUnresolvedRateHigh
        expr: >
          rate(campaign_resolution_total{status="unresolved"}[5m])
          / rate(campaign_resolution_total[5m]) > 0.25
        for: 5m
        labels:
          severity: critical
          slo: "campaign_resolution_unresolved_spike"
        annotations:
          summary: "Campaign resolution unresolved spike >25% for tenant {{ $labels.tenant_id }}"
          description: "Sudden spike in unresolved resolution rate ({{ $value | humanizePercentage }}). Possible connector misconfiguration, platform ID format change, or registry corruption."

      - alert: CampaignSourceSyncFailed
        expr: rate(campaign_source_sync_total{status="error"}[30m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Campaign source sync failing for {{ $labels.platform }} (tenant {{ $labels.tenant_id }})"
          description: "Campaign source on {{ $labels.platform }} has been reporting sync failures for 15+ minutes. Spend data may be stale and resolution quality may degrade."

      - alert: CampaignSourceStale
        expr: campaign_source_freshness_seconds > 93600
        for: 10m
        labels:
          severity: warning
          slo: "campaign_source_freshness_26h"
        annotations:
          summary: "Campaign source stale for {{ $labels.platform }} (tenant {{ $labels.tenant_id }})"
          description: "Last successful campaign sync was {{ $value | humanizeDuration }} ago. SLO target is 26h. External campaign data may be outdated."

      - alert: CampaignBackfillStuck
        expr: >
          rate(campaign_reprocess_requested_total[30m]) > 0
          and rate(campaign_reprocess_completed_total[30m]) == 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Campaign reprocess job stuck for tenant {{ $labels.tenant_id }}"
          description: "Reprocessing was requested but no completions recorded for 20+ minutes. Check job queue and worker health."

      - alert: CampaignMappingReviewQueueHigh
        expr: campaign_mapping_review_open > 500
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Campaign mapping review queue >500 for tenant {{ $labels.tenant_id }}"
          description: "{{ $value }} open mapping reviews require operator attention. Unresolved evidence cannot be attributed."

      - alert: CampaignSpendMappingRateLow
        expr: campaign_spend_mapping_rate < 0.7
        for: 60m
        labels:
          severity: warning
          slo: "campaign_spend_mapping_rate_70pct"
        annotations:
          summary: "Campaign spend mapping rate below 70% for tenant {{ $labels.tenant_id }}"
          description: "Only {{ $value | humanizePercentage }} of spend records resolve to a canonical campaign UUID. ROAS reporting accuracy is degraded."

      - alert: CampaignTouchpointMappingRateLow
        expr: campaign_touchpoint_mapping_rate < 0.7
        for: 60m
        labels:
          severity: warning
          slo: "campaign_touchpoint_mapping_rate_70pct"
        annotations:
          summary: "Campaign touchpoint mapping rate below 70% for tenant {{ $labels.tenant_id }}"
          description: "Only {{ $value | humanizePercentage }} of touchpoint facts resolve to a canonical campaign UUID. Attribution accuracy is degraded."

  # ============================================================
  # Semantic Pipeline Health
  # Metrics emitted by services/semantic_intelligence only —
  # tests/unit/test_semantic_observability_assets.py pins this
  # group to the contracted series names.
  # Targets: abstention ratio ≤ 25%, classify p95 ≤ 1000 ms,
  #          review queue ≤ 50 open items
  # ============================================================
  - name: aether_semantic_health
    rules:
      - alert: SemanticAbstentionRatioHigh
        expr: >
          rate(aether_semantic_observations_abstained_total[15m])
          / (
            rate(aether_semantic_observations_classified_total[15m])
            + rate(aether_semantic_observations_abstained_total[15m])
          ) > 0.25
        for: 15m
        labels:
          severity: warning
          slo: "semantic_abstention_rate_25pct"
        annotations:
          summary: "Semantic abstention ratio >25% for tenant {{ $labels.tenant_id }}"
          description: "{{ $value | humanizePercentage }} of semantic observations are abstaining. Abstention is fail-closed (correct) behaviour — a sustained surge means the model provider is disabled/credential-less or unsupported input is flooding in. See docs/runbooks/semantic-sentiment/semantic-sentiment-operations.md."

      - alert: SemanticClassifyLatencyHigh
        expr: >
          histogram_quantile(0.95,
            rate(aether_semantic_classify_latency_ms_bucket[10m])
          ) > 1000
        for: 5m
        labels:
          severity: warning
          slo: "semantic_classify_latency_p95_1000ms"
        annotations:
          summary: "Semantic classify p95 latency >1000ms"
          description: "Classification p95 is {{ $value }}ms. SLO ceiling is 1000ms. Throttle deep analysis before core ingestion; check model provider health."

      - alert: SemanticQuarantineSustained
        expr: rate(aether_semantic_observations_quarantined_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Semantic quarantine sustained for tenant {{ $labels.tenant_id }} (reason {{ $labels.reason }})"
          description: "Unregistered event types have been quarantined continuously for 15+ minutes. Check the canonical event registry and SDK versions — quarantined events are never classified."

      - alert: SemanticReviewQueueStalled
        expr: aether_semantic_review_queue_open > 50
        for: 60m
        labels:
          severity: warning
          slo: "semantic_review_queue_depth_50"
        annotations:
          summary: "Semantic review queue ({{ $labels.queue_type }}) >50 open items"
          description: "{{ $value }} open review items require operator attention. Low-confidence subject resolutions cannot assert canonical subjects until reviewed."

      - alert: SemanticReplayJobsStuck
        expr: aether_semantic_replay_jobs_active > 0
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "Semantic replay jobs active for 2+ hours"
          description: "{{ $value }} replay job(s) have been active continuously for 2+ hours. Check job progress and pause/cancel controls — replay reads only Bronze and must never contend with live ingestion."

  # ── Payment-rail financial plane ──────────────────────────────────────────
  # Thresholds below are the default (staging) tuning; production overlays a
  # per-environment rules file that adjusts them. No secrets or provider payloads
  # ever appear in an alert — labels carry provider/health tokens only.
  - name: aether_payment_rails
    rules:
      - alert: PaymentRailNoWebhookInWindow
        expr: max by (provider) (payment_rail_provider_freshness_seconds{mode="webhook_only"}) > 86400
        for: 15m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "No verified webhook for {{ $labels.provider }} in >24h"
          description: "Provider freshness is {{ $value }}s; a webhook-only provider has gone silent."

      - alert: PaymentRailRepeatedSignatureFailures
        expr: sum by (provider) (rate(payment_rail_webhook_rejected_total[15m])) > 0.2
        for: 10m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Repeated payment webhook signature rejections for {{ $labels.provider }}"
          description: "Sustained rejected-webhook rate ({{ $value }}/s) — rotated/misconfigured secret or a probing caller."

      - alert: PaymentRailUnknownEndpointBurst
        expr: sum by (provider) (rate(payment_rail_webhook_unknown_endpoint_total[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Burst of unknown-endpoint webhook requests for {{ $labels.provider }}"
          description: "Requests to unknown/revoked endpoint ids ({{ $value }}/s) — enumeration attempt or stale provider config."

      - alert: PaymentRailProviderAuthFailure
        expr: increase(payment_rail_provider_poll_degraded_total{health="auth_error"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          plane: payment_rails
        annotations:
          summary: "Provider polling authentication failure for {{ $labels.provider }}"
          description: "The polling API key for {{ $labels.provider }} is rejected (revoked/rotated/wrong environment)."

      - alert: PaymentRailProviderRateLimited
        expr: increase(payment_rail_provider_poll_degraded_total{health="rate_limited"}[15m]) > 3
        for: 10m
        labels:
          severity: info
          plane: payment_rails
        annotations:
          summary: "Provider rate limiting {{ $labels.provider }}"
          description: "Repeated 429s from {{ $labels.provider }} polling."

      - alert: PaymentRailProviderUnavailable
        expr: increase(payment_rail_provider_poll_degraded_total{health=~"server_error|timeout|network_error"}[15m]) > 3
        for: 10m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Provider API unavailable {{ $labels.provider }}"
          description: "Repeated 5xx/timeout/network errors polling {{ $labels.provider }}."

      - alert: PaymentRailStalePollingCursor
        expr: max by (provider) (payment_rail_provider_freshness_seconds{mode="poll"}) > 7200
        for: 30m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Stale polling cursor for {{ $labels.provider }}"
          description: "No successful poll for {{ $labels.provider }} in >2h ({{ $value }}s)."

      - alert: PaymentRailSyncWorkerHeartbeatLoss
        expr: increase(payment_rail_sync_cycle_total[2h]) < 1
        for: 15m
        labels:
          severity: critical
          plane: payment_rails
        annotations:
          summary: "Payment-rail sync worker heartbeat lost"
          description: "No sync cycle completed in >2h — provider-truth pull + staleness reconciliation are stalled."

      - alert: PaymentRailRepairWorkerHeartbeatLoss
        expr: absent(payment_rail_repair_heartbeat) or increase(payment_rail_repair_cycle_total[2h]) < 1
        for: 15m
        labels:
          severity: critical
          plane: payment_rails
        annotations:
          summary: "Payment-rail canonical-repair worker heartbeat lost"
          description: "No repair cycle in >2h — incomplete deliveries will not self-heal."

      - alert: PaymentRailOldestIncompleteReceipt
        expr: payment_rail_oldest_incomplete_receipt_seconds > 3600
        for: 15m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "A payment receipt has been incomplete >1h"
          description: "Oldest incomplete receipt age is {{ $value }}s — a delivery is stuck short of completed."

      - alert: PaymentRailCanonicalBacklog
        expr: payment_rail_canonical_backlog > 100
        for: 15m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Payment canonical-delivery backlog is high"
          description: "{{ $value }} incomplete receipts — emission/outbox delivery is falling behind."

      - alert: PaymentRailOutboxDeadLetterGrowth
        expr: sum(increase(ingestion_outbox_relay_dead_lettered_total[1h])) > 0 or sum(increase(payment_rail_repair_dead_lettered_total[1h])) > 0
        for: 5m
        labels:
          severity: critical
          plane: payment_rails
        annotations:
          summary: "Payment delivery dead-letters are growing"
          description: "Outbox relay or canonical repair dead-lettered records in the last hour — manual replay required."

      - alert: PaymentRailProviderPollDegraded
        expr: max by (provider) (payment_rail_provider_poll_health) < 1
        for: 30m
        labels:
          severity: info
          plane: payment_rails
        annotations:
          summary: "Provider poll health degraded for {{ $labels.provider }}"
          description: "Provider {{ $labels.provider }} poll health has been non-ok for >30m."

      # ── Derived / growth conditions (complement the absolute-threshold rules
      # above). These are the genuinely-missing signals: reconciliation conflict,
      # canonical-backlog GROWTH (vs the absolute 100 ceiling), and outbox delivery
      # stalling. NOTE: these fire on the per-transition COUNTER
      # (payment_rail_sync_transitioned_total{state=...}); the durable conflict/stale
      # BACKLOG (how many sessions are conflicted right now) has no gauge, so it is
      # additionally evaluated in-process by
      # services/integrations/providers/payment_rails/alert_eval.py, which reads the
      # reconciliation records directly. No secrets appear here — labels carry only
      # provider/state tokens.

      # A funding session whose SDK-observed truth disagreed with provider truth
      # crossed into `conflict` during reconciliation. Any conflict is a financial-
      # integrity discrepancy worth an operator's eyes, so the threshold is >0 over
      # a 1h window (the sync worker sweeps every ~15m, so 1h catches ≥3 sweeps).
      - alert: PaymentRailReconciliationConflict
        expr: increase(payment_rail_sync_transitioned_total{state="conflict"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Payment reconciliation conflict detected"
          description: "{{ $value }} funding session(s) transitioned to `conflict` in the last hour — SDK-observed vs provider truth disagree. Inspect the reconciliation discrepancies."

      # SDK-only funding sessions that no provider ever confirmed within the
      # staleness window are aging into `stale`. A handful is normal churn; a surge
      # (>10/h) can mean a provider is silently dropping traffic or a webhook
      # endpoint is misrouted. Info severity — investigate, not page.
      - alert: PaymentRailReconciliationStaleSurge
        expr: increase(payment_rail_sync_transitioned_total{state="stale"}[1h]) > 10
        for: 15m
        labels:
          severity: info
          plane: payment_rails
        annotations:
          summary: "Surge of stale (unconfirmed) payment reconciliations"
          description: "{{ $value }} session(s) aged into `stale` in the last hour — provider confirmations may be missing."

      # The absolute-ceiling rule (PaymentRailCanonicalBacklog > 100) misses a
      # backlog that is climbing steadily but still under 100. deriv() over 30m
      # catches a sustained positive slope early, before the ceiling is hit —
      # emission/outbox delivery is falling behind faster than it drains.
      - alert: PaymentRailCanonicalBacklogGrowth
        expr: deriv(payment_rail_canonical_backlog[30m]) > 0
        for: 30m
        labels:
          severity: warning
          plane: payment_rails
        annotations:
          summary: "Payment canonical-delivery backlog is steadily growing"
          description: "Incomplete-receipt backlog slope is positive over 30m ({{ $value }}/s) — delivery is falling behind even below the absolute alarm threshold."

      # Payment canonical events flow onto the shared transactional outbox spine
      # (ingest_many → event_outbox → the outbox relay). If the relay is CLAIMING
      # rows but PUBLISHING none, delivery is stalled and canonical payment events
      # never reach the bus. Rows claimed with zero published over 15m is the
      # unambiguous stall signature (a healthy relay always publishes what it
      # claims). Critical — payment events are stuck undelivered.
      - alert: PaymentRailOutboxDeliveryStalling
        expr: >
          rate(ingestion_outbox_relay_claimed_total[15m]) > 0
          and rate(ingestion_outbox_relay_published_total[15m]) == 0
        for: 15m
        labels:
          severity: critical
          plane: payment_rails
        annotations:
          summary: "Payment outbox relay claiming rows but publishing none"
          description: "The transactional outbox relay has claimed rows without publishing any for 15m — canonical payment event delivery is stalled."
