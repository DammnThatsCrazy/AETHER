# Aether Platform — Pre-commit Hooks
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Documentation drift check — ensures versions are in sync
  - repo: local
    hooks:
      - id: validate-docs
        name: Validate documentation versions
        entry: python scripts/validate_docs.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [commit]

      # Frontmatter schema check on docs/*.md - blocks commits that add
      # invalid or missing frontmatter (back-fill complete as of slice 3).
      # Triggered by doc changes AND by changes to the schema or the
      # validator itself — a schema edit can invalidate existing docs.
      - id: validate-frontmatter
        name: Validate doc YAML frontmatter
        entry: python scripts/validate_frontmatter.py
        language: python
        pass_filenames: false
        additional_dependencies: ["PyYAML>=6.0"]
        files: '^(docs/.*\.(md|mdx)|scripts/docs_schema\.json|scripts/validate_frontmatter\.py)$'
        stages: [commit]

      # Source-path drift + staleness (strict). Runs unconditionally: a
      # commit that only renames/deletes a referenced module touches no
      # doc, so a files filter would skip exactly the scenario this check
      # exists to catch. --strict promotes staleness from advisory to
      # fatal — matches the CI gate.
      - id: docs-drift
        name: Check doc source paths + staleness (strict)
        entry: python scripts/docs_drift.py --strict
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: ["PyYAML>=6.0"]
        stages: [commit]

      # Re-derive docs/_generated/*.json - blocks commits that change a
      # canonical source without also committing the regenerated JSON.
      # The hook regenerates, then fails only on UNSTAGED drift — i.e.
      # output that differs from what the dev staged. The normal flow
      # (make extract-docs, git add docs/_generated/, commit) passes:
      # the deterministic regen reproduces the staged bytes exactly, so
      # there's no unstaged diff. `git status --porcelain` would have
      # mis-fired here because it also reports staged entries.
      # pyproject.toml is included because every generator stamps the
      # artifact with the platform version read from it.
      - id: extract-docs
        name: Regenerate docs/_generated artifacts
        entry: bash -c 'python scripts/docs_extract/run_all.py >/dev/null && if ! git diff --quiet -- docs/_generated/ || [ -n "$(git ls-files --others --exclude-standard docs/_generated/)" ]; then echo "docs/_generated drifted — run \"make extract-docs\" then git add docs/_generated/"; git status --porcelain docs/_generated/; exit 1; fi'
        language: system
        pass_filenames: false
        files: '^(packages/shared/.*\.ts|\.env\.example|pyproject\.toml|Backend Architecture/aether-backend/shared/(plans/catalog|providers/categories|events/events)\.py|scripts/docs_extract/.*\.py)$'
        stages: [commit]

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
