name: CI Runtime Report

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: Adaptive PR p50/p95
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Measure recent adaptive PR authority runs
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import math
          import os
          import pathlib
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aether-ci-runtime-report",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def timestamp(value: str) -> dt.datetime:
              return dt.datetime.fromisoformat(value.replace("Z", "+00:00"))

          def percentile(values, p):
              if not values:
                  return None
              ordered = sorted(values)
              rank = max(1, math.ceil((p / 100.0) * len(ordered)))
              return ordered[rank - 1]

          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "repo-consistency.yml/runs?event=pull_request&status=completed&per_page=100"
          )
          workflow_runs = get(runs_url).get("workflow_runs", [])
          samples = []
          for run in workflow_runs:
              # The cutover authority exists only in runs that contain both of
              # these exact jobs. Older pre-cutover runs are ignored naturally.
              jobs = get(run["jobs_url"]).get("jobs", [])
              by_name = {job.get("name"): job for job in jobs}
              impact = by_name.get("Classify change (impact authority)")
              disposition = by_name.get("verification / disposition")
              if not impact or not disposition:
                  continue
              if not impact.get("started_at") or not disposition.get("completed_at"):
                  continue
              elapsed = (
                  timestamp(disposition["completed_at"]) - timestamp(impact["started_at"])
              ).total_seconds()
              if elapsed < 0:
                  continue
              samples.append(
                  {
                      "run_id": run["id"],
                      "run_number": run["run_number"],
                      "sha": run["head_sha"],
                      "conclusion": disposition.get("conclusion"),
                      "authority_wall_seconds": round(elapsed, 3),
                  }
              )
              if len(samples) >= 30:
                  break

          values = [sample["authority_wall_seconds"] for sample in samples]
          report = {
              "schema_version": 1,
              "authority": "verification-runtime-report",
              "sample_count": len(samples),
              "status": "READY" if len(samples) >= 5 else "INSUFFICIENT_SAMPLES",
              "p50_seconds": percentile(values, 50),
              "p95_seconds": percentile(values, 95),
              "samples": samples,
          }
          out = pathlib.Path("release-evidence")
          out.mkdir(parents=True, exist_ok=True)
          (out / "ci-runtime-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Adaptive PR runtime\n\n")
              summary.write(f"- Samples: **{report['sample_count']}**\n")
              summary.write(f"- Status: **{report['status']}**\n")
              summary.write(f"- p50: **{report['p50_seconds']} s**\n")
              summary.write(f"- p95: **{report['p95_seconds']} s**\n")
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ci-runtime-report
          path: release-evidence/ci-runtime-report.json
          if-no-files-found: error
