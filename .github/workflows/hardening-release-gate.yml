name: Hardening Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-gates:
    name: Canonical CI and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install repository dependencies
        run: |
          python -m pip install --disable-pip-version-check -e '.[all]'
          npm ci
      - name: Canonical PR completion gate
        run: make ci-check
      - name: Release readiness gate
        run: make release-gate
