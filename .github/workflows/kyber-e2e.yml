name: Kyber E2E

# Explicit release gate for the Kyber operator control surface.
# Runs Playwright end-to-end tests against a dev-server instance.
#
# Triggers:
#   - Every push to main (guard main-branch regressions).
#   - Finalized pull requests (ready_for_review) that touch apps/kyber-web/**.
#     Draft pushes remain an implementation phase and do not start hosted CI.
#   - Manual dispatch via the Actions tab.
on:
  push:
    branches: [Development, staging, main]
    paths:
      - 'apps/kyber-web/**'
      - 'packages/shared/**'
      - '.github/workflows/kyber-e2e.yml'
  pull_request:
    types: [ready_for_review]
    paths:
      - 'apps/kyber-web/**'
      - 'packages/shared/**'
      - '.github/workflows/kyber-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyber-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build web SDK
        run: npm run build --workspace=packages/sdk/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/kyber-web

      - name: Run component tests
        run: npm run test:component
        working-directory: apps/kyber-web

      - name: Run integration tests
        run: npm run test:integration
        working-directory: apps/kyber-web

      - name: Run Playwright E2E
        run: npm run test:e2e
        working-directory: apps/kyber-web
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/kyber-web/playwright-report/
          retention-days: 7
