name: SDK Release Validation

on:
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - 'packages/web/**'
      - 'packages/react-native/**'
      - 'packages/ios/**'
      - 'packages/android/**'
      - 'docs/SDK*.md'
      - 'docs/source-of-truth/**'
      - 'docs/reports/**'
      - 'CHANGELOG.md'
      - 'scripts/validate_sdk_release_alignment.py'
      - 'scripts/release/sdk_conformance.py'
      - 'packages/shared/sdk-parity.json'
      - '.github/workflows/sdk-release-validation.yml'
  # Narrower than the `push` list above, deliberately. This workflow's `ios` job runs
  # on macos-latest, which bills at a 10x minute multiplier; `docs/source-of-truth/**`,
  # `docs/reports/**` and `CHANGELOG.md` matched almost every PR in this repo, so
  # documentation-only changes were paying for a full native SDK validation. Pushes to
  # main keep the broad list — that is the sweep that precedes a release. Native SDK
  # validation runs for SDK-touching PRs when they are finalized, not on every draft push.
  pull_request:
    types: [ready_for_review]
    paths:
      - 'packages/shared/**'
      - 'packages/web/**'
      - 'packages/react-native/**'
      - 'packages/ios/**'
      - 'packages/android/**'
      - 'docs/SDK*.md'
      - 'scripts/validate_sdk_release_alignment.py'
      - 'scripts/release/sdk_conformance.py'
      - 'packages/shared/sdk-parity.json'
      - '.github/workflows/sdk-release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Release alignment drift gate
        run: python scripts/validate_sdk_release_alignment.py
      - name: Shared tests with coverage threshold
        run: npm run test --workspace=packages/shared -- --coverage --coverage.thresholds.lines=95 --coverage.thresholds.branches=80 --coverage.thresholds.functions=95 --coverage.thresholds.statements=95
      - name: Web tests with coverage threshold
        run: npm run test --workspace=packages/web -- --coverage --coverage.thresholds.lines=65 --coverage.thresholds.branches=65 --coverage.thresholds.functions=55 --coverage.thresholds.statements=65
      - name: React Native tests with coverage threshold
        run: npm run test --workspace=packages/react-native -- --coverage --coverage.thresholds.lines=75 --coverage.thresholds.branches=73 --coverage.thresholds.functions=55 --coverage.thresholds.statements=75
      - name: Build publish artifacts
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/web
          npm run build --workspace=packages/react-native
          npm pack --workspace=packages/shared --dry-run
          npm pack --workspace=packages/web --dry-run
          npm pack --workspace=packages/react-native --dry-run
      - name: Distribution wiring gate
        run: python scripts/validate_sdk_distribution_artifacts.py
      - name: Verify web SDK package artifacts
        # Guards the tarball npm would actually publish: every declared artifact
        # present and non-empty, entry points resolvable, bundles within budget.
        run: npm run verify:artifacts --workspace=packages/web
      - name: Verify CDN loader artifacts
        # Explicit belt-and-braces check. The verifier above asserts the same
        # files, but these fail loudly and early if the verifier itself regresses.
        run: |
          test -f packages/web/dist/loader.js
          test -f packages/web/dist/loader.mjs
          test -f packages/web/dist/aether.umd.js
          test -f packages/web/dist/aether.esm.js
      - name: Record JS release evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"sdk-js"}\n' "$GITHUB_SHA" > release-evidence/sdk-js.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-js-release-evidence
          path: release-evidence/sdk-js.json
      - name: Secret pattern scan
        run: |
          # Scans committed source under packages/ only. node_modules is
          # gitignored (installed third-party code) — some Expo tooling
          # sources ship the literal PEM private-key header in a WebAuthn
          # DevTools pane (an export-to-PEM helper), which is not a secret;
          # scanning it is a false positive.
          if grep -rE --exclude-dir=node_modules '(-----BEGIN (RSA|EC|PRIVATE)|PRIVATE_KEY\s*=\s*["\x27][A-Za-z0-9+/]{20})' packages/; then
            echo "ERROR: Possible secret detected in packages/" && exit 1
          fi
      - name: CHANGELOG entry check
        run: >-
          grep -q 'SDK Productization' CHANGELOG.md ||
          (echo "ERROR: CHANGELOG missing SDK Productization entry" && exit 1)
      - name: Audit doc existence check
        run: >-
          test -f docs/reports/SDK_PRODUCTION_READINESS_AUDIT.md ||
          (echo "ERROR: Audit doc missing" && exit 1)

      - name: Legacy CDN path scan in docs
        run: |
          if grep -rEn --include='*.md' 'sdk/v5/loader\.js|aether-sdk\.esm\.min\.js|aether-sdk\.umd\.js' docs/; then
            echo "ERROR: Legacy CDN paths found in docs — these must reference only v1.js" && exit 1
          fi
          echo "OK: No legacy CDN paths in docs"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Android unit tests
        working-directory: packages/android
        run: gradle test
      - name: Android release build and Maven dry run
        working-directory: packages/android
        run: gradle assembleRelease publishToMavenLocal
      - name: Record Android release evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"android"}\n' "$GITHUB_SHA" > release-evidence/android.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-evidence
          path: release-evidence/android.json

  ios:
    # Native validation runs on the PR finalization event when SDK paths are
    # touched, plus push/dispatch lanes. Draft pushes do not start this costly
    # macOS job; the pull_request paths filter above still keeps unrelated
    # finalizations out.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          simulator_udid="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); devices = [device for runtime, entries in data["devices"].items() if "iOS" in runtime for device in entries if device["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")'
          )"
          if [ -z "$simulator_udid" ]; then
            echo 'ERROR: No available iPhone simulator was found.'
            exit 1
          fi
          echo "Using iPhone simulator $simulator_udid"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
      - name: Swift package tests with coverage
        working-directory: packages/ios
        run: |
          xcodebuild test \
            -scheme AetherSDK \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -enableCodeCoverage YES \
            -quiet
      - name: CocoaPods podspec dry-run lint
        run: |
          gem install cocoapods --no-document
          pod spec lint packages/ios/AetherSDK.podspec --allow-warnings --quick
          pod spec lint packages/react-native/aether-react-native.podspec --allow-warnings --quick
      - name: Record iOS release evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"ios"}\n' "$GITHUB_SHA" > release-evidence/ios.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-evidence
          path: release-evidence/ios.json
