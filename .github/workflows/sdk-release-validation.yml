name: SDK Release Validation

on:
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - 'packages/web/**'
      - 'packages/react-native/**'
      - 'packages/ios/**'
      - 'packages/android/**'
      - 'docs/SDK*.md'
      - 'docs/source-of-truth/**'
      - 'docs/reports/**'
      - 'CHANGELOG.md'
      - 'scripts/validate_sdk_release_alignment.py'
      - 'scripts/release/sdk_conformance.py'
      - 'packages/shared/sdk-parity.json'
      - '.github/workflows/sdk-release-validation.yml'
  pull_request:
    paths:
      - 'packages/shared/**'
      - 'packages/web/**'
      - 'packages/react-native/**'
      - 'packages/ios/**'
      - 'packages/android/**'
      - 'docs/SDK*.md'
      - 'docs/source-of-truth/**'
      - 'docs/reports/**'
      - 'CHANGELOG.md'
      - 'scripts/validate_sdk_release_alignment.py'
      - 'scripts/release/sdk_conformance.py'
      - 'packages/shared/sdk-parity.json'
      - '.github/workflows/sdk-release-validation.yml'
  workflow_dispatch:

jobs:
  sdk-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Release alignment drift gate
        run: python scripts/validate_sdk_release_alignment.py
      - name: Shared tests with coverage threshold
        run: npm run test --workspace=packages/shared -- --coverage --coverage.thresholds.lines=95 --coverage.thresholds.branches=80 --coverage.thresholds.functions=95 --coverage.thresholds.statements=95
      - name: Web tests with coverage threshold
        run: npm run test --workspace=packages/web -- --coverage --coverage.thresholds.lines=65 --coverage.thresholds.branches=65 --coverage.thresholds.functions=55 --coverage.thresholds.statements=65
      - name: React Native tests with coverage threshold
        run: npm run test --workspace=packages/react-native -- --coverage --coverage.thresholds.lines=75 --coverage.thresholds.branches=73 --coverage.thresholds.functions=55 --coverage.thresholds.statements=75
      - name: Build publish artifacts
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/web
          npm run build --workspace=packages/react-native
          npm pack --workspace=packages/shared --dry-run
          npm pack --workspace=packages/web --dry-run
          npm pack --workspace=packages/react-native --dry-run
      - name: Record JS release evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"sdk-js"}\n' "$GITHUB_SHA" > release-evidence/sdk-js.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-js-release-evidence
          path: release-evidence/sdk-js.json
      - name: Secret pattern scan
        run: |
          if grep -rE '(-----BEGIN (RSA|EC|PRIVATE)|PRIVATE_KEY\s*=\s*["\x27][A-Za-z0-9+/]{20})' packages/; then
            echo "ERROR: Possible secret detected in packages/" && exit 1
          fi
      - name: CHANGELOG entry check
        run: >-
          grep -q 'SDK Productization' CHANGELOG.md ||
          (echo "ERROR: CHANGELOG missing SDK Productization entry" && exit 1)
      - name: Audit doc existence check
        run: >-
          test -f docs/reports/SDK_PRODUCTION_READINESS_AUDIT.md ||
          (echo "ERROR: Audit doc missing" && exit 1)

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Android unit tests
        working-directory: packages/android
        run: gradle test
      - name: Android release build and Maven dry run
        working-directory: packages/android
        run: gradle assembleRelease publishToMavenLocal
      - name: Record Android release evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"android"}\n' "$GITHUB_SHA" > release-evidence/android.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-evidence
          path: release-evidence/android.json

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          simulator_udid="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); devices = [device for runtime, entries in data["devices"].items() if "iOS" in runtime for device in entries if device["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")'
          )"
          if [ -z "$simulator_udid" ]; then
            echo 'ERROR: No available iPhone simulator was found.'
            exit 1
          fi
          echo "Using iPhone simulator $simulator_udid"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
      - name: Swift package tests with coverage
        working-directory: packages/ios
        run: |
          xcodebuild test \
            -scheme AetherSDK \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -enableCodeCoverage YES \
            -quiet
      - name: CocoaPods podspec dry-run lint
        run: |
          gem install cocoapods --no-document
          pod spec lint packages/ios/AetherSDK.podspec --allow-warnings --quick
          pod spec lint packages/react-native/aether-react-native.podspec --allow-warnings --quick
      - name: Record iOS release evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"ios"}\n' "$GITHUB_SHA" > release-evidence/ios.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-evidence
          path: release-evidence/ios.json
