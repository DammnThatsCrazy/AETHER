name: Staging Smoke Test (Proof Gate)

# ---------------------------------------------------------------------
# STAGING SMOKE TEST — PROOF GATE
# ---------------------------------------------------------------------
# This workflow provides a single manual gate that validates the staging
# environment is healthy enough to proceed with a release. It is the
# "proof" step that confirms staging smoke tests pass and produces a
# release-proof report artifact.
#
# BLOCKING BEHAVIOR (release approval):
#   - smoke-staging ... P0 smoke failure BLOCKS release approval.
#                       If the staging smoke tests fail, the release gate
#                       is closed and no release can proceed until the
#                       smoke tests pass again.
#   - release-proof .. produces the release proof report artifact.
#                      Runs only after smoke-staging succeeds.
#
# ARTIFACT:
#   The final report is uploaded as:
#     aether-functionality-proof-report-YYYY-MM-DD.md
#   (dated file name for easy identification in the release-readiness
#   reports directory).
# ---------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to smoke test'
        type: string
        default: 'staging'
        required: false
      proof_tenant_id:
        description: 'Proof tenant ID for smoke test authentication'
        type: string
        default: 'aether-proof-tenant'
        required: false
      proof_workspace_id:
        description: 'Proof workspace ID for smoke test authentication'
        type: string
        default: 'proof-lab'
        required: false
  push:
    branches: [main]
    paths:
      - 'services/backend/**'
      - 'packages/shared/**'
      - 'packages/web/**'

permissions:
  contents: read

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # preflight — Verify the canonical staging proof contract before running.
  #
  # This gate fails closed. A skipped smoke job is not evidence that staging
  # passed, and the runtime scripts consume AETHER_API_URL/AETHER_API_KEY/
  # PROOF_TENANT_ID/PROOF_WORKSPACE_ID rather than the retired secret names.
  # -------------------------------------------------------------------
  preflight:
    name: Preflight — Check Staging Secrets
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Check the canonical staging proof inputs
        id: check
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          AETHER_API_URL: ${{ vars.AETHER_API_URL || secrets.TF_DOMAIN_NAME }}
          AETHER_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          PROOF_TENANT_ID: ${{ inputs.proof_tenant_id || 'aether-proof-tenant' }}
          PROOF_WORKSPACE_ID: ${{ inputs.proof_workspace_id || 'proof-lab' }}
        run: |
          set -euo pipefail
          test "$TARGET_ENVIRONMENT" = staging || {
            echo "::error::staging-smoke.yml only accepts environment=staging"; exit 1;
          }
          test -n "${AETHER_API_URL:-}" || {
            echo "::error::AETHER_API_URL is missing; set repository variable AETHER_API_URL or secret TF_DOMAIN_NAME"; exit 1;
          }
          test -n "${AETHER_API_KEY:-}" || {
            echo "::error::AETHER_API_KEY is missing; configure SMOKE_API_KEY"; exit 1;
          }
          test -n "${PROOF_TENANT_ID:-}" || { echo '::error::PROOF_TENANT_ID is empty'; exit 1; }
          test -n "${PROOF_WORKSPACE_ID:-}" || { echo '::error::PROOF_WORKSPACE_ID is empty'; exit 1; }
          echo 'Canonical staging proof inputs are configured; secret values were not printed.'

  # -------------------------------------------------------------------
  # smoke-staging — P0 smoke test against the staging environment.
  #
  # This job runs the pnpm smoke:staging script which validates that
  # the staging environment is serving correctly, key endpoints respond,
  # and the proof tenant can authenticate and perform basic operations.
  #
  # BLOCKS RELEASE: A failure here means the staging environment is NOT
  # healthy and release approval must be withheld until the smoke tests
  # pass.
  #
  # The smoke report is uploaded as an artifact to
  # reports/release-readiness/ for review by the release process.
  # -------------------------------------------------------------------
  smoke-staging:
    name: Smoke Test Staging
    needs: preflight
    if: needs.preflight.result == 'success'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run staging smoke test
        env:
          AETHER_API_URL: ${{ vars.AETHER_API_URL || secrets.TF_DOMAIN_NAME }}
          AETHER_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          PROOF_TENANT_ID: ${{ inputs.proof_tenant_id || 'aether-proof-tenant' }}
          PROOF_WORKSPACE_ID: ${{ inputs.proof_workspace_id || 'proof-lab' }}
          AETHER_ENV: staging
        run: pnpm smoke:staging

      - name: Upload smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-smoke-report-${{ github.run_id }}
          path: reports/release-readiness/
          retention-days: 30
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # release-proof — Release proof report generation.
  #
  # Runs only after smoke-staging succeeds. This job generates the
  # release proof report that documents the smoke test results and
  # confirms the staging environment is ready for release.
  #
  # The report is uploaded as:
  #   aether-functionality-proof-report-YYYY-MM-DD.md
  # where YYYY-MM-DD is the current date, making it easy to identify
  # the report in the release-readiness reports directory.
  # -------------------------------------------------------------------
  release-proof:
    name: Release Proof Report
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, smoke-staging]
    if: always() && needs.preflight.result == 'success' && needs.smoke-staging.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Determine report date for artifact naming
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate release proof report
        env:
          AETHER_API_URL: ${{ vars.AETHER_API_URL || secrets.TF_DOMAIN_NAME }}
          AETHER_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          PROOF_TENANT_ID: ${{ inputs.proof_tenant_id || 'aether-proof-tenant' }}
          PROOF_WORKSPACE_ID: ${{ inputs.proof_workspace_id || 'proof-lab' }}
          AETHER_ENV: staging
          REPORT_DATE: ${{ steps.date.outputs.date }}
        run: pnpm release:proof

      - name: Upload release proof report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-functionality-proof-report-${{ steps.date.outputs.date }}
          path: reports/release-readiness/aether-functionality-proof-report-*.md
          retention-days: 90
          if-no-files-found: warn
