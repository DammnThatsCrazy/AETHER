name: Immutable delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Explicit promotion target
        type: choice
        options: [staging, production]
        default: staging
        required: true
      source_run_id:
        description: Successful staging build run containing the release manifest (required for production)
        type: string
        required: false
      release_manifest_checksum:
        description: Approved sha256 checksum of release.json (required for production)
        type: string
        required: false

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: false
permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  delivery-armed:
    name: Delivery armed check
    # The secrets context is not available in a job `if:` condition, so the
    # deploy role is laundered through an env binding here and published as a
    # step output. build / deploy / delivery-not-armed all gate on this one
    # output: when the role is absent armed=false and delivery is a loud
    # no-op; the moment the role is wired armed=true and delivery runs exactly
    # as before. If this job ever fails, its output is empty, every gated job
    # is skipped, and the run ends red on this job's own failure — the armed
    # state is never silently assumed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - name: Detect whether the deploy role is configured
        id: check
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_DEPLOY_ROLE_ARN:-}" ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi

  require-ci-green:
    # Deploy must not run against untested code. This job blocks the staging
    # build (the only path that can reach a live rollout without an explicit,
    # already-verified production promotion -- see acquire-release below,
    # which only ever consumes an artifact from a staging build that already
    # passed through this same gate) until the test workflows for this exact
    # commit SHA have completed successfully. repo-health.yml triggers
    # unconditionally on every push (including main) and its `validate` job
    # is the aggregate required-status check for the whole Python/TypeScript/
    # ML/e2e test matrix, so it is the concrete signal polled here.
    #
    # This is deliberately independent of GitHub branch protection: a direct
    # push to main (bypassing a PR) or an admin override would otherwise
    # reach `build` with no verification at all. Polling the Checks API for
    # the pushed SHA closes that gap regardless of how the commit landed.
    name: Verify tests are green for this commit before building
    if: github.event_name == 'push' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Poll required check-runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required_checks=(validate)
          deadline=$((SECONDS + 1500))
          while true; do
            all_done=true
            runs_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")
            for name in "${required_checks[@]}"; do
              status=$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | .status // "missing"' <<<"$runs_json")
              conclusion=$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$runs_json")
              if [ "$status" != "completed" ]; then
                echo "check '$name' is '$status' for $SHA -- waiting"
                all_done=false
                continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "::error::required check '$name' concluded '$conclusion' for $SHA -- refusing to deploy untested code"
                exit 1
              fi
              echo "check '$name' is green for $SHA"
            done
            if [ "$all_done" = "true" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for required checks (${required_checks[*]}) to complete for $SHA"
              exit 1
            fi
            sleep 20
          done
          echo "All required checks are green for $SHA."

  build:
    name: Build immutable release once
    needs: [require-ci-green, delivery-armed]
    # NOT ARMED WITHOUT THE DEPLOY ROLE. The build pushes images to ECR, so
    # without the role there is nowhere to push and nothing to deploy; the job
    # is skipped and delivery-not-armed reports it loudly. The moment the role
    # is wired, the build runs exactly as before. The armed state is read from
    # delivery-armed's output, because the secrets context is not available in
    # a job `if:` condition.
    if: >-
      (github.event_name == 'push' || inputs.environment == 'staging')
      && needs.delivery-armed.outputs.armed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest_checksum: ${{ steps.manifest.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Reuse existing immutable backend image when present
        id: existing-backend
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if digest=$(aws ecr describe-images \
            --repository-name aether-backend \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null) && [ -n "$digest" ] && [ "$digest" != "None" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Immutable backend tag ${GITHUB_SHA} already exists; reusing ${digest}."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing immutable backend tag for ${GITHUB_SHA}; building it."
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build backend by commit
        id: backend
        if: steps.existing-backend.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend Architecture/aether-backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/aether-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Resolve backend image digest
        id: backend-digest
        env:
          EXISTING_DIGEST: ${{ steps.existing-backend.outputs.digest }}
          BUILT_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-${BUILT_DIGEST:-}}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build static frontends (per-app Auth0 client and endpoints)
        # Each SPA is built with its own Auth0 client ID and API endpoints.
        # AETHER_AUTH0_CLIENT_ID / KYBER_AUTH0_CLIENT_ID come from the
        # Terraform outputs aether_client_id / kyber_client_id.
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AETHER_AUTH0_CLIENT_ID: ${{ secrets.AETHER_AUTH0_CLIENT_ID }}
          AETHER_API_BASE_URL: ${{ vars.AETHER_API_BASE_URL }}
          KYBER_AUTH0_CLIENT_ID: ${{ secrets.KYBER_AUTH0_CLIENT_ID }}
          KYBER_API_BASE_URL: ${{ vars.KYBER_API_BASE_URL }}
          KYBER_WS_BASE_URL: ${{ vars.KYBER_WS_BASE_URL }}
        run: |
          set -euo pipefail
          npm ci
          # The frontends import @aether/shared from the local workspace.
          # npm ci installs dependencies but does not build that workspace,
          # so compile it before the per-app TypeScript/Vite builds.
          npm run build --workspace @aether/shared
          # The frontends also import @aether/web, whose package exports point
          # at its Rollup output under packages/web/dist. Build it after the
          # shared contracts and fail early if the published entrypoints are
          # missing instead of letting Vite report a misleading package-entry
          # resolution error.
          npm run build --workspace @aether/web
          test -f packages/web/dist/aether.esm.js
          test -f packages/web/dist/aether.cjs.js
          test -f packages/web/dist/health/index.js
          test -f packages/web/dist/react.js
          VITE_AUTH0_CLIENT_ID="$AETHER_AUTH0_CLIENT_ID" \
            VITE_API_BASE_URL="$AETHER_API_BASE_URL" \
            npm --workspace frontend/aether run build
          VITE_AUTH0_CLIENT_ID="$KYBER_AUTH0_CLIENT_ID" \
            VITE_API_BASE_URL="$KYBER_API_BASE_URL" \
            VITE_WS_BASE_URL="$KYBER_WS_BASE_URL" \
            npm --workspace frontend/kyber run build
          tar --sort=name --mtime='UTC 1970-01-01' -czf aether-spa.tar.gz -C frontend/aether/dist .
          tar --sort=name --mtime='UTC 1970-01-01' -czf kyber-spa.tar.gz -C frontend/kyber/dist .
          tar --sort=name --mtime='UTC 1970-01-01' -czf migrations.tar.gz \
            'Backend Architecture/aether-backend/alembic.ini' 'Backend Architecture/aether-backend/alembic'
          cp config/runtime_deployment.yaml runtime_deployment.yaml
      - name: Create commit-bound release manifest
        id: manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend-digest.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          def digest(p): return 'sha256:' + hashlib.sha256(Path(p).read_bytes()).hexdigest()
          data = {
            'schema_version': 1, 'commit_sha': os.environ['GITHUB_SHA'],
            'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'profile': 'staging',
            'artifacts': {
              'backend_image': {'uri': f"{os.environ['REGISTRY']}/aether-backend@{os.environ['BACKEND_DIGEST']}", 'digest': os.environ['BACKEND_DIGEST']},
              'aether_spa': {'file': 'aether-spa.tar.gz', 'digest': digest('aether-spa.tar.gz')},
              'kyber_spa': {'file': 'kyber-spa.tar.gz', 'digest': digest('kyber-spa.tar.gz')},
              'migration_package': {'file': 'migrations.tar.gz', 'digest': digest('migrations.tar.gz')},
              'configuration': {'file': 'runtime_deployment.yaml', 'digest': digest('runtime_deployment.yaml')},
            }}
          Path('release.json').write_text(json.dumps(data))
          PY
          python scripts/release/release_manifest.py release.json --expected-sha "$GITHUB_SHA" --write-checksum
          echo "checksum=$(cat release.json.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            release.json
            release.json.sha256
            aether-spa.tar.gz
            kyber-spa.tar.gz
            migrations.tar.gz
            runtime_deployment.yaml
          if-no-files-found: error
          retention-days: 30

  delivery-not-armed:
    name: Delivery not armed — no AWS deploy role configured
    needs: [delivery-armed]
    # Loud, explicit signal that the build/deploy jobs were skipped because the
    # deploy role is absent, so a reader does not mistake a skipped job for a
    # silently-green delivery. This is NOT a claim that anything was deployed.
    if: needs.delivery-armed.outputs.armed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report that delivery is not armed
        run: |
          set -euo pipefail
          echo '::notice title=Delivery not armed::AWS_DEPLOY_ROLE_ARN is not configured, so the build/deploy jobs were skipped. Nothing was built or deployed; this is NOT a claim that a release exists. Configure the deploy role to arm delivery.'

  acquire-release:
    name: Acquire approved staged release
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit immutable approval inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_MANIFEST_CHECKSUM: ${{ inputs.release_manifest_checksum }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID" || { echo '::error::source_run_id is required'; exit 1; }
          test -n "$RELEASE_MANIFEST_CHECKSUM" || { echo '::error::release_manifest_checksum is required'; exit 1; }
      - name: Verify source run identity before trusting its artifacts
        # The source run must be a successful run of THIS workflow file whose
        # staging deploy job completed; otherwise its artifacts are untrusted.
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          run_path=$(jq -r '.path' <<<"$run_json")
          run_conclusion=$(jq -r '.conclusion' <<<"$run_json")
          test "$run_path" = '.github/workflows/deploy.yml' || {
            echo "::error::source run ${SOURCE_RUN_ID} belongs to ${run_path}, not this workflow"; exit 1; }
          test "$run_conclusion" = 'success' || {
            echo "::error::source run ${SOURCE_RUN_ID} concluded ${run_conclusion}, not success"; exit 1; }
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")
          staging_ok=$(jq -r '[.jobs[] | select((.name | startswith("Deploy exact release (staging)")) and .conclusion == "success")] | length' <<<"$jobs_json")
          test "$staging_ok" -ge 1 || {
            echo "::error::source run ${SOURCE_RUN_ID} has no successful staging deploy job"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: release-*
          merge-multiple: true
      - name: Verify approved manifest and every artifact
        env:
          RELEASE_MANIFEST_CHECKSUM: ${{ inputs.release_manifest_checksum }}
        run: |
          set -euo pipefail
          SHA=$(python -c "import json; print(json.load(open('release.json'))['commit_sha'])")
          python scripts/release/release_manifest.py release.json --expected-sha "$SHA" --checksum "$RELEASE_MANIFEST_CHECKSUM"
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('release.json'))
          for key in ('aether_spa','kyber_spa','migration_package','configuration'):
              a=m['artifacts'][key]; actual='sha256:'+hashlib.sha256(pathlib.Path(a['file']).read_bytes()).hexdigest()
              if actual != a['digest']: raise SystemExit(f'{key} artifact checksum mismatch')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: approved-release
          path: |
            release.json
            release.json.sha256
            aether-spa.tar.gz
            kyber-spa.tar.gz
            migrations.tar.gz
            runtime_deployment.yaml
          retention-days: 1

  deploy:
    name: Deploy exact release (${{ github.event_name == 'push' && 'staging' || inputs.environment }})
    needs: [build, acquire-release, delivery-armed]
    # NOT ARMED WITHOUT THE DEPLOY ROLE: skip the deploy when the role is
    # absent, and do not let a skipped build (also armed-gated) count as a
    # success path into a real deployment. Staging also stays asleep by
    # default: the deploy role may exist for release builds, but ECS mutation
    # requires the explicit STAGING_RUNTIME_ENABLED repository variable. This
    # keeps the low-cost/asleep staging posture from turning a main push into
    # an attempted runtime rollout before Terraform has provisioned services.
    if: >-
      always() && !cancelled() && needs.delivery-armed.outputs.armed == 'true'
      && (github.event_name == 'workflow_dispatch' || vars.STAGING_RUNTIME_ENABLED == 'true')
      && ((needs.build.result == 'success' && needs.acquire-release.result == 'skipped')
          || (needs.acquire-release.result == 'success' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install workflow Python dependencies
        run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire-release.result == 'success' && 'approved-release' || format('release-{0}', github.sha) }}
      - name: Verify release immediately before mutation
        run: |
          set -euo pipefail
          CHECKSUM=$(cat release.json.sha256)
          SHA=$(python -c "import json; print(json.load(open('release.json'))['commit_sha'])")
          python scripts/release/release_manifest.py release.json --expected-sha "$SHA" --checksum "$CHECKSUM"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply packaged migrations, then register exact task revision for every profile service
        env:
          TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
        run: |
          set -euo pipefail
          PROFILE=$([ "$TARGET_ENV" = production ] && echo production-lean || echo staging)
          CLUSTER="AETHER-${TARGET_ENV}"
          IMAGE=$(python -c "import json; print(json.load(open('release.json'))['artifacts']['backend_image']['uri'])")
          # Roll out SERVICES, not logical roles. Since runtime_deployment.yaml
          # schema v2 a service may host several roles (an execution group), so
          # the services map — not the role list — is the set of ECS services
          # that exist. Each service key IS the AETHER_ROLE token that service
          # runs (`api`, a dedicated worker role, or a group like lean-worker
          # that services/runtime/run_role.py expands into its members), which
          # is why the loop variable below stays named `role`.
          mapfile -t SERVICES < <(python -c "import yaml; print(*yaml.safe_load(open('runtime_deployment.yaml'))['profiles']['$PROFILE']['services'], sep='\n')")
          test "${#SERVICES[@]}" -gt 0 || { echo "::error::profile $PROFILE declares no services"; exit 1; }
          printf '%s\n' "${SERVICES[@]}" | grep -qx api || { echo "::error::profile $PROFILE declares no api service"; exit 1; }
          # Deployment is only valid after the reviewed staging apply has
          # opened an awake lease.  A deploy-role secret alone is not evidence
          # that Terraform created the cluster; fail closed before any ECS
          # mutation when the lease is absent or unreadable.
          if [ "$TARGET_ENV" = staging ]; then
            lease_json=$(aws ssm get-parameter --name /aether/staging/lifecycle/awake-until \
              --query 'Parameter.Value' --output text 2> >(sed 's/[[:cntrl:]]//g' >&2)) || {
              echo '::error::staging apply/wake evidence is unavailable: cannot read the awake lease; refusing ECS mutation'
              exit 1
            }
            assert_lease() {
              LEASE_VALUE="$1" python3 -c 'import json,os,sys; from datetime import datetime,timezone; raw=os.environ.get("LEASE_VALUE",""); doc=json.loads(raw); since=datetime.fromisoformat(doc["awake_since"].replace("Z","+00:00")); until=datetime.fromisoformat(doc["awake_until"].replace("Z","+00:00")); now=datetime.now(timezone.utc); bad=(until<=now or since>now or until<=since or (until-since).total_seconds()>8*3600 or (now-since).total_seconds()>40*3600 or not isinstance(doc.get("extensions",0),int) or doc.get("extensions",0)<0); sys.exit("::error::staging awake lease is invalid or outside TTL limits; refusing ECS mutation" if bad else 0)'
            }
            assert_lease "$lease_json"
          fi
          # api first: the packaged migrations must land before any service
          # adopts the new image (expand-before-rollout).
          ORDERED=(api)
          for s in "${SERVICES[@]}"; do [ "$s" = api ] || ORDERED+=("$s"); done
          cluster_failures=$(aws ecs describe-clusters --clusters "$CLUSTER" \
            --query 'failures' --output json 2> >(sed 's/[[:cntrl:]]//g' >&2)) || {
            echo "::error::unable to inspect ECS cluster $CLUSTER; staging apply may not have completed"
            exit 1
          }
          if [ "$(jq 'length' <<<"$cluster_failures")" -ne 0 ]; then
            echo "::error::ECS cluster $CLUSTER is unavailable; refusing ECS mutation"
            jq -c . <<<"$cluster_failures"
            exit 1
          fi
          for role in "${SERVICES[@]}"; do
            service="AETHER-${TARGET_ENV}-$([ "$role" = api ] && echo backend || echo "$role")"
            service_check=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
              --query 'failures' --output json 2> >(sed 's/[[:cntrl:]]//g' >&2)) || {
              echo "::error::unable to inspect required ECS service $service; refusing ECS mutation"
              exit 1
            }
            if [ "$(jq 'length' <<<"$service_check")" -ne 0 ]; then
              echo "::error::required ECS service $service is unavailable; refusing ECS mutation"
              jq -c . <<<"$service_check"
              exit 1
            fi
          done
          for role in "${ORDERED[@]}"; do
            # Canonical service-key -> ECS service mapping: the api service is
            # served by the Terraform-provisioned "-backend" service; every
            # other service key maps 1:1 to "AETHER-<env>-<key>".
            # Documented in config/runtime_deployment.yaml.
            service="AETHER-${TARGET_ENV}-$([ "$role" = api ] && echo backend || echo "$role")"
            current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --query 'services[0].taskDefinition' --output text)
            test "$current" != None || { echo "::error::required service missing: $service"; exit 1; }
            aws ecs describe-task-definition --task-definition "$current" --query taskDefinition > task.json
            jq --arg image "$IMAGE" --arg role "$role" '
              .containerDefinitions[0].image=$image |
              .containerDefinitions[0].environment=((.containerDefinitions[0].environment // []) | map(select(.name != "AETHER_ROLE"))) + [{name:"AETHER_ROLE",value:$role}] |
              del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' task.json > rendered.json
            revision=$(aws ecs register-task-definition --cli-input-json file://rendered.json --query 'taskDefinition.taskDefinitionArn' --output text)
            if [ "$role" = api ]; then
              # Re-read immediately before the first runtime mutation; a lease
              # can expire while image/task-definition inspection is running.
              if [ "$TARGET_ENV" = staging ]; then
                lease_json=$(aws ssm get-parameter --name /aether/staging/lifecycle/awake-until --query 'Parameter.Value' --output text)
                assert_lease "$lease_json"
              fi
              # Apply the packaged migrations with the exact release image before
              # any service rollout. The migration archive digest is bound to this
              # image by the verified release manifest; /v1/ready re-verifies
              # DB revision == packaged head after rollout.
              container=$(jq -r '.containerDefinitions[0].name' rendered.json)
              netcfg=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --query 'services[0].networkConfiguration' --output json)
              migration_task=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$revision" \
                --launch-type FARGATE --network-configuration "$netcfg" \
                --overrides "{\"containerOverrides\":[{\"name\":\"$container\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
                --query 'tasks[0].taskArn' --output text)
              aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$migration_task"
              migration_exit=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$migration_task" --query 'tasks[0].containers[0].exitCode' --output text)
              test "$migration_exit" = "0" || { echo "::error::packaged migration task failed (exit $migration_exit)"; exit 1; }
              printf 'migrations %s %s\n' "$migration_task" "$IMAGE" >> deployment-evidence.txt
            fi
            if [ "$TARGET_ENV" = staging ]; then
              lease_json=$(aws ssm get-parameter --name /aether/staging/lifecycle/awake-until --query 'Parameter.Value' --output text)
              assert_lease "$lease_json"
            fi
            aws ecs update-service --cluster "$CLUSTER" --service "$service" --task-definition "$revision" >/dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$service"
            running=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --query 'services[0].taskDefinition' --output text)
            test "$running" = "$revision" || { echo "::error::$service did not adopt $revision"; exit 1; }
            printf '%s %s %s\n' "$role" "$revision" "$IMAGE" >> deployment-evidence.txt
          done
      - name: Readiness gate (/v1/ready — DB, migrations head, cache, event bus, auth)
        # /v1/ready is the authoritative in-environment gate: it fails unless the
        # database alembic revision matches the deployed release's migration head.
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
        run: |
          set -euo pipefail
          test -n "$ALB_DNS_NAME" || { echo '::error::ALB_DNS_NAME environment variable is required for the readiness gate'; exit 1; }
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${ALB_DNS_NAME}/v1/ready" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Readiness check passed (attempt $i)"
              exit 0
            fi
            echo "Readiness returned HTTP $STATUS (attempt $i), retrying in 15s..."
            curl -s "https://${ALB_DNS_NAME}/v1/ready" | head -c 2000 || true
            sleep 15
          done
          echo "::error::Readiness check failed after 5 attempts — service is alive but not deployable-ready"
          exit 1
      - name: Golden-path smoke test
        env:
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ALB_DNS_NAME:-}" || { echo '::error::ALB_DNS_NAME is required for the smoke test'; exit 1; }
          test -n "${SMOKE_API_KEY:-}" || { echo '::error::SMOKE_API_KEY is required for the smoke test'; exit 1; }
          python scripts/smoke_test.py \
            --base-url "https://${ALB_DNS_NAME}" \
            --api-key "${SMOKE_API_KEY}" \
            --timeout 15
      - name: Publish private static SPA origins
        env:
          TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
        run: |
          set -euo pipefail
          for app in aether kyber; do
            bucket_var=$(echo "${app}_static_bucket" | tr '[:lower:]' '[:upper:]')
            bucket=$(aws ssm get-parameter --name "/aether/${TARGET_ENV}/${bucket_var}" --query Parameter.Value --output text)
            mkdir -p "dist-$app"; tar -xzf "$app-spa.tar.gz" -C "dist-$app"
            aws s3 sync "dist-$app" "s3://$bucket" --delete --cache-control 'public,max-age=31536000,immutable' --exclude index.html
            aws s3 cp "dist-$app/index.html" "s3://$bucket/index.html" --cache-control 'no-cache,no-store,must-revalidate'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: deployment-evidence.txt
          if-no-files-found: error
