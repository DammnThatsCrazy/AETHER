name: Deploy

# Triggers: automatic on push to main, or manual for staging/production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: production
        required: true

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false  # never cancel an active deployment

permissions:
  id-token: write   # required for OIDC auth with AWS
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build Docker images and push to ECR
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    outputs:
      image_tag:    ${{ steps.tag.outputs.tag }}
      ecr_registry: ${{ steps.ecr-login.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ────────────────────────────────────────────────────────────
      # Build context is repo root (Dockerfile COPYs from repo-relative paths)
      - name: Build & push aether-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Backend Architecture/aether-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/aether-backend:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/aether-backend:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # ── ML serving ─────────────────────────────────────────────────────────
      - name: Build & push aether-ml-serving
        uses: docker/build-push-action@v5
        with:
          context: ML Models/aether-ml
          file: ML Models/aether-ml/docker/Dockerfile
          target: serving
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/aether-ml-serving:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/aether-ml-serving:latest
          cache-from: type=gha,scope=ml-serving
          cache-to:   type=gha,scope=ml-serving,mode=max

      # ── Aether SPA ─────────────────────────────────────────────────────────
      # Auth0 config is baked into the Vite bundle at build time.
      # VITE_AUTH0_CLIENT_ID comes from the Terraform output:
      #   terraform output -raw aether_client_id
      # Set it as a GitHub Actions variable (AETHER_AUTH0_CLIENT_ID) per environment.
      - name: Build & push aether-ui
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/aether/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/aether-aether:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/aether-aether:latest
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.AETHER_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}
            VITE_API_BASE_URL=${{ vars.AETHER_API_BASE_URL }}
          cache-from: type=gha,scope=aether-ui
          cache-to:   type=gha,scope=aether-ui,mode=max

      # ── Kyber SPA ──────────────────────────────────────────────────────────
      # VITE_AUTH0_CLIENT_ID comes from: terraform output -raw kyber_client_id
      # Set it as KYBER_AUTH0_CLIENT_ID GitHub Actions variable per environment.
      - name: Build & push kyber-ui
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/kyber/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/aether-kyber:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/aether-kyber:latest
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.KYBER_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}
            VITE_API_BASE_URL=${{ vars.KYBER_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.KYBER_WS_BASE_URL }}
          cache-from: type=gha,scope=kyber-ui
          cache-to:   type=gha,scope=kyber-ui,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Force new ECS deployments and wait for stability
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'production' }}

    env:
      ENV: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployments
        run: |
          CLUSTER="AETHER-${ENV}"
          for svc in \
            "AETHER-${ENV}-backend" \
            "AETHER-${ENV}-ml-serving" \
            "AETHER-${ENV}-aether-ui" \
            "AETHER-${ENV}-kyber-ui"; do
            echo "Deploying ${svc} to cluster ${CLUSTER}..."
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$svc" \
              --force-new-deployment \
              --region "${{ env.AWS_REGION }}" || \
            echo "::warning::Service ${svc} not found — skipping (not yet provisioned)"
          done

      - name: Wait for services to stabilise
        run: |
          CLUSTER="AETHER-${ENV}"
          # Collect only services that exist in the cluster
          EXISTING=$(aws ecs list-services --cluster "$CLUSTER" \
            --query 'serviceArns[*]' --output text | tr '\t' '\n' | \
            grep -E "backend|ml-serving|aether-ui|kyber-ui" | tr '\n' ' ')
          if [ -n "$EXISTING" ]; then
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services $EXISTING \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Health check (liveness gate)
        # Quick liveness check — blocks traffic promotion until the ALB responds.
        # ALB_DNS_NAME is a GitHub Actions variable set per environment
        # (set it to the Terraform output: terraform output -raw alb_dns_name)
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "https://${{ vars.ALB_DNS_NAME }}/v1/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check returned HTTP $STATUS (attempt $i), retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Golden-path smoke test — runs after ECS stabilises
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke test (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: deploy
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run smoke tests
        # SMOKE_API_KEY — a long-lived read-only API key set as a GitHub Actions secret.
        # ALB_DNS_NAME  — the Terraform-output ALB DNS name set as a GitHub Actions variable.
        run: |
          python scripts/smoke_test.py \
            --base-url "https://${{ vars.ALB_DNS_NAME }}" \
            --api-key "${{ secrets.SMOKE_API_KEY }}" \
            --timeout 15
