          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$manual" = true ]; then
            echo "::error::staging is past its TTL or its live state is unproven; exact asleep=${ASLEEP:-unknown}, converged=${CONVERGED:-not-run}, awake_tasks=${AWAKE_TASKS:-unknown}, residual_tasks=${RESIDUAL_TASKS:-unknown}; intervene manually"
            exit 1
          fi
          if [ "$enforced" = true ]; then
            echo "::error::staging was past its TTL and the guard changed live AWS state; run staging-lifecycle.yml with action: apply-sleep to reconcile Terraform state"
            exit 1
          fi
          if [ "$awake_known" = true ] && [ "${AWAKE_TASKS}" -gt 0 ]; then
            echo "::notice::staging is awake with ${REMAINING_MINUTES:-0} min of lease remaining"
          elif [ "${ASLEEP:-unknown}" = true ]; then
            echo '::notice::staging is asleep'
          else
            echo "::notice::staging has no current tasks but an open capacity envelope; ${REMAINING_MINUTES:-0} min of lease remaining"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-ttl-guard-${{ github.run_id }}
          path: .artifacts/ttl-guard
          if-no-files-found: warn
          retention-days: 30
