name: Production-Equivalent CI (M1 + M2 + M4)

# Phase-2 Program 4 — "A production-equivalent CI lane"
# docs/architecture/RELIABILITY-PHASE-2-PROGRAM.md, section 4, milestones
# M1 + M2 + M4.
#
# WHAT THIS IS: every OTHER backend workflow in .github/workflows/ runs with
# AETHER_ENV=local, which makes repositories.repos.get_pool() return None, so
# services/ingestion/bronze_bulk.py (and every repository with the same
# pattern) silently takes its in-memory-dict fallback branch instead of the
# real asyncpg/Postgres path. This workflow boots real postgres + redis service
# containers and runs the persistence paths against them.
#
# PR AUTHORITY: this lane is intentionally NOT a required merge check. On pull
# requests it is impact-filtered at the workflow trigger so irrelevant changes
# do not even provision Postgres/Redis runners. Pushes to main, nightly runs,
# and explicit dispatch retain full real-stack coverage.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-equivalent-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BACKEND_DIR: "Backend Architecture/aether-backend"
  DATABASE_URL: postgresql://aether:aether_dev_password@localhost:5432/aether
  REDIS_URL: redis://localhost:6379/0

jobs:
  classify-impact:
    name: Select real-stack scope (impact authority)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_real_stack: ${{ steps.selection.outputs.run_real_stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap impact-graph dependencies
        run: make bootstrap
      - name: Classify persistence impact
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p release-evidence
          .venv/bin/python scripts/impact_graph.py --base "$BASE_SHA" > release-evidence/impact-graph.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          index = json.loads(Path("release-evidence/impact-graph.json").read_text())
          changed = set(index["changed_files"])
          components = set(index["impacted_components"])
          production_paths = (
              "tests/prod_equivalent/",
              "Backend Architecture/aether-backend/alembic/",
              "Backend Architecture/aether-backend/repositories/",
              "Backend Architecture/aether-backend/services/ingestion/",
          )
          direct_production_path = any(
              path == "docker-compose.yml"
              or path == "pyproject.toml"
              or path == ".github/workflows/production-equivalent-ci.yml"
              or path.startswith(production_prefix)
              for path in changed
              for production_prefix in production_paths
          )
          full_non_pr_lane = os.environ["EVENT_NAME"] != "pull_request"
          unresolved = bool(index["unresolved_paths"])
          run_real_stack = (
              full_non_pr_lane
              or unresolved
              or direct_production_path
              or bool({"application-runtime", "infrastructure-runtime"} & components)
          )
          reason = (
              "full-non-pr-lane" if full_non_pr_lane else
              "unresolved-paths" if unresolved else
              "direct-production-persistence-path" if direct_production_path else
              "impacted-runtime-component" if run_real_stack else
              "no-production-equivalent-impact"
          )
          print("run_real_stack=" + str(run_real_stack).lower())
          print("selection_reason=" + reason)
          Path("release-evidence/selection-summary.json").write_text(json.dumps({
              "schema_version": 1,
              "authority": "impact",
              "workflow": "production-equivalent-ci",
              "run_real_stack": run_real_stack,
              "reason": reason,
              "changed_files": sorted(changed),
              "impacted_components": sorted(components),
              "unresolved_paths": index["unresolved_paths"],
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-equivalent-selection
          path: release-evidence/*.json
          if-no-files-found: error

  real-stack-ingestion-smoke:
    name: Ingestion smoke test against real postgres + redis
    needs: classify-impact
    if: needs.classify-impact.outputs.run_real_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aether
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install sync DB driver for Alembic
        run: python -m pip install --disable-pip-version-check 'psycopg2-binary>=2.9'

      - name: Verify redis is reachable
        run: |
          python - <<'PY'
          import socket
          with socket.create_connection(("localhost", 6379), timeout=5) as s:
              s.sendall(b"PING\r\n")
              resp = s.recv(64)
          assert b"PONG" in resp, f"unexpected redis response: {resp!r}"
          print("redis reachable:", resp)
          PY

      - name: Apply database migrations
        working-directory: ${{ env.BACKEND_DIR }}
        run: alembic upgrade head

      - name: Run real-stack ingestion smoke test
        run: python -m pytest tests/prod_equivalent/test_real_stack_smoke.py -v -n0

      - name: Run real-stack ingestion idempotency/concurrency tests (M2)
        run: python -m pytest tests/prod_equivalent/test_real_stack_ingestion_concurrency.py -v -n0

      - name: Run real-stack measurement/attribution repo tests (M4)
        run: python -m pytest tests/prod_equivalent/test_real_stack_measurement_repos.py -v -n0

      - name: Diagnostics on failure
        if: failure()
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          echo "-- alembic current --"
          alembic current || true
          echo "-- alembic heads --"
          alembic heads || true
