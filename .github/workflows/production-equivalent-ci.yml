name: Production-Equivalent CI (M1 + M2 + M4)

# Phase-2 Program 4 — "A production-equivalent CI lane"
# docs/architecture/RELIABILITY-PHASE-2-PROGRAM.md, section 4, milestones
# M1 + M2 + M4.
#
# WHAT THIS IS: every OTHER backend workflow in .github/workflows/ runs with
# AETHER_ENV=local, which makes repositories.repos.get_pool() return None, so
# services/ingestion/bronze_bulk.py (and every repository with the same
# pattern) silently takes its in-memory-dict fallback branch instead of the
# real asyncpg/Postgres path. This workflow is the FIRST one that boots real
# postgres + redis service containers (matching docker-compose.yml's
# versions/env) and sets DATABASE_URL so the backend takes the REAL pool
# path, then runs one ingestion smoke test against it.
#
# WHAT THIS IS NOT (M1 + M2 scope, not the full program):
#   - Not required: this workflow is intentionally absent from branch
#     protection. A failure here blocks nothing.
#   - Does not change `make ci-check`, repo-health.yml, or any other existing
#     workflow — this file is purely additive.
#   - M2 (this increment) adds real-stack ingestion IDEMPOTENCY/CONCURRENCY
#     tests (tests/prod_equivalent/test_real_stack_ingestion_concurrency.py):
#     concurrent ingest_many of the same idempotency key(s) must yield
#     exactly-once rows against real Postgres, exercising the real
#     ux_bronze_sdk_events_key / ux_event_outbox_key UNIQUE indexes + ON CONFLICT
#     DO NOTHING — the property the AETHER_ENV=local in-memory dict fallback gets
#     "right" for free (its check-then-set never yields) without ever proving it.
#     M2 does NOT migrate the ENTIRE ingestion suite: the in-memory unit tests in
#     tests/unit/test_ingestion_v2.py still run in-memory under make ci-check and
#     stay green as-is (they cover the sequential accept/duplicate/rollback
#     semantics; the concurrency property they cannot prove is what moved here).
#     M2 does not add kafka/outbox-relay (M3) and is not a required check yet
#     (M5). Those are later, separately-scoped milestones — see the program doc.
#   - M4 (this increment) extends the lane to the measurement/attribution
#     repositories (conversion_repo / spend_repo / attribution_run_repo) via
#     tests/prod_equivalent/test_real_stack_measurement_repos.py — the real
#     ON CONFLICT / partial-unique / tenant-scope / FX-provenance properties the
#     in-memory dict fallback cannot model. It does NOT migrate the full
#     measurement/attribution unit-test suites (those stay in-memory under
#     make ci-check); kafka/outbox-relay (M3) and required-check (M5) remain.
#   - Adds no database migration and changes no runtime behavior; it only
#     runs already-existing migrations against a fresh, ephemeral database.
#
# FRESH-DB MIGRATION BUGS THIS LANE FOUND (and that are now fixed): booting a
# genuinely fresh Postgres 16 database and running `alembic upgrade head` — the
# thing no other workflow did, because they all run AETHER_ENV=local and never
# touch Alembic — surfaced five pre-existing defects that were invisible to the
# in-memory path, every one of them a real production-provisioning failure:
#   1. alembic/versions/20260604_agent_control_plane.py created agent_worker_runs
#      that 20260712_ops_runtime.py indexed, with no declared dependency, so the
#      topological sort could order the index before the table → fixed by adding
#      depends_on to 20260712_ops_runtime.py.
#   2/3. Two malformed ARRAY server_defaults (string 'ARRAY[...]' instead of
#      sa.text("ARRAY[...]")) in 20260529_notification_intelligence.py that
#      Postgres could not cast to text[] → fixed to sa.text(...).
#   4. 13 revision ids exceed Alembic's default alembic_version.version_num
#      VARCHAR(32) (up to 47 chars), overflowing on the first over-length stamp
#      → fixed by widening the column in alembic/env.py (backward compatible).
#   5. A plain-string (non-f-string) DDL in 20260808_provider_evidence.py carried
#      a doubled-brace '{{}}'::jsonb that leaked literally as invalid JSON →
#      fixed to '{}'.
# This lane deliberately did NOT route around any of them — routing around a real
# migration-graph bug would hide the exact signal M1 exists to produce. With the
# fixes above, `alembic upgrade head` against a fresh database now completes to a
# single head (verified locally against postgres:16), so the "Apply database
# migrations" step is expected to be GREEN. A red at that step now signals a NEW
# fresh-DB regression to fix at its source, not a known-accepted gap.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-equivalent-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BACKEND_DIR: "Backend Architecture/aether-backend"
  # Matches docker-compose.yml's x-runtime-env anchor (postgres service).
  DATABASE_URL: postgresql://aether:aether_dev_password@localhost:5432/aether
  REDIS_URL: redis://localhost:6379/0

jobs:
  real-stack-ingestion-smoke:
    name: Ingestion smoke test against real postgres + redis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Versions/env below are copied from docker-compose.yml's `postgres` and
    # `redis` services (repo root) so this lane matches the documented local
    # topology rather than inventing a separate one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aether
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install sync DB driver for Alembic
        # alembic/env.py runs migrations synchronously via SQLAlchemy against a
        # postgresql:// URL, which needs a sync driver. pyproject.toml only
        # declares asyncpg (the runtime driver bronze_bulk.py's get_pool()
        # uses) — psycopg2 is Alembic-only tooling for THIS lane, installed
        # here rather than added as a project dependency everything else
        # would also carry.
        run: python -m pip install --disable-pip-version-check 'psycopg2-binary>=2.9'

      - name: Verify redis is reachable
        # Plain stdlib socket check (no redis-cli / redis-tools dependency on
        # the runner) — just proves the service container is actually up.
        run: |
          python - <<'PY'
          import socket
          with socket.create_connection(("localhost", 6379), timeout=5) as s:
              s.sendall(b"PING\r\n")
              resp = s.recv(64)
          assert b"PONG" in resp, f"unexpected redis response: {resp!r}"
          print("redis reachable:", resp)
          PY

      - name: Apply database migrations
        working-directory: ${{ env.BACKEND_DIR }}
        run: alembic upgrade head

      - name: Run real-stack ingestion smoke test
        run: python -m pytest tests/prod_equivalent/test_real_stack_smoke.py -v -n0

      - name: Run real-stack ingestion idempotency/concurrency tests (M2)
        # M2: genuinely-concurrent ingest_many of the same idempotency key(s)
        # must yield exactly-once rows against real Postgres — exercising the
        # real UNIQUE indexes + ON CONFLICT DO NOTHING that the AETHER_ENV=local
        # in-memory dict fallback bypasses (its check-then-set never yields, so
        # it serializes writers for free and never proves the DB does). Runs
        # ALONGSIDE (not instead of) the M1 smoke step above. -n0 disables xdist
        # so the shared asyncpg pool singleton stays on one process/event loop;
        # DATABASE_URL / REDIS_URL come from the job-level env.
        run: python -m pytest tests/prod_equivalent/test_real_stack_ingestion_concurrency.py -v -n0

      - name: Run real-stack measurement/attribution repo tests (M4)
        # M4: extends the lane beyond ingestion to the measurement/attribution
        # repositories — conversion_repo / spend_repo / attribution_run_repo —
        # which share bronze_bulk.py's exact get_pool()/in-memory-dict fallback.
        # Forces their REAL Postgres branch and asserts what the dict cannot:
        # the authority-ranked ON CONFLICT conversion merge + tenant isolation of
        # a shared deduplication_key; idempotent spend replay yielding one row
        # with a stable spend_record_id PK; the CURRENCY FX provenance round-trip
        # through provenance JSONB + exchange_rate NUMERIC(18,8); and the
        # "exactly one active run per (tenant_id, conversion_id)" invariant.
        # Self-skips without DATABASE_URL, so make ci-check stays green. -n0 for
        # the same shared-pool reason as the M2 step.
        run: python -m pytest tests/prod_equivalent/test_real_stack_measurement_repos.py -v -n0

      - name: Diagnostics on failure
        if: failure()
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          echo "-- alembic current --"
          alembic current || true
          echo "-- alembic heads --"
          alembic heads || true
