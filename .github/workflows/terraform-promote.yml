name: Reviewed Terraform promotion

# The ONLY path that applies Terraform. workflow_dispatch-only: no push, tag,
# schedule or path trigger can reach an apply. Apply consumes the exact binary
# plan produced by the plan job, at the exact commit that produced it, and
# never re-plans.

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [staging, production-lean, production-scale, enterprise-isolated, demo, preview]
        default: staging
        required: true
      deployment_lane:
        description: "Deployment lane. `pilot` is valid only with profile=staging and defers Kyber/GCP gates."
        type: choice
        options: [full, pilot]
        default: full
        required: true
      action:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      backend_image_digest:
        description: Immutable backend image digest from the approved release manifest (sha256:...) — required for plan
        type: string
        required: false
      ml_image_digest:
        description: Immutable ML serving image digest from the approved release manifest (sha256:...) — required for plan
        type: string
        required: false
      staging_state:
        description: >-
          Staging wake/sleep shape for the plan. `asleep` drives every ECS
          desired count and autoscaling floor to zero. Ignored by the three
          production-class profiles and the demo/preview ephemeral profiles,
          which have no staging_state block in config/runtime_deployment.yaml.
          Plan-time only — an apply consumes the stored plan and cannot
          reshape it.
        type: choice
        options: [awake, asleep]
        default: awake
        required: false
      secret_preflight_required:
        description: "Keep application-secret preflight enabled; only sleep plans/applies may set this false"
        type: boolean
        default: true
        required: false
      staging_listener_target_group_arn:
        description: "Optional existing maintenance target-group ARN for a reviewed staging backend replacement transition"
        type: string
        required: false
      plan_run_id:
        description: Plan workflow run ID (required for apply)
        type: string
        required: false
      plan_checksum:
        description: Approved plan SHA256 (required for apply)
        type: string
        required: false
      expected_commit_sha:
        description: "Optional exact commit SHA the plan must be generated from"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # Staging, demo, and preview share an account and globally named ECR
  # repositories. Serialize those profiles with reconciliation to make the
  # ownership check and import decision atomic; production profiles retain
  # independent concurrency.
  group: ${{ (inputs.profile == 'staging' || inputs.profile == 'demo' || inputs.profile == 'preview') && 'terraform-nonprod-shared' || format('terraform-{0}', inputs.profile) }}
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  TF_DIR: deploy/aws/terraform
jobs:
  staging-secret-payload-preflight:
    name: Verify staging secret payloads before plan or apply
    if: inputs.profile == 'staging' && inputs.secret_preflight_required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install secret preflight dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Configure AWS inspection credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IAM policy inspection is deliberately performed by the separate
          # infrastructure inspection role. The secret role is value-readable
          # only and must not be widened with iam:List*/Get* permissions.
          # The dedicated staging plan role is the metadata-only IAM auditor.
          # Keep the shared infrastructure credential out of this contract so
          # the audit path remains explicit and the secret role stays value-only.
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify staging IAM inspection role assumption
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          expected_role_path="${EXPECTED_ROLE_ARN#*:role/}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role_path="$(jq -r .Arn <<<"$caller_json")"
          caller_role_path="${caller_role_path#*:assumed-role/}"
          caller_role_path="${caller_role_path%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::IAM inspection account mismatch'; exit 1; }
          test "$caller_role_path" = "$expected_role_path" || { echo '::error::IAM inspection role does not match AWS_TERRAFORM_PLAN_ROLE_ARN'; exit 1; }
          test "$caller_role_path" = AetherStagingPlan || { echo '::error::IAM inspection must use AetherStagingPlan'; exit 1; }
      - name: Verify the effective secret preflight IAM contract
        env:
          TARGET_ROLE_ARN: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
        run: |
          set -euo pipefail
          python scripts/release/verify_effective_staging_apply_policy.py --role-arn "$TARGET_ROLE_ARN" --manifest config/staging_secret_preflight_iam_policy.yaml --expected-role AetherStagingSecretPreflight --required-policy-suffix AetherStagingSecretPreflightContract
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify secret preflight role assumption and policy
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
        run: |
          set -euo pipefail
          python scripts/release/check_staging_secret_preflight_policy.py
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role="$(jq -r .Arn <<<"$caller_json")"
          caller_role="${caller_role#*:assumed-role/}"
          caller_role="${caller_role%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::secret preflight account mismatch'; exit 1; }
          test "$caller_role" = AetherStagingSecretPreflight || { echo '::error::unexpected secret preflight role'; exit 1; }
      - name: Verify raw secret payloads and staging Stripe mode
        run: |
          set -euo pipefail
          python scripts/release/check_staging_secret_payload_contract.py \
            --lane '${{ inputs.deployment_lane || 'full' }}'

  plan:
    needs: [staging-secret-payload-preflight]
    if: >-
      always()
      && inputs.action == 'plan'
      && (inputs.profile != 'staging'
          || inputs.staging_state == 'asleep'
          || inputs.secret_preflight_required == false
          || needs.staging-secret-payload-preflight.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, id-token: write}
    env:
      TF_VAR_acm_certificate_arn: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
      TF_VAR_domain_name: ${{ secrets.TF_DOMAIN_NAME }}
      TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
      TF_VAR_auth0_domain: ${{ secrets.TF_AUTH0_DOMAIN }}
      # Amplify requires a repository access token even when the GitHub
      # repository is public. The credential guard below validates the secret
      # before Terraform runs and exports it only to the plan job.
      # The auth0 provider reads these from its own environment, so the
      # credentials never become Terraform root variables and therefore never
      # enter the plan file. This is the structural fix for the plan-artifact
      # secret leak; the sanitiser downstream is defence in depth, not the cure.
      AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
      TF_VAR_aether_app_url: ${{ secrets.TF_AETHER_APP_URL }}
      TF_VAR_kyber_app_url: ${{ secrets.TF_KYBER_APP_URL }}
      TF_VAR_kyber_google_hosted_domain: ${{ vars.KYBER_GOOGLE_HOSTED_DOMAIN || 'olympuslabs.ai' }}
      # The custom KMS key policy must name the protected staging apply role as
      # an explicit administrator. Keep the value in the encrypted secret
      # store; the ARN is non-sensitive, but the repository variable was never
      # guaranteed to exist and produced a key policy that AWS rejected as
      # lockout-unsafe.
      TF_VAR_kms_key_admin_role_arns: '${{ inputs.profile == ''staging'' && format(''["{0}"]'', secrets.AWS_TERRAFORM_APPLY_ROLE_ARN) || ''[]'' }}'
    steps:
      - uses: actions/checkout@v4
        with:
          # A moving dispatch ref is not the reviewed source. When the caller
          # supplies an exact SHA, fetch that commit before any plan checks so
          # a branch advance cannot turn a valid handoff into a false mismatch.
          ref: ${{ inputs.expected_commit_sha || github.sha }}
      - name: Verify the requested plan commit
        if: inputs.expected_commit_sha != ''
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::expected_commit_sha is not a 40-character lowercase commit sha'; exit 1; }
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EXPECTED_COMMIT_SHA" \
            || { echo "::error::Terraform plan checkout ${actual_commit} is not expected commit ${EXPECTED_COMMIT_SHA}; refusing to plan a different repository state"; exit 1; }
      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Configure Terraform provider cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate deployment lane and canonical profile pairing
        env:
          PROFILE: ${{ inputs.profile }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_LANE" in
            full|pilot) ;;
            *) echo "::error::deployment_lane must be full or pilot, got ${DEPLOYMENT_LANE}"; exit 1 ;;
          esac
          if [ "$DEPLOYMENT_LANE" = pilot ] && [ "$PROFILE" != staging ]; then
            echo '::error::deployment_lane=pilot is valid only with the canonical profile=staging'
            exit 1
          fi
      - name: Require secret-preflight bypass to be sleep-only
        if: inputs.profile == 'staging' && inputs.secret_preflight_required == false
        env:
          STAGING_STATE: ${{ inputs.staging_state }}
        run: |
          set -euo pipefail
          test "$STAGING_STATE" = asleep || {
            echo '::error::secret_preflight_required=false is only valid for a plan with staging_state=asleep'; exit 1;
          }
      - name: Install plan-validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
      - name: Validate staging credential shape before planning
        if: inputs.profile == 'staging'
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
          AWS_INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_STAGING_LIFECYCLE_ROLE_ARN: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_ACM_CERTIFICATE_ARN: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_DOMAIN_NAME: ${{ secrets.TF_DOMAIN_NAME }}
          TF_ALERT_EMAIL: ${{ secrets.TF_ALERT_EMAIL }}
          TF_AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
          TF_AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
          TF_AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
          TF_AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
          TF_AETHER_APP_URL: ${{ secrets.TF_AETHER_APP_URL }}
          TF_KYBER_APP_URL: ${{ secrets.TF_KYBER_APP_URL }}
          STAGING_ADMIN_API_KEY: ${{ secrets.STAGING_ADMIN_API_KEY }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          KYBER_GOOGLE_CLIENT_ID: ${{ secrets.KYBER_GOOGLE_CLIENT_ID }}
          KYBER_GOOGLE_CLIENT_SECRET: ${{ secrets.KYBER_GOOGLE_CLIENT_SECRET }}
          TF_BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
        run: |
          set -euo pipefail
          python scripts/release/check_staging_credential_contract.py --lane "$DEPLOYMENT_LANE"
      - name: Validate the staging deployment-lane contract and static runtime wiring
        if: inputs.profile == 'staging'
        env:
          PROFILE: ${{ inputs.profile }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          python scripts/release/check_staging_lane_contract.py \
            --profile "$PROFILE" \
            --deployment-lane "$DEPLOYMENT_LANE" \
            --check-runtime-wiring
      - name: Validate the reviewed Kyber workforce identity contract
        if: inputs.profile == 'staging' && inputs.deployment_lane != 'pilot'
        env:
          TF_DOMAIN_NAME: ${{ secrets.TF_DOMAIN_NAME }}
          TF_KYBER_APP_URL: ${{ secrets.TF_KYBER_APP_URL }}
          TF_KYBER_GOOGLE_HOSTED_DOMAIN: ${{ vars.KYBER_GOOGLE_HOSTED_DOMAIN || 'olympuslabs.ai' }}
          KYBER_GOOGLE_CLIENT_ID: ${{ vars.KYBER_GOOGLE_CLIENT_ID || secrets.KYBER_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          python scripts/release/check_kyber_staging_contract.py \
            --require-public-client-id \
            --evidence-out "${TF_DIR}/reviewed.kyber-contract.json"
      - name: Validate the reviewed Terraform state access contract
        run: |
          set -euo pipefail
          python scripts/release/check_terraform_state_access_policy.py \
            --manifest config/terraform_state_access_policy.yaml \
            --terraform-root "${TF_DIR}"
      # Fail closed when the plan credential set is incomplete. The apply role
      # is deliberately not part of this check: a plan must be runnable without
      # mutation credentials. The protected apply job has its own complete
      # apply-credential check below, immediately before assuming that role.
      - name: Require the complete remote-plan credential set
        env:
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_ACM_CERTIFICATE_ARN: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_DOMAIN_NAME: ${{ secrets.TF_DOMAIN_NAME }}
          TF_ALERT_EMAIL: ${{ secrets.TF_ALERT_EMAIL }}
          TF_AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
          TF_AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
          TF_AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
          TF_AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
          TF_AETHER_APP_URL: ${{ secrets.TF_AETHER_APP_URL }}
          TF_KYBER_APP_URL: ${{ secrets.TF_KYBER_APP_URL }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_TERRAFORM_PLAN_ROLE_ARN \
            TF_STATE_BUCKET \
            TF_LOCK_TABLE \
            TF_ACM_CERTIFICATE_ARN \
            TF_DOMAIN_NAME \
            TF_ALERT_EMAIL \
            TF_AUTH0_DOMAIN \
            TF_AUTH0_MANAGEMENT_CLIENT_ID \
            TF_AUTH0_MANAGEMENT_CLIENT_SECRET \
            TF_AMPLIFY_GITHUB_ACCESS_TOKEN \
            TF_AETHER_APP_URL \
            TF_KYBER_APP_URL
          do
            # `${!name-}` is indirect expansion with an empty default, so an
            # entirely unset secret does not abort the loop under `set -u`.
            if [ -z "${!name-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf -v missing_list '%s, ' "${missing[@]}"
            echo "::error::Reviewed Terraform promotion requires the complete remote-plan credential set. Missing ${missing_list%, }."
            exit 1
          fi
          amplify_token="${TF_AMPLIFY_GITHUB_ACCESS_TOKEN:-}"
          if [ -z "$amplify_token" ] || [ "$amplify_token" = '-' ]; then
            echo '::error::TF_AMPLIFY_GITHUB_ACCESS_TOKEN must be a real GitHub repository token; AWS Amplify requires one for public and private repositories.'
            exit 1
          fi
          if [[ "$amplify_token" =~ [[:space:]] ]]; then
            echo '::error::TF_AMPLIFY_GITHUB_ACCESS_TOKEN contains whitespace and cannot be passed to AWS Amplify.'
            exit 1
          fi
          printf 'TF_VAR_amplify_github_access_token=%s\n' "$amplify_token" >> "$GITHUB_ENV"
          if [ "${{ inputs.action }}" = "apply" ] && [ -z "${AWS_TERRAFORM_APPLY_ROLE_ARN:-}" ]; then
            echo '::error::Reviewed Terraform apply requires AWS_TERRAFORM_APPLY_ROLE_ARN.'
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify effective staging plan IAM contract
        if: inputs.profile == 'staging'
        env:
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          # The checked-in manifest is reviewed intent; this read-only check
          # proves the assumed role actually realizes it before Terraform can
          # refresh state or produce a reviewed plan. It catches stale external
          # policy attachments, including ECR digest-read drift, at the role
          # boundary instead of after a remote-plan command fails.
          python scripts/release/verify_effective_staging_apply_policy.py \
            --role-arn "$AWS_TERRAFORM_PLAN_ROLE_ARN" \
            --manifest config/staging_plan_iam_policy.yaml \
            --supplemental-manifest config/terraform_plan_state_access_policy.yaml \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-lock-table "$TF_LOCK_TABLE" \
            --state-profile "${{ inputs.profile }}" \
            --expected-role AetherStagingPlan \
            --required-policy-suffix AetherStagingPlanContract
      - name: Verify required staging secret metadata before planning
        if: inputs.profile == 'staging' && inputs.staging_state != 'asleep'
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          # This is metadata-only: the plan role proves every secret that the
          # selected ECS lane mounts already has a live AWSCURRENT version.
          # Values are never read. Keeping this gate before Terraform plan
          # prevents a plan from approving an otherwise guaranteed task-start
          # failure or a secret create/import collision.
          python scripts/release/check_staging_lane_contract.py \
            --profile staging \
            --deployment-lane "$DEPLOYMENT_LANE" \
            --require-aws-staging-secrets
      - name: Verify the assumed plan role matches the encrypted secret
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          PROFILE: ${{ inputs.profile }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          expected_role_path="${EXPECTED_ROLE_ARN#*:role/}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role_path="$(jq -r .Arn <<<"$caller_json")"
          caller_role_path="${caller_role_path#*:assumed-role/}"
          caller_role_path="${caller_role_path%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::assumed plan role account does not match AWS_TERRAFORM_PLAN_ROLE_ARN'; exit 1; }
          test "$caller_role_path" = "$expected_role_path" || { echo '::error::assumed role does not match AWS_TERRAFORM_PLAN_ROLE_ARN'; exit 1; }
          if [ "$PROFILE" = staging ]; then
            test "$caller_role_path" = AetherStagingPlan || { echo '::error::staging plan job assumed an unexpected IAM role'; exit 1; }
            echo 'Verified staging plan credentials resolve to AetherStagingPlan in the expected account.'
          else
            echo "Verified ${PROFILE} plan credentials resolve to the encrypted role ARN in the expected account."
          fi
      - name: Require immutable image digests
        env:
          PROFILE: ${{ inputs.profile }}
          BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
          ML_IMAGE_DIGEST: ${{ inputs.ml_image_digest }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_IMAGE_DIGEST" || { echo '::error::backend_image_digest is required for plan'; exit 1; }
          case "${PROFILE}" in
            production-scale|enterprise-isolated)
              test -n "$ML_IMAGE_DIGEST" || { echo '::error::ml_image_digest is required for dedicated-ML profiles'; exit 1; } ;;
            staging|production-lean|demo|preview)
              # These profiles run ML inline; an empty ML digest is intentional.
              : ;;
            *)
              echo "::error::unsupported profile ${PROFILE}"; exit 1 ;;
          esac
          if [ "$PROFILE" = staging ]; then
            test -n "${{ inputs.expected_commit_sha }}" \
              || { echo '::error::staging plans require expected_commit_sha so the image tag is bound to the reviewed checkout'; exit 1; }
            python scripts/release/check_staging_image_provenance.py \
              --repository aether-backend \
              --digest "$BACKEND_IMAGE_DIGEST" \
              --expected-commit "${{ inputs.expected_commit_sha }}"
          fi
      - name: Record reviewed maintenance listener input
        env:
          STAGING_LISTENER_TARGET_GROUP_ARN: ${{ inputs.staging_listener_target_group_arn }}
        working-directory: deploy/aws/terraform
        run: printf '%s\n' "$STAGING_LISTENER_TARGET_GROUP_ARN" > reviewed.staging-listener-target-group-arn
      - name: Create immutable reviewed plan
        working-directory: deploy/aws/terraform
        env:
          PROFILE: ${{ inputs.profile }}
          BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
          ML_IMAGE_DIGEST: ${{ inputs.ml_image_digest }}
          STAGING_STATE: ${{ inputs.staging_state }}
          STAGING_LISTENER_TARGET_GROUP_ARN: ${{ inputs.staging_listener_target_group_arn }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
          COMMIT_SHA: ${{ github.sha }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          # Lockfile digest is taken from the checked-out tree BEFORE init, so
          # apply can compare it against the same git content at the same
          # commit without racing terraform's own lockfile maintenance.
          sha256sum .terraform.lock.hcl | cut -d' ' -f1 > reviewed.lock.sha256
          printf '%s\n' "profiles/${PROFILE}/terraform.tfstate" > reviewed.state-key
          bash "${GITHUB_WORKSPACE}/scripts/release/terraform_init_retry.sh" -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=profiles/${PROFILE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          state_list_file="$(mktemp)"
          terraform state list >"$state_list_file"
          if grep -Fxq 'module.alb.aws_lb_target_group.backend' "$state_list_file"; then
            echo '::error::legacy backend target-group state address remains; run the confirmation-gated terraform-state-migrate workflow and regenerate the reviewed plan'
            exit 1
          fi
          if [ "$PROFILE" = staging ] && [ "$DEPLOYMENT_LANE" = pilot ]; then
            # The pilot preflight proves that all four self-service price secrets already
            # exist remotely. Require their canonical Terraform owners before
            # creating the plan as well: otherwise a secure bootstrap between
            # plan and apply would make the saved plan try to create a secret
            # that now exists, producing the exact stale-plan/resource-exists
            # loop this workflow is designed to prevent.
            required_pilot_secret_names=(
              stripe-price-alpha
              stripe-price-beta
              stripe-price-gamma
              stripe-price-delta
            )
            for name in "${required_pilot_secret_names[@]}"; do
              address="module.secrets.aws_secretsmanager_secret.this[\"${name}\"]"
              grep -Fxq "$address" "$state_list_file" || {
                echo "::error::pilot plan requires ${address} in staging Terraform state; populate the secret securely, run staging-state-reconcile, then create a fresh plan"
                exit 1
              }
            done
            echo 'Verified all pilot Stripe price secrets are canonical Terraform state owners before planning.'
          fi
          required_staging_secret_names=(
            jwt-secret
            byok-encryption-key
            stripe-secret-key
            stripe-webhook-secret
            oracle-signer-private-key
            watermark-secret-key
            canary-secret-seed
            extraction-canary-seed
            sdk-config-secret
            first-admin-bootstrap-token
            jwt-secret-previous
            byok-encryption-key-previous
          )
          if [ "$PROFILE" = staging ] && [ "$DEPLOYMENT_LANE" = full ]; then
            required_staging_secret_names+=(kyber-google-client-id kyber-google-client-secret)
          elif [ "$PROFILE" = staging ] && [ "$DEPLOYMENT_LANE" = pilot ]; then
            required_staging_secret_names+=(
              stripe-price-alpha
              stripe-price-beta
              stripe-price-gamma
              stripe-price-delta
            )
          fi
          if [ "$PROFILE" = staging ]; then
            for app_key in olympus-marketing aether-marketing docs aether-app status; do
              address="aws_amplify_domain_association.frontend[\"${app_key}\"]"
              grep -Fxq "$address" "$state_list_file" || {
                echo "::error::staging plan requires ${address} in staging Terraform state; verify the existing Squarespace-backed association, run staging-state-reconcile with staging.olympuslabsml.com, then create a fresh plan"
                exit 1
              }
            done
            for name in "${required_staging_secret_names[@]}"; do
              address="module.secrets.aws_secretsmanager_secret.this[\"${name}\"]"
              if [ "$name" = jwt-secret-previous ]; then
                address='module.secrets.aws_secretsmanager_secret.jwt_secret_previous'
              elif [ "$name" = byok-encryption-key-previous ]; then
                address='module.secrets.aws_secretsmanager_secret.byok_key_previous'
              fi
              grep -Fxq "$address" "$state_list_file" || {
                echo "::error::required staging secret aether/${name} is not at its canonical Terraform state address ${address}; run staging-state-reconcile and create a fresh plan"
                exit 1
              }
            done
            for address in \
              module.secrets.aws_kms_key.secrets \
              module.secrets.aws_kms_alias.secrets; do
              grep -Fxq "$address" "$state_list_file" || {
                echo "::error::staging Secrets Manager KMS resource ${address} is not in Terraform state; reconcile it before creating a plan"
                exit 1
              }
            done
            echo 'Verified all required staging secret resources and their Secrets Manager CMK are canonical Terraform state owners before planning.'
          fi
          terraform validate
          # staging_state is recorded alongside the plan so a reviewer can see
          # which shape was approved. It is load-bearing, not decorative: apply
          # below refuses a plan whose recorded state is not one of the two legal
          # tokens, and staging-lifecycle.yml asserts it equals the shape it
          # asked for before it dispatches an apply. The AUTHORITATIVE control on
          # the applied shape is still the plan-JSON desired-count assertion in
          # that workflow; this file is the cheap cross-check that the plan under
          # review is the one that was requested. It is a plan-time input only:
          # apply consumes the stored plan and cannot reshape it.
          printf '%s\n' "${STAGING_STATE}" > reviewed.staging-state
          printf '%s\n' "${DEPLOYMENT_LANE}" > reviewed.deployment-lane
          terraform plan -input=false -lock-timeout=5m \
            -var-file="profiles/${PROFILE}.tfvars" \
            -var "backend_image_digest=${BACKEND_IMAGE_DIGEST}" \
            -var "ml_image_digest=${ML_IMAGE_DIGEST}" \
            -var "staging_state=${STAGING_STATE}" \
            -var "deployment_lane=${DEPLOYMENT_LANE}" \
            -var "staging_listener_target_group_arn=${STAGING_LISTENER_TARGET_GROUP_ARN}" \
            -out=reviewed.tfplan
          terraform show -json reviewed.tfplan > plan-raw.json
          if [ "$PROFILE" = staging ] && jq -e '
            any(.resource_changes[]?;
              .address == "module.alb.aws_lb_target_group.backend[0]" and
              ((.change.actions // []) | (index("delete") != null and index("create") != null)))
          ' plan-raw.json >/dev/null; then
            if [ -z "$STAGING_LISTENER_TARGET_GROUP_ARN" ]; then
              echo '::error::staging target-group replacement requires staging_listener_target_group_arn so the listener is detached before deletion'
              exit 1
            fi
          fi
          # SECRET HYGIENE: `terraform show -json` does NOT redact `sensitive = true`
          # ROOT VARIABLES -- TF_VAR_auth0_management_client_secret would appear
          # verbatim in the top-level `variables` block of an uploaded artifact.
          # The raw document is written to a name outside the uploaded
          # `reviewed.*` glob, sanitised into reviewed.tfplan.json, and deleted.
          python "${GITHUB_WORKSPACE}/scripts/release/sanitize_terraform_plan_json.py" \
            plan-raw.json reviewed.tfplan.json
          rm -f plan-raw.json
          # The human-readable rendering redacts sensitive values itself and
          # never prints root variables at all.
          terraform show -no-color reviewed.tfplan > reviewed.tfplan.txt
          # archive_file materializes the Lambda package while planning. Carry
          # the exact bytes with the reviewed plan so apply never reconstructs
          # a different ZIP (or fails because the apply runner lacks it).
          if [ -f drift_lambda.zip ]; then
            cp drift_lambda.zip reviewed.drift_lambda.zip
          fi
          if [ -f rotate_secret.zip ]; then
            cp rotate_secret.zip reviewed.rotate_secret.zip
          fi
          sha256sum reviewed.tfplan > reviewed.tfplan.sha256
          printf '%s\n' "$COMMIT_SHA" > reviewed.commit
          printf '%s\n' "$PROFILE" > reviewed.profile
          printf '%s\n' "$TF_STATE_BUCKET" > reviewed.state-bucket
          printf '%s\n' "$TF_LOCK_TABLE" > reviewed.state-lock-table
          terraform version -json | jq -r '.terraform_version' > reviewed.terraform-version
          # A reviewed plan is valid for 24 hours. Apply refuses an expired plan.
          date -u +%Y-%m-%dT%H:%M:%SZ > reviewed.created-utc
          date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ > reviewed.expires-utc
      - name: Validate reviewed plan against policy and cost model
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/release/check_terraform_plan_policy.py \
            --profile "$PROFILE" \
            --plan-json "${TF_DIR}/reviewed.tfplan.json" \
            | tee "${TF_DIR}/reviewed.policy.txt"
          # The canonical resource inventory the policy validator emits travels
          # with the plan, so apply reviews the same resource set.
          cp artifacts/profile-resource-inventory.json "${TF_DIR}/reviewed.resources.json"
          if python -c "import os, yaml; p = (yaml.safe_load(open('config/deployment_profiles.yaml')) or {}).get('profiles') or {}; raise SystemExit(0 if (p.get(os.environ['PROFILE']) or {}).get('budget') else 1)"; then
            python scripts/release/check_cost_model.py \
              --profile "$PROFILE" \
              --inventory "${TF_DIR}/reviewed.resources.json" \
              --out-dir "artifacts/cost-${PROFILE}" \
              | tee "${TF_DIR}/reviewed.cost.txt"
          else
            echo "${PROFILE} declares no budget in config/deployment_profiles.yaml; no numeric ceiling to enforce." \
              | tee "${TF_DIR}/reviewed.cost.txt"
          fi
      - name: Summarise the reviewed plan identity
        working-directory: deploy/aws/terraform
        run: |
          set -euo pipefail
          {
            echo '### Reviewed Terraform plan'
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| profile | $(cat reviewed.profile) |"
            echo "| commit | $(cat reviewed.commit) |"
            echo "| state key | $(cat reviewed.state-key) |"
            echo "| terraform version | $(cat reviewed.terraform-version) |"
            echo "| lockfile sha256 | $(cat reviewed.lock.sha256) |"
            echo "| plan sha256 | $(sha256sum reviewed.tfplan | cut -d' ' -f1) |"
            echo "| created (UTC) | $(cat reviewed.created-utc) |"
            echo "| expires (UTC) | $(cat reviewed.expires-utc) |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Reviewable evidence. Every `reviewed.*` file EXCEPT the binary plan:
      # reviewed.tfplan.json is sanitised above, and the remaining files are
      # checksums, timestamps and rendered reports that carry no secret value.
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.profile }}-${{ github.sha }}
          path: |
            deploy/aws/terraform/reviewed.*
            !deploy/aws/terraform/reviewed.tfplan
          if-no-files-found: error
          retention-days: 14
      # SECRET-BEARING ARTIFACT. The binary plan embeds every root variable value
      # Terraform was given, including the `sensitive = true` Auth0 management
      # credentials; nothing can strip them without destroying the exact-plan
      # apply guarantee. It cannot be dropped because `terraform apply
      # reviewed.tfplan` is the whole point of this workflow, so instead it is
      # split out with the SHORTEST retention the apply path can use: a reviewed
      # plan expires 24h after it is created (reviewed.expires-utc, enforced
      # below), so one day of retention outlives every plan that is still legal
      # to apply and nothing beyond it. GitHub artifacts have no per-artifact
      # ACL, so retention is the only lever here; narrowing readership further
      # would mean encrypting this file under a repository secret.
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.profile }}-binary-${{ github.sha }}
          path: deploy/aws/terraform/reviewed.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: [staging-secret-payload-preflight]
    # Do not authorize an apply from the requested staging_state input. The
    # reviewed artifact is the authority for the plan shape; the only
    # job-level preflight bypass is the explicit sleep-only flag, which is
    # checked again against reviewed.staging-state below.
    if: >-
      always()
      && inputs.action == 'apply'
      && (inputs.profile != 'staging'
          || inputs.secret_preflight_required == false
          || needs.staging-secret-payload-preflight.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Per-profile environments: each profile carries its own reviewers and
    # protection rules. staging cannot borrow production's approvals, and
    # production cannot be applied behind staging's.
    environment:
      name: >-
        ${{ inputs.profile == 'staging' && 'staging-terraform'
        || inputs.profile == 'production-lean' && 'production-lean-terraform'
        || inputs.profile == 'production-scale' && 'production-scale-terraform'
        || inputs.profile == 'enterprise-isolated' && 'enterprise-terraform'
        || inputs.profile == 'demo' && 'demo-terraform'
        || inputs.profile == 'preview' && 'preview-terraform'
        || 'enterprise-terraform' }}
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - name: Require explicit reviewed plan identity
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_CHECKSUM: ${{ inputs.plan_checksum }}
          PROFILE: ${{ inputs.profile }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          test -n "$PLAN_RUN_ID" || { echo '::error::plan_run_id required'; exit 1; }
          test -n "$PLAN_CHECKSUM" || { echo '::error::plan_checksum required'; exit 1; }
          case "$PROFILE" in
            staging|production-lean|production-scale|enterprise-isolated|demo|preview) ;;
            *) echo "::error::unknown profile ${PROFILE}"; exit 1 ;;
          esac
          case "$DEPLOYMENT_LANE" in
            full|pilot) ;;
            *) echo "::error::deployment_lane must be full or pilot, got ${DEPLOYMENT_LANE}"; exit 1 ;;
          esac
          if [ "$DEPLOYMENT_LANE" = pilot ] && [ "$PROFILE" != staging ]; then
            echo '::error::deployment_lane=pilot is valid only with the canonical profile=staging'
            exit 1
          fi
      - name: Require the complete apply credential set
        env:
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_STATE_KEY: profiles/${{ inputs.profile }}/terraform.tfstate
        run: |
          set -euo pipefail
          test -n "$AWS_TERRAFORM_APPLY_ROLE_ARN" || { echo '::error::AWS_TERRAFORM_APPLY_ROLE_ARN required'; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo '::error::TF_STATE_BUCKET required'; exit 1; }
          test -n "$TF_LOCK_TABLE" || { echo '::error::TF_LOCK_TABLE required'; exit 1; }
      # The artifact NAME pattern below constrains what is downloaded, but not
      # which workflow produced it: any run that uploaded an artifact called
      # `terraform-plan-<profile>-*` would satisfy it. Bind the run itself to
      # this workflow file, and require it to have succeeded, before trusting a
      # single byte of its output. Mirrors the release-run identity check in
      # staging-lifecycle.yml.
      - name: Verify the plan run belongs to this workflow and succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"
          run_path="$(jq -r '.path' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          if [ "$run_path" != '.github/workflows/terraform-promote.yml' ]; then
            echo "::error::plan run ${PLAN_RUN_ID} belongs to ${run_path}, not the reviewed promotion workflow"
            exit 1
          fi
          if [ "$run_conclusion" != success ]; then
            echo "::error::plan run ${PLAN_RUN_ID} concluded ${run_conclusion}, not success"
            exit 1
          fi
      # Downloaded outside the workspace: the reviewed-commit checkout below
      # cleans the workspace and would otherwise delete the plan.
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
          pattern: terraform-plan-${{ inputs.profile }}-*
          path: ${{ runner.temp }}/reviewed-plan
          merge-multiple: true
      - name: Verify reviewed plan metadata, profile and 24h expiry
        id: reviewed
        env:
          PROFILE: ${{ inputs.profile }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
          STAGING_LISTENER_TARGET_GROUP_ARN: ${{ inputs.staging_listener_target_group_arn }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/reviewed-plan"
          for artefact in \
            reviewed.tfplan reviewed.tfplan.json reviewed.tfplan.txt \
            reviewed.tfplan.sha256 reviewed.commit reviewed.profile \
            reviewed.deployment-lane \
            reviewed.terraform-version reviewed.lock.sha256 reviewed.state-key \
            reviewed.state-bucket reviewed.state-lock-table \
            reviewed.created-utc reviewed.expires-utc reviewed.resources.json \
            reviewed.policy.txt reviewed.cost.txt reviewed.staging-state
          do
            if [ ! -s "$artefact" ]; then
              echo "::error::reviewed plan is missing required evidence: ${artefact}"
              exit 1
            fi
          done
          if [ ! -f reviewed.staging-listener-target-group-arn ]; then
            echo '::error::reviewed plan is missing maintenance listener input evidence'
            exit 1
          fi

          # The recorded wake/sleep shape must be one of the two legal tokens.
          # A plan whose staging_state cannot be named is a plan nobody reviewed
          # the shape of.
          reviewed_staging_state="$(cat reviewed.staging-state)"
          case "$reviewed_staging_state" in
            awake|asleep) ;;
            *) echo "::error::reviewed.staging-state is '${reviewed_staging_state}', not awake or asleep"; exit 1 ;;
          esac

          reviewed_deployment_lane="$(cat reviewed.deployment-lane)"
          if [ "$reviewed_deployment_lane" != "$DEPLOYMENT_LANE" ]; then
            echo "::error::plan was reviewed for deployment_lane=${reviewed_deployment_lane}, dispatched for ${DEPLOYMENT_LANE}"
            exit 1
          fi

          if [ "$PROFILE" = staging ] && [ "$DEPLOYMENT_LANE" != pilot ]; then
            test -s reviewed.kyber-contract.json \
              || { echo '::error::reviewed plan is missing Kyber workforce identity evidence'; exit 1; }
            jq -e '
              .contract == "kyber-workforce-identity" and
              .version == 1 and
              .profile == "staging" and
              .secret_values_read == false and
              .google_client_secret_source == "aws_secrets_manager:aether/kyber-google-client-secret"
            ' reviewed.kyber-contract.json >/dev/null \
              || { echo '::error::reviewed Kyber workforce identity evidence is missing or invalid'; exit 1; }
          fi

          reviewed_profile="$(cat reviewed.profile)"
          if [ "$reviewed_profile" != "$PROFILE" ]; then
            echo "::error::plan was reviewed for ${reviewed_profile}, dispatched for ${PROFILE}"
            exit 1
          fi

          reviewed_listener_arn="$(cat reviewed.staging-listener-target-group-arn)"
          if [ "$PROFILE" = staging ]; then
            # The reviewed artifact is authoritative. Lifecycle callers may
            # omit this optional input; when they do, carry the exact value
            # forward from the artifact instead of comparing it to an empty
            # dispatch input. A supplied value is still checked strictly so
            # a caller can never override the reviewed listener transition.
            if [ -n "${STAGING_LISTENER_TARGET_GROUP_ARN:-}" ] \
              && [ "$reviewed_listener_arn" != "$STAGING_LISTENER_TARGET_GROUP_ARN" ]; then
              echo '::error::maintenance listener ARN differs between reviewed plan and apply dispatch'
              exit 1
            fi
            if [ -n "$reviewed_listener_arn" ] && ! grep -Fq "$reviewed_listener_arn" reviewed.tfplan.json; then
              echo '::error::reviewed plan does not select the dispatched maintenance target group ARN'
              exit 1
            fi
          elif [ -n "$reviewed_listener_arn" ]; then
            echo '::error::maintenance listener ARN is only valid for staging'
            exit 1
          fi

          reviewed_state_key="$(cat reviewed.state-key)"
          if [ "$reviewed_state_key" != "profiles/${PROFILE}/terraform.tfstate" ]; then
            echo "::error::plan records backend state key ${reviewed_state_key}, not this profile's"
            exit 1
          fi

          reviewed_state_bucket="$(cat reviewed.state-bucket)"
          reviewed_state_lock_table="$(cat reviewed.state-lock-table)"
          test -n "$reviewed_state_bucket" || {
            echo '::error::reviewed plan records an empty state bucket'; exit 1; }
          test -n "$reviewed_state_lock_table" || {
            echo '::error::reviewed plan records an empty state lock table'; exit 1; }
          test "$reviewed_state_bucket" = "$TF_STATE_BUCKET" || {
            echo '::error::reviewed plan state bucket differs from the apply backend'; exit 1; }
          test "$reviewed_state_lock_table" = "$TF_LOCK_TABLE" || {
            echo '::error::reviewed plan lock table differs from the apply backend'; exit 1; }

          reviewed_commit="$(cat reviewed.commit)"
          if ! printf '%s' "$reviewed_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::reviewed.commit is not a 40-character commit sha'
            exit 1
          fi

          reviewed_tf_version="$(cat reviewed.terraform-version)"
          if ! printf '%s' "$reviewed_tf_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo '::error::reviewed.terraform-version is not a concrete version'
            exit 1
          fi

          created_epoch="$(date -u -d "$(cat reviewed.created-utc)" +%s)"
          expires_epoch="$(date -u -d "$(cat reviewed.expires-utc)" +%s)"
          now_epoch="$(date -u +%s)"
          if [ "$expires_epoch" -le "$created_epoch" ]; then
            echo '::error::reviewed plan expiry precedes its creation timestamp'
            exit 1
          fi
          if [ "$((expires_epoch - created_epoch))" -gt 86400 ]; then
            echo '::error::reviewed plan claims a validity window longer than 24 hours'
            exit 1
          fi
          if [ "$now_epoch" -ge "$expires_epoch" ]; then
            echo "::error::reviewed plan expired at $(cat reviewed.expires-utc); create a fresh plan"
            exit 1
          fi

          {
            printf 'commit=%s\n' "$reviewed_commit"
            printf 'terraform_version=%s\n' "$reviewed_tf_version"
            printf 'listener_target_group_arn=%s\n' "$reviewed_listener_arn"
            printf 'deployment_lane=%s\n' "$reviewed_deployment_lane"
            printf 'staging_state=%s\n' "$reviewed_staging_state"
          } >> "$GITHUB_OUTPUT"

      - name: Require secret-preflight bypass to be backed by an asleep reviewed plan
        if: inputs.profile == 'staging' && inputs.secret_preflight_required == false
        env:
          REVIEWED_STAGING_STATE: ${{ steps.reviewed.outputs.staging_state }}
        run: |
          set -euo pipefail
          test "$REVIEWED_STAGING_STATE" = asleep || {
            echo '::error::secret_preflight_required=false is only valid when the reviewed plan records staging_state=asleep'; exit 1;
          }

      # Bind the apply to the plan's OWN commit, not the dispatch ref. The ref
      # may have moved since review; github.sha says nothing about which code
      # the reviewed plan was built from.
      - name: Check out the exact commit the plan was reviewed at
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.reviewed.outputs.commit }}
          fetch-depth: 1
      - name: Verify the checkout is the reviewed commit
        env:
          REVIEWED_COMMIT: ${{ steps.reviewed.outputs.commit }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$REVIEWED_COMMIT" ]; then
            echo "::error::checked out ${head_sha}, expected reviewed commit ${REVIEWED_COMMIT}"
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.reviewed.outputs.terraform_version }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Configure Terraform provider cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plan-validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
      - name: Stage the reviewed plan before any AWS prerequisite mutation
        working-directory: deploy/aws/terraform
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/reviewed-plan"/reviewed.* .
          # Preserve the archive_file output from the plan run verbatim. The
          # binary plan records its checksum; recreating this ZIP at apply time
          # would be nondeterministic and can invalidate the exact plan.
          if [ -f reviewed.drift_lambda.zip ]; then
            cp reviewed.drift_lambda.zip drift_lambda.zip
          fi
          if [ -f reviewed.rotate_secret.zip ]; then
            cp reviewed.rotate_secret.zip rotate_secret.zip
          fi
          if jq -e 'any(.resource_changes[]?; (.address // "") | contains("ml_drift_lambda"))' reviewed.tfplan.json >/dev/null \
            && [ ! -s drift_lambda.zip ]; then
            echo '::error::reviewed plan contains ml_drift_lambda but its exact package was not carried into apply'
            exit 1
          fi
          if jq -e 'any(.resource_changes[]?; (.address // "") | contains("secrets") and contains("rotation"))' reviewed.tfplan.json >/dev/null \
            && [ ! -s rotate_secret.zip ]; then
            echo '::error::reviewed plan contains secret rotation resources but its exact package was not carried into apply'
            exit 1
          fi
      - name: Validate AWS and external-provider apply inputs
        env:
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          TF_VAR_auth0_domain: ${{ secrets.TF_AUTH0_DOMAIN }}
          AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/release/check_provider_apply_inputs.py \
            --inventory "${TF_DIR}/reviewed.resources.json" \
            --verify-auth0-scopes
      - name: Validate the reviewed Terraform state access contract
        run: |
          set -euo pipefail
          python scripts/release/check_terraform_state_access_policy.py \
            --manifest config/terraform_state_access_policy.yaml \
            --terraform-root "${TF_DIR}"
      - name: Validate the reviewed staging apply IAM contract
        if: inputs.profile == 'staging'
        run: |
          set -euo pipefail
          python scripts/release/check_staging_apply_policy.py \
            --manifest config/staging_apply_iam_policy.yaml \
            --profile staging
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify the assumed apply role matches the encrypted secret
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          expected_role_path="${EXPECTED_ROLE_ARN#*:role/}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role_path="$(jq -r .Arn <<<"$caller_json")"
          caller_role_path="${caller_role_path#*:assumed-role/}"
          caller_role_path="${caller_role_path%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::assumed apply role account does not match AWS_TERRAFORM_APPLY_ROLE_ARN'; exit 1; }
          test "$caller_role_path" = "$expected_role_path" || { echo '::error::assumed role does not match AWS_TERRAFORM_APPLY_ROLE_ARN'; exit 1; }
          if [ "$PROFILE" = staging ]; then
            test "$caller_role_path" = AetherStagingDeploy || { echo '::error::staging apply job assumed an unexpected IAM role'; exit 1; }
            echo 'Verified staging apply credentials resolve to AetherStagingDeploy in the expected account.'
          else
            echo "Verified ${PROFILE} apply credentials resolve to the encrypted role ARN in the expected account."
          fi
      - name: Verify effective Terraform state permissions
        env:
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_STATE_KEY: profiles/${{ inputs.profile }}/terraform.tfstate
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          python scripts/release/verify_terraform_state_role.py \
            --role-arn "$AWS_TERRAFORM_APPLY_ROLE_ARN" \
            --bucket "$TF_STATE_BUCKET" \
            --lock-table "$TF_LOCK_TABLE" \
            --state-key "$TF_STATE_KEY" \
            --account-id "$account_id"
      - name: Verify effective staging apply policy
        if: inputs.profile == 'staging'
        env:
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          python scripts/release/verify_effective_staging_apply_policy.py \
            --role-arn "$AWS_TERRAFORM_APPLY_ROLE_ARN" \
            --manifest config/staging_apply_iam_policy.yaml \
            --supplemental-manifest config/staging_application_delivery_iam_policy.yaml \
            --supplemental-manifest config/terraform_state_access_policy.yaml \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-lock-table "$TF_LOCK_TABLE" \
            --state-profile "${{ inputs.profile }}"
      - name: Verify required staging secrets have current versions
        if: inputs.profile == 'staging' && steps.reviewed.outputs.staging_state != 'asleep'
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          # Terraform creates the named Secrets Manager resources, but never
          # invents their values. ECS will reject a task definition that
          # references a stub without an AWSCURRENT version, so fail before
          # any apply mutation and direct the operator to the secure bootstrap
          # procedure. Values are never read or printed here.
          required_secrets=(
            jwt-secret
            byok-encryption-key
            stripe-secret-key
            stripe-webhook-secret
            oracle-signer-private-key
            watermark-secret-key
            canary-secret-seed
            extraction-canary-seed
            sdk-config-secret
            first-admin-bootstrap-token
            jwt-secret-previous
            byok-encryption-key-previous
          )
          if [ "$DEPLOYMENT_LANE" = full ]; then
            required_secrets+=(kyber-google-client-id kyber-google-client-secret)
          else
            required_secrets+=(
              stripe-price-alpha
              stripe-price-beta
              stripe-price-gamma
              stripe-price-delta
            )
          fi
          for name in "${required_secrets[@]}"; do
            describe_file="$(mktemp)"
            if ! aws secretsmanager describe-secret \
              --secret-id "aether/${name}" \
              --output json >"$describe_file" 2>/tmp/staging-secret.err; then
              cat /tmp/staging-secret.err >&2
              echo "::error::required staging secret aether/${name} is not present or is not readable"
              exit 1
            fi
            if ! python - "$describe_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("DeletedDate") is not None:
              raise SystemExit("secret is pending deletion")
          versions = payload.get("VersionIdsToStages") or {}
          if not any("AWSCURRENT" in stages for stages in versions.values()):
              raise SystemExit(1)
          PY
            then
              echo "::error::required staging secret aether/${name} has no AWSCURRENT version; bootstrap/import its value before apply"
              exit 1
            fi
            rm -f "$describe_file"
          done
          echo 'Verified all ECS-mounted staging secrets exist with an AWSCURRENT version; values were not read.'

          # Aurora owns its database credential secret, so it is not in the
          # aether/* application-secret allow-list above. When an existing
          # cluster is present, its RDS-managed secret must nevertheless be
          # active before a task definition can successfully connect. A brand
          # new cluster is allowed to remain absent here because the same
          # reviewed apply creates it and AWS creates the managed secret.
          rds_metadata="$(mktemp)"
          rds_error="$(mktemp)"
          if ! aws rds describe-db-clusters \
            --db-cluster-identifier AETHER-staging-aurora \
            --output json >"$rds_metadata" 2>"$rds_error"; then
            if grep -q 'DBClusterNotFoundFault' "$rds_error"; then
              echo 'No existing canonical Aurora cluster; the reviewed apply will create its RDS-managed secret.'
            else
              cat "$rds_error" >&2
              echo '::error::could not inspect the existing canonical Aurora credential status; refusing apply'
              exit 1
            fi
          elif [ "$(jq '.DBClusters | length' "$rds_metadata")" -eq 0 ]; then
            echo 'No existing canonical Aurora cluster; the reviewed apply will create its RDS-managed secret.'
          else
            rds_secret_status="$(jq -r '.DBClusters[0].MasterUserSecret.SecretStatus // empty' "$rds_metadata")"
            test "$rds_secret_status" = active || {
              echo "::error::canonical Aurora RDS-managed credential status is '$rds_secret_status', expected active"
              exit 1
            }
            echo 'Verified the existing canonical Aurora RDS-managed credential is active; its value was not read.'
          fi
          rm -f "$rds_metadata" "$rds_error"
      - name: Require complete pilot Stripe wiring and current-version price secrets
        if: >-
          inputs.profile == 'staging'
          && inputs.deployment_lane == 'pilot'
          && steps.reviewed.outputs.staging_state != 'asleep'
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane }}
        run: |
          set -euo pipefail
          # This is the last fail-closed gate before Terraform can mutate AWS.
          # It checks the exact reviewed source wiring and read-only Secrets
          # Manager metadata plus the current Stripe price-ID format. Values
          # are used only for validation and are never printed or persisted.
          python scripts/release/check_staging_lane_contract.py \
            --profile staging \
            --deployment-lane "$DEPLOYMENT_LANE" \
            --check-runtime-wiring \
            --require-aws-price-secrets
      - name: Validate reviewed staging maintenance target group
        if: inputs.profile == 'staging'
        env:
          # Use the value verified from the reviewed artifact. The lifecycle
          # dispatcher intentionally does not need to duplicate this optional
          # plan input, preventing empty-input false failures.
          MAINTENANCE_TG_ARN: ${{ steps.reviewed.outputs.listener_target_group_arn }}
        run: |
          set -euo pipefail
          # The listener ARN is only a maintenance target during an actual
          # backend target-group replacement. Normal staging plans record the
          # existing backend target group for provenance; do not misclassify
          # that ordinary ARN as a maintenance transition.
          if ! jq -e '
            any(.resource_changes[]?;
              .address == "module.alb.aws_lb_target_group.backend[0]" and
              ((.change.actions // []) | (index("delete") != null and index("create") != null)))
          ' "${RUNNER_TEMP}/reviewed-plan/reviewed.tfplan.json" >/dev/null; then
            exit 0
          fi
          if [ -z "$MAINTENANCE_TG_ARN" ]; then
            exit 0
          fi
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          case "$MAINTENANCE_TG_ARN" in
            arn:aws:elasticloadbalancing:us-east-1:${account_id}:targetgroup/aether-staging-maintenance*) ;;
            *)
              echo '::error::maintenance target group must be an existing us-east-1 target group in this account named aether-staging-maintenance*'
              exit 1
              ;;
          esac
          tg_json="$(aws elbv2 describe-target-groups --target-group-arns "$MAINTENANCE_TG_ARN" --output json)" || {
            echo '::error::maintenance target group ARN does not exist or is not readable'
            exit 1
          }
          tg_name="$(jq -r '.TargetGroups[0].TargetGroupName // empty' <<<"$tg_json")"
          tg_vpc="$(jq -r '.TargetGroups[0].VpcId // empty' <<<"$tg_json")"
          tg_type="$(jq -r '.TargetGroups[0].TargetType // empty' <<<"$tg_json")"
          [ -n "$tg_name" ] && [ "$tg_name" = aether-staging-maintenance ] || [[ "$tg_name" == aether-staging-maintenance-* ]] || {
            echo '::error::maintenance target group has an unexpected name'
            exit 1
          }
          [[ "$tg_type" = ip || "$tg_type" = instance ]] || {
            echo '::error::maintenance target group is not ALB-compatible (expected ip or instance target type)'
            exit 1
          }
          alb_vpc="$(aws elbv2 describe-load-balancers --names aether-staging-alb --query 'LoadBalancers[0].VpcId' --output text)"
          [ -n "$alb_vpc" ] && [ "$alb_vpc" != None ] && [ "$tg_vpc" = "$alb_vpc" ] || {
            echo '::error::maintenance target group is not in the staging ALB VPC'
            exit 1
          }
          echo "Validated reviewed maintenance target group $MAINTENANCE_TG_ARN in VPC $tg_vpc"
      - name: Refuse unsupported free-plan Aurora topology before mutation
        if: inputs.profile == 'staging'
        run: |
          set -euo pipefail
          # AWS Free accounts can create Aurora only through Express Configuration.
          # The full staging topology uses a customer-managed KMS key, which
          # the Express API does not represent. Express mode
          # (aurora_express_mode = true) uses AWS-managed encryption and is
          # compatible with Free accounts.
          plan_type="$(aws freetier get-account-plan-state --query 'accountPlanType' --output text 2>/tmp/freetier.err)" || {
            cat /tmp/freetier.err >&2
            echo '::error::Unable to determine the AWS account plan; refusing staging apply until the Free Tier plan check succeeds.'
            exit 1
          }
          uses_cmk="$(jq '[.resource_changes[]? | select(.address | startswith("module.aurora.aws_kms_key.")) | select(.change.actions != ["delete"])] | length' \
            "${RUNNER_TEMP}/reviewed-plan/reviewed.tfplan.json")"
          case "$plan_type" in
            PAID)
              echo 'AWS account plan is PAID; Aurora topology is eligible to proceed.'
              ;;
            FREE)
              if [ "$uses_cmk" -gt 0 ]; then
                echo '::error::AWS Free plan cannot apply a staging Aurora topology with a customer-managed KMS key. Set aurora_express_mode = true in the staging profile or upgrade the account plan.'
                exit 1
              fi
              echo 'AWS account plan is FREE; reviewed plan uses express mode (AWS-managed encryption). Eligible to proceed.'
              ;;
            *)
              echo "::error::AWS account plan returned an unsupported value '$plan_type'; refusing staging apply."
              exit 1
              ;;
          esac
      - name: Require live listener detachment before target-group replacement
        if: inputs.profile == 'staging'
        env:
          MAINTENANCE_TG_ARN: ${{ steps.reviewed.outputs.listener_target_group_arn }}
        run: |
          set -euo pipefail
          if ! jq -e '
            any(.resource_changes[]?;
              .address == "module.alb.aws_lb_target_group.backend[0]" and
              ((.change.actions // []) | (index("delete") != null and index("create") != null)))
          ' "${RUNNER_TEMP}/reviewed-plan/reviewed.tfplan.json" >/dev/null; then
            exit 0
          fi
          [ -n "$MAINTENANCE_TG_ARN" ] || {
            echo '::error::replacement plan has no maintenance target group'
            exit 1
          }
          alb_arn="$(aws elbv2 describe-load-balancers --names aether-staging-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)"
          [ -n "$alb_arn" ] && [ "$alb_arn" != None ] || {
            echo '::error::cannot verify the staging ALB before a destructive target-group replacement'
            exit 1
          }
          listener_arn="$(aws elbv2 describe-listeners --load-balancer-arn "$alb_arn" --query 'Listeners[?Port==`443`].ListenerArn | [0]' --output text)"
          [ -n "$listener_arn" ] && [ "$listener_arn" != None ] || {
            echo '::error::cannot verify the staging HTTPS listener before target-group replacement'
            exit 1
          }
          current_tg="$(aws elbv2 describe-listeners --listener-arns "$listener_arn" --query 'Listeners[0].DefaultActions[0].TargetGroupArn' --output text)"
          if [ "$current_tg" != "$MAINTENANCE_TG_ARN" ]; then
            echo '::error::staging HTTPS listener is not already detached to the reviewed maintenance target group; apply a detach-only plan first'
            exit 1
          fi
          echo 'Verified live staging HTTPS listener is detached to the reviewed maintenance target group.'
      # Re-run at the reviewed commit: the reports in the artifact are evidence,
      # not proof. The policy and cost rules that ship with the reviewed code
      # must pass before any AWS prerequisite mutation.
      - name: Re-validate the reviewed plan against policy and cost model
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/release/check_terraform_plan_policy.py \
            --profile "$PROFILE" \
            --plan-json "${TF_DIR}/reviewed.tfplan.json"
          if python -c "import os, yaml; p = (yaml.safe_load(open('config/deployment_profiles.yaml')) or {}).get('profiles') or {}; raise SystemExit(0 if (p.get(os.environ['PROFILE']) or {}).get('budget') else 1)"; then
            python scripts/release/check_cost_model.py \
              --profile "$PROFILE" \
              --inventory "${TF_DIR}/reviewed.resources.json" \
              --out-dir "artifacts/cost-${PROFILE}"
          fi
      - name: Check ECR collisions before account-level role bootstrap
        if: inputs.profile == 'staging' || inputs.profile == 'demo' || inputs.profile == 'preview'
        working-directory: deploy/aws/terraform
        env:
          PROFILE: ${{ inputs.profile }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          # The immutable delivery build creates the shared ECR repositories
          # before Terraform runs. A repository that exists remotely but is
          # absent from this profile's state would otherwise fail halfway
          # through apply, after unrelated resources have already mutated.
          # Refuse before any mutation and route the exact repository names
          # through a separate, confirmation-gated state reconciliation.
          # This is deliberately before the ECS service-linked-role step: a
          # rejected collision must not leave an account-level IAM mutation.
          bash "${GITHUB_WORKSPACE}/scripts/release/terraform_init_retry.sh" -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=profiles/${PROFILE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          ecr_creates="$(jq -r '
            .resource_changes[]?
            | select((.address // "") | startswith("module.ecr.aws_ecr_repository.this["))
            | select((.change.actions // []) | index("create") != null)
            | (.address | split("[")[1] | gsub("\\\""; "") | rtrimstr("]"))
          ' reviewed.tfplan.json)"
          while IFS= read -r repository; do
            [ -n "$repository" ] || continue
            state_address="module.ecr.aws_ecr_repository.this[\"${repository}\"]"
            state_list_file="$(mktemp)"
            terraform state list >"$state_list_file"
            if grep -Fxq "$state_address" "$state_list_file"; then
              continue
            fi
            set +e
            existing_repository="$(aws ecr describe-repositories \
              --repository-names "$repository" \
              --query 'repositories[0].repositoryName' --output text 2>/tmp/ecr.err)"
            lookup_rc=$?
            set -e
            if [ "$lookup_rc" -ne 0 ]; then
              if grep -Eiq 'RepositoryNotFoundException|not found|does not exist' /tmp/ecr.err; then
                existing_repository=""
              else
                cat /tmp/ecr.err >&2
                echo "::error::unable to verify ECR repository ${repository}; refusing to apply on an inconclusive AWS response"
                exit 1
              fi
            fi
            if [ -n "$existing_repository" ] && [ "$existing_repository" != None ]; then
              if [ "$PROFILE" = staging ]; then
                echo "::error::ECR repository ${repository} already exists outside Terraform state; run the confirmation-gated staging state reconciliation and create a fresh reviewed plan before applying"
              else
                echo "::error::ECR repository ${repository} already exists outside ${PROFILE} Terraform state; resolve shared ECR ownership and create a fresh reviewed plan before applying"
              fi
              exit 1
            fi
          done <<< "$ecr_creates"
      - name: Ensure the ECS service-linked role exists before capacity providers
        # Every selectable profile provisions the ECS capacity-provider
        # resource. Bootstrap the account-level service-linked role before
        # Terraform touches that resource; each profile's protected apply role
        # must carry the same narrowly scoped CreateServiceLinkedRole/GetRole
        # contract. If it does not, fail here before any profile resource is
        # mutated rather than discovering the gap mid-apply.
        run: |
          set -euo pipefail
          # ECS creates this service-linked role lazily, but capacity-provider
          # updates can race that creation and fail mid-apply. Create it
          # idempotently before Terraform starts; an existing role is fine.
          if ! aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/tmp/ecs-slr.out 2>/tmp/ecs-slr.err; then
            # AWS has returned all of these variants across regions/provider
            # versions for an already-present service-linked role. Treat only
            # those explicit idempotency responses as success; fail closed on
            # permission, throttling, or any other error.
            if ! grep -Eiq 'InvalidInput.*already exists|EntityAlreadyExists|has been taken' /tmp/ecs-slr.err; then
              cat /tmp/ecs-slr.err >&2
              exit 1
            fi
          fi
          for attempt in 1 2 3 4 5 6; do
            aws iam get-role --role-name AWSServiceRoleForECS >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo '::error::AWSServiceRoleForECS was not visible after idempotent creation'
          exit 1
      # Re-run at the reviewed commit: the reports in the artifact are evidence,
      # not proof. The policy and cost rules that ship with the reviewed code
      # must still pass against the reviewed plan at apply time.
      - name: Apply the exact approved plan (never re-plan)
        working-directory: deploy/aws/terraform
        env:
          PROFILE: ${{ inputs.profile }}
          PLAN_CHECKSUM: ${{ inputs.plan_checksum }}
          REVIEWED_COMMIT: ${{ steps.reviewed.outputs.commit }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_VAR_auth0_domain: ${{ secrets.TF_AUTH0_DOMAIN }}
          AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "$(cat reviewed.profile)" = "$PROFILE"
          test "$(cat reviewed.commit)" = "$REVIEWED_COMMIT"
          test "$(cat reviewed.commit)" = "$(git rev-parse HEAD)"
          test "$(cat reviewed.state-key)" = "profiles/${PROFILE}/terraform.tfstate"
          test "$(sha256sum reviewed.tfplan | cut -d' ' -f1)" = "$PLAN_CHECKSUM"
          sha256sum --check --status reviewed.tfplan.sha256
          test "$(cat reviewed.lock.sha256)" = "$(sha256sum .terraform.lock.hcl | cut -d' ' -f1)"
          test "$(cat reviewed.terraform-version)" = "$(terraform version -json | jq -r '.terraform_version')"
          test "$(date -u +%s)" -lt "$(date -u -d "$(cat reviewed.expires-utc)" +%s)"
          if [ "$PROFILE" = staging ] && jq -e '
            any(.resource_changes[]?;
              .address == "module.alb.aws_lb_target_group.backend[0]" and
              ((.change.actions // []) | (index("delete") != null and index("create") != null)))
          ' reviewed.tfplan.json >/dev/null; then
            test -n "$(cat reviewed.staging-listener-target-group-arn)" || {
              echo '::error::reviewed staging replacement has no maintenance listener transition target'
              exit 1
            }
          fi
          bash "${GITHUB_WORKSPACE}/scripts/release/terraform_init_retry.sh" -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=profiles/${PROFILE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          state_list_file="$(mktemp)"
          terraform state list >"$state_list_file"
          if grep -Fxq 'module.alb.aws_lb_target_group.backend' "$state_list_file"; then
            echo '::error::legacy backend target-group state address remains; run the confirmation-gated terraform-state-migrate workflow and create a fresh plan'
            exit 1
          fi
          if [ "$PROFILE" = staging ]; then
            # A partially completed rehearsal can leave the deterministic
            # target group in AWS while its state entry is absent. Refuse
            # before any mutation and route recovery through the reviewed
            # import-only workflow instead of allowing a mid-apply collision.
            # An update plan already proves the target is in the reviewed prior
            # state; perform the AWS collision lookup only for a create action.
            if jq -e '
              any(.resource_changes[]?;
                .address == "module.alb.aws_lb_target_group.backend[0]" and
                ((.change.actions // []) | index("create") != null))
            ' reviewed.tfplan.json >/dev/null; then
              set +e
              existing_tg="$(aws elbv2 describe-target-groups \
                --names aether-staging-backend \
                --query 'TargetGroups[0].TargetGroupArn' --output text 2>/tmp/target-group.err)"
              lookup_rc=$?
              set -e
              if [ "$lookup_rc" -ne 0 ]; then
                if grep -Eiq 'TargetGroupNotFound|not found|does not exist' /tmp/target-group.err; then
                  existing_tg=""
                else
                  cat /tmp/target-group.err >&2
                  echo '::error::unable to verify aether-staging-backend; refusing to apply on an inconclusive AWS response'
                  exit 1
                fi
              fi
              if [ -n "$existing_tg" ] && [ "$existing_tg" != None ] \
                && ! grep -Fxq 'module.alb.aws_lb_target_group.backend[0]' "$state_list_file"; then
                echo '::error::aether-staging-backend already exists outside Terraform state; run the import-only staging-state-reconcile workflow and create a fresh plan before applying'
                exit 1
              fi
            fi

          fi
          terraform apply -input=false reviewed.tfplan | tee reviewed.apply.txt
          sha256sum reviewed.apply.txt > reviewed.apply.sha256
          # The ALB hostname is assigned by AWS at apply time, but it is not the
          # HTTPS endpoint: the certificate is issued for var.domain_name. Keep
          # the raw ALB name as evidence, then publish the configured backend
          # hostname for the lifecycle smoke tests. DNS is managed outside this
          # Terraform root, so do not fail a completed apply just because the
          # operator-managed hostname has not propagated to the new ALB yet.
          # The lifecycle workflow performs the fail-closed DNS check immediately
          # before readiness, the lease, and any rehearsal requests.
          alb_dns="$(terraform output -raw alb_dns)"
          case "$alb_dns" in
            ''|*://*|*/*|*' '*|*'"'*)
              echo '::error::terraform output alb_dns is empty or is not a host name'; exit 1 ;;
          esac
          backend_url="$(terraform output -raw backend_url)"
          backend_host="$(python - "$backend_url" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = sys.argv[1]
          parsed = urlparse(url)
          host = parsed.hostname or ""
          if parsed.scheme != "https" or parsed.path not in ("", "/") or not host:
              raise SystemExit("terraform output backend_url is not a certificate-covered HTTPS host")
          print(host)
          PY
          )"
          case "$backend_host" in
            ''|*://*|*/*|*' '*|*'"'*)
              echo '::error::terraform output backend_url produced an invalid host'; exit 1 ;;
          esac
          printf '%s\n' "$backend_host" > reviewed.api-host
          printf '%s\n' "$alb_dns" > reviewed.alb-dns
      - name: Verify applied staging frontend runtime links
        if: inputs.profile == 'staging'
        run: |
          set -euo pipefail
          # Terraform updates the branch-level variables that the built SPA
          # receives. Verify those live values before publishing apply evidence;
          # the normal lifecycle preflight still performs the stronger
          # repository/job/domain provenance check before smoke.
          python scripts/release/check_amplify_app_contract.py \
            --mode staging-runtime
      - name: Verify applied staging Aurora safety controls
        if: inputs.profile == 'staging'
        run: |
          set -euo pipefail
          # Staging is persistent even though compute sleeps. The reviewed
          # apply must leave the canonical Aurora cluster encrypted, protected
          # from deletion, and backed by an active RDS-managed credential.
          for attempt in $(seq 1 30); do
            cluster_json="$(aws rds describe-db-clusters \
              --db-cluster-identifier AETHER-staging-aurora --output json)"
            if jq -e '
              (.DBClusters | length) == 1 and
              .DBClusters[0].StorageEncrypted == true and
              .DBClusters[0].DeletionProtection == true and
              .DBClusters[0].MasterUserSecret.SecretStatus == "active"
            ' <<<"$cluster_json" >/dev/null; then
              echo 'Verified canonical staging Aurora encryption, deletion protection, and active RDS credential.'
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo '::error::canonical staging Aurora did not reach the reviewed safety shape after apply'
          exit 1
      - name: Verify applied staging ECS task-definition lane
        if: inputs.profile == 'staging'
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'full' }}
        run: |
          set -euo pipefail
          # Terraform and the delivery workflow must converge the registered
          # revisions, not merely the source module. This metadata-only gate
          # proves the live API and lean-worker tasks match the selected lane
          # and that secret values are never read.
          python scripts/release/check_staging_task_definition_contract.py \
            --lane "$DEPLOYMENT_LANE"
      - name: Verify applied staging ECS cache IAM permissions
        if: inputs.profile == 'staging'
        working-directory: deploy/aws/terraform
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          task_role_arn="$(terraform output -raw ecs_task_role_arn)"
          table_name="$(terraform output -raw dynamodb_cache_table_name)"
          python ../../../scripts/release/check_staging_runtime_iam.py \
            --role-arn "$task_role_arn" \
            --table-arn "arn:aws:dynamodb:${AWS_REGION}:${account_id}:table/${table_name}"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-evidence-${{ github.run_id }}
          path: |
            deploy/aws/terraform/reviewed.apply.*
            deploy/aws/terraform/reviewed.api-host
            deploy/aws/terraform/reviewed.alb-dns
          if-no-files-found: error
