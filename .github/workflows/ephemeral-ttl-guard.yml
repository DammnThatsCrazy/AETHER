name: Ephemeral TTL guard

# Fail-safe against demo/preview ephemeral environments being left running
# forever. Each ephemeral profile carries an absolute UTC `expires-at` lease in
# SSM at /aether/{profile}/{env}/lifecycle/expires-at, written by
# scripts/release/ephemeral_env.py provision. This workflow runs hourly,
# compares the lease against the clock, and fails the run red when the lease is
# expired so the lapse is visible and the environment is known to be unsafe.
#
# FAIL-CLOSED. An environment nobody can account for must not be allowed to
# keep running, and the guard must never report an unaccountable env as live.
# A missing lease, an unreadable lease, a malformed lease and an expired lease
# ALL read as "expired" (scripts/release/ephemeral_ttl_guard.py::evaluate), and
# an expired env ends the run red. An AWS call failure is treated the same way:
# a throttled or unauthorised `aws ssm get-parameter` returns no lease, which
# the guard reads as expired, which fails the run.
#
# The enforcement action on expiry is operator-run `ephemeral_env.py teardown`
# (scale-to-zero + floor-zeroing + lease removal); this cron is the tripwire
# that makes the expiry visible and blocks a green run while an env is
# unaccounted for.

on:
  schedule:
    # Hourly: the tightest useful granularity against a 4-hour default TTL.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeral-ttl-guard
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  guard:
    name: Enforce the ephemeral TTL (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: demo
            env: demo
          - profile: preview
            env: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install guard dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml

      # NOT ARMED WITHOUT THE LIFECYCLE ROLE. When the role is absent the guard
      # has no credential to read the lease or trip the TTL, so it is a NO-OP
      # until the role is wired; demo/preview may still be running and will NOT
      # be guarded — this is NOT a claim that demo/preview are asleep. The
      # moment the role is configured, every step below runs exactly as written:
      # fail-closed. The secrets context is not available in step `if:`
      # conditions, so the role is laundered through an env binding and
      # published as a step output that every credential-gated step below reads.
      - name: Detect whether the lifecycle role is configured
        id: check-armed
        env:
          AWS_EPHEMERAL_LIFECYCLE_ROLE_ARN: ${{ secrets.AWS_EPHEMERAL_LIFECYCLE_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_EPHEMERAL_LIFECYCLE_ROLE_ARN:-}" ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'Lifecycle role is configured; the guard is armed.'
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'Lifecycle role is absent; the guard is a NO-OP until it is wired.'
          fi

      - name: TTL guard is not armed without the lifecycle role
        if: steps.check-armed.outputs.armed == 'false'
        run: |
          set -euo pipefail
          echo '::notice title=Ephemeral TTL guard not armed::AWS_EPHEMERAL_LIFECYCLE_ROLE_ARN is not configured, so the guard has no credential to read the lease or trip the TTL; it is a NO-OP until the role is wired. Demo/preview environments may still be running and will NOT be guarded — this is NOT a claim that demo/preview are asleep.'
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check-armed.outputs.armed == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_EPHEMERAL_LIFECYCLE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve the ephemeral TTL decision
        id: decision
        if: steps.check-armed.outputs.armed == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
          ENV: ${{ matrix.env }}
        run: |
          set -euo pipefail
          output="$(python scripts/release/ephemeral_ttl_guard.py --profile "$PROFILE" --env "$ENV")"
          expired="$(printf '%s\n' "$output" | sed -n 's/^ephemeral_expired=//p' | tail -n 1)"
          reason="$(printf '%s\n' "$output" | sed -n 's/^ephemeral_reason=//p' | tail -n 1)"
          test -n "$expired" \
            || { echo '::error::ephemeral TTL guard produced no expiry decision'; exit 1; }
          {
            printf 'profile=%s\n' "$PROFILE"
            printf 'env=%s\n' "$ENV"
            printf 'expired=%s\n' "$expired"
            printf 'reason=%s\n' "${reason:-none}"
          } >> "$GITHUB_OUTPUT"
          echo "ephemeral ${PROFILE}/${ENV}: expired=${expired} reason=${reason:-none}"

      # A blocking alert. When the lease is expired (or unaccountable) the run
      # ends red so the failure is visible rather than buried in a log.
      - name: Blocking alert on an expired ephemeral environment
        if: >-
          steps.check-armed.outputs.armed == 'true'
          && steps.decision.outputs.expired == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
          ENV: ${{ matrix.env }}
          REASON: ${{ steps.decision.outputs.reason }}
        run: |
          set -euo pipefail
          echo "::error::${PROFILE}/${ENV} is past its TTL: ${REASON:-unaccountable} (lease /aether/${PROFILE}/${ENV}/lifecycle/expires-at); run scripts/release/ephemeral_env.py teardown --profile ${PROFILE} --env ${ENV}"
          exit 1
