name: Repo Consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repo-consistency-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repo-consistency:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for docs_drift.py commit-range checks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run repo consistency checks
        run: make ci-check
