name: Repo Consistency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-consistency-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repo-consistency:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for docs_drift.py commit-range checks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,security,backend,agent,ml]"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Contract generator parity check
        run: make generate-contracts-check

      - name: Event registry schema parity check
        run: make validate-schema-parity

      - name: Consent registry parity check
        run: python scripts/validate_consent_schema_parity.py

      - name: Run repo consistency checks
        run: make ci-check

  # Full release gate (ci-check + strict production status + ops readiness +
  # staging preflight self-test). Manual dispatch only — this is the
  # pre-release ratchet, not a per-PR gate.
  release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,security,backend,agent,ml]" alembic

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Release gate
        run: make release-gate

      - name: Staging preflight (dry-run self-test)
        run: python scripts/staging_preflight.py --dry-run
