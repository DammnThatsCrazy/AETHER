name: Repo Consistency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-consistency-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  classify-change:
    name: Classify change (impact authority)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      minimum-lane: ${{ steps.selection.outputs.minimum_lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap router dependencies
        run: make bootstrap
      - name: Select affected verification
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          mkdir -p release-evidence
          .venv/bin/python scripts/check_router.py --base "$BASE_SHA" --output release-evidence/verification-selection.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("release-evidence/verification-selection.json") as source:
              print("minimum_lane=" + json.load(source)["minimum_lane"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-selection-evidence
          path: release-evidence/verification-selection.json
          if-no-files-found: error
      - name: Index complete impact graph and emit telemetry evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          .venv/bin/python scripts/impact_graph.py \
            --base "$BASE_SHA" \
            --fail-on-unresolved \
            --telemetry-output release-evidence/telemetry.json \
            > release-evidence/impact-graph.json
          .venv/bin/python scripts/validate_telemetry_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: impact-telemetry-evidence
          path: |
            release-evidence/impact-graph.json
            release-evidence/telemetry.json
          if-no-files-found: error

  build-artifact:
    name: Build affected artifact (build authority)
    needs: classify-change
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep scoped workspace builds equivalent to the root production build
      # command in package.json. These are intentionally invalid endpoints:
      # they satisfy compile-time configuration without creating live access.
      VITE_AETHER_ENV: production
      VITE_KYBER_ENV: production
      VITE_DEMO_ENV: production
      VITE_API_BASE_URL: https://api.invalid
      VITE_AETHER_ENDPOINT: https://api.invalid
      VITE_WS_BASE_URL: wss://api.invalid
      VITE_GRAPHQL_URL: https://api.invalid/v1/analytics/graphql
      VITE_OIDC_AUTHORITY: https://identity.invalid
      VITE_OIDC_CLIENT_ID: workspace-build
      VITE_OIDC_REDIRECT_URI: https://app.invalid/callback
      VITE_DEMO_TENANT_ID: certification-demo
      VITE_DEMO_SEED_NAMESPACE: certification
      VITE_AETHER_URL: https://app.invalid
      VITE_KYBER_URL: https://operator.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: impact-telemetry-evidence
          path: release-evidence
      - name: Select affected build workspaces from the impact graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("release-evidence/impact-graph.json").read_text())
          selection = index["build_selection"]
          selected = selection.get("workspaces")
          if not isinstance(selected, list) or not all(isinstance(path, str) for path in selected):
              raise SystemExit("Impact Graph did not emit an ordered workspace build selection")
          if any(not (Path(workspace) / "package.json").is_file() for workspace in selected):
              raise SystemExit("Impact Graph selected a workspace without package.json")
          selection = {
              "schema_version": 1,
              "authority": "impact",
              "changed_files": index["changed_files"],
              "workspaces": selected,
              "packages": selection["packages"],
              "applications": selection["applications"],
              "backend_image": selection["backend_image"],
              "sdk": selection["sdk"],
          }
          Path("release-evidence/build-selection.json").write_text(
              json.dumps(selection, indent=2) + "\n"
          )
          Path("release-evidence/build-workspaces.txt").write_text(
              "\n".join(selected) + ("\n" if selected else "")
          )
          PY
      - name: Build only selected workspaces in dependency order
        run: |
          set -euo pipefail
          while IFS= read -r workspace; do
            [ -n "$workspace" ] || continue
            if node -e 'const p=require("./" + process.argv[1] + "/package.json"); process.exit(p.scripts?.build ? 0 : 1)' "$workspace"; then
              npm run build --workspace="$workspace"
            else
              echo "No build script for $workspace; recording it as typecheck/test-only scope."
            fi
          done < release-evidence/build-workspaces.txt
      - name: Build selected backend image without publishing or deploying
        run: |
          set -euo pipefail
          selected="$(python -c 'import json; print(json.load(open("release-evidence/build-selection.json"))["backend_image"])')"
          case "$selected" in
            True)
              test -f "Backend Architecture/aether-backend/Dockerfile" || {
                echo "Impact Graph selected backend_image but the canonical Dockerfile is missing" >&2
                exit 1
              }
              docker build \
                --file "Backend Architecture/aether-backend/Dockerfile" \
                --tag "aether-backend:pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                .
              ;;
            False)
              echo "backend_image is NOT_APPLICABLE for this Impact Graph selection"
              ;;
            *)
              echo "::error::Impact Graph emitted a non-boolean backend_image selection: $selected" >&2
              exit 1
              ;;
          esac
      - name: Package selected build outputs once and create immutable candidate
        run: |
          mkdir -p release-evidence
          outputs=(release-evidence/build-selection.json)
          while IFS= read -r workspace; do
            [ -n "$workspace" ] || continue
            if [ -d "$workspace/dist" ]; then
              outputs+=("$workspace/dist")
            fi
          done < release-evidence/build-workspaces.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf release-evidence/repository-build.tar.gz "${outputs[@]}"
          python scripts/artifact_builder.py \
            --candidate-id "pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --profile bundle-certification \
            --component repository-build=release-evidence/repository-build.tar.gz \
            --lockfile package-lock.json --lockfile pyproject.toml \
            --required-check verification/disposition \
            --output release-evidence/release-candidate.json
          cp release-evidence/release-candidate.json release-evidence/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr-build-evidence
          path: |
            release-evidence/build.json
            release-evidence/release-candidate.json
            release-evidence/repository-build.tar.gz
          if-no-files-found: error

  selected-verification:
    name: Affected verification execution
    needs: [classify-change, build-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: make bootstrap
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: pr-build-evidence
          path: release-evidence
      - name: Verify exact build candidate before testing
        run: |
          python scripts/artifact_builder.py --verify \
            --expected-commit "$GITHUB_SHA" \
            --component repository-build=release-evidence/repository-build.tar.gz \
            --lockfile package-lock.json --lockfile pyproject.toml \
            --output release-evidence/release-candidate.json
      - name: Materialize verified build outputs for consumers
        run: tar --extract --gzip --file release-evidence/repository-build.tar.gz
      - name: Frontend data-truth source guardrail
        run: npm run validate:frontend-data-truth
      - name: Frontend brand migration guardrail
        run: npm run validate:frontend-branding
      - name: Execute the single adaptive verification disposition
        id: disposition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          .venv/bin/python scripts/verification_disposition.py \
            --base "$BASE_SHA" --execute \
            --output release-evidence/pr-disposition.json \
            --runtime-output release-evidence/ci-runtime-runs.json
      - name: Record verification disposition evidence
        if: always()
        env:
          STAGE_RESULT: ${{ steps.disposition.outcome }}
        run: |
          mkdir -p release-evidence
          printf '{"schema_version":1,"stage":"verification-disposition","authority":"verification","blocking":true,"status":"%s","commit_sha":"%s"}\n' \
            "$(test "$STAGE_RESULT" = success && echo PASS || echo FAILED)" "$GITHUB_SHA" > release-evidence/selected-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-verification-evidence
          path: |
            release-evidence/pr-disposition.json
            release-evidence/ci-runtime-runs.json
            release-evidence/selected-verification.json
          if-no-files-found: error

  publish-evidence:
    name: verification / disposition
    if: always()
    needs: [classify-change, build-artifact, selected-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*evidence*'
          path: release-evidence
          merge-multiple: true
      - name: Enforce blocking stage disposition
        env:
          IMPACT_RESULT: ${{ needs.classify-change.result }}
          AFFECTED_BUILD_RESULT: ${{ needs.build-artifact.result }}
          VERIFICATION_DISPOSITION_RESULT: ${{ needs.selected-verification.result }}
        run: |
          python - <<'PY'
          import json, os
          results = {
              "impact": os.environ["IMPACT_RESULT"],
              "affected_build": os.environ["AFFECTED_BUILD_RESULT"],
              "verification_disposition": os.environ["VERIFICATION_DISPOSITION_RESULT"],
          }
          failed = {name: value for name, value in results.items() if value != "success"}
          with open("release-evidence/verification-decision.json", "w") as fh:
              json.dump({"schema_version": 1, "stage": "verification-disposition", "authority": "verification",
                         "blocking": True, "status": "FAILED" if failed else "PASS",
                         "results": results}, fh, indent=2)
              fh.write("\n")
          if failed:
              raise SystemExit("blocking PR stages did not pass: " + repr(failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-consistency-evidence
          path: release-evidence/*.json
          if-no-files-found: error

  # Full release gate (ci-check + strict production status + ops readiness +
  # staging preflight self-test). Manual dispatch only — this is the
  # pre-release ratchet, not a per-PR gate.
  release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Release gate
        run: make release-gate

      - name: Staging preflight (dry-run self-test)
        run: python scripts/staging_preflight.py --dry-run
