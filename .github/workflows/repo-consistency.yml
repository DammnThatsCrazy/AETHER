name: Repo Consistency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-consistency-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repo-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for docs_drift.py commit-range checks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Frontend data-truth source guardrail
        run: npm run validate:frontend-data-truth

      - name: Frontend route-state coverage
        run: npm run validate:frontend-route-state

      - name: Clean-install and demo seed safety smokes
        run: make clean-install-smoke demo-seed-smoke demo-reset-smoke

      - name: Contract generator parity check
        run: make generate-contracts-check

      - name: Event registry schema parity check
        run: make validate-schema-parity

      - name: Consent registry parity check
        run: python scripts/validate_consent_schema_parity.py

      - name: Run repo consistency checks
        run: make ci-check

      - name: Record repo-consistency evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"repo-consistency"}\n' "$GITHUB_SHA" > release-evidence/repo-consistency.json

      - uses: actions/upload-artifact@v4
        with:
          name: repo-consistency-evidence
          path: release-evidence/repo-consistency.json

  # Full release gate (ci-check + strict production status + ops readiness +
  # staging preflight self-test). Manual dispatch only — this is the
  # pre-release ratchet, not a per-PR gate.
  release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Release gate
        run: make release-gate

      - name: Staging preflight (dry-run self-test)
        run: python scripts/staging_preflight.py --dry-run
