name: Infrastructure

on:
  pull_request:
    paths:
      - 'AWS Deployment/**'
  push:
    branches: [main]
    paths:
      - 'AWS Deployment/**'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false  # never cancel an active apply

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: AWS Deployment/aether-aws/terraform

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC auth with AWS
      contents: read
      pull-requests: write  # post plan output as PR comment

    defaults:
      run:
        working-directory: AWS Deployment/aether-aws/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      # Detect whether AWS credentials are configured.
      # Without them we still run terraform validate (syntax check, no network calls).
      # With them we run the full init → plan/apply flow.
      - name: Check AWS credentials available
        id: creds
        env:
          INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
        run: |
          if [ -n "$INFRA_ROLE_ARN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS_INFRA_ROLE_ARN secret not set — running validate only (no plan/apply)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Validate-only path (no AWS credentials) ──────────────────────────────

      - name: Terraform Init (validate only, no remote backend)
        if: steps.creds.outputs.available != 'true'
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # ── Full path (AWS credentials present) ──────────────────────────────────

      - name: Configure AWS credentials (OIDC)
        if: steps.creds.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (with remote backend)
        if: steps.creds.outputs.available == 'true'
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE:   ${{ secrets.TF_LOCK_TABLE }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Plan
        if: steps.creds.outputs.available == 'true'
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: steps.creds.outputs.available == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8');
            const truncated = output.length > 60000
              ? output.slice(0, 60000) + '\n\n...(truncated — see full output in workflow logs)'
              : output;
            const body = `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.creds.outputs.available == 'true' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: >-
          steps.creds.outputs.available == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
