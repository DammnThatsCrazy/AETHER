name: Infrastructure Profiles

# Validate-and-plan only. This workflow NEVER applies Terraform.
# The single production apply path is .github/workflows/terraform-promote.yml,
# which is workflow_dispatch-only, environment-gated, and consumes a reviewed,
# checksum-bound binary plan.
#
# Provider-mocked configuration plans run on pushes and PR finalization. A
# credentialed remote plan is deliberately explicit: dispatch it only after
# Immutable delivery has published the commit-bound release manifest, passing
# both its backend digest and commit SHA as inputs. This prevents the old race
# where a main push planned against a mutable repository secret while deploy.yml
# was still publishing the image for that same commit.

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'deploy/aws/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      backend_image_digest:
        description: Immutable backend digest from the completed delivery manifest
        type: string
        required: true
      expected_commit_sha:
        description: Exact commit SHA contained in the completed delivery manifest
        type: string
        required: true
      deployment_lane:
        description: "Staging lane for the remote plan; pilot defers Kyber/GCP credentials while preserving the full AWS topology"
        type: choice
        options: [pilot, full]
        default: pilot
        required: false
  push:
    branches: [main]
    paths:
      - 'deploy/aws/**'
      - '.github/workflows/infrastructure.yml'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: deploy/aws/terraform
  TF_IN_AUTOMATION: true

jobs:
  remote-plan-readiness:
    name: Remote Plan Credential Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - name: Detect complete remote-plan credential set
        id: credentials
        env:
          AWS_INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_ACM_CERTIFICATE_ARN: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_DOMAIN_NAME: ${{ secrets.TF_DOMAIN_NAME }}
          TF_ALERT_EMAIL: ${{ secrets.TF_ALERT_EMAIL }}
          TF_AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
          TF_AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
          TF_AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
          TF_AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
          TF_AETHER_APP_URL: ${{ secrets.TF_AETHER_APP_URL }}
          TF_KYBER_APP_URL: ${{ secrets.TF_KYBER_APP_URL }}
          BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Remote Terraform plan held::Credentialed remote plans are dispatch-only and must be run after Immutable delivery with its exact backend digest and commit SHA.'
            exit 0
          fi
          printf '%s' "$BACKEND_IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo '::error::backend_image_digest input must be an immutable sha256 digest'; exit 1; }
          printf '%s' "$EXPECTED_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::expected_commit_sha input must be a 40-character lowercase commit SHA'; exit 1; }
          missing=()
          # TF_ML_IMAGE_DIGEST is profile-specific: staging and
          # production-lean run inline ML and do not require a serving image.
          # Dedicated ML profiles validate it in their matrix job below.
          for name in \
            AWS_INFRA_ROLE_ARN \
            AWS_TERRAFORM_PLAN_ROLE_ARN \
            TF_STATE_BUCKET \
            TF_LOCK_TABLE \
            TF_ACM_CERTIFICATE_ARN \
            TF_DOMAIN_NAME \
            TF_ALERT_EMAIL \
            TF_AUTH0_DOMAIN \
            TF_AUTH0_MANAGEMENT_CLIENT_ID \
            TF_AUTH0_MANAGEMENT_CLIENT_SECRET \
            TF_AMPLIFY_GITHUB_ACCESS_TOKEN \
            TF_AETHER_APP_URL \
            TF_KYBER_APP_URL
          do
            # `${!name-}` is indirect expansion with an empty default, so an
            # entirely unset secret does not abort the loop under `set -u`.
            if [ -z "${!name-}" ]; then
              missing+=("$name")
            fi
          done

          amplify_token="${TF_AMPLIFY_GITHUB_ACCESS_TOKEN:-}"
          if [ -z "$amplify_token" ] || [ "$amplify_token" = '-' ]; then
            missing+=(TF_AMPLIFY_GITHUB_ACCESS_TOKEN)
          elif [[ "$amplify_token" =~ [[:space:]] ]]; then
            missing+=(TF_AMPLIFY_GITHUB_ACCESS_TOKEN)
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Remote Terraform planning credentials are configured.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            printf -v missing_list '%s, ' "${missing[@]}"
            # The enforcement step below is itself gated on this same
            # `configured` output, so a dispatch with incomplete credentials
            # fails closed without attempting AWS or Terraform work.
            echo "::notice title=Remote Terraform plans not configured::Missing ${missing_list%, }. Provider-mocked configuration plans remain available on pushes and PR finalization; run this workflow again only after the complete credential set is wired."
          fi

  plan:
    name: Terraform Plan (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - staging
          - production-lean
          - production-scale
          - enterprise-isolated
          - demo
          - preview
    defaults:
      run:
        working-directory: deploy/aws/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Configure Terraform provider cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Prepare checked-in profile and CI-only variables
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          cp "profiles/${PROFILE}.tfvars" profile.auto.tfvars
          # backend/ml digests: provider-mocked configuration plans never touch
          # infrastructure, so a syntactically valid placeholder digest is fine
          # here. Real plans always receive the release-manifest digests.
          cat > ci.auto.tfvars.json <<'JSON'
          {
            "acm_certificate_arn": "arn:aws:acm:us-east-1:111122223333:certificate/00000000-0000-0000-0000-000000000000",
            "domain_name": "api.ci.aether.invalid",
            "alert_email": "terraform-ci@aether.invalid",
            "aether_app_url": "https://app.ci.aether.invalid",
            "kyber_app_url": "https://kyber.ci.aether.invalid",
            "backend_image_digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111",
            "ml_image_digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111"
          }
          JSON

      - name: Terraform Init (no remote state)
        run: bash "${GITHUB_WORKSPACE}/scripts/release/terraform_init_retry.sh" -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Configuration Plan
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          # `pipefail` is mandatory here: without it the step exit status is
          # tee's, and a failing `terraform test` would report a green job.
          terraform test \
            -filter=tests/profile_plan.tftest.hcl \
            -verbose \
            -no-color | tee "plan-${PROFILE}.txt"
          sha256sum "plan-${PROFILE}.txt" > "plan-${PROFILE}.txt.sha256"

      - name: Upload immutable configuration-plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-configuration-plan-${{ matrix.profile }}-${{ inputs.expected_commit_sha || github.sha }}
          path: |
            ${{ env.TF_DIR }}/plan-${{ matrix.profile }}.txt
            ${{ env.TF_DIR }}/plan-${{ matrix.profile }}.txt.sha256
          if-no-files-found: error
          retention-days: 30

  remote-plan:
    name: Terraform Remote Plan (${{ matrix.profile }})
    needs: [remote-plan-readiness, plan]
    if: github.event_name == 'workflow_dispatch' && needs.remote-plan-readiness.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # demo/preview are ephemeral-class and deliberately excluded from
        # remote-plan.
        profile:
          - staging
          - production-lean
          - production-scale
          - enterprise-isolated
    defaults:
      run:
        working-directory: deploy/aws/terraform
    env:
      DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'pilot' }}
      TF_VAR_acm_certificate_arn: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
      TF_VAR_domain_name: ${{ secrets.TF_DOMAIN_NAME }}
      TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
      TF_VAR_auth0_domain: ${{ secrets.TF_AUTH0_DOMAIN }}
      # AWS Amplify requires a repository access token for every GitHub-backed
      # app, including apps sourced from a public repository.
      TF_AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
      # The auth0 provider reads these from its own environment, so the
      # credentials never become Terraform root variables and therefore never
      # enter the plan file. This is the structural fix for the plan-artifact
      # secret leak; the sanitiser downstream is defence in depth, not the cure.
      AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
      TF_VAR_aether_app_url: ${{ secrets.TF_AETHER_APP_URL }}
      TF_VAR_kyber_app_url: ${{ secrets.TF_KYBER_APP_URL }}
      # Immutable image digests are required root variables (no defaults):
      # remote plans must pin the currently approved release digests.
      TF_VAR_backend_image_digest: ${{ inputs.backend_image_digest }}
      TF_VAR_ml_image_digest: ${{ secrets.TF_ML_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.15'

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      - name: Configure Terraform provider cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plan-validation dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml

      - name: Validate staging credential shape before remote planning
        if: matrix.profile == 'staging'
        env:
          AWS_INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_STAGING_LIFECYCLE_ROLE_ARN: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_ACM_CERTIFICATE_ARN: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_DOMAIN_NAME: ${{ secrets.TF_DOMAIN_NAME }}
          TF_ALERT_EMAIL: ${{ secrets.TF_ALERT_EMAIL }}
          TF_AUTH0_DOMAIN: ${{ secrets.TF_AUTH0_DOMAIN }}
          TF_AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_ID }}
          TF_AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.TF_AUTH0_MANAGEMENT_CLIENT_SECRET }}
          TF_AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
          TF_AETHER_APP_URL: ${{ secrets.TF_AETHER_APP_URL }}
          TF_KYBER_APP_URL: ${{ secrets.TF_KYBER_APP_URL }}
          STAGING_ADMIN_API_KEY: ${{ secrets.STAGING_ADMIN_API_KEY }}
          KYBER_GOOGLE_CLIENT_ID: ${{ secrets.KYBER_GOOGLE_CLIENT_ID }}
          KYBER_GOOGLE_CLIENT_SECRET: ${{ secrets.KYBER_GOOGLE_CLIENT_SECRET }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane || 'pilot' }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_LANE" in
            pilot|full) ;;
            *) echo "::error::deployment_lane must be pilot or full, got $DEPLOYMENT_LANE"; exit 1 ;;
          esac
          python scripts/release/check_staging_credential_contract.py \
            --lane "$DEPLOYMENT_LANE" \
            --purpose terraform-plan

      - name: Validate Amplify checkout token
        run: |
          set -euo pipefail
          amplify_token="${TF_AMPLIFY_GITHUB_ACCESS_TOKEN:-}"
          if [ -z "$amplify_token" ] || [ "$amplify_token" = '-' ]; then
            echo '::error::TF_AMPLIFY_GITHUB_ACCESS_TOKEN must be a real GitHub repository token; AWS Amplify requires one for public and private repositories.'
            exit 1
          fi
          if [[ "$amplify_token" =~ [[:space:]] ]]; then
            echo '::error::TF_AMPLIFY_GITHUB_ACCESS_TOKEN contains whitespace and cannot be passed to AWS Amplify.'
            exit 1
          fi
          printf 'TF_VAR_amplify_github_access_token=%s\n' "$amplify_token" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The staging matrix leg must plan with the dedicated read-only
          # AetherStagingPlan role. Other profiles retain the shared
          # infrastructure planning role until their profile contracts are
          # migrated to dedicated authorities.
          role-to-assume: ${{ matrix.profile == 'staging' && secrets.AWS_TERRAFORM_PLAN_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify effective staging plan IAM contract
        if: matrix.profile == 'staging'
        env:
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          # Audit the same dedicated staging role that the matrix leg actually
          # assumed before image/state work; this is metadata-only and never
          # reads application secrets.
          python scripts/release/verify_effective_staging_apply_policy.py \
            --role-arn "$AWS_TERRAFORM_PLAN_ROLE_ARN" \
            --manifest config/staging_plan_iam_policy.yaml \
            --supplemental-manifest config/terraform_plan_state_access_policy.yaml \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-lock-table "$TF_LOCK_TABLE" \
            --state-profile "${{ matrix.profile }}" \
            --expected-role AetherStagingPlan \
            --required-policy-suffix AetherStagingPlanContract

      - name: Validate approved backend digest is present and current
        env:
          APPROVED_BACKEND_DIGEST: ${{ env.TF_VAR_backend_image_digest }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$APPROVED_BACKEND_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo '::error::backend_image_digest must be an immutable sha256 digest'; exit 1; }
          published_digest="$(aws ecr describe-images \
            --repository-name aether-backend \
            --image-ids imageDigest="$APPROVED_BACKEND_DIGEST" \
            --query 'imageDetails[0].imageDigest' --output text)"
          test "$published_digest" = "$APPROVED_BACKEND_DIGEST" \
            || { echo '::error::approved backend digest is not present in aether-backend'; exit 1; }
          commit_digest="$(aws ecr describe-images \
            --repository-name aether-backend \
            --image-ids imageTag="$EXPECTED_COMMIT_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          test "$commit_digest" = "$APPROVED_BACKEND_DIGEST" \
            || { echo "::error::backend_image_digest does not match the immutable image published for ${EXPECTED_COMMIT_SHA}"; exit 1; }
          python "${GITHUB_WORKSPACE}/scripts/release/check_staging_image_provenance.py" \
            --repository aether-backend \
            --digest "$APPROVED_BACKEND_DIGEST" \
            --expected-commit "$EXPECTED_COMMIT_SHA"

      - name: Terraform Init (isolated profile state)
        env:
          PROFILE: ${{ matrix.profile }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/release/terraform_init_retry.sh" \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=profiles/${PROFILE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Remote Plan
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          plan_args=(
            -input=false
            -lock-timeout=5m
            -var-file="profiles/${PROFILE}.tfvars"
          )
          if [ "$PROFILE" = staging ]; then
            case "$DEPLOYMENT_LANE" in
              pilot|full) ;;
              *) echo "::error::deployment_lane must be pilot or full, got $DEPLOYMENT_LANE"; exit 1 ;;
            esac
            plan_args+=("-var=deployment_lane=${DEPLOYMENT_LANE}")
          fi
          if [[ "$PROFILE" == production-scale || "$PROFILE" == enterprise-isolated ]]; then
            test -n "${TF_VAR_ml_image_digest:-}" \
              || { echo "::error::${PROFILE} requires TF_ML_IMAGE_DIGEST because remote_ml is enabled"; exit 1; }
            printf '%s' "$TF_VAR_ml_image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
              || { echo "::error::${PROFILE} requires an immutable sha256 ML image digest"; exit 1; }
          fi
          terraform plan "${plan_args[@]}" -out="tfplan-${PROFILE}"
          # The human-readable rendering redacts sensitive values itself and
          # never prints root variables at all.
          terraform show -no-color "tfplan-${PROFILE}" > "remote-plan-${PROFILE}.txt"
          # SECRET HYGIENE: `terraform show -json` does NOT redact `sensitive = true`
          # ROOT VARIABLES -- TF_VAR_auth0_management_client_secret would appear
          # verbatim in the top-level `variables` block of the artifact uploaded
          # below, on every push to main and every same-repo pull request that
          # touches `deploy/aws/**`. The raw document is written to a name
          # that is never uploaded, sanitised, and deleted.
          terraform show -json "tfplan-${PROFILE}" > plan-raw.json
          python "${GITHUB_WORKSPACE}/scripts/release/sanitize_terraform_plan_json.py" \
            plan-raw.json "remote-plan-${PROFILE}.json"
          rm -f plan-raw.json
          # The binary plan is NOT uploaded by this workflow: it embeds every
          # root variable value and nothing here consumes it. Only the reviewed
          # promotion workflow ships a binary plan, and only because its apply
          # must replay that exact plan.
          sha256sum \
            "remote-plan-${PROFILE}.txt" \
            "remote-plan-${PROFILE}.json" > "remote-plan-${PROFILE}.sha256"

      # check_terraform_plan_policy.py reads the plan JSON and emits the
      # canonical artifacts/profile-resource-inventory.json; check_cost_model.py
      # consumes that inventory. Neither exit status is swallowed.
      - name: Validate plan JSON against policy and cost model
        working-directory: ${{ github.workspace }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          plan_json="${TF_DIR}/remote-plan-${PROFILE}.json"
          test -s "${plan_json}"
          mkdir -p artifacts
          python scripts/release/check_terraform_plan_policy.py \
            --profile "${PROFILE}" \
            --plan-json "${plan_json}" \
            | tee "artifacts/plan-policy-report-${PROFILE}.txt"
          test -s artifacts/profile-resource-inventory.json
          # The numeric cost ceiling only exists for profiles that declare a
          # `budget` in the canonical policy data; asking for one where none is
          # declared is a usage error, not a cost failure.
          if python -c "import os, yaml; p = (yaml.safe_load(open('config/deployment_profiles.yaml')) or {}).get('profiles') or {}; raise SystemExit(0 if (p.get(os.environ['PROFILE']) or {}).get('budget') else 1)"; then
            python scripts/release/check_cost_model.py \
              --profile "${PROFILE}" \
              --inventory artifacts/profile-resource-inventory.json \
              --out-dir "artifacts/cost-${PROFILE}" \
              | tee "artifacts/cost-model-report-${PROFILE}.txt"
          else
            echo "::notice title=No cost budget::${PROFILE} declares no budget in config/deployment_profiles.yaml; no numeric ceiling to enforce." \
              | tee "artifacts/cost-model-report-${PROFILE}.txt"
          fi
          sha256sum \
            artifacts/profile-resource-inventory.json \
            "artifacts/plan-policy-report-${PROFILE}.txt" \
            "artifacts/cost-model-report-${PROFILE}.txt" \
            > "artifacts/plan-validation-${PROFILE}.sha256"

      - name: Upload immutable remote-plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-remote-plan-${{ matrix.profile }}-${{ inputs.expected_commit_sha || github.sha }}
          path: |
            ${{ env.TF_DIR }}/remote-plan-${{ matrix.profile }}.txt
            ${{ env.TF_DIR }}/remote-plan-${{ matrix.profile }}.json
            ${{ env.TF_DIR }}/remote-plan-${{ matrix.profile }}.sha256
            artifacts/profile-resource-inventory.json
            artifacts/plan-policy-report-${{ matrix.profile }}.txt
            artifacts/cost-model-report-${{ matrix.profile }}.txt
            artifacts/plan-validation-${{ matrix.profile }}.sha256
            artifacts/cost-${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 30

  # Retained deliberately after the automatic apply was deleted. It gates the
  # explicit post-delivery remote-plan dispatch, whose inputs bind the plan to
  # the exact immutable release manifest that was just published.
  require-production-credentials:
    name: Require Reviewed Remote Plans Before Promotion
    needs: [remote-plan-readiness, plan, remote-plan]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce credentialed remote plans
        if: always()
        env:
          READINESS_RESULT: ${{ needs.remote-plan-readiness.result }}
          CONFIGURED: ${{ needs.remote-plan-readiness.outputs.configured }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REMOTE_PLAN_RESULT: ${{ needs.remote-plan.result }}
        run: |
          set -euo pipefail
          if [ "$READINESS_RESULT" != 'success' ]; then
            echo "::error::Remote Terraform plan credential readiness did not complete successfully (result: $READINESS_RESULT)."
            exit 1
          fi
          if [ "$CONFIGURED" != 'true' ]; then
            echo '::error::Production promotion requires the complete remote Terraform planning credential set.'
            exit 1
          fi
          if [ "$PLAN_RESULT" != 'success' ]; then
            echo "::error::Terraform configuration plan matrix did not pass (result: $PLAN_RESULT)."
            exit 1
          fi
          if [ "$REMOTE_PLAN_RESULT" != 'success' ]; then
            echo "::error::Remote Terraform plan matrix did not pass (result: $REMOTE_PLAN_RESULT)."
            exit 1
          fi
