      - name: Bootstrap run-scoped rehearsal tenants and API keys
        run: |
          set -euo pipefail
          test -n "${ALB_DNS_NAME:-}" || { echo '::error::wake apply did not expose an ALB hostname'; exit 1; }
          test -n "${STAGING_ADMIN_API_KEY:-}" || { echo '::error::STAGING_ADMIN_API_KEY was not passed from the verified admin step'; exit 1; }
          mkdir -p artifacts/rehearsal
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request, uuid

          base = f"https://{os.environ['ALB_DNS_NAME']}"
          tenant_pattern = re.compile(r"[A-Za-z0-9_-]{1,128}\Z")
          marker_path = "artifacts/rehearsal/bootstrap-marker.json"
          marker = {"run_scoped": True, "tenant_ids": []}

          def save_marker():
              with open(marker_path, "w", encoding="utf-8") as handle:
                  json.dump(marker, handle, indent=2)

          def call(method, path, body=None, expect=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(base + path, data=data, method=method)
              request.add_header("Accept", "application/json")
              request.add_header("X-API-Key", os.environ["STAGING_ADMIN_API_KEY"])
              if data:
                  request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status, payload = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, payload = error.code, error.read()
              if expect is not None and status not in expect:
                  sys.exit(f"::error::{method} {path} returned {status}; expected {sorted(expect)}")
              try:
                  return status, json.loads(payload or b"{}")
              except ValueError:
                  return status, {}

          def extract(node, *names):
              if not isinstance(node, dict):
                  return None
              for name in names:
                  value = node.get(name)
                  if value:
                      return value
              for nested_name in ("data", "tenant"):
                  nested = node.get(nested_name)
                  value = extract(nested, *names)
                  if value:
                      return value
              return None

          def create_tenant(label):
              _, payload = call("POST", "/v1/admin/tenants", body={
                  "name": f"Aether staging {label} {os.environ['GITHUB_RUN_ID']}",
                  "plan": "free",
                  "contact_email": f"aether-staging-{label.lower()}-{uuid.uuid4().hex}@staging.invalid",
                  "settings": {"lifecycle": "run-scoped-rehearsal"},
              }, expect={200, 201})
              tenant_id = extract(payload, "tenant_id", "id")
              if not isinstance(tenant_id, str) or not tenant_pattern.fullmatch(tenant_id):
                  sys.exit(f"::error::admin tenant bootstrap returned no valid tenant id for {label}")
              marker["tenant_ids"].append(tenant_id)
              save_marker()
              return tenant_id

          def create_key(tenant_id, label, permissions):
              _, payload = call("POST", f"/v1/admin/tenants/{tenant_id}/api-keys", body={
                  "name": f"staging-rehearsal-{label.lower()}-{os.environ['GITHUB_RUN_ID']}",
                  "tier": "free",
                  "permissions": permissions,
              }, expect={200, 201})
              key = extract(payload, "api_key")
              if not isinstance(key, str) or not re.fullmatch(r"ak_[A-Za-z0-9]{24}", key):
                  sys.exit(f"::error::admin key bootstrap returned no valid key for {label}")
              print(f"::add-mask::{key}")
              return key

          save_marker()
          mine_id = create_tenant("Primary")
          mine_key = create_key(mine_id, "Primary", [
              "read", "write", "ingest", "analytics", "analytics:export",
              "consent:manage", "billing",
          ])
          peer_id = create_tenant("Isolation")
          peer_key = create_key(peer_id, "Isolation", ["read"])
          if mine_id == peer_id:
              sys.exit("::error::run-scoped rehearsal tenants must be distinct")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"REHEARSAL_TENANT_API_KEY={mine_key}\n")
              env.write(f"ISOLATION_PEER_API_KEY={peer_key}\n")
              env.write(f"REHEARSAL_TENANT_ID={mine_id}\n")
              env.write(f"ISOLATION_PEER_TENANT_ID={peer_id}\n")
          print(f"bootstrapped run-scoped tenants {mine_id} and {peer_id}")
          PY

      - name: Create the isolated rehearsal tenant and verify tenant isolation
        run: |
          set -euo pipefail
          test -n "${REHEARSAL_TENANT_API_KEY:-}" \
            || { echo '::error::run-scoped rehearsal API key was not bootstrapped'; exit 1; }
          test -n "${ISOLATION_PEER_API_KEY:-}" \
            || { echo '::error::run-scoped isolation API key was not bootstrapped'; exit 1; }
          mkdir -p artifacts/rehearsal
          python - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request, uuid

          base = f"https://{os.environ['ALB_DNS_NAME']}"

          def call(method, path, key=None, body=None, expect=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method)
              req.add_header("Accept", "application/json")
              if data:
                  req.add_header("Content-Type", "application/json")
              if key:
                  req.add_header("X-API-Key", key)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status, payload = resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  status, payload = exc.code, exc.read()
              if expect is not None and status not in expect:
                  sys.exit(f"::error::{method} {path} returned {status}, expected one of {expect}")
              try:
                  return status, json.loads(payload or b"{}")
              except ValueError:
                  return status, {}

          # The public registration path is exercised end to end. In the current
          # backend contract it is POST /v1/tenants and may return a pending,
          # contained tenant; the data-plane tenant is the dedicated rehearsal
          # credential below, so no registration response is trusted as a key.
          _registration_status, registration = call("POST", "/v1/tenants", body={
              "name": "Aether staging rehearsal",
              "contact_email": f"rehearsal-{uuid.uuid4().hex}@staging.invalid",
              "plan_tier": "alpha",
              "settings": {"lifecycle": "run-scoped-rehearsal"},
          }, expect={200, 201})
          # Persist only a secret-free marker and a narrowly validated tenant ID.
          # Never upload the registration response: it may contain user fields,
          # tokens, or other provider-controlled data. Cleanup runs in a later
          # always() step and must still be able to remove this temporary tenant
          # when a subsequent isolation assertion fails.
          registration_node = registration.get("data", registration)
          registration_tenant_id = registration_node.get("tenant_id") or (registration_node.get("tenant") or {}).get("tenant_id")
          registration_user = registration_node.get("user") or {}
          registration_tenant_id = registration_tenant_id or registration_user.get("tenant_id") or (registration_user.get("tenant") or {}).get("tenant_id")
          if registration_tenant_id is not None:
              if not isinstance(registration_tenant_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", registration_tenant_id):
                  sys.exit("::error::registration response exposed an invalid tenant_id; refusing unsafe cleanup")
          json.dump({"registration_completed": True, "tenant_id": registration_tenant_id},
                    open("artifacts/rehearsal/registration-marker.json", "w"))

          _, mine = call("GET", "/v1/me", key=os.environ["REHEARSAL_TENANT_API_KEY"], expect={200})
          _, peer = call("GET", "/v1/me", key=os.environ["ISOLATION_PEER_API_KEY"], expect={200})

          def tenant_id(payload):
              node = payload.get("data", payload)
              value = node.get("tenant_id") or node.get("tenant", {}).get("tenant_id")
              if not value:
                  sys.exit("::error::/v1/me does not expose a tenant_id")
              return value

          mine_id, peer_id = tenant_id(mine), tenant_id(peer)
          if mine_id == peer_id:
              sys.exit("::error::the rehearsal tenant and the isolation peer are the same tenant")

          # Cross-tenant read must be refused, not silently empty.
          status, _ = call("GET", f"/v1/consent/records/{peer_id}", key=os.environ["REHEARSAL_TENANT_API_KEY"])
          if status == 200:
              sys.exit("::error::tenant isolation breach: peer tenant records are readable")
          if status not in (401, 403, 404):
              sys.exit(f"::error::cross-tenant read returned an unexpected {status}")

          # Unauthenticated access is refused (fail-closed).
          call("GET", "/v1/me", expect={401, 403})

          json.dump({"tenant_id": mine_id, "peer_tenant_id": peer_id,
                     "registration_completed": True},
                    open("artifacts/rehearsal/tenant.json", "w"))
          print(f"isolated rehearsal tenant {mine_id}, peer {peer_id}")
          PY

      - name: Capability checks (auth, consent, ingestion, queue, graph, analytics, ML)
        run: |
          set -euo pipefail
          python scripts/staging_capability_matrix.py --json > artifacts/rehearsal/capability-matrix.json
          python scripts/smoke_test.py \
            --base-url "https://${ALB_DNS_NAME}" \
            --api-key "$REHEARSAL_TENANT_API_KEY" \
            --admin-api-key "$STAGING_ADMIN_API_KEY" \
            --web2 \
            --timeout 20 \
            | tee artifacts/rehearsal/smoke.txt
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request, uuid
          from datetime import datetime, timezone

          base = f"https://{os.environ['ALB_DNS_NAME']}"
          key = os.environ["REHEARSAL_TENANT_API_KEY"]
          results = {}

          def call(method, path, body=None, expect=None, key_override=...):
              api_key = key if key_override is ... else key_override
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method)
              req.add_header("Accept", "application/json")
              if data:
                  req.add_header("Content-Type", "application/json")
              if api_key:
                  req.add_header("X-API-Key", api_key)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status, payload = resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  status, payload = exc.code, exc.read()
              if expect is not None and status not in expect:
                  sys.exit(f"::error::{method} {path} returned {status}, expected one of {expect}")
              try:
                  return status, json.loads(payload or b"{}")
              except ValueError:
                  return status, {}

          # auth — an authenticated identity resolves, an anonymous one does not.
          call("GET", "/v1/me", expect={200})
          call("GET", "/v1/me", expect={401, 403}, key_override=None)
          results["auth"] = "ok"

          # consent / privacy — a consent record round-trips and the retention
          # manifest is served.
          subject = f"rehearsal-{uuid.uuid4().hex}"
          call("POST", "/v1/consent/records", body={
              "user_id": subject, "purposes": ["analytics"], "granted": True,
              "source": "staging-rehearsal",
          }, expect={200, 201})
          call("GET", f"/v1/consent/records/{subject}", expect={200})
          call("GET", "/v1/consent/retention-manifest", expect={200})
          call("POST", "/v1/consent/dsr", body={"user_id": subject, "request_type": "access"},
               expect={200, 201, 202})
          results["consent_privacy"] = "ok"

          # ingestion — the canonical SDK batch accepts a fully enveloped event.
          # The older /v1/sdk/events alias is not a mounted ingestion route and
          # /v1/ingest/feed is a server-side provider-feed contract, not an SDK
          # event envelope.
          event_id = str(uuid.uuid4())
          session_id = f"rehearsal-{uuid.uuid4().hex}"
          sent_at = datetime.now(timezone.utc).isoformat()
          call("POST", "/v1/batch", body={
              "batch": [{
                  "id": event_id, "type": "page_view", "timestamp": sent_at,
                  "sessionId": session_id, "anonymousId": session_id,
                  "userId": subject,
                  "properties": {"run": os.environ["GITHUB_RUN_ID"]},
                  "context": {
                      "schemaVersion": "1.0.0", "surface": "web",
                      "sequence": {"number": 1},
                  },
              }],
              "sentAt": sent_at,
              "consents": ["analytics"],
          }, expect={200, 201, 202})
          results["ingestion"] = "ok"

          # queue / worker — the consolidated lean-worker must drain the event the
          # ingestion call enqueued, so it becomes queryable within the window.
          deadline = time.time() + 300
          drained = False
          while time.time() < deadline:
              status, payload = call("POST", "/v1/analytics/events/query",
                                     body={"session_id": session_id, "limit": 1})
              payload_blob = json.dumps(payload)
              if status == 200 and (event_id in payload_blob or session_id in payload_blob):
                  drained = True
                  break
              time.sleep(15)
          if not drained:
              sys.exit("::error::the lean-worker execution group did not drain the ingested event")
          results["queue_worker"] = "ok"

          # graph — exercise the canonical capability discovery and the
          # tenant-scoped universal query contract. There is no public
          # /v1/graph/observations route; tenant graph writes are produced by
          # the ingestion/projector path and must not be faked by the rehearsal.
          call("GET", "/v1/graph/capabilities", expect={200})
          call("POST", "/v1/graph/query", body={
              "tenant_id": os.environ["REHEARSAL_TENANT_ID"],
              "anchors": [], "depth": 1, "limit": 10,
          }, expect={200})
          results["graph"] = "ok"

          # analytics / materialisation.
          call("GET", "/v1/analytics/dashboard/summary", expect={200})
          results["analytics"] = "ok"

          # inline ML — staging runs remote_ml: false, so serving is in-process.
          call("GET", "/v1/ml/models", expect={200})
          # The gateway list endpoint can return registry-only data even when
          # the serving process is absent. Probe the unique /models route from
          # the mounted in-process router as well, so staging proves the inline
          # image path and its auth boundary rather than only proving the model
          # registry is importable.
          call("GET", "/models", expect={200})
          results["inline_ml"] = "ok"

          json.dump(results, open("artifacts/rehearsal/capabilities.json", "w"), indent=2)
          print(json.dumps(results, indent=2))
          PY

      - name: Synthetic-seed exclusion and empty-state checks
        run: |
          set -euo pipefail
          # The staging profile must ship no compiled-in synthetic dataset.
          python scripts/validate_frontend_data_truth.py | tee artifacts/rehearsal/data-truth.txt
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request, uuid

          base = f"https://{os.environ['ALB_DNS_NAME']}"

          def get(path, key):
              req = urllib.request.Request(base + path, method="GET")
              req.add_header("Accept", "application/json")
              req.add_header("X-API-Key", key)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  return exc.code, {}
              except ValueError:
                  return 200, {}

          # A subject this environment has never seen must come back empty, not
          # seeded: a demo/synthetic seed in staging would answer with data.
          unknown = uuid.uuid4().hex
          status, payload = get(f"/v1/consent/records/{unknown}",
                                os.environ["REHEARSAL_TENANT_API_KEY"])
          if status == 200:
              node = payload.get("data", payload)
              records = node if isinstance(node, list) else node.get("records") or []
              if records:
                  sys.exit("::error::empty-state violated: an unknown subject returned records")
          elif status not in (204, 404):
              sys.exit(f"::error::empty-state probe returned {status}")

          blob = json.dumps(payload).lower()
          for marker in ("demo", "synthetic", "sample-tenant", "lorem"):
              if marker in blob:
                  sys.exit(f"::error::staging response carries a synthetic-seed marker: {marker}")
          print("synthetic-seed exclusion and empty-state confirmed")
          PY

      - name: Baseline load test
        run: |
          set -euo pipefail
          python scripts/load_smoke.py \
            --host "https://${ALB_DNS_NAME}" \
            --api-key "$REHEARSAL_TENANT_API_KEY" \
            --users 10 \
            --duration 60 \
            --json-out artifacts/rehearsal/load.json \
            | tee artifacts/rehearsal/load.txt

      - name: Failure and retry checks
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request, uuid
          from datetime import datetime, timezone

          base = f"https://{os.environ['ALB_DNS_NAME']}"
          key = os.environ["REHEARSAL_TENANT_API_KEY"]

          def call(method, path, body=None, headers=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method)
              req.add_header("Accept", "application/json")
              req.add_header("X-API-Key", key)
              if data:
                  req.add_header("Content-Type", "application/json")
              for name, value in (headers or {}).items():
                  req.add_header(name, value)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.code, json.loads(exc.read() or b"{}")
                  except ValueError:
                      return exc.code, {}

          # A malformed payload must be rejected as a client error, never as a 5xx.
          now = datetime.now(timezone.utc).isoformat()
          status, _ = call("POST", "/v1/batch", body={
              "batch": "not-a-list", "sentAt": now,
          })
          if status >= 500:
              sys.exit(f"::error::malformed batch produced a server error ({status})")
          if status < 400:
              sys.exit(f"::error::malformed batch was accepted ({status})")

          # A retried write with the same event id must be idempotent, not doubled.
          event_id = str(uuid.uuid4())
          session_id = f"retry-{uuid.uuid4().hex}"
          payload = {
              "batch": [{
                  "id": event_id, "type": "page_view", "timestamp": now,
                  "sessionId": session_id, "anonymousId": session_id,
                  "properties": {"run": os.environ["GITHUB_RUN_ID"]},
                  "context": {
                      "schemaVersion": "1.0.0", "surface": "web",
                      "sequence": {"number": 1},
                  },
              }],
              "sentAt": now,
              "consents": ["analytics"],
          }
          first, _first_body = call("POST", "/v1/batch", body=payload)
          second, second_body = call("POST", "/v1/batch", body=payload)
          if first >= 400:
              sys.exit(f"::error::first retry-probe write failed ({first})")
          if second >= 500:
              sys.exit(f"::error::retried write produced a server error ({second})")
          if int(second_body.get("duplicates", 0) or 0) < 1:
              sys.exit("::error::retried write was not reported as a duplicate")
          print(f"failure/retry checks passed (malformed={status}, retry={first}/{second})")
          PY

      - name: Rollback rehearsal
        run: |
          set -euo pipefail
          # Guard hard: this step mutates a running service, and only the staging
          # cluster may ever be touched by it.
          test "$STAGING_CLUSTER" = "AETHER-staging" \
            || { echo '::error::rollback rehearsal refused outside the staging cluster'; exit 1; }
          service="AETHER-${STAGING_ENV}-backend"
          current="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "$service" \
            --query 'services[0].taskDefinition' --output text)"
          test -n "$current" && test "$current" != None \
            || { echo "::error::backend service ${service} has no current task definition"; exit 1; }
          family="${current%:*}"
          revision="${current##*:}"
          case "$revision" in
            ''|*[!0-9]*) echo "::error::backend service task definition ${current} has an invalid revision"; exit 1 ;;
          esac
          if [ "$revision" -le 1 ]; then
            # The first approved staging deployment has no prior revision.
            # Record that rollback is not applicable rather than failing a
            # healthy first run or pretending that a rollback occurred.
            printf 'status=not_applicable\nreason=first approved staging revision; no earlier task definition exists\ncurrent=%s\n' \
              "$current" > artifacts/rehearsal/rollback.txt
            echo '::notice::rollback rehearsal not applicable for the first approved staging revision'
            exit 0
          fi
          previous="${family}:$((revision - 1))"
          aws ecs describe-task-definition --task-definition "$previous" >/dev/null \
            || { echo "::error::previous task definition ${previous} is not available for rollback"; exit 1; }

          rolled_back=false
          restore_current() {
            if [ "$rolled_back" != true ]; then
              return 0
            fi
            echo "restoring reviewed task definition ${current}"
            if ! aws ecs update-service --cluster "$STAGING_CLUSTER" --service "$service" \
              --task-definition "$current" >/dev/null; then
              echo '::error::roll-forward update failed while restoring the reviewed task definition'
              return 1
            fi
            if ! aws ecs wait services-stable --cluster "$STAGING_CLUSTER" --services "$service"; then
              echo '::error::roll-forward service never became stable while restoring the reviewed task definition'
              return 1
            fi
            restored="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "$service" \
              --query 'services[0].taskDefinition' --output text)"
            if [ "$restored" != "$current" ]; then
              echo "::error::roll-forward restored ${restored}, not ${current}"
              return 1
            fi
            rolled_back=false
            return 0
          }
          on_exit() {
            status=$?
            if [ "$rolled_back" = true ]; then
              restore_current || status=1
            fi
            exit "$status"
          }
          trap on_exit EXIT

          aws ecs update-service --cluster "$STAGING_CLUSTER" --service "$service" \
            --task-definition "$previous" >/dev/null
          rolled_back=true
          aws ecs wait services-stable --cluster "$STAGING_CLUSTER" --services "$service"
          rolled="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "$service" \
            --query 'services[0].taskDefinition' --output text)"
          test "$rolled" = "$previous" || { echo "::error::rollback did not take effect"; exit 1; }
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://${ALB_DNS_NAME}/v1/health")"
          test "$status" = 200 || { echo "::error::rolled-back revision is unhealthy (${status})"; exit 1; }
          # Roll forward to the reviewed release revision and prove it is restored.
          restore_current
          trap - EXIT
          printf 'rolled_back_to=%s\nrestored=%s\n' "$previous" "$restored" \
            > artifacts/rehearsal/rollback.txt

      - name: Collect logs, metrics, plans, test output and cost
        if: always()
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/rehearsal
          if ! services_raw="$(aws ecs list-services --cluster "$STAGING_CLUSTER" \
            --query 'serviceArns[]' --output text)"; then
            echo '::error::unable to enumerate staging ECS services; evidence is incomplete'
            exit 1
          fi
          mapfile -t services < <(printf '%s' "$services_raw" | tr '\t' '\n' | sed '/^$/d')
          test "${#services[@]}" -gt 0 || {
            echo '::error::staging ECS service enumeration returned no services; evidence is incomplete'; exit 1;
          }
          aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "${services[@]}" \
            > artifacts/rehearsal/ecs-services.json
          aws logs describe-log-groups --log-group-name-prefix "/ecs/${STAGING_CLUSTER}" \
            > artifacts/rehearsal/log-groups.json
          aws cloudwatch list-metrics --namespace AETHER \
            > artifacts/rehearsal/metrics.json
          cp -f "${RUNNER_TEMP}/release/release.json" artifacts/rehearsal/release.json
          python scripts/release/check_cost_model.py \
            --profile "$PROFILE" \
            --inventory artifacts/profile-resource-inventory.json \
            --out-dir "artifacts/rehearsal/cost" \
            > artifacts/rehearsal/cost.txt 2>&1

      - name: Delete or expire the rehearsal tenant
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s artifacts/rehearsal/bootstrap-marker.json ] && [ ! -s artifacts/rehearsal/registration-marker.json ]; then
            echo 'no run-scoped tenant was created; nothing to remove'
            exit 0
          fi
          test -n "${STAGING_ADMIN_API_KEY:-}" \
            || { echo '::error::verified STAGING_ADMIN_API_KEY is unavailable for run-scoped tenant cleanup'; exit 1; }
          python - <<'PY'
          import json, os, re, subprocess, sys

          pattern = re.compile(r"[A-Za-z0-9_-]{1,128}\Z")
          ids = []
          bootstrap = "artifacts/rehearsal/bootstrap-marker.json"
          if os.path.exists(bootstrap):
              marker = json.load(open(bootstrap, encoding="utf-8"))
              if marker.get("run_scoped") is not True or not isinstance(marker.get("tenant_ids"), list):
                  sys.exit("::error::bootstrap marker is not a trusted run-scoped marker; refusing tenant cleanup")
              ids.extend(marker["tenant_ids"])
          registration = "artifacts/rehearsal/registration-marker.json"
          if os.path.exists(registration):
              value = json.load(open(registration, encoding="utf-8")).get("tenant_id")
              if value:
                  ids.append(value)
          unique = []
          for value in ids:
              if not isinstance(value, str) or not pattern.fullmatch(value):
                  sys.exit("::error::tenant marker contains an invalid id; refusing unsafe cleanup")
              if value not in unique:
                  unique.append(value)
          if not unique:
              print("no validated run-scoped tenant ids were recorded; refusing to guess")
              raise SystemExit(0)
          failures = []
          base = f"https://{os.environ['ALB_DNS_NAME']}"
          def request(method, path):
              response = os.path.join(
                  "artifacts/rehearsal",
                  "cleanup-" + path.rsplit("/", 1)[-1] + ".json",
              )
              completed = subprocess.run([
                  "curl", "-sS", "-o", response, "-w", "%{http_code}", "-X", method,
                  "-H", f"X-API-Key: {os.environ['STAGING_ADMIN_API_KEY']}", base + path,
              ], check=False, capture_output=True, text=True)
              if completed.returncode != 0:
                  return None, None, f"curl exit {completed.returncode}"
              try:
                  body = json.load(open(response, encoding="utf-8"))
              except (OSError, ValueError):
                  body = None
              return completed.stdout.strip(), body, None

          for tenant_id in unique:
              status, payload, error = request("DELETE", f"/v1/admin/tenants/{tenant_id}")
              if error:
                  failures.append(f"{tenant_id}: delete {error}")
                  continue
              deleted = ((payload or {}).get("data") or {}).get("deleted") or {}
              if status == "200" and deleted.get("cleanup_complete") is True:
                  print(f"run-scoped rehearsal tenant {tenant_id} deleted")
                  continue
              if status in {"200", "204"}:
                  failures.append(
                      f"{tenant_id}: delete returned {status} without a verified cleanup_complete receipt"
                  )
                  continue
              delete_status = status
              print(f"delete returned {delete_status}; falling back to deactivation")
              status, payload, error = request("POST", f"/v1/admin/tenants/{tenant_id}/deactivate")
              if error:
                  failures.append(f"{tenant_id}: deactivation {error}")
                  continue
              deactivated = (payload or {}).get("data") or {}
              if status != "200" or deactivated.get("status") != "inactive":
                  failures.append(f"{tenant_id}: delete returned {delete_status}, deactivation returned {status}")
                  continue
              if "api_keys_revoked" not in deactivated or "keys_evicted" not in deactivated:
                  failures.append(
                      f"{tenant_id}: deactivation returned no credential-invalidation receipt"
                  )
                  continue
              print(f"run-scoped rehearsal tenant {tenant_id} expired")
          if failures:
              sys.exit("::error::run-scoped rehearsal cleanup incomplete; all tenants were attempted: " + "; ".join(failures))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-rehearsal-${{ github.run_id }}
          path: artifacts/rehearsal
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Phase 6 — FAIL-SAFE SLEEP. Runs under always(): staging returns to `asleep`
  # even when the wake, migrations, smoke, load, rollback or evidence phases
  # failed. It reports, but never repairs, the original failure: the `outcome`
  # job below re-raises it so the run still ends red.
  # ---------------------------------------------------------------------------
  sleep:
    name: Fail-safe sleep (always)
    needs: [select-profile, amplify-preflight, wake-plan, wake-validate, wake-apply, rehearse]
    if: always() && needs.select-profile.outputs.plan_sleep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      cleanup_result: ${{ steps.report.outputs.cleanup_result }}
      residual_tasks: ${{ steps.residual.outputs.residual_tasks }}
      residual_task_arns: ${{ steps.residual.outputs.residual_task_arns }}
      standalone_tasks: ${{ steps.residual.outputs.standalone_tasks }}
      residual_cost_usd_per_hour: ${{ steps.residual.outputs.residual_cost_usd_per_hour }}
      manual_intervention_required: ${{ steps.report.outputs.manual_intervention_required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sleep-phase dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Record the validation result being cleaned up after
        id: upstream
        env:
          WAKE_PLAN_RESULT: ${{ needs.wake-plan.result }}
          WAKE_VALIDATE_RESULT: ${{ needs.wake-validate.result }}
          WAKE_APPLY_RESULT: ${{ needs.wake-apply.result }}
          REHEARSE_RESULT: ${{ needs.rehearse.result }}
        run: |
          set -euo pipefail
          validation_result=success
          for result in "$WAKE_PLAN_RESULT" "$WAKE_VALIDATE_RESULT" "$WAKE_APPLY_RESULT" "$REHEARSE_RESULT"; do
            case "$result" in
              failure|cancelled|timed_out) validation_result=failure ;;
            esac
          done
          echo "validation_result=${validation_result}" >> "$GITHUB_OUTPUT"
          echo "cleaning up after validation_result=${validation_result}"

      - name: Skip the reviewed sleep plan only when staging is provably at zero
        id: already
        run: |
          set -euo pipefail
          # FAIL CLOSED. `mapfile -t x < <(cmd)` does not observe cmd's exit
          # status -- `pipefail` does not reach into a process substitution --
          # so an API error, a throttle or an expired credential used to yield an
          # empty array that read as "already asleep", skipping the reviewed
          # sleep plan, the sleep apply AND the last-resort cost stop. The step
          # is called "provably at zero": unprovable must never be proven. The
          # AWS call is therefore run on its own, its status checked, and its
          # stderr kept.
          if ! services_raw="$(aws ecs list-services --cluster "$STAGING_CLUSTER" \
            --query 'serviceArns[]' --output text)"; then
            echo '::error::could not enumerate staging ECS services; staging state is UNKNOWN and must not be treated as asleep'
            echo 'asleep=unknown' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mapfile -t services < <(printf '%s' "$services_raw" | tr '\t' '\n' | sed '/^$/d')
          if [ "${#services[@]}" -eq 0 ]; then
            nonzero=0
            echo 'staging exposes no ECS services; checking for standalone ECS tasks before declaring zero'
          else
            if ! nonzero="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "${services[@]}" \
              --query 'length(services[?desiredCount>`0`])' --output text)"; then
              echo '::error::could not describe staging ECS services; staging state is UNKNOWN and must not be treated as asleep'
              echo 'asleep=unknown' >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          case "$nonzero" in
            ''|*[!0-9]*)
              echo "::error::staging desired-count query returned '${nonzero}', not a count; treating staging state as UNKNOWN"
              echo 'asleep=unknown' >> "$GITHUB_OUTPUT"
              exit 1 ;;
          esac
          if [ "$nonzero" = 0 ]; then
            if ! aws ecs list-tasks --cluster "$STAGING_CLUSTER" --desired-status RUNNING \
              --query 'taskArns[]' --output json > "${RUNNER_TEMP}/staging-running-tasks.json"; then
              echo '::error::could not enumerate standalone staging tasks; staging state is UNKNOWN and must not be treated as asleep'
              echo 'asleep=unknown' >> "$GITHUB_OUTPUT"
              exit 1
            fi
            running_tasks="$(jq 'length' "${RUNNER_TEMP}/staging-running-tasks.json")"
            if [ "$running_tasks" = 0 ]; then
              echo 'asleep=true' >> "$GITHUB_OUTPUT"
            else
              echo 'asleep=false' >> "$GITHUB_OUTPUT"
              echo "staging has ${running_tasks} running or pending task(s); a reviewed sleep path is required"
            fi
          else
            echo 'asleep=false' >> "$GITHUB_OUTPUT"
          fi
          echo "services with a non-zero desired count: ${nonzero}"

      - name: Generate the reviewed sleep plan
        id: sleep-plan
        if: steps.already.outputs.asleep != 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN || github.token }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          ML_IMAGE_DIGEST: ${{ inputs.ml_image_digest }}
          BACKEND_IMAGE_DIGEST: ${{ needs.wake-plan.outputs.backend_image_digest || inputs.backend_image_digest }}
          STAGING_SECRETS_KMS_KEY_ARN: ${{ inputs.staging_secrets_kms_key_arn }}
          PROMOTE_TIMEOUT_MINUTES: ${{ inputs.promote_timeout_minutes }}
          EXPECTED_COMMIT_SHA: ${{ inputs.intended_release_sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" \
            || { echo '::error::no GitHub Actions token is available to dispatch the reviewed promotion workflow'; exit 1; }
          reconcile_staging_state() {
            local secret_names="$1"
            local reconcile_workflow=staging-state-reconcile.yml
            local reconcile_output reconcile_run_id reconcile_status reconcile_conclusion
            local reconcile_wait_deadline
            local -a reconcile_args
            reconcile_args=(
              -f staging_amplify_domain_name=staging.olympuslabsml.com
              -f repair_staging_amplify_subdomains=REPAIR-STAGING-AMPLIFY
              -f confirm_staging_import=IMPORT-STAGING
              -f backend_image_digest="$BACKEND_IMAGE_DIGEST"
              -f expected_commit_sha="$EXPECTED_COMMIT_SHA"
            )
            if [ -n "$secret_names" ]; then
              test -n "$STAGING_SECRETS_KMS_KEY_ARN" || {
                echo '::error::staging_secrets_kms_key_arn is required for pilot sleep-plan state reconciliation'; exit 1;
              }
              reconcile_args+=(
                -f staging_secret_names="$secret_names"
                -f staging_secrets_kms_key_arn="$STAGING_SECRETS_KMS_KEY_ARN"
                -f migrate_legacy_secret_kms=true
                -f confirm_legacy_secret_kms=MIGRATE-STAGING-SECRETS
              )
            fi
            reconcile_output="$(gh workflow run "$reconcile_workflow" --ref "$REF_NAME" "${reconcile_args[@]}" 2>&1)"
            printf '%s\n' "$reconcile_output"
            reconcile_run_id="$(printf '%s\n' "$reconcile_output" \
              | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | tail -n 1)"
            test -n "$reconcile_run_id" || {
              echo "::error::${reconcile_workflow} dispatch did not return its created run URL; refusing ambiguous correlation"
              exit 1
            }
            reconcile_wait_deadline="$(( $(date -u +%s) + PROMOTE_TIMEOUT_MINUTES * 60 ))"
            while :; do
              reconcile_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${reconcile_run_id}" --jq '.status')"
              if [ "$reconcile_status" = completed ]; then
                reconcile_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${reconcile_run_id}" --jq '.conclusion')"
                test "$reconcile_conclusion" = success || {
                  echo "::error::${reconcile_workflow} run ${reconcile_run_id} concluded ${reconcile_conclusion}"; exit 1;
                }
                echo "${reconcile_workflow} run ${reconcile_run_id} completed successfully"
                break
              fi
              if [ "$(date -u +%s)" -ge "$reconcile_wait_deadline" ]; then
                echo "::error::${reconcile_workflow} run ${reconcile_run_id} exceeded ${PROMOTE_TIMEOUT_MINUTES} minutes"
                exit 1
              fi
              sleep 20
            done
          }
          if [ "$DEPLOYMENT_LANE" = pilot ]; then
            reconcile_staging_state 'stripe-price-alpha,stripe-price-beta,stripe-price-gamma,stripe-price-delta'
          else
            reconcile_staging_state ''
          fi
          dispatch_output="$(gh workflow run "$PROMOTE_WORKFLOW" --ref "$REF_NAME" \
            -f profile="$STAGING_PROFILE" \
            -f action=plan \
            -f deployment_lane="$DEPLOYMENT_LANE" \
            -f staging_state=asleep \
            -f secret_preflight_required=false \
            -f backend_image_digest="$BACKEND_IMAGE_DIGEST" \
            -f ml_image_digest="$ML_IMAGE_DIGEST" \
            -f expected_commit_sha="$EXPECTED_COMMIT_SHA" 2>&1)"
          printf '%s\n' "$dispatch_output"
          run_id="$(printf '%s\n' "$dispatch_output" \
            | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | tail -n 1)"
          test -n "$run_id" || {
            echo '::error::reviewed sleep plan dispatch did not return its created run URL; refusing ambiguous correlation'
            exit 1
          }
          wait_deadline="$(( $(date -u +%s) + PROMOTE_TIMEOUT_MINUTES * 60 ))"
          conclusion=''
          while :; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
              break
            fi
            if [ "$(date -u +%s)" -ge "$wait_deadline" ]; then
              echo "::error::reviewed sleep plan ${run_id} did not finish within ${PROMOTE_TIMEOUT_MINUTES}m"
              exit 1
            fi
            sleep 20
          done
          if [ "$conclusion" != success ]; then
            echo "::error::reviewed sleep plan ${run_id} concluded ${conclusion}"
            exit 1
          fi
          printf 'plan_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.sleep-plan.outputs.plan_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.sleep-plan.outputs.plan_run_id }}
          pattern: terraform-plan-${{ needs.select-profile.outputs.profile }}-*
          path: ${{ runner.temp }}/reviewed-sleep-plan
          merge-multiple: true

      - name: Verify the reviewed sleep plan and assert the asleep shape
        id: sleep-verify
        if: steps.sleep-plan.outputs.plan_run_id != ''
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          EXPECTED_STATE: asleep
          EXPECTED_COMMIT_SHA: ${{ inputs.intended_release_sha || github.sha }}
        run: |
          set -euo pipefail
          plan_dir="${RUNNER_TEMP}/reviewed-sleep-plan"
          cd "$plan_dir"
          for artefact in \
            reviewed.tfplan reviewed.tfplan.json reviewed.tfplan.txt \
            reviewed.tfplan.sha256 reviewed.commit reviewed.profile \
            reviewed.deployment-lane \
            reviewed.terraform-version reviewed.lock.sha256 reviewed.state-key \
            reviewed.state-bucket reviewed.state-lock-table \
            reviewed.created-utc reviewed.expires-utc reviewed.resources.json \
            reviewed.policy.txt reviewed.cost.txt reviewed.staging-state
          do
            test -s "$artefact" || { echo "::error::reviewed sleep plan is missing ${artefact}"; exit 1; }
          done
          test "$(cat reviewed.profile)" = "$PROFILE"
          test "$(cat reviewed.deployment-lane)" = "$DEPLOYMENT_LANE" \
            || { echo "::error::reviewed sleep plan lane $(cat reviewed.deployment-lane) is not ${DEPLOYMENT_LANE}"; exit 1; }
          test "$(cat reviewed.state-key)" = "profiles/${PROFILE}/terraform.tfstate"
          reviewed_state_bucket="$(cat reviewed.state-bucket)"
          reviewed_state_lock_table="$(cat reviewed.state-lock-table)"
          printf '%s' "$reviewed_state_bucket" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo '::error::reviewed sleep plan records an invalid state bucket'; exit 1; }
          printf '%s' "$reviewed_state_lock_table" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo '::error::reviewed sleep plan records an invalid state lock table'; exit 1; }
          test "$(cat reviewed.staging-state)" = "$EXPECTED_STATE" \
            || { echo "::error::reviewed sleep plan records staging_state $(cat reviewed.staging-state), not ${EXPECTED_STATE}"; exit 1; }
          sha256sum --check --status reviewed.tfplan.sha256
          reviewed_commit="$(cat reviewed.commit)"
          printf '%s' "$reviewed_commit" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::reviewed.commit is not a 40-character commit sha'; exit 1; }
          test "$reviewed_commit" = "$EXPECTED_COMMIT_SHA" \
            || { echo "::error::reviewed sleep plan commit ${reviewed_commit} is not expected commit ${EXPECTED_COMMIT_SHA}"; exit 1; }
          created_epoch="$(date -u -d "$(cat reviewed.created-utc)" +%s)"
          expires_epoch="$(date -u -d "$(cat reviewed.expires-utc)" +%s)"
          if [ "$((expires_epoch - created_epoch))" -gt 86400 ]; then
            echo '::error::reviewed sleep plan claims a validity window longer than 24 hours'
            exit 1
          fi
          if [ "$(date -u +%s)" -ge "$expires_epoch" ]; then
            echo '::error::reviewed sleep plan has already expired'
            exit 1
          fi
          checksum="$(sha256sum reviewed.tfplan | cut -d' ' -f1)"
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts
          python scripts/release/check_terraform_plan_policy.py \
            --profile "$PROFILE" \
            --plan-json "${plan_dir}/reviewed.tfplan.json" \
            | tee artifacts/sleep-plan-policy.txt
          PLAN_JSON="${plan_dir}/reviewed.tfplan.json" python - <<'PY'
          import json, os, sys, yaml

          profile = os.environ["PROFILE"]
          state = os.environ["EXPECTED_STATE"]
          env = os.environ["STAGING_ENV"]
          runtime = (yaml.safe_load(open("config/runtime_deployment.yaml")) or {}).get("profiles") or {}
          pcfg = runtime.get(profile) or {}
          services = pcfg.get("services")
          if not isinstance(services, dict) or not services:
              sys.exit(f"::error::runtime_deployment.yaml profile {profile} has no services mapping")
          states = (pcfg.get("staging_state") or {}).get("states") or {}
          multiplier = (states.get(state) or {}).get("desired_count_multiplier")
          if multiplier is None:
              sys.exit(f"::error::runtime_deployment.yaml declares no desired_count_multiplier for {state}")

          def ecs_name(key: str) -> str:
              return f"AETHER-{env}-{'backend' if key == 'api' else key}"

          expected = {ecs_name(k): int(v.get("desired_count", 0)) * int(multiplier)
                      for k, v in services.items()}
          if any(expected.values()):
              sys.exit(f"::error::the asleep shape is not all-zero: {expected}")

          plan = json.load(open(os.environ["PLAN_JSON"]))

          def walk(module):
              for res in module.get("resources") or []:
                  yield res
              for child in module.get("child_modules") or []:
                  yield from walk(child)

          root = (plan.get("planned_values") or {}).get("root_module") or {}
          actual, autoscaling, scheduled = {}, {}, []
          for res in walk(root):
              values = res.get("values") or {}
              if res.get("type") == "aws_ecs_service":
                  actual[values.get("name")] = values.get("desired_count")
              if res.get("type") == "aws_appautoscaling_target":
                  autoscaling[values.get("resource_id")] = values.get("min_capacity")
              if res.get("type") in ("aws_scheduler_schedule", "aws_cloudwatch_event_rule"):
                  if values.get("state") not in ("DISABLED",) and values.get("is_enabled") is not False:
                      scheduled.append(values.get("name"))

          if actual != expected:
              sys.exit(f"::error::planned ECS desired counts {actual} != pinned {state} shape {expected}")
          for target, minimum in autoscaling.items():
              if minimum not in (0, None):
                  sys.exit(f"::error::asleep plan leaves an autoscaling floor of {minimum} on {target}")
          print(f"asleep shape confirmed: {actual}; scheduled rules still enabled: {scheduled}")
          PY
          printf 'plan_checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Apply the exact reviewed sleep plan
        id: sleep-apply
        if: needs.select-profile.outputs.apply_sleep == 'true' && steps.sleep-verify.outputs.plan_checksum != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN || github.token }}
          PLAN_RUN_ID: ${{ steps.sleep-plan.outputs.plan_run_id }}
          PLAN_CHECKSUM: ${{ steps.sleep-verify.outputs.plan_checksum }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          PROMOTE_TIMEOUT_MINUTES: ${{ inputs.promote_timeout_minutes }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" \
            || { echo '::error::no GitHub Actions token is available to dispatch the reviewed promotion workflow'; exit 1; }
          test -n "$PLAN_RUN_ID" || { echo '::error::no verified sleep plan_run_id'; exit 1; }
          test -n "$PLAN_CHECKSUM" || { echo '::error::no verified sleep plan_checksum'; exit 1; }
          dispatch_output="$(gh workflow run "$PROMOTE_WORKFLOW" --ref "$REF_NAME" \
            -f profile="$STAGING_PROFILE" \
            -f action=apply \
            -f deployment_lane="$DEPLOYMENT_LANE" \
            -f secret_preflight_required=false \
            -f plan_run_id="$PLAN_RUN_ID" \
            -f plan_checksum="$PLAN_CHECKSUM" 2>&1)"
          printf '%s\n' "$dispatch_output"
          run_id="$(printf '%s\n' "$dispatch_output" \
            | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | tail -n 1)"
          test -n "$run_id" || {
            echo '::error::dispatched reviewed sleep apply did not return its created run URL; refusing ambiguous correlation'
            exit 1
          }
          wait_deadline="$(( $(date -u +%s) + PROMOTE_TIMEOUT_MINUTES * 60 ))"
          conclusion=''
          while :; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
              break
            fi
            if [ "$(date -u +%s)" -ge "$wait_deadline" ]; then
              echo "::error::reviewed sleep apply ${run_id} did not finish within ${PROMOTE_TIMEOUT_MINUTES}m"
              exit 1
            fi
            sleep 20
          done
          printf 'conclusion=%s\n' "$conclusion" >> "$GITHUB_OUTPUT"
          if [ "$conclusion" != success ]; then
            echo "::warning::reviewed sleep apply ${run_id} concluded ${conclusion}; the last-resort cost stop will run"
          fi

      # Last resort, and only when the reviewed sleep did not land: scale the
      # staging services to zero directly so cost stops now. This is a reduction
      # only — it can never provision anything — and the next reviewed sleep plan
      # reconciles Terraform state to the same zero.
      - name: Last-resort cost stop (scale staging to zero)
        id: last-resort
        if: >-
          always()
          && needs.select-profile.outputs.apply_sleep == 'true'
          && steps.already.outputs.asleep != 'true'
          && steps.sleep-apply.outputs.conclusion != 'success'
        run: |
          set -euo pipefail
          test "$STAGING_CLUSTER" = "AETHER-staging" \
            || { echo '::error::last-resort cost stop refused outside the staging cluster'; exit 1; }
          # Fail closed: an unreadable service list means the cost stop did not
          # happen, and a green step here would claim it did.
          if ! services_raw="$(aws ecs list-services --cluster "$STAGING_CLUSTER" \
            --query 'serviceArns[]' --output text)"; then
            echo '::error::could not enumerate staging ECS services; the last-resort cost stop did not run'
            exit 1
          fi
          mapfile -t services < <(printf '%s' "$services_raw" | tr '\t' '\n' | sed '/^$/d')
          stopped=0
          for service in "${services[@]:-}"; do
            test -n "$service" || continue
            aws ecs update-service --cluster "$STAGING_CLUSTER" --service "$service" \
              --desired-count 0 >/dev/null
            stopped=$((stopped + 1))
            echo "::warning::scaled ${service} to 0 outside Terraform; state must be reconciled"
          done
          task_stop_count=0
          if ! task_arns_raw="$(aws ecs list-tasks --cluster "$STAGING_CLUSTER" \
            --desired-status RUNNING --query 'taskArns[]' --output text)"; then
            echo '::error::could not enumerate staging ECS tasks; the last-resort cost stop did not complete'
            exit 1
          fi
          mapfile -t task_arns < <(printf '%s' "$task_arns_raw" | tr '\t' '\n' | sed '/^$/d')
          for task_arn in "${task_arns[@]:-}"; do
            test -n "$task_arn" || continue
            aws ecs stop-task --cluster "$STAGING_CLUSTER" --task "$task_arn" \
              --reason 'staging reviewed sleep apply failed' >/dev/null
            task_stop_count=$((task_stop_count + 1))
            echo "::warning::stopped residual ${task_arn} outside Terraform; state must be reconciled"
          done
          printf 'scaled_to_zero=%s\n' "$stopped" >> "$GITHUB_OUTPUT"
          printf 'tasks_stopped=%s\n' "$task_stop_count" >> "$GITHUB_OUTPUT"

      - name: Verify zero desired counts and no residual staging compute
        id: residual
        if: always() && needs.select-profile.outputs.apply_sleep == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/sleep
          echo '[]' > artifacts/sleep/desired-counts.json
          residual_tasks=unknown
          zero_ok=true
          # FAIL CLOSED, twice over. This step reports whether staging is at
          # zero; an AWS call it could not make proves nothing, and used to be
          # swallowed into `zero_ok=true`. Neither the service enumeration nor
          # the autoscaling query may fail silently. This step does NOT exit
          # early: it must reach the report step so the run ends red with the
          # reason on the summary, rather than red with no disclosure.
          if services_raw="$(aws ecs list-services --cluster "$STAGING_CLUSTER" \
            --query 'serviceArns[]' --output text)"; then
            mapfile -t services < <(printf '%s' "$services_raw" | tr '\t' '\n' | sed '/^$/d')
            residual_tasks=0
            if [ "${#services[@]}" -gt 0 ]; then
              if aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "${services[@]}" \
                --query 'services[].{name:serviceName,desired:desiredCount,running:runningCount,pending:pendingCount}' \
                --output json > artifacts/sleep/desired-counts.json; then
                nonzero="$(python -c "import json;d=json.load(open('artifacts/sleep/desired-counts.json'));print(sum(1 for s in d if s['desired'] or s['running'] or s['pending']))")"
                residual_tasks="$(python -c "import json;d=json.load(open('artifacts/sleep/desired-counts.json'));print(sum(s['running']+s['pending'] for s in d))")"
                if [ "$nonzero" != 0 ]; then
                  zero_ok=false
                  echo "::error::${nonzero} staging service(s) are still non-zero after sleep"
                fi
              else
                zero_ok=false
                residual_tasks=unknown
                echo '[]' > artifacts/sleep/desired-counts.json
                echo '::error::could not describe staging ECS services; residual staging compute is UNKNOWN and must not be reported as zero'
              fi
            fi
          else
            zero_ok=false
            echo '::error::could not enumerate staging ECS services; residual staging compute is UNKNOWN and must not be reported as zero'
          fi
          # Nothing may be left scheduled or autoscaled back up either. The
          # ResourceId is matched on the EXACT cluster: `contains()` would match
          # any cluster in the account-wide ECS autoscaling namespace whose name
          # merely contains this one.
          if aws application-autoscaling describe-scalable-targets --service-namespace ecs \
            --query "ScalableTargets[?starts_with(ResourceId, 'service/${STAGING_CLUSTER}/')].{id:ResourceId,min:MinCapacity}" \
            --output json > artifacts/sleep/autoscaling.json; then
            floors="$(python -c "import json;d=json.load(open('artifacts/sleep/autoscaling.json'));print(sum(1 for t in d if t.get('min',0)))")"
            if [ "$floors" != 0 ]; then
              zero_ok=false
              echo "::error::${floors} staging autoscaling target(s) still hold a non-zero floor"
            fi
          else
            zero_ok=false
            echo '[]' > artifacts/sleep/autoscaling.json
            echo '::error::could not read staging autoscaling targets; an autoscaling floor could revive staging and cannot be ruled out'
          fi
          residual_task_arns=unknown
          standalone_tasks=unknown
          if aws ecs list-tasks --cluster "$STAGING_CLUSTER" --desired-status RUNNING \
            --output json > artifacts/sleep/running-task-arns.json; then
            mapfile -t task_arns < <(jq -r '.taskArns[]?' artifacts/sleep/running-task-arns.json)
            residual_task_arns="${#task_arns[@]}"
            if [ "$residual_task_arns" -gt 0 ]; then
              if aws ecs describe-tasks --cluster "$STAGING_CLUSTER" --tasks "${task_arns[@]}" \
                --output json > artifacts/sleep/running-tasks.json; then
                standalone_tasks="$(jq '[.tasks[] | select(((.group // "") | startswith("service:")) | not)] | length' artifacts/sleep/running-tasks.json)"
                zero_ok=false
                echo "::error::${residual_task_arns} ECS task(s) remain running or pending after sleep (${standalone_tasks} standalone)"
              else
                standalone_tasks=unknown
                zero_ok=false
                echo '::error::could not describe residual ECS tasks; staging compute is UNKNOWN and must not be reported as zero'
              fi
            else
              echo '[]' > artifacts/sleep/running-tasks.json
              standalone_tasks=0
            fi
          else
            zero_ok=false
            echo '[]' > artifacts/sleep/running-task-arns.json
            echo '::error::could not enumerate residual ECS tasks; staging compute is UNKNOWN and must not be reported as zero'
          fi
          # Residual cost, priced from the canonical price book rather than a guess.
          RESIDUAL_JSON=artifacts/sleep/desired-counts.json python - <<'PY'
          import json, os, yaml
          book = (yaml.safe_load(open("config/aws_price_book.yaml")) or {})
          ecs = ((book.get("usage_variable_resources") or {}).get("aws_ecs_service")
                 or (book.get("fixed_resources") or {}).get("aws_ecs_service") or {})
          vcpu_hour = float(ecs.get("vcpu_hour", 0.04048))
          gb_hour = float(ecs.get("gb_hour", 0.004445))
          runtime = (yaml.safe_load(open("config/runtime_deployment.yaml")) or {}).get("profiles") or {}
          services = (runtime.get(os.environ["STAGING_PROFILE"]) or {}).get("services") or {}
          sizes = {f"AETHER-{os.environ['STAGING_ENV']}-{'backend' if k == 'api' else k}":
                   (float(v.get("cpu", 1024)), float(v.get("memory", 2048)))
                   for k, v in services.items()}
          hourly = 0.0
          for svc in json.load(open(os.environ["RESIDUAL_JSON"])):
              cpu, memory = sizes.get(svc["name"], (1024.0, 2048.0))
              tasks = max(svc["desired"], svc["running"] + svc["pending"])
              hourly += tasks * (cpu / 1024.0 * vcpu_hour + memory / 1024.0 * gb_hour)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"residual_cost_usd_per_hour={hourly:.4f}\n")
          print(f"estimated residual staging compute cost: ${hourly:.4f}/hour")
          PY
          {
            printf 'residual_tasks=%s\n' "$residual_tasks"
            printf 'residual_task_arns=%s\n' "$residual_task_arns"
            printf 'standalone_tasks=%s\n' "$standalone_tasks"
            printf 'zero_ok=%s\n' "$zero_ok"
          } >> "$GITHUB_OUTPUT"

      - name: Close the awake lease
        if: always() && needs.select-profile.outputs.apply_sleep == 'true'
        run: |
          set -euo pipefail
          # Only an explicit ParameterNotFound is a benign already-closed
          # lease. AccessDenied, throttling, and other AWS failures must stay
          # visible so cleanup cannot report success while state is unknown.
          delete_output="$(mktemp)"
          if aws ssm delete-parameter --name "$AWAKE_LEASE_PARAM" >"$delete_output" 2>&1; then
            echo 'awake lease removed'
          elif grep -q 'ParameterNotFound' "$delete_output"; then
            echo 'no awake lease to close'
          else
            cat "$delete_output"
            echo '::error::could not remove the staging awake lease; cleanup state is unknown'
            rm -f "$delete_output"
            exit 1
          fi
          rm -f "$delete_output"

      - name: Report cleanup outcome
        id: report
        if: always()
        env:
          VALIDATION_RESULT: ${{ steps.upstream.outputs.validation_result }}
          APPLY_SLEEP: ${{ needs.select-profile.outputs.apply_sleep }}
          ALREADY_ASLEEP: ${{ steps.already.outputs.asleep }}
          SLEEP_APPLY_CONCLUSION: ${{ steps.sleep-apply.outputs.conclusion }}
          SCALED_TO_ZERO: ${{ steps.last-resort.outputs.scaled_to_zero }}
          RESIDUAL_TASKS: ${{ steps.residual.outputs.residual_tasks }}
          RESIDUAL_TASK_ARNS: ${{ steps.residual.outputs.residual_task_arns }}
          STANDALONE_TASKS: ${{ steps.residual.outputs.standalone_tasks }}
          RESIDUAL_COST: ${{ steps.residual.outputs.residual_cost_usd_per_hour }}
          ZERO_OK: ${{ steps.residual.outputs.zero_ok }}
        run: |
          set -euo pipefail
          cleanup_result=success
          manual=false
          if [ "${APPLY_SLEEP:-false}" != true ]; then
            cleanup_result=not_applied
            echo '::notice::sleep plan verified; plan-sleep does not mutate staging or close the awake lease'
          fi
          # `zero_ok` is only true when an AWS call actually PROVED staging is at
          # zero. An absent or false value (a skipped step, a failed step, an
          # unreadable API) is a failure, never a pass.
          if [ "${APPLY_SLEEP:-false}" = true ] && [ "${ZERO_OK:-false}" != true ]; then
            cleanup_result=failure
            manual=true
          fi
          # The same rule for the pre-sleep state probe: `unknown` is not `true`.
          if [ "${APPLY_SLEEP:-false}" = true ] && [ "${ALREADY_ASLEEP:-unknown}" = unknown ]; then
            cleanup_result=failure
            manual=true
            echo '::error::staging was never proven to be at zero before the sleep phase ran'
          fi
          if [ "${APPLY_SLEEP:-false}" = true ] && [ "${ALREADY_ASLEEP:-false}" != true ] && [ "${SLEEP_APPLY_CONCLUSION:-}" != success ]; then
            cleanup_result=degraded
            manual=true
          fi
          if [ "${APPLY_SLEEP:-false}" = true ] && [ -n "${SCALED_TO_ZERO:-}" ] && [ "${SCALED_TO_ZERO:-0}" -gt 0 ]; then
            manual=true
          fi
          {
            echo '### Staging lifecycle cleanup'
            echo
            echo '| field | value |'
            echo '| --- | --- |'
            echo "| validation result | ${VALIDATION_RESULT:-unknown} |"
            echo "| cleanup result | ${cleanup_result} |"
            echo "| sleep mutation requested | ${APPLY_SLEEP:-false} |"
            echo "| staging state before sleep | ${ALREADY_ASLEEP:-unknown} |"
            echo "| staging proven at zero after sleep | ${ZERO_OK:-false} |"
            echo "| reviewed sleep apply | ${SLEEP_APPLY_CONCLUSION:-not-dispatched} |"
            echo "| services force-scaled to zero | ${SCALED_TO_ZERO:-0} |"
            echo "| residual running/pending tasks | ${RESIDUAL_TASKS:-unknown} |"
            echo "| residual ECS task ARNs | ${RESIDUAL_TASK_ARNS:-not-run} |"
            echo "| residual standalone tasks | ${STANDALONE_TASKS:-not-run} |"
            echo "| estimated residual cost | \$${RESIDUAL_COST:-unknown}/hour |"
            echo "| manual intervention required | ${manual} |"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'cleanup_result=%s\n' "$cleanup_result"
            printf 'manual_intervention_required=%s\n' "$manual"
          } >> "$GITHUB_OUTPUT"
          if [ "$manual" = true ]; then
            echo "::error::staging cleanup needs manual intervention (cleanup_result=${cleanup_result}, residual_tasks=${RESIDUAL_TASKS:-unknown})"
            exit 1
          fi

      - name: Build the checksummed evidence bundle
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/sleep
          (cd artifacts && find . -type f ! -name 'evidence.sha256' -print0 \
            | sort -z | xargs -0 sha256sum > evidence.sha256)
          sha256sum artifacts/evidence.sha256 > artifacts/evidence.sha256.sha256
          cat artifacts/evidence.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-lifecycle-evidence-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Phase 7 — re-raise the original failure. The fail-safe sleep above must never
  # turn a failed rehearsal green, so this gate fails whenever ANY phase failed,
  # including the cleanup itself.
  # ---------------------------------------------------------------------------
  outcome:
    name: Lifecycle outcome (never masks a failure)
    needs: [select-profile, amplify-preflight, wake-plan, wake-validate, preflight-rehearsal-inputs, wake-apply, rehearse, sleep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-raise any phase failure
        env:
          SELECT_RESULT: ${{ needs.select-profile.result }}
          AMPLIFY_PREFLIGHT_RESULT: ${{ needs.amplify-preflight.result }}
          WAKE_PLAN_RESULT: ${{ needs.wake-plan.result }}
          WAKE_VALIDATE_RESULT: ${{ needs.wake-validate.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight-rehearsal-inputs.result }}
          WAKE_APPLY_RESULT: ${{ needs.wake-apply.result }}
          REHEARSE_RESULT: ${{ needs.rehearse.result }}
          SLEEP_RESULT: ${{ needs.sleep.result }}
          CLEANUP_RESULT: ${{ needs.sleep.outputs.cleanup_result }}
          RESIDUAL_TASKS: ${{ needs.sleep.outputs.residual_tasks }}
          RESIDUAL_TASK_ARNS: ${{ needs.sleep.outputs.residual_task_arns }}
          RESIDUAL_COST: ${{ needs.sleep.outputs.residual_cost_usd_per_hour }}
          MANUAL_INTERVENTION: ${{ needs.sleep.outputs.manual_intervention_required }}
          APPLY_SLEEP: ${{ needs.select-profile.outputs.apply_sleep }}
        run: |
          set -euo pipefail
          failed=()
          for phase in select-profile:"$SELECT_RESULT" amplify-preflight:"$AMPLIFY_PREFLIGHT_RESULT" wake-plan:"$WAKE_PLAN_RESULT" \
                       wake-validate:"$WAKE_VALIDATE_RESULT" preflight-rehearsal-inputs:"$PREFLIGHT_RESULT" \
                       wake-apply:"$WAKE_APPLY_RESULT" \
                       rehearse:"$REHEARSE_RESULT" sleep:"$SLEEP_RESULT"
          do
            case "${phase##*:}" in
              failure|cancelled|timed_out) failed+=("$phase") ;;
            esac
          done
          {
            echo '### Staging lifecycle outcome'
            echo
            echo "- cleanup result: ${CLEANUP_RESULT:-not-run}"
            echo "- residual running tasks: ${RESIDUAL_TASKS:-unknown}"
            echo "- residual ECS task ARNs: ${RESIDUAL_TASK_ARNS:-not-run}"
            echo "- estimated residual cost: \$${RESIDUAL_COST:-unknown}/hour"
            echo "- manual intervention required: ${MANUAL_INTERVENTION:-unknown}"
            echo "- failed phases: ${failed[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::staging lifecycle failed in: ${failed[*]}"
            exit 1
          fi
          if [ "${APPLY_SLEEP:-false}" = true ]; then
            echo 'staging lifecycle completed and staging is asleep'
          else
            echo 'staging sleep plan completed; staging was not mutated'
          fi
