name: Staging lifecycle (wake / validate / sleep)

# Staging is a wake-for-validation environment: it exists only for the duration
# of a rehearsal and must return to `asleep` afterwards, even when the rehearsal
# fails. See config/deployment_profiles.yaml -> profiles.staging.behavior.
#
# THIS WORKFLOW NEVER RUNS `terraform apply` ITSELF.
# .github/workflows/terraform-promote.yml is the sole sanctioned apply path. Every
# infrastructure mutation here is a `workflow_dispatch` of that workflow, so the
# immutable reviewed-plan guarantees (plan -> checksum -> verify -> apply the exact
# stored plan, per-profile environment approval, distinct plan/apply AWS roles,
# 24h expiry, apply never re-plans) are inherited rather than re-implemented.
# This workflow independently re-verifies the reviewed plan before it dispatches
# an apply, so a compromised or stale plan cannot be promoted through here.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Lifecycle action
        type: choice
        options:
          - plan-wake
          - apply-wake
          - validate
          - plan-sleep
          - apply-sleep
          - full-rehearsal
        default: validate
        required: true
      deployment_lane:
        description: "Staging overlay lane; full preserves the existing rehearsal, pilot provisions complete lean customer staging"
        type: choice
        options: [full, pilot]
        default: full
        required: true
      confirm_runtime_wake:
        description: "Explicitly authorize starting staging ECS services (required for apply-wake/full-rehearsal)"
        type: boolean
        default: false
        required: false
      ml_image_digest:
        description: "Immutable ML serving image digest (sha256:...) — required only for profiles with remote_ml: true"
        type: string
        required: false
      backend_image_digest:
        description: Immutable backend image digest (sha256:...) — ignored when release_run_id is supplied
        type: string
        required: false
      staging_secrets_kms_key_arn:
        description: "Reviewed staging Secrets Manager CMK ARN or alias used by the pilot secret-state reconciliation"
        type: string
        default: "alias/aether-staging-secrets"
        required: false
      release_run_id:
        description: Successful `Immutable delivery` build-only or deployed run holding release.json (required for full-rehearsal)
        type: string
        required: false
      release_manifest_checksum:
        description: Approved sha256 of release.json (required for full-rehearsal)
        type: string
        required: false
      intended_release_sha:
        description: "Merged-main SHA the approved delivery run must contain (defaults to this workflow revision)"
        type: string
        required: false
      plan_run_id:
        description: Reviewed-plan run ID (required for a standalone validate / apply-wake / apply-sleep)
        type: string
        required: false
      plan_checksum:
        description: Approved reviewed.tfplan sha256 (required for a standalone apply-wake / apply-sleep)
        type: string
        required: false
      max_awake_hours:
        description: Awake lease written at wake, in hours (1-8). The TTL guard enforces it.
        type: string
        default: "4"
        required: false
      promote_timeout_minutes:
        description: How long to wait for a dispatched reviewed-promotion run, including its approval
        type: string
        default: "180"
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: staging-lifecycle
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STAGING_PROFILE: staging
  STAGING_ENV: staging
  STAGING_CLUSTER: AETHER-staging
  PROMOTE_WORKFLOW: terraform-promote.yml
  PROMOTE_WORKFLOW_PATH: .github/workflows/terraform-promote.yml
  DELIVERY_WORKFLOW_PATH: .github/workflows/deploy.yml
  AWAKE_LEASE_PARAM: /aether/staging/lifecycle/awake-until
  MAX_AWAKE_HOURS_CAP: "8"
  TF_DIR: deploy/aws/terraform

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — select the staging profile and route the requested action.
  # ---------------------------------------------------------------------------
  select-profile:
    name: Select the staging profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Validate cleanup credentials before any lifecycle path that inspects or
    # mutates staging can dispatch. plan-wake is plan-only and delegates to the
    # reviewed Terraform plan workflow, so it intentionally needs no lifecycle
    # role and remains usable with only plan credentials.
    permissions:
      contents: read
      id-token: write
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      plan_wake: ${{ steps.route.outputs.plan_wake }}
      apply_wake: ${{ steps.route.outputs.apply_wake }}
      do_validate: ${{ steps.route.outputs.do_validate }}
      plan_sleep: ${{ steps.route.outputs.plan_sleep }}
      apply_sleep: ${{ steps.route.outputs.apply_sleep }}
      rehearse: ${{ steps.route.outputs.rehearse }}
      awake_hours: ${{ steps.route.outputs.awake_hours }}
      deployment_lane: ${{ steps.route.outputs.deployment_lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Require merged-main authority
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main || {
            echo '::error::staging lifecycle must be dispatched from merged main'; exit 1;
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lifecycle Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
      - name: Validate lifecycle IAM action contract
        run: python3 scripts/release/check_staging_lifecycle_policy.py

      - name: Resolve the staging profile from canonical configuration
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM_RUNTIME_WAKE: ${{ inputs.confirm_runtime_wake }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane }}
        run: |
          set -euo pipefail
          test -f "${TF_DIR}/profiles/${STAGING_PROFILE}.tfvars" \
            || { echo "::error::no tfvars for profile ${STAGING_PROFILE}"; exit 1; }
          python - <<'PY'
          import os, sys, yaml
          class UniqueLoader(yaml.SafeLoader):
              pass
          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"duplicate YAML key: {key}", key_node.start_mark)
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping
          UniqueLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping)
          profile = os.environ["STAGING_PROFILE"]
          deploy = (yaml.load(open("config/deployment_profiles.yaml"), Loader=UniqueLoader) or {}).get("profiles") or {}
          cfg = deploy.get(profile)
          if not cfg:
              sys.exit(f"::error::config/deployment_profiles.yaml declares no {profile} profile")
          if cfg.get("class") != "staging":
              sys.exit(f"::error::{profile} is not a staging-class profile")
          if not cfg.get("wake_sleep"):
              sys.exit(f"::error::{profile} does not declare wake_sleep: true")
          if not (cfg.get("budget") or {}).get("hard_monthly_spend"):
              sys.exit(f"::error::{profile} declares no hard_monthly_spend budget ceiling")
          runtime = (yaml.load(open("config/runtime_deployment.yaml"), Loader=UniqueLoader) or {}).get("profiles") or {}
          state = ((runtime.get(profile) or {}).get("staging_state") or {}).get("states") or {}
          for required in ("awake", "asleep"):
              if required not in state:
                  sys.exit(f"::error::runtime_deployment.yaml declares no staging_state.{required}")
          print(f"staging profile resolved: {profile}")
          PY

      - name: Validate the requested staging deployment lane
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane }}
        run: |
          set -euo pipefail
          python scripts/release/check_staging_lane_contract.py \
            --profile "$STAGING_PROFILE" \
            --deployment-lane "$DEPLOYMENT_LANE" \
            --check-runtime-wiring

      - name: Preflight lifecycle and apply credentials
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        env:
          ACTION: ${{ inputs.action }}
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          AWS_STAGING_LIFECYCLE_ROLE_ARN: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          CONFIRM_RUNTIME_WAKE: ${{ inputs.confirm_runtime_wake }}
        run: |
          set -euo pipefail
          role="${AWS_STAGING_LIFECYCLE_ROLE_ARN:-}"
          if [ -z "$role" ]; then
            echo '::error::AWS_STAGING_LIFECYCLE_ROLE_ARN is required before any staging lifecycle action; without it cleanup cannot prove zero or stop cost.'
            exit 1
          fi
          case "$role" in
            arn:aws:iam::????????????:role/*) ;;
            *) echo '::error::AWS_STAGING_LIFECYCLE_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
          esac
          case "$ACTION" in
            apply-wake|full-rehearsal)
              test -n "${AWS_TERRAFORM_PLAN_ROLE_ARN:-}" \
                || { echo '::error::AWS_TERRAFORM_PLAN_ROLE_ARN is required before staging IAM policy inspection'; exit 1; }
              case "$AWS_TERRAFORM_PLAN_ROLE_ARN" in
                arn:aws:iam::????????????:role/*) ;;
                *) echo '::error::AWS_TERRAFORM_PLAN_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
              esac
              test -n "${AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN:-}" \
                || { echo '::error::AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN is required before validating staging secret payloads'; exit 1; }
              case "$AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN" in
                arn:aws:iam::????????????:role/*) ;;
                *) echo '::error::AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
              esac
              test -n "${AWS_TERRAFORM_APPLY_ROLE_ARN:-}" \
                || { echo '::error::AWS_TERRAFORM_APPLY_ROLE_ARN is required before a staging apply path'; exit 1; }
              case "$AWS_TERRAFORM_APPLY_ROLE_ARN" in
                arn:aws:iam::????????????:role/*) ;;
                *) echo '::error::AWS_TERRAFORM_APPLY_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
              esac
              ;;
            apply-sleep)
              test -n "${AWS_TERRAFORM_PLAN_ROLE_ARN:-}" \
                || { echo '::error::AWS_TERRAFORM_PLAN_ROLE_ARN is required before staging IAM policy inspection'; exit 1; }
              case "$AWS_TERRAFORM_PLAN_ROLE_ARN" in
                arn:aws:iam::????????????:role/*) ;;
                *) echo '::error::AWS_TERRAFORM_PLAN_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
              esac
              test -n "$AWS_TERRAFORM_APPLY_ROLE_ARN" \
                || { echo '::error::AWS_TERRAFORM_APPLY_ROLE_ARN is required before a staging sleep apply'; exit 1; }
              case "$AWS_TERRAFORM_APPLY_ROLE_ARN" in
                arn:aws:iam::????????????:role/*) ;;
                *) echo '::error::AWS_TERRAFORM_APPLY_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
              esac
              ;;
            plan-sleep)
              test -n "${AWS_TERRAFORM_PLAN_ROLE_ARN:-}" \
                || { echo '::error::AWS_TERRAFORM_PLAN_ROLE_ARN is required before staging IAM policy inspection'; exit 1; }
              case "$AWS_TERRAFORM_PLAN_ROLE_ARN" in
                arn:aws:iam::????????????:role/*) ;;
                *) echo '::error::AWS_TERRAFORM_PLAN_ROLE_ARN is not a concrete IAM role ARN'; exit 1 ;;
              esac
              ;;
          esac
          if { [ "$ACTION" = apply-wake ] || [ "$ACTION" = full-rehearsal ]; } \
            && [ "$CONFIRM_RUNTIME_WAKE" != true ]; then
            echo '::error::runtime wake is disabled by default; set confirm_runtime_wake=true for an explicit staging wake authorization'
            exit 1
          fi

      - name: Configure AWS inspection credentials
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The lifecycle role is intentionally narrow and cannot inspect IAM
          # policy attachments. Keep policy auditing on the separate
          # infrastructure inspection role.
          # AetherStagingPlan is the dedicated read-only inspector for role
          # metadata and Amplify metadata. The lifecycle role must not inspect
          # its own IAM contract, and the shared infrastructure credential is
          # not part of this audit boundary.
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify staging IAM inspection role assumption
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          expected_role_path="${EXPECTED_ROLE_ARN#*:role/}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role_path="$(jq -r .Arn <<<"$caller_json")"
          caller_role_path="${caller_role_path#*:assumed-role/}"
          caller_role_path="${caller_role_path%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::IAM inspection account mismatch'; exit 1; }
          test "$caller_role_path" = "$expected_role_path" || { echo '::error::IAM inspection role does not match AWS_TERRAFORM_PLAN_ROLE_ARN'; exit 1; }
          test "$caller_role_path" = AetherStagingPlan || { echo '::error::IAM inspection must use AetherStagingPlan'; exit 1; }

      - name: Verify effective staging plan IAM contract before dispatch
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        env:
          AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          # The role is externally managed, so the checked-in manifest alone
          # is not proof. Refuse every lifecycle dispatch until the live
          # AetherStagingPlan role covers the exact reviewed contract.
          python scripts/release/verify_effective_staging_apply_policy.py \
            --role-arn "$AWS_TERRAFORM_PLAN_ROLE_ARN" \
            --manifest config/staging_plan_iam_policy.yaml \
            --supplemental-manifest config/terraform_plan_state_access_policy.yaml \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-lock-table "$TF_LOCK_TABLE" \
            --state-profile staging \
            --expected-role AetherStagingPlan \
            --required-policy-suffix AetherStagingPlanContract

      - name: Verify effective lifecycle IAM policy before dispatch
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        env:
          TARGET_ROLE_ARN: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
        run: |
          set -euo pipefail
          python scripts/release/verify_effective_staging_lifecycle_policy.py --role-arn "$TARGET_ROLE_ARN"

      - name: Verify lifecycle role assumption before dispatch
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        env:
          AWS_STAGING_LIFECYCLE_ROLE_ARN: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm lifecycle credentials are usable
        if: inputs.action != 'validate' && inputs.action != 'plan-wake'
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
        run: |
          set -euo pipefail
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          expected_role_path="${EXPECTED_ROLE_ARN#*:role/}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role_path="$(jq -r .Arn <<<"$caller_json")"
          caller_role_path="${caller_role_path#*:assumed-role/}"
          caller_role_path="${caller_role_path%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::assumed lifecycle role account does not match AWS_STAGING_LIFECYCLE_ROLE_ARN'; exit 1; }
          test "$caller_role_path" = "$expected_role_path" || { echo '::error::assumed role does not match AWS_STAGING_LIFECYCLE_ROLE_ARN'; exit 1; }
          test "$caller_role_path" = AetherStagingLifecycle || { echo '::error::lifecycle job assumed an unexpected IAM role'; exit 1; }
          echo 'Verified lifecycle credentials resolve to AetherStagingLifecycle in the expected account.'

      - name: Configure AWS secret preflight credentials
        if: inputs.action == 'apply-wake' || inputs.action == 'full-rehearsal'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify secret preflight role assumption and policy
        if: inputs.action == 'apply-wake' || inputs.action == 'full-rehearsal'
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_STAGING_SECRET_PREFLIGHT_ROLE_ARN }}
        run: |
          set -euo pipefail
          python scripts/release/check_staging_secret_preflight_policy.py
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role="$(jq -r .Arn <<<"$caller_json")"
          caller_role="${caller_role#*:assumed-role/}"
          caller_role="${caller_role%/*}"
          test "$caller_account" = "$expected_account" || { echo '::error::secret preflight account mismatch'; exit 1; }
          test "$caller_role" = AetherStagingSecretPreflight || { echo '::error::unexpected secret preflight role'; exit 1; }
      - name: Verify ECS-mounted staging secret payloads before dispatch
        if: inputs.action == 'apply-wake' || inputs.action == 'full-rehearsal'
        env:
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane }}
        run: |
          set -euo pipefail
          python scripts/release/check_staging_secret_payload_contract.py \
            --lane "$DEPLOYMENT_LANE"

      - name: Route the lifecycle action
        id: route
        env:
          ACTION: ${{ inputs.action }}
          MAX_AWAKE_HOURS: ${{ inputs.max_awake_hours }}
          PROMOTE_TIMEOUT_MINUTES: ${{ inputs.promote_timeout_minutes }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_MANIFEST_CHECKSUM: ${{ inputs.release_manifest_checksum }}
          INTENDED_RELEASE_SHA: ${{ inputs.intended_release_sha || github.sha }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_CHECKSUM: ${{ inputs.plan_checksum }}
          ML_IMAGE_DIGEST: ${{ inputs.ml_image_digest }}
          DEPLOYMENT_LANE: ${{ inputs.deployment_lane }}
        run: |
          set -euo pipefail
          plan_wake=false
          apply_wake=false
          do_validate=false
          plan_sleep=false
          apply_sleep=false
          rehearse=false
          case "$ACTION" in
            plan-wake)      plan_wake=true ;;
            validate)       do_validate=true ;;
            apply-wake)     do_validate=true; apply_wake=true ;;
            plan-sleep)     plan_sleep=true ;;
            apply-sleep)    plan_sleep=true; apply_sleep=true ;;
            full-rehearsal) plan_wake=true; do_validate=true; apply_wake=true
                            rehearse=true; plan_sleep=true; apply_sleep=true ;;
            *) echo "::error::unknown lifecycle action '${ACTION}'"; exit 1 ;;
          esac

          # Dedicated remote-ML profiles need an immutable ML digest. Inline-ML
          # profiles (including staging) intentionally have no serving image.
          if [ "$plan_wake" = true ] || [ "$plan_sleep" = true ]; then
            remote_ml="$(python - <<'PY'
          import os, yaml
          profiles = (yaml.safe_load(open("config/runtime_deployment.yaml")) or {}).get("profiles") or {}
          print(str((profiles.get(os.environ["STAGING_PROFILE"]) or {}).get("remote_ml", False)).lower())
          PY
            )"
            if [ "$remote_ml" = true ]; then
              test -n "$ML_IMAGE_DIGEST" \
                || { echo '::error::ml_image_digest is required for profiles with remote_ml: true'; exit 1; }
            elif [ -n "$ML_IMAGE_DIGEST" ]; then
              echo "Inline-ML profile $STAGING_PROFILE ignores the optional ML digest."
            fi
          fi
          # Validating or applying without producing a plan here means an existing
          # reviewed plan must be named explicitly.
          if [ "$do_validate" = true ] && [ "$plan_wake" = false ]; then
            test -n "$PLAN_RUN_ID" \
              || { echo '::error::plan_run_id is required when no wake plan is produced in this run'; exit 1; }
          fi
          if [ "$apply_wake" = true ] && [ "$plan_wake" = false ]; then
            test -n "$PLAN_CHECKSUM" \
              || { echo '::error::plan_checksum is required for a standalone apply-wake'; exit 1; }
          fi
          if [ "$rehearse" = true ]; then
            test -n "$RELEASE_RUN_ID" \
              || { echo '::error::release_run_id is required for full-rehearsal'; exit 1; }
            test -n "$RELEASE_MANIFEST_CHECKSUM" \
              || { echo '::error::release_manifest_checksum is required for full-rehearsal'; exit 1; }
          fi

          case "$MAX_AWAKE_HOURS" in
            ''|*[!0-9]*) echo "::error::max_awake_hours must be a whole number of hours"; exit 1 ;;
          esac
          if [ "$MAX_AWAKE_HOURS" -lt 1 ] || [ "$MAX_AWAKE_HOURS" -gt "$MAX_AWAKE_HOURS_CAP" ]; then
            echo "::error::max_awake_hours ${MAX_AWAKE_HOURS} is outside 1..${MAX_AWAKE_HOURS_CAP}"
            exit 1
          fi
          case "$PROMOTE_TIMEOUT_MINUTES" in
            ''|*[!0-9]*) echo "::error::promote_timeout_minutes must be a whole number of minutes"; exit 1 ;;
          esac

          {
            printf 'profile=%s\n' "$STAGING_PROFILE"
            printf 'plan_wake=%s\n' "$plan_wake"
            printf 'apply_wake=%s\n' "$apply_wake"
            printf 'do_validate=%s\n' "$do_validate"
            printf 'plan_sleep=%s\n' "$plan_sleep"
            printf 'apply_sleep=%s\n' "$apply_sleep"
            printf 'rehearse=%s\n' "$rehearse"
            printf 'awake_hours=%s\n' "$MAX_AWAKE_HOURS"
            printf 'deployment_lane=%s\n' "$DEPLOYMENT_LANE"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Full-lane rehearsals require a pre-existing durable admin key before wake.
  # Pilot rehearsals establish or resume that key only after migrations and
  # runtime readiness, using the one-time token and durable marker. Run-scoped
  # tenant/isolation keys are created only after that handoff.
  # ---------------------------------------------------------------------------
  amplify-preflight:
    name: Verify Amplify app ownership and current-head artifacts
    needs: [select-profile]
    if: >-
      needs.select-profile.result == 'success'
      && (needs.select-profile.outputs.plan_wake == 'true' || needs.select-profile.outputs.plan_sleep == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-terraform
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure AWS read credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify all staging Amplify apps and current-head jobs
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.intended_release_sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/release/check_amplify_app_contract.py \
            --mode staging \
            --expected-commit "$EXPECTED_COMMIT_SHA" \
            --wait-for-current-job \
            --job-timeout-seconds 900 \
            --job-poll-seconds 15
      - name: Verify production status provenance and branch stage
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.intended_release_sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/release/check_amplify_app_contract.py \
            --mode production-status \
            --expected-commit "$EXPECTED_COMMIT_SHA" \
            --wait-for-current-job \
            --job-timeout-seconds 900 \
            --job-poll-seconds 15

  preflight-rehearsal-inputs:
    name: Preflight full-rehearsal smoke inputs
    needs: [select-profile]
    if: needs.select-profile.outputs.rehearse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    env:
      DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
    steps:
      - name: Require a durable admin key for full-lane rehearsal
        if: inputs.deployment_lane == 'full'
        env:
          STAGING_ADMIN_API_KEY: ${{ secrets.STAGING_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${STAGING_ADMIN_API_KEY:-}" \
            || { echo '::error::STAGING_ADMIN_API_KEY is required as the durable staging admin credential for the full lane'; exit 1; }
          [[ "$STAGING_ADMIN_API_KEY" =~ ^ak_[A-Za-z0-9]{24}$ ]] \
            || { echo '::error::STAGING_ADMIN_API_KEY must be the durable ak_ API key'; exit 1; }
          echo 'Full-lane durable staging admin credential shape is valid.'

  # ---------------------------------------------------------------------------
  # Phase 2 — credentialed wake plan, produced by the reviewed promotion workflow.
  # ---------------------------------------------------------------------------
  wake-plan:
    name: Credentialed wake plan (reviewed promotion)
    needs: [select-profile, amplify-preflight]
    if: needs.select-profile.outputs.plan_wake == 'true' && needs.amplify-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    outputs:
      plan_run_id: ${{ steps.dispatch.outputs.plan_run_id }}
      plan_checksum: ${{ steps.verify.outputs.plan_checksum }}
      reviewed_commit: ${{ steps.verify.outputs.reviewed_commit }}
      backend_image_digest: ${{ steps.release.outputs.backend_image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The wake plan must pin the SAME backend image digest the approved release
      # manifest binds, so applying the plan is itself the delivery of the exact
      # immutable artifact rather than of whatever tag happens to be current.
      - uses: actions/download-artifact@v4
        if: inputs.release_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Resolve the backend image digest from the approved release manifest
        id: release
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_MANIFEST_CHECKSUM: ${{ inputs.release_manifest_checksum }}
          BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
          INTENDED_RELEASE_SHA: ${{ inputs.intended_release_sha || github.sha }}
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_RUN_ID" ]; then
            test -n "$BACKEND_IMAGE_DIGEST" \
              || { echo '::error::supply release_run_id or backend_image_digest'; exit 1; }
            printf 'backend_image_digest=%s\n' "$BACKEND_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          run_path="$(jq -r '.path' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          if [ "$run_path" != "$DELIVERY_WORKFLOW_PATH" ]; then
            echo "::error::release run ${RELEASE_RUN_ID} belongs to ${run_path}, not the delivery workflow"
            exit 1
          fi
          if [ "$run_conclusion" != success ]; then
            echo "::error::release run ${RELEASE_RUN_ID} concluded ${run_conclusion}, not success"
            exit 1
          fi
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100")"
          build_conclusion="$(jq -r '[.jobs[] | select(.name == "Build immutable release once") | .conclusion] | last // "missing"' <<<"$jobs_json")"
          test "$build_conclusion" = success \
            || { echo "::error::release run ${RELEASE_RUN_ID} has no successful immutable build job"; exit 1; }
          test "$run_head_sha" = "$INTENDED_RELEASE_SHA" \
            || { echo "::error::release run ${RELEASE_RUN_ID} head ${run_head_sha} is not intended release ${INTENDED_RELEASE_SHA}"; exit 1; }
          cd "${RUNNER_TEMP}/release"
          test -s release.json || { echo '::error::release run produced no release.json'; exit 1; }
          sha="$(python -c "import json; print(json.load(open('release.json'))['commit_sha'])")"
          test "$sha" = "$INTENDED_RELEASE_SHA" \
            || { echo "::error::release manifest commit ${sha} is not intended release ${INTENDED_RELEASE_SHA}"; exit 1; }
          case "$sha" in
            ''|*[!0-9a-f]*) echo '::error::candidate commit is not a lowercase Git SHA'; exit 1 ;;
          esac
          # The release candidate owns its dependency identity.  Read only its
          # lockfiles so a staging dispatch cannot replace the reviewed
          # workflow/control scripts with an older candidate checkout.
          cd "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin "$sha"
          cd "${RUNNER_TEMP}/release"
          git -C "${GITHUB_WORKSPACE}" show "$sha:package-lock.json" > package-lock.json
          git -C "${GITHUB_WORKSPACE}" show "$sha:pyproject.toml" > pyproject.toml
          python "${GITHUB_WORKSPACE}/scripts/release/release_manifest.py" release.json \
            --expected-sha "$sha" --checksum "$RELEASE_MANIFEST_CHECKSUM"
          python "${GITHUB_WORKSPACE}/scripts/release/release_candidate_adapter.py" --verify \
            --manifest release.json --candidate release-candidate.json \
            --expected-sha "$sha" \
            --lockfile package-lock.json \
            --lockfile pyproject.toml
          digest="$(python -c "import json; print(json.load(open('release.json'))['artifacts']['backend_image']['digest'])")"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::release manifest backend digest is not a sha256 digest"; exit 1 ;;
          esac
          if [ -n "$BACKEND_IMAGE_DIGEST" ] && [ "$BACKEND_IMAGE_DIGEST" != "$digest" ]; then
            echo "::error::backend_image_digest input does not match the approved release manifest"
            exit 1
          fi
          printf 'backend_image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Dispatch the reviewed wake plan and wait for it
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN || github.token }}
          STAGING_STATE: awake
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          BACKEND_IMAGE_DIGEST: ${{ steps.release.outputs.backend_image_digest }}
          STAGING_SECRETS_KMS_KEY_ARN: ${{ inputs.staging_secrets_kms_key_arn }}
          ML_IMAGE_DIGEST: ${{ inputs.ml_image_digest }}
          INTENDED_RELEASE_SHA: ${{ inputs.intended_release_sha || github.sha }}
          PROMOTE_TIMEOUT_MINUTES: ${{ inputs.promote_timeout_minutes }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" \
            || { echo '::error::no GitHub Actions token is available to dispatch the reviewed promotion workflow'; exit 1; }
          reconcile_staging_state() {
            local secret_names="$1"
            local reconcile_workflow=staging-state-reconcile.yml
            local reconcile_output reconcile_run_id reconcile_status reconcile_conclusion
            local reconcile_wait_deadline
            local -a reconcile_args
            reconcile_args=(
              -f staging_amplify_domain_name=staging.olympuslabsml.com
              -f repair_staging_amplify_subdomains=REPAIR-STAGING-AMPLIFY
              -f confirm_staging_import=IMPORT-STAGING
              -f backend_image_digest="$BACKEND_IMAGE_DIGEST"
              -f expected_commit_sha="$INTENDED_RELEASE_SHA"
            )
            if [ -n "$secret_names" ]; then
              test -n "$STAGING_SECRETS_KMS_KEY_ARN" || {
                echo '::error::staging_secrets_kms_key_arn is required for pilot state reconciliation'; exit 1;
              }
              reconcile_args+=(
                -f staging_secret_names="$secret_names"
                -f staging_secrets_kms_key_arn="$STAGING_SECRETS_KMS_KEY_ARN"
                -f migrate_legacy_secret_kms=true
                -f confirm_legacy_secret_kms=MIGRATE-STAGING-SECRETS
              )
            fi
            reconcile_output="$(gh workflow run "$reconcile_workflow" --ref "$REF_NAME" "${reconcile_args[@]}" 2>&1)"
            printf '%s\n' "$reconcile_output"
            reconcile_run_id="$(printf '%s\n' "$reconcile_output" \
              | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | tail -n 1)"
            test -n "$reconcile_run_id" || {
              echo "::error::${reconcile_workflow} dispatch did not return its created run URL; refusing ambiguous correlation"
              exit 1
            }
            reconcile_wait_deadline="$(( $(date -u +%s) + PROMOTE_TIMEOUT_MINUTES * 60 ))"
            while :; do
              reconcile_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${reconcile_run_id}" --jq '.status')"
              if [ "$reconcile_status" = completed ]; then
                reconcile_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${reconcile_run_id}" --jq '.conclusion')"
                test "$reconcile_conclusion" = success || {
                  echo "::error::${reconcile_workflow} run ${reconcile_run_id} concluded ${reconcile_conclusion}"; exit 1;
                }
                echo "${reconcile_workflow} run ${reconcile_run_id} completed successfully"
                break
              fi
              if [ "$(date -u +%s)" -ge "$reconcile_wait_deadline" ]; then
                echo "::error::${reconcile_workflow} run ${reconcile_run_id} exceeded ${PROMOTE_TIMEOUT_MINUTES} minutes"
                exit 1
              fi
              sleep 20
            done
          }
          if [ "$DEPLOYMENT_LANE" = pilot ]; then
            reconcile_staging_state 'stripe-price-alpha,stripe-price-beta,stripe-price-gamma,stripe-price-delta'
          else
            reconcile_staging_state ''
          fi
          dispatch_output="$(gh workflow run "$PROMOTE_WORKFLOW" --ref "$REF_NAME" \
            -f profile="$STAGING_PROFILE" \
            -f action=plan \
            -f deployment_lane="$DEPLOYMENT_LANE" \
            -f staging_state="$STAGING_STATE" \
            -f backend_image_digest="$BACKEND_IMAGE_DIGEST" \
            -f ml_image_digest="$ML_IMAGE_DIGEST" \
            -f expected_commit_sha="$INTENDED_RELEASE_SHA" 2>&1)"
          printf '%s\n' "$dispatch_output"
          run_id="$(printf '%s\n' "$dispatch_output" \
            | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | tail -n 1)"
          test -n "$run_id" || {
            echo '::error::reviewed plan dispatch did not return its created run URL; refusing ambiguous correlation'
            exit 1
          }
          echo "reviewed plan run: ${run_id}"
          wait_deadline="$(( $(date -u +%s) + PROMOTE_TIMEOUT_MINUTES * 60 ))"
          conclusion=''
          while :; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
              break
            fi
            if [ "$(date -u +%s)" -ge "$wait_deadline" ]; then
              echo "::error::reviewed plan run ${run_id} did not finish within ${PROMOTE_TIMEOUT_MINUTES}m"
              exit 1
            fi
            sleep 20
          done
          if [ "$conclusion" != success ]; then
            echo "::error::reviewed plan run ${run_id} concluded ${conclusion}"
            exit 1
          fi
          printf 'plan_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.dispatch.outputs.plan_run_id }}
          pattern: terraform-plan-${{ needs.select-profile.outputs.profile }}-*
          path: ${{ runner.temp }}/reviewed-plan
          merge-multiple: true

      - name: Verify the reviewed wake plan and publish its checksum
        id: verify
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          EXPECTED_STATE: awake
          EXPECTED_COMMIT_SHA: ${{ inputs.intended_release_sha || github.sha }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/reviewed-plan"
          for artefact in \
            reviewed.tfplan reviewed.tfplan.json reviewed.tfplan.txt \
            reviewed.tfplan.sha256 reviewed.commit reviewed.profile \
            reviewed.deployment-lane \
            reviewed.terraform-version reviewed.lock.sha256 reviewed.state-key \
            reviewed.state-bucket reviewed.state-lock-table \
            reviewed.created-utc reviewed.expires-utc reviewed.resources.json \
            reviewed.policy.txt reviewed.cost.txt reviewed.staging-state
          do
            test -s "$artefact" || { echo "::error::reviewed plan is missing ${artefact}"; exit 1; }
          done
          test "$(cat reviewed.profile)" = "$PROFILE"
          test "$(cat reviewed.deployment-lane)" = "$DEPLOYMENT_LANE" \
            || { echo "::error::reviewed plan lane $(cat reviewed.deployment-lane) is not ${DEPLOYMENT_LANE}"; exit 1; }
          test "$(cat reviewed.state-key)" = "profiles/${PROFILE}/terraform.tfstate"
          reviewed_state_bucket="$(cat reviewed.state-bucket)"
          reviewed_state_lock_table="$(cat reviewed.state-lock-table)"
          printf '%s' "$reviewed_state_bucket" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo '::error::reviewed plan records an invalid state bucket'; exit 1; }
          printf '%s' "$reviewed_state_lock_table" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo '::error::reviewed plan records an invalid state lock table'; exit 1; }
          # The shape this run asked terraform-promote to plan. The authoritative
          # check is the desired-count assertion against the plan JSON in
          # wake-validate; this refuses a plan that was not even requested for
          # the state we are about to wake into.
          test "$(cat reviewed.staging-state)" = "$EXPECTED_STATE" \
            || { echo "::error::reviewed plan records staging_state $(cat reviewed.staging-state), not ${EXPECTED_STATE}"; exit 1; }
          sha256sum --check --status reviewed.tfplan.sha256
          reviewed_commit="$(cat reviewed.commit)"
          printf '%s' "$reviewed_commit" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::reviewed.commit is not a 40-character commit sha'; exit 1; }
          test "$reviewed_commit" = "$EXPECTED_COMMIT_SHA" \
            || { echo "::error::reviewed plan commit ${reviewed_commit} is not the intended release ${EXPECTED_COMMIT_SHA}"; exit 1; }
          checksum="$(sha256sum reviewed.tfplan | cut -d' ' -f1)"
          {
            printf 'plan_checksum=%s\n' "$checksum"
            printf 'reviewed_commit=%s\n' "$reviewed_commit"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Phase 3 — independently validate the reviewed plan: policy, budget, and the
  # pinned awake shape. Nothing is applied until this job is green.
  # ---------------------------------------------------------------------------
  wake-validate:
    name: Validate the reviewed wake plan (policy + budget + awake shape)
    needs: [select-profile, wake-plan]
    if: >-
      !cancelled()
      && needs.select-profile.result == 'success'
      && needs.select-profile.outputs.do_validate == 'true'
      && needs.wake-plan.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      plan_run_id: ${{ steps.identity.outputs.plan_run_id }}
      plan_checksum: ${{ steps.reviewed.outputs.plan_checksum }}
      reviewed_commit: ${{ steps.reviewed.outputs.reviewed_commit }}
    steps:
      - name: Resolve which reviewed plan is under validation
        id: identity
        env:
          PRODUCED_RUN_ID: ${{ needs.wake-plan.outputs.plan_run_id }}
          INPUT_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          run_id="${PRODUCED_RUN_ID:-$INPUT_RUN_ID}"
          test -n "$run_id" || { echo '::error::no reviewed plan run to validate'; exit 1; }
          printf 'plan_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wake-plan.outputs.reviewed_commit || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plan-validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.plan_run_id }}
          pattern: terraform-plan-${{ needs.select-profile.outputs.profile }}-*
          path: ${{ runner.temp }}/reviewed-plan
          merge-multiple: true

      # Reproduces terraform-promote's apply-time provenance verification so this
      # workflow never hands an unverified plan identity to an apply dispatch.
      - name: Verify reviewed plan provenance, profile and 24h expiry
        id: reviewed
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          EXPECTED_CHECKSUM: ${{ needs.wake-plan.outputs.plan_checksum || inputs.plan_checksum }}
          EXPECTED_STATE: awake
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/reviewed-plan"
          for artefact in \
            reviewed.tfplan reviewed.tfplan.json reviewed.tfplan.txt \
            reviewed.tfplan.sha256 reviewed.commit reviewed.profile \
            reviewed.deployment-lane \
            reviewed.terraform-version reviewed.lock.sha256 reviewed.state-key \
            reviewed.state-bucket reviewed.state-lock-table \
            reviewed.created-utc reviewed.expires-utc reviewed.resources.json \
            reviewed.policy.txt reviewed.cost.txt reviewed.staging-state
          do
            test -s "$artefact" || { echo "::error::reviewed plan is missing ${artefact}"; exit 1; }
          done
          test "$(cat reviewed.profile)" = "$PROFILE"
          test "$(cat reviewed.deployment-lane)" = "$DEPLOYMENT_LANE" \
            || { echo "::error::reviewed plan lane $(cat reviewed.deployment-lane) is not ${DEPLOYMENT_LANE}"; exit 1; }
          test "$(cat reviewed.state-key)" = "profiles/${PROFILE}/terraform.tfstate"
          reviewed_state_bucket="$(cat reviewed.state-bucket)"
          reviewed_state_lock_table="$(cat reviewed.state-lock-table)"
          printf '%s' "$reviewed_state_bucket" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo '::error::reviewed plan records an invalid state bucket'; exit 1; }
          printf '%s' "$reviewed_state_lock_table" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo '::error::reviewed plan records an invalid state lock table'; exit 1; }
          test "$(cat reviewed.staging-state)" = "$EXPECTED_STATE" \
            || { echo "::error::reviewed plan records staging_state $(cat reviewed.staging-state), not ${EXPECTED_STATE}"; exit 1; }
          sha256sum --check --status reviewed.tfplan.sha256
          checksum="$(sha256sum reviewed.tfplan | cut -d' ' -f1)"
          if [ -n "$EXPECTED_CHECKSUM" ] && [ "$checksum" != "$EXPECTED_CHECKSUM" ]; then
            echo '::error::reviewed.tfplan does not match the approved plan_checksum'
            exit 1
          fi
          reviewed_commit="$(cat reviewed.commit)"
          printf '%s' "$reviewed_commit" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::reviewed.commit is not a 40-character commit sha'; exit 1; }
          printf '%s' "$(cat reviewed.terraform-version)" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo '::error::reviewed.terraform-version is not a concrete version'; exit 1; }
          created_epoch="$(date -u -d "$(cat reviewed.created-utc)" +%s)"
          expires_epoch="$(date -u -d "$(cat reviewed.expires-utc)" +%s)"
          now_epoch="$(date -u +%s)"
          if [ "$expires_epoch" -le "$created_epoch" ]; then
            echo '::error::reviewed plan expiry precedes its creation timestamp'
            exit 1
          fi
          if [ "$((expires_epoch - created_epoch))" -gt 86400 ]; then
            echo '::error::reviewed plan claims a validity window longer than 24 hours'
            exit 1
          fi
          if [ "$now_epoch" -ge "$expires_epoch" ]; then
            echo "::error::reviewed plan expired at $(cat reviewed.expires-utc); create a fresh plan"
            exit 1
          fi
          {
            printf 'plan_checksum=%s\n' "$checksum"
            printf 'reviewed_commit=%s\n' "$reviewed_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the reviewed plan against policy
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/release/check_terraform_plan_policy.py \
            --profile "$PROFILE" \
            --plan-json "${RUNNER_TEMP}/reviewed-plan/reviewed.tfplan.json" \
            | tee artifacts/wake-plan-policy.txt
          test -s artifacts/profile-resource-inventory.json

      - name: Validate the staging budget
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, yaml
          profile = os.environ["PROFILE"]
          cfg = ((yaml.safe_load(open("config/deployment_profiles.yaml")) or {}).get("profiles") or {}).get(profile) or {}
          budget = cfg.get("budget") or {}
          for key in ("hard_monthly_spend", "target_monthly_spend", "maximum_scheduled_awake_hours_per_month"):
              if not budget.get(key):
                  sys.exit(f"::error::{profile} budget is missing {key}; the cost ceiling is unenforceable")
          print(f"{profile} budget ceiling: {budget['hard_monthly_spend']} {budget.get('currency', 'USD')}/month")
          PY
          python scripts/release/check_cost_model.py \
            --profile "$PROFILE" \
            --inventory artifacts/profile-resource-inventory.json \
            --out-dir "artifacts/cost-${PROFILE}" \
            | tee artifacts/wake-plan-cost.txt

      # The pinned Terraform interface: `awake` gives 1 API task and 1 lean-worker
      # task. This reads the plan itself, so it holds regardless of what any
      # evidence file claims.
      - name: Assert the reviewed plan encodes the awake desired counts
        env:
          PROFILE: ${{ needs.select-profile.outputs.profile }}
          EXPECTED_STATE: awake
        run: |
          set -euo pipefail
          PLAN_JSON="${RUNNER_TEMP}/reviewed-plan/reviewed.tfplan.json" python - <<'PY'
          import json, os, sys, yaml

          profile = os.environ["PROFILE"]
          state = os.environ["EXPECTED_STATE"]
          env = os.environ["STAGING_ENV"]
          runtime = (yaml.safe_load(open("config/runtime_deployment.yaml")) or {}).get("profiles") or {}
          pcfg = runtime.get(profile) or {}
          services = pcfg.get("services")
          if not isinstance(services, dict) or not services:
              sys.exit(f"::error::runtime_deployment.yaml profile {profile} has no services mapping")
          if len(set(services)) != len(services):
              sys.exit(f"::error::runtime_deployment.yaml profile {profile} has duplicate service keys")
          states = (pcfg.get("staging_state") or {}).get("states") or {}
          multiplier = (states.get(state) or {}).get("desired_count_multiplier")
          if multiplier is None:
              sys.exit(f"::error::runtime_deployment.yaml declares no desired_count_multiplier for {state}")

          # deploy.yml's canonical service-key -> ECS service mapping.
          def ecs_name(key: str) -> str:
              return f"AETHER-{env}-{'backend' if key == 'api' else key}"

          expected = {ecs_name(k): int(v.get("desired_count", 0)) * int(multiplier)
                      for k, v in services.items()}

          plan = json.load(open(os.environ["PLAN_JSON"]))

          def walk(module):
              for res in module.get("resources") or []:
                  yield res
              for child in module.get("child_modules") or []:
                  yield from walk(child)

          root = (plan.get("planned_values") or {}).get("root_module") or {}
          actual, autoscaling = {}, {}
          for res in walk(root):
              values = res.get("values") or {}
              if res.get("type") == "aws_ecs_service":
                  actual[values.get("name")] = values.get("desired_count")
              if res.get("type") == "aws_appautoscaling_target":
                  autoscaling[values.get("resource_id")] = values.get("min_capacity")

          if actual != expected:
              sys.exit(f"::error::planned ECS desired counts {actual} != pinned {state} shape {expected}")
          if state == "asleep":
              for target, minimum in autoscaling.items():
                  if minimum not in (0, None):
                      sys.exit(f"::error::asleep plan leaves autoscaling floor {minimum} on {target}")
          print(f"{state} shape confirmed: {actual}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-wake-plan-validation-${{ github.run_id }}
          path: |
            artifacts/wake-plan-policy.txt
            artifacts/wake-plan-cost.txt
            artifacts/profile-resource-inventory.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Phase 4 — apply the exact reviewed wake plan (via the reviewed promotion
  # workflow, which re-verifies everything and never re-plans), then wait for
  # infrastructure readiness and open the awake lease.
  # ---------------------------------------------------------------------------
  wake-apply:
    name: Apply the exact reviewed wake plan
    needs: [select-profile, wake-plan, wake-validate, preflight-rehearsal-inputs]
    if: >-
      always()
      && !cancelled()
      && needs.select-profile.outputs.apply_wake == 'true'
      && needs.wake-plan.result != 'failure'
      && needs.wake-validate.result == 'success'
      && (needs.select-profile.outputs.rehearse != 'true'
          || needs.preflight-rehearsal-inputs.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      apply_run_id: ${{ steps.dispatch.outputs.apply_run_id }}
      api_host: ${{ steps.outputs.outputs.api_host }}
      alb_dns: ${{ steps.outputs.outputs.alb_dns }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install autoscaling preflight dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml boto3
      # Establish the bounded lease before any apply dispatch. If the apply
      # starts services but readiness later fails, the TTL guard is already
      # armed and the fail-safe sleep job has a concrete deadline to enforce.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Preflight staging autoscaling target ownership tags before wake
        run: |
          set -euo pipefail
          python scripts/release/ensure_staging_autoscaling_target_tags.py --allow-missing-tags
      - name: Open the bounded awake lease before apply
        env:
          AWAKE_HOURS: ${{ needs.select-profile.outputs.awake_hours }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deadline="$(date -u -d "+${AWAKE_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          lease="$(printf '{"awake_since":"%s","awake_until":"%s","extensions":0}' "$now" "$deadline")"
          aws ssm put-parameter --name "$AWAKE_LEASE_PARAM" \
            --type String --overwrite --value "$lease" \
            --description "staging awake window (UTC); enforced by staging-ttl-guard"
          echo "staging awake lease armed before apply: since ${now}, expires ${deadline}"
      - name: Dispatch the reviewed apply for the verified wake plan
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN || github.token }}
          PLAN_RUN_ID: ${{ needs.wake-validate.outputs.plan_run_id }}
          PLAN_CHECKSUM: ${{ needs.wake-validate.outputs.plan_checksum }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
          PROMOTE_TIMEOUT_MINUTES: ${{ inputs.promote_timeout_minutes }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" \
            || { echo '::error::no GitHub Actions token is available to dispatch the reviewed promotion workflow'; exit 1; }
          # Both values come from the verification job, never straight from a
          # dispatch input: an apply here can only promote a plan this workflow
          # has already downloaded, checksummed and policy-validated.
          test -n "$PLAN_RUN_ID" || { echo '::error::no verified plan_run_id'; exit 1; }
          test -n "$PLAN_CHECKSUM" || { echo '::error::no verified plan_checksum'; exit 1; }
          dispatch_output="$(gh workflow run "$PROMOTE_WORKFLOW" --ref "$REF_NAME" \
            -f profile="$STAGING_PROFILE" \
            -f action=apply \
            -f deployment_lane="$DEPLOYMENT_LANE" \
            -f plan_run_id="$PLAN_RUN_ID" \
            -f plan_checksum="$PLAN_CHECKSUM" 2>&1)"
          printf '%s\n' "$dispatch_output"
          run_id="$(printf '%s\n' "$dispatch_output" \
            | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | tail -n 1)"
          test -n "$run_id" || {
            echo '::error::dispatched reviewed apply did not return its created run URL; refusing ambiguous correlation'
            exit 1
          }
          echo "reviewed apply run: ${run_id}"
          wait_deadline="$(( $(date -u +%s) + PROMOTE_TIMEOUT_MINUTES * 60 ))"
          conclusion=''
          while :; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
              break
            fi
            if [ "$(date -u +%s)" -ge "$wait_deadline" ]; then
              echo "::error::reviewed apply run ${run_id} did not finish within ${PROMOTE_TIMEOUT_MINUTES}m (approval pending?)"
              exit 1
            fi
            sleep 20
          done
          if [ "$conclusion" != success ]; then
            echo "::error::reviewed apply run ${run_id} concluded ${conclusion}"
            exit 1
          fi
          printf 'apply_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      # The promotion wait may include a protected-environment approval and
      # can exceed the default one-hour OIDC session. Re-assume the lifecycle
      # role before any follow-up AWS reads or lease writes so a successful
      # promotion cannot be reported as a failed rehearsal on expired creds.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Capture the applied certificate-covered API hostname
        id: outputs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN || github.token }}
          APPLY_RUN_ID: ${{ steps.dispatch.outputs.apply_run_id }}
        run: |
          set -euo pipefail
          test -n "$APPLY_RUN_ID" || { echo '::error::reviewed apply run id was not recorded'; exit 1; }
          evidence_dir="${RUNNER_TEMP}/terraform-apply-evidence"
          rm -rf "$evidence_dir"
          gh run download "$APPLY_RUN_ID" \
            --name "terraform-apply-evidence-${APPLY_RUN_ID}" \
            --dir "$evidence_dir"
          api_file="$(find "$evidence_dir" -type f -name 'reviewed.api-host' -print -quit)"
          test -n "$api_file" || { echo '::error::reviewed apply did not publish reviewed.api-host'; exit 1; }
          alb_file="$(find "$evidence_dir" -type f -name 'reviewed.alb-dns' -print -quit)"
          test -n "$alb_file" || { echo '::error::reviewed apply did not publish reviewed.alb-dns'; exit 1; }
          api_host="$(tr -d '\r\n' < "$api_file")"
          alb_dns="$(tr -d '\r\n' < "$alb_file")"
          case "$api_host" in
            ''|*://*|*/*|*' '*|*'"'*)
              echo '::error::applied API output is empty or is not a host name'; exit 1 ;;
          esac
          case "$alb_dns" in
            ''|*://*|*/*|*' '*|*'"'*)
              echo '::error::applied ALB output is empty or is not a host name'; exit 1 ;;
          esac
          printf 'api_host=%s\n' "$api_host" >> "$GITHUB_OUTPUT"
          printf 'alb_dns=%s\n' "$alb_dns" >> "$GITHUB_OUTPUT"
          echo 'Certificate-covered API hostname captured for the rehearsal.'

      - name: Verify API DNS points to the applied load balancer
        env:
          API_HOST: ${{ steps.outputs.outputs.api_host }}
          ALB_DNS: ${{ steps.outputs.outputs.alb_dns }}
        run: |
          set -euo pipefail
          # ALB A records are elastic and can rotate between two resolver
          # calls. Verify the stable operator-managed CNAME target instead of
          # comparing transient IP intersections, then let the HTTPS probe
          # below validate that the endpoint is actually serving.
          normalize_name() { printf '%s' "$1" | sed 's/\.$//'; }
          api_cname="$(dig +short CNAME "$API_HOST" | sed -n '1p' | sed 's/\.$//')"
          alb_name="$(normalize_name "$ALB_DNS")"
          test -n "$api_cname" || {
            echo "::error::certificate-covered API hostname ${API_HOST} has no CNAME record"; exit 1;
          }
          test "$api_cname" = "$alb_name" || {
            echo "::error::${API_HOST} CNAME is ${api_cname}, not the applied ALB ${alb_name}"; exit 1;
          }
          echo "verified ${API_HOST} CNAME targets the applied ALB ${ALB_DNS}"

      - name: Wait for staging infrastructure readiness
        run: |
          set -euo pipefail
          cluster_failures="$(aws ecs describe-clusters --cluster "$STAGING_CLUSTER" \
            --query 'failures' --output json)"
          if ! printf '%s' "$cluster_failures" | jq -e 'length == 0' >/dev/null; then
            echo '::error::staging ECS cluster returned failures after wake'
            exit 1
          fi
          # The AWS call is made on its own so its exit status is observed: a
          # process substitution would hand `mapfile` an empty array on failure.
          if ! services_raw="$(aws ecs list-services --cluster "$STAGING_CLUSTER" \
            --query 'serviceArns[]' --output text)"; then
            echo '::error::could not enumerate staging ECS services after wake'
            exit 1
          fi
          mapfile -t services < <(printf '%s' "$services_raw" | tr '\t' '\n' | sed '/^$/d')
          test "${#services[@]}" -gt 0 || { echo '::error::staging cluster exposes no services after wake'; exit 1; }
          if ! aws ecs wait services-stable --cluster "$STAGING_CLUSTER" --services "${services[@]}"; then
            echo '::error::staging ECS services did not become stable after wake'
            aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "${services[@]}" \
              --query 'services[].{name:serviceName,status:status,desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount}}' \
              --output table || true
            exit 1
          fi
          aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "${services[@]}" \
            --query 'services[].[serviceName,desiredCount,runningCount]' --output text

      # Refresh the bounded lease after a successful wake so the deadline is
      # measured from actual readiness while preserving the pre-apply guard.
      #
      # `awake_since` is the ORIGINAL wake. Extensions granted by the TTL guard
      # move `awake_until` but never `awake_since`, so the guard's total awake
      # ceiling is measured from the moment staging actually came up rather than
      # from the most recent extension. Without it, N sequential extensions buy
      # unbounded awake time.
      - name: Refresh the awake lease after readiness
        env:
          AWAKE_HOURS: ${{ needs.select-profile.outputs.awake_hours }}
        run: |
          set -euo pipefail
          lease="$(aws ssm get-parameter --name "$AWAKE_LEASE_PARAM" \
            --query 'Parameter.Value' --output text)"
          lease_since="$(jq -er '.awake_since // empty' <<<"$lease")"
          lease_extensions="$(jq -er '.extensions // 0' <<<"$lease")"
          test -n "$lease_since" || { echo '::error::pre-apply lease has no awake_since anchor'; exit 1; }
          case "$lease_extensions" in
            ''|*[!0-9]*) echo '::error::pre-apply lease has invalid extensions'; exit 1 ;;
          esac
          deadline="$(date -u -d "+${AWAKE_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          ceiling="$(date -u -d "${lease_since} +${MAX_AWAKE_HOURS_CAP} hours" +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$(date -u -d "$deadline" +%s)" -gt "$(date -u -d "$ceiling" +%s)" ]; then
            deadline="$ceiling"
          fi
          refreshed_lease="$(printf '{"awake_since":"%s","awake_until":"%s","extensions":%s}' \
            "$lease_since" "$deadline" "$lease_extensions")"
          aws ssm put-parameter --name "$AWAKE_LEASE_PARAM" \
            --type String --overwrite --value "$refreshed_lease" \
            --description "staging awake window (UTC); enforced by staging-ttl-guard"
          echo "staging awake lease refreshed: since ${lease_since}, expires ${deadline}, extensions ${lease_extensions}"

  # ---------------------------------------------------------------------------
  # Phase 5 — the rehearsal itself.
  # ---------------------------------------------------------------------------
  rehearse:
    name: Full staging rehearsal
    needs: [select-profile, wake-plan, wake-validate, wake-apply, preflight-rehearsal-inputs]
    if: >-
      !cancelled()
      && needs.select-profile.outputs.rehearse == 'true'
      && needs.wake-apply.result == 'success'
      && needs.preflight-rehearsal-inputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # Kept under the legacy variable name for the existing probe scripts;
      # the value is the certificate-covered API hostname, not *.elb.amazonaws.com.
      ALB_DNS_NAME: ${{ needs.wake-apply.outputs.api_host }}
      BACKEND_IMAGE_DIGEST: ${{ needs.wake-plan.outputs.backend_image_digest }}
      DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rehearsal dependencies
        run: |
          set -euo pipefail
          # The rehearsal invokes scripts/load_smoke.py, which launches the
          # selected Locust user class directly.  Keep the load runner
          # explicit here so a clean GitHub runner cannot reach the load gate
          # with a missing module and report a misleading staging failure.
          python -m pip install --disable-pip-version-check \
            pyyaml \
            boto3 \
            'locust>=2.31,<3'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_LIFECYCLE_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      # The policy-validation job emits the credentialed Terraform resource
      # inventory used by the rehearsal's cost evidence. Jobs have isolated
      # workspaces, so make that artifact an explicit input instead of letting
      # the evidence phase silently price a missing file.
      - uses: actions/download-artifact@v4
        with:
          name: staging-wake-plan-validation-${{ github.run_id }}
          path: artifacts

      - name: Verify the exact immutable application artifact is what staging runs
        env:
          RELEASE_MANIFEST_CHECKSUM: ${{ inputs.release_manifest_checksum }}
          INTENDED_RELEASE_SHA: ${{ inputs.intended_release_sha || github.sha }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release"
          sha="$(python -c "import json; print(json.load(open('release.json'))['commit_sha'])")"
          test "$sha" = "$INTENDED_RELEASE_SHA" \
            || { echo "::error::release manifest commit ${sha} is not intended release ${INTENDED_RELEASE_SHA}"; exit 1; }
          case "$sha" in
            ''|*[!0-9a-f]*) echo '::error::candidate commit is not a lowercase Git SHA'; exit 1 ;;
          esac
          # Reuse only the candidate commit's lockfiles, preserving the
          # relative paths used when the immutable candidate was built while
          # keeping all subsequent controls on this reviewed workflow SHA.
          cd "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin "$sha"
          cd "${RUNNER_TEMP}/release"
          git -C "${GITHUB_WORKSPACE}" show "$sha:package-lock.json" > package-lock.json
          git -C "${GITHUB_WORKSPACE}" show "$sha:pyproject.toml" > pyproject.toml
          python "${GITHUB_WORKSPACE}/scripts/release/release_manifest.py" release.json \
            --expected-sha "$sha" --checksum "$RELEASE_MANIFEST_CHECKSUM"
          python "${GITHUB_WORKSPACE}/scripts/release/release_candidate_adapter.py" --verify \
            --manifest release.json --candidate release-candidate.json \
            --expected-sha "$sha" \
            --lockfile package-lock.json \
            --lockfile pyproject.toml
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          manifest = json.load(open("release.json"))
          for key in ("aether_spa", "kyber_spa", "migration_package", "configuration"):
              artefact = manifest["artifacts"][key]
              actual = "sha256:" + hashlib.sha256(pathlib.Path(artefact["file"]).read_bytes()).hexdigest()
              if actual != artefact["digest"]:
                  sys.exit(f"::error::{key} artifact digest mismatch")
          print("release artifact digests verified")
          PY
          manifest_lane="$(python -c "import json; print(json.load(open('release.json')).get('deployment_lane', 'full'))")"
          test "$manifest_lane" = "$DEPLOYMENT_LANE" \
            || { echo "::error::release manifest deployment_lane=${manifest_lane} does not match ${DEPLOYMENT_LANE}"; exit 1; }
          if [ "$DEPLOYMENT_LANE" = full ]; then
            test -s kyber-staging-contract.json \
              || { echo '::error::approved release is missing the Kyber workforce identity contract evidence'; exit 1; }
            jq -e '
              .contract == "kyber-workforce-identity" and
              .version == 1 and
              .profile == "staging" and
              .secret_values_read == false and
              .google_client_id_present == true and
              .google_client_secret_source == "aws_secrets_manager:aether/kyber-google-client-secret"
            ' kyber-staging-contract.json >/dev/null \
              || { echo '::error::approved release Kyber workforce identity evidence is invalid'; exit 1; }
          else
            jq -e '
              .contract == "kyber-workforce-identity" and
              .version == 1 and
              .profile == "staging" and
              .deployment_lane == "pilot" and
              .deferred == true and
              .secret_values_read == false
            ' kyber-staging-contract.json >/dev/null \
              || { echo '::error::pilot release must carry explicit deferred Kyber evidence'; exit 1; }
          fi
          image_uri="$(python -c "import json; print(json.load(open('release.json'))['artifacts']['backend_image']['uri'])")"
          digest="$(python -c "import json; print(json.load(open('release.json'))['artifacts']['backend_image']['digest'])")"
          test "$digest" = "$BACKEND_IMAGE_DIGEST" \
            || { echo '::error::the applied wake plan does not pin the approved release digest'; exit 1; }
          # Every running staging service must carry exactly that image. The
          # enumeration fails closed: an empty service list would otherwise skip
          # the loop below and report the image as verified without checking it.
          if ! services_raw="$(aws ecs list-services --cluster "$STAGING_CLUSTER" \
            --query 'serviceArns[]' --output text)"; then
            echo '::error::could not enumerate staging ECS services; the running image is unverified'
            exit 1
          fi
          mapfile -t services < <(printf '%s' "$services_raw" | tr '\t' '\n' | sed '/^$/d')
          test "${#services[@]}" -gt 0 \
            || { echo '::error::staging exposes no services; the approved image is unverified'; exit 1; }
          for service in "${services[@]}"; do
            task_def="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "$service" \
              --query 'services[0].taskDefinition' --output text)"
            running_image="$(aws ecs describe-task-definition --task-definition "$task_def" \
              --query 'taskDefinition.containerDefinitions[0].image' --output text)"
            if [ "$running_image" != "$image_uri" ]; then
              echo "::error::${service} runs ${running_image}, not the approved ${image_uri}"
              exit 1
            fi
          done
          echo "staging runs the approved immutable release"

      - name: Preflight staging autoscaling target ownership tags before rehearsal
        run: |
          set -euo pipefail
          python scripts/release/ensure_staging_autoscaling_target_tags.py

      - name: Revalidate awake lease before static publication
        # Static publication mutates the staging origins. Re-check the lease
        # immediately before the first S3 write so an expired wake window cannot
        # overwrite or delete staging content.
        env:
          MIN_LEASE_SECONDS: "300"
        run: |
          set -euo pipefail
          lease="$(aws ssm get-parameter --name "$AWAKE_LEASE_PARAM" --query 'Parameter.Value' --output text)"
          until="$(jq -r '.awake_until // empty' <<<"$lease")"
          test -n "$until" || { echo '::error::awake lease is missing before static publication'; exit 1; }
          now="$(date -u +%s)"; deadline="$(date -u -d "$until" +%s)"
          test "$((deadline - now))" -ge "$MIN_LEASE_SECONDS" \
            || { echo '::error::awake lease lacks five minutes for static publication'; exit 1; }

      - name: Publish and verify the approved static SPA artifacts
        # Static publication is part of the exact-release rehearsal, not an
        # assumption about whatever happens to remain in the buckets.
        env:
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_checksum }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/rehearsal"
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          m = json.load(open("release.json"))
          keys = ["aether_spa"]
          if os.environ.get("DEPLOYMENT_LANE") == "full":
              keys.append("kyber_spa")
          for key in keys:
              a = m["artifacts"][key]
              got = "sha256:" + hashlib.sha256(pathlib.Path(a["file"]).read_bytes()).hexdigest()
              if got != a["digest"]:
                  sys.exit(f"::error::{key} digest mismatch before publication")
          PY
          apps=(aether)
          if [ "$DEPLOYMENT_LANE" = full ]; then
            apps+=(kyber)
          fi
          for app in "${apps[@]}"; do
            archive_key="${app}_spa"
            archive="$(python -c "import json; print(json.load(open('release.json'))['artifacts']['${archive_key}']['file'])")"
            expected="$(python -c "import json; print(json.load(open('release.json'))['artifacts']['${archive_key}']['digest'])")"
            test -s "$archive"
            dist="${GITHUB_WORKSPACE}/artifacts/rehearsal/dist-${app}"
            rm -rf "$dist"; mkdir -p "$dist"
            tar -xzf "$archive" -C "$dist"
            bucket_var="$(echo "${app}_static_bucket" | tr '[:lower:]' '[:upper:]')"
            bucket="$(aws ssm get-parameter --name "/aether/${STAGING_ENV}/${bucket_var}" --query 'Parameter.Value' --output text)"
            aws s3 sync "$dist" "s3://${bucket}" --delete --cache-control 'public,max-age=31536000,immutable' --exclude index.html
            aws s3 cp "$dist/index.html" "s3://${bucket}/index.html" --cache-control 'no-cache,no-store,must-revalidate'
            verify="${RUNNER_TEMP}/verify-${app}"; rm -rf "$verify"; mkdir -p "$verify"
            aws s3 sync "s3://${bucket}" "$verify" --delete
            diff -qr "$dist" "$verify" >/dev/null || { echo "::error::published ${app} SPA differs from approved artifact"; exit 1; }
            printf '%s=%s\n' "$app" "$expected" >> "${GITHUB_WORKSPACE}/artifacts/rehearsal/static-publication.txt"
          done
          printf 'manifest_sha256=%s\n' "$RELEASE_MANIFEST_SHA256" >> "${GITHUB_WORKSPACE}/artifacts/rehearsal/static-publication.txt"

      - name: Revalidate awake lease before migration mutation
        # Revalidate immediately before the first mutating rehearsal action.
        # The wake lease may have expired while image verification ran.
        env:
          MIN_LEASE_SECONDS: "300"
        run: |
          set -euo pipefail
          lease="$(aws ssm get-parameter --name "$AWAKE_LEASE_PARAM" --query 'Parameter.Value' --output text)"
          until="$(jq -r '.awake_until // empty' <<<"$lease")"
          test -n "$until" || { echo '::error::awake lease is missing before migration mutation'; exit 1; }
          now="$(date -u +%s)"; deadline="$(date -u -d "$until" +%s)"
          test "$((deadline - now))" -ge "$MIN_LEASE_SECONDS" \
            || { echo '::error::awake lease lacks five minutes for the next staging mutation'; exit 1; }

      - name: Run migrations and verify the resulting revision
        run: |
          set -euo pipefail
          mkdir -p artifacts/rehearsal
          service="AETHER-${STAGING_ENV}-backend"
          task_def="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "$service" \
            --query 'services[0].taskDefinition' --output text)"
          test "$task_def" != None || { echo "::error::required service missing: ${service}"; exit 1; }
          container="$(aws ecs describe-task-definition --task-definition "$task_def" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)"
          netcfg="$(aws ecs describe-services --cluster "$STAGING_CLUSTER" --services "$service" \
            --query 'services[0].networkConfiguration' --output json)"
          # RUN_MIGRATIONS=1 makes the release entrypoint run `alembic upgrade head`.
          task_arn="$(aws ecs run-task --cluster "$STAGING_CLUSTER" --task-definition "$task_def" \
            --launch-type FARGATE --network-configuration "$netcfg" \
            --overrides "{\"containerOverrides\":[{\"name\":\"${container}\",\"command\":[\"/bin/sh\",\"-c\",\"exit 0\"],\"environment\":[{\"name\":\"RUN_MIGRATIONS\",\"value\":\"1\"}]}]}" \
            --query 'tasks[0].taskArn' --output text)"
          test -n "$task_arn" && test "$task_arn" != None \
            || { echo '::error::migration task did not return a task ARN'; exit 1; }
          printf 'migration_task=%s\n' "$task_arn" > artifacts/rehearsal/migrations.txt
          wait_status=0
          if aws ecs wait tasks-stopped --cluster "$STAGING_CLUSTER" --tasks "$task_arn"; then
            :
          else
            wait_status=$?
          fi
          describe_status=0
          if aws ecs describe-tasks --cluster "$STAGING_CLUSTER" --tasks "$task_arn" \
            > artifacts/rehearsal/migration-task.json; then
            :
          else
            describe_status=$?
          fi
          test "$describe_status" = 0 \
            || { echo '::error::could not collect migration task evidence'; exit 1; }
          test "$wait_status" = 0 \
            || { echo "::error::migration task did not stop successfully (wait status ${wait_status})"; exit 1; }
          jq -e '.tasks | length == 1 and .[0].lastStatus == "STOPPED"' \
            artifacts/rehearsal/migration-task.json >/dev/null \
            || { echo '::error::migration task evidence does not show a stopped task'; exit 1; }
          exit_code="$(jq -er '.tasks[0].containers[0].exitCode // empty' artifacts/rehearsal/migration-task.json)"
          stopped_reason="$(jq -r '.tasks[0].stoppedReason // empty' artifacts/rehearsal/migration-task.json)"
          stop_code="$(jq -r '.tasks[0].stopCode // empty' artifacts/rehearsal/migration-task.json)"
          container_reason="$(jq -r '.tasks[0].containers[0].reason // empty' artifacts/rehearsal/migration-task.json)"
          printf 'exit_code=%s\nstop_code=%s\nstopped_reason=%s\ncontainer_reason=%s\n' \
            "$exit_code" "$stop_code" "$stopped_reason" "$container_reason" \
            >> artifacts/rehearsal/migrations.txt
          if [ "$exit_code" != 0 ]; then
            echo "::error::migration task failed (exit ${exit_code}; stop_code=${stop_code}; stopped_reason=${stopped_reason:-unknown}; container_reason=${container_reason:-unknown})"
            # Keep failure output useful without uploading raw container logs:
            # application logs can contain provider-controlled values.  Only
            # sanitized migration/error lines are retained as evidence.
            task_id="${task_arn##*/}"
            log_group="$(aws ecs describe-task-definition --task-definition "$task_def" \
              --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group"' --output text)"
            stream_prefix="$(aws ecs describe-task-definition --task-definition "$task_def" \
              --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-stream-prefix"' --output text)"
            log_stream="${stream_prefix}/${container}/${task_id}"
            raw_log="${RUNNER_TEMP}/migration-log.raw"
            sanitized_log="artifacts/rehearsal/migration-log-diagnostic.txt"
            if aws logs get-log-events --log-group-name "$log_group" --log-stream-name "$log_stream" \
              --start-from-head --query 'events[].message' --output text > "$raw_log" 2>/dev/null; then
              sed -E \
                -e 's#(postgres(ql)?://[^:@[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
                -e 's#((password|secret|token|api[_-]?key|private[_-]?key)[=:][^[:space:]]+)#\2=[REDACTED]#Ig' \
                "$raw_log" | rg -i 'alembic|migration|traceback|exception|error|failed|duplicate|permission|denied|timeout|database|postgres' \
                | tail -80 > "$sanitized_log" || true
            fi
            if [ -s "$sanitized_log" ]; then
              cat "$sanitized_log"
            else
              echo '::warning::migration task logs were unavailable or contained no sanitized error lines'
            fi
            exit 1
          fi
          # /v1/ready fails unless the database alembic revision equals the
          # packaged head, so it is the authoritative revision verification.
          status="$(curl -sS -o artifacts/rehearsal/ready.json -w '%{http_code}' \
            "https://${ALB_DNS_NAME}/v1/ready")"
          if [ "$status" != 200 ]; then
            echo "::error::/v1/ready returned ${status} after migrations"
            # The response contains status/detail fields only; retain it as
            # sanitized evidence so the failing dependency is actionable.
            jq . artifacts/rehearsal/ready.json || true
            exit 1
          fi
          python - <<'PY'
          import json, sys
          body = json.load(open("artifacts/rehearsal/ready.json"))
          blob = json.dumps(body)
          if "alembic" not in blob and "migration" not in blob:
              sys.exit("::error::/v1/ready does not report a migration revision")
          print("migration revision verified by /v1/ready")
          PY

      - name: Backend readiness and frontend availability
        run: |
          set -euo pipefail
          test -n "${ALB_DNS_NAME:-}" || { echo '::error::ALB_DNS_NAME is required'; exit 1; }
          for path in /v1/health /v1/ready; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://${ALB_DNS_NAME}${path}")"
            test "$status" = 200 || { echo "::error::${path} returned ${status}"; exit 1; }
          done

      - name: Verify or bootstrap the durable admin credential after readiness
        env:
          EXISTING_STAGING_ADMIN_API_KEY: ${{ secrets.STAGING_ADMIN_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN || secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ALB_DNS_NAME:-}" || { echo '::error::wake apply did not expose an API hostname'; exit 1; }
          helper_args=(
            --base-url "https://${ALB_DNS_NAME}"
            --repo "$GITHUB_REPOSITORY"
          )
          if [ "$DEPLOYMENT_LANE" = pilot ]; then
            bootstrap_token="$(aws secretsmanager get-secret-value \
              --secret-id aether/first-admin-bootstrap-token \
              --query SecretString --output text)"
            test -n "$bootstrap_token" \
              || { echo '::error::first-admin bootstrap token is unavailable'; exit 1; }
            echo "::add-mask::${bootstrap_token}"
            FIRST_ADMIN_BOOTSTRAP_TOKEN="$bootstrap_token" \
              python scripts/release/bootstrap_staging_admin_key.py \
                "${helper_args[@]}" --allow-bootstrap --confirm-single-use
            unset bootstrap_token
          else
            python scripts/release/bootstrap_staging_admin_key.py "${helper_args[@]}"
          fi

      - name: Probe the live Kyber workforce identity edge
        env:
          TF_DOMAIN_NAME: ${{ secrets.TF_DOMAIN_NAME }}
          TF_KYBER_APP_URL: ${{ secrets.TF_KYBER_APP_URL }}
          TF_KYBER_GOOGLE_HOSTED_DOMAIN: ${{ vars.KYBER_GOOGLE_HOSTED_DOMAIN || 'olympuslabs.ai' }}
          KYBER_API_BASE_URL: ${{ format('https://{0}', needs.wake-apply.outputs.api_host) }}
          DEPLOYMENT_LANE: ${{ needs.select-profile.outputs.deployment_lane }}
        run: |
          set -euo pipefail
          apps=(aether)
          if [ "$DEPLOYMENT_LANE" = full ]; then
            python scripts/release/check_kyber_staging_contract.py \
              --evidence-out artifacts/rehearsal/kyber-contract-live.json
            python scripts/release/probe_kyber_staging_identity.py \
              --base-url "https://${ALB_DNS_NAME}" \
              --evidence-out artifacts/rehearsal/kyber-identity-probe.json
            apps+=(kyber)
          else
            echo 'Kyber workforce identity and its Google/GCP prerequisites are deferred for the pilot lane.'
          fi
          for app in "${apps[@]}"; do
            bucket_var="$(echo "${app}_static_bucket" | tr '[:lower:]' '[:upper:]')"
            bucket="$(aws ssm get-parameter --name "/aether/${STAGING_ENV}/${bucket_var}" \
              --query Parameter.Value --output text)"
            aws s3api head-object --bucket "$bucket" --key index.html >/dev/null \
              || { echo "::error::${app} SPA origin has no index.html"; exit 1; }
