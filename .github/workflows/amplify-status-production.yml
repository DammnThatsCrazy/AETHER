name: Bind and deploy the production web app

# Production runs ONE Amplify app (AETHER-production-web, the former
# aether-status app) with two branches built from the same main commit:
#
# - main: the Aether site (with the product under /app) for aether, docs,
#   status and app;
# - production-olympus: the Olympus Labs site (VITE_SITE=olympus) for www.
#
# Each site build prerenders its own pages for search and link previews, so
# the two hosts need separate builds. Every main push binds the app to this
# repository with the reviewed build, rules and production settings, mirrors
# the exact main SHA to the production-olympus Git branch, keeps both branches
# in PRODUCTION stage, and starts a commit-pinned release job on each. It never
# changes DNS or domain mappings; Squarespace remains the DNS authority.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: "Exact main SHA to deploy (defaults to this workflow SHA)"
        type: string
        required: false

permissions:
  contents: read
  checks: read
  actions: read
  id-token: write

concurrency:
  group: amplify-status-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AMPLIFY_REPOSITORY: https://github.com/DammnThatsCrazy/AETHER
  AMPLIFY_APP_NAME: AETHER-production-web
  # Git and Amplify branch for the Olympus Labs site: always an exact copy of
  # a reviewed main commit, written only by this workflow.
  OLYMPUS_BRANCH: production-olympus

jobs:
  verify-main-integration:
    name: Verify Main integration authority for exact commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Wait for the exact commit's integration authority
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo '::error::expected status commit must be a 40-character lowercase Git SHA'; exit 1;
          }
          deadline=$((SECONDS + 2040))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Filter by name: an unfiltered first page can omit the authority
            # once staging dispatches add more than 100 check runs to the SHA.
            runs_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_COMMIT_SHA/check-runs" \
              -f check_name="Main integration authority" -F per_page=100)"
            status="$(jq -r '[.check_runs[] | select(.name == "Main integration authority")] | sort_by(.started_at) | last | .status // "missing"' <<<"$runs_json")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "Main integration authority")] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$runs_json")"
            if [ "$status" = completed ]; then
              test "$conclusion" = success || {
                echo "::error::Main integration authority concluded $conclusion for $EXPECTED_COMMIT_SHA"; exit 1;
              }
              echo "Main integration authority is green for $EXPECTED_COMMIT_SHA."
              exit 0
            fi
            echo "Main integration authority is $status for $EXPECTED_COMMIT_SHA; waiting."
            sleep 15
          done
          echo "::error::Main integration authority did not complete within the 34-minute verification window for $EXPECTED_COMMIT_SHA"
          exit 1

  deploy:
    name: Bind status app and deploy exact main SHA
    needs: verify-main-integration
    if: needs.verify-main-integration.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the assumed staging deploy role
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          caller_json="$(aws sts get-caller-identity --output json)"
          expected_account="${EXPECTED_ROLE_ARN#arn:aws:iam::}"
          expected_account="${expected_account%%:*}"
          expected_role_path="${EXPECTED_ROLE_ARN#*:role/}"
          caller_account="$(jq -r .Account <<<"$caller_json")"
          caller_role_path="$(jq -r .Arn <<<"$caller_json")"
          caller_role_path="${caller_role_path#*:assumed-role/}"
          caller_role_path="${caller_role_path%/*}"
          test "$caller_account" = "$expected_account" || {
            echo '::error::status deployment role account does not match AWS_DEPLOY_ROLE_ARN'; exit 1;
          }
          test "$caller_role_path" = "$expected_role_path" || {
            echo '::error::status deployment assumed an unexpected AWS role'; exit 1;
          }
          test "$caller_role_path" = AetherStagingDeploy || {
            echo '::error::status deployment must use AetherStagingDeploy in the staging account'; exit 1;
          }
          echo 'Verified status deployment credentials resolve to AetherStagingDeploy in the expected account.'

      - name: Resolve the exact status app and validate deployment inputs
        id: inputs
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha || github.sha }}
          AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo '::error::expected_commit_sha must be a 40-character lowercase Git SHA'; exit 1;
          }
          test -n "$AMPLIFY_GITHUB_ACCESS_TOKEN" || {
            echo '::error::TF_AMPLIFY_GITHUB_ACCESS_TOKEN is required to bind the Amplify app to GitHub'; exit 1;
          }
          if [[ "$AMPLIFY_GITHUB_ACCESS_TOKEN" =~ [[:space:]] ]]; then
            echo '::error::TF_AMPLIFY_GITHUB_ACCESS_TOKEN contains whitespace'; exit 1;
          fi
          mapfile -t app_ids < <(aws amplify list-apps --max-results 100 \
            --query "apps[?name=='${AMPLIFY_APP_NAME}'].appId" --output text | tr '\t' '\n' | awk 'NF')
          test "${#app_ids[@]}" -eq 1 || {
            echo "::error::expected exactly one Amplify app named ${AMPLIFY_APP_NAME}; found ${#app_ids[@]}"; exit 1;
          }
          printf 'app_id=%s\n' "${app_ids[0]}" >> "$GITHUB_OUTPUT"
          printf 'expected_commit_sha=%s\n' "$EXPECTED_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Mirror the exact main commit to the Olympus site branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ steps.inputs.outputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          # Only a commit already on main may be published to www.
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_COMMIT_SHA...main" --jq .status)"
          case "$comparison" in
            identical|ahead) ;;
            *) echo "::error::$EXPECTED_COMMIT_SHA is not on main (compare status: ${comparison:-unknown})"; exit 1 ;;
          esac
          git push --force origin "${EXPECTED_COMMIT_SHA}:refs/heads/${OLYMPUS_BRANCH}"
          echo "Mirrored ${EXPECTED_COMMIT_SHA} to ${OLYMPUS_BRANCH}."

      - name: Assess status app state before repository binding
        id: state
        env:
          APP_ID: ${{ steps.inputs.outputs.app_id }}
        run: |
          set -euo pipefail
          app_json="$(aws amplify get-app --app-id "$APP_ID")"
          app_name="$(jq -r '.app.name // empty' <<<"$app_json")"
          repository="$(jq -r '.app.repository // empty' <<<"$app_json")"
          test "$app_name" = "$AMPLIFY_APP_NAME" || {
            echo "::error::refusing to bind unexpected Amplify app ${app_name}"; exit 1;
          }

          branches_json="$(aws amplify list-branches --app-id "$APP_ID" --max-results 50 \
            --query 'branches[].branchName' --output json)"
          branch_count="$(jq 'length' <<<"$branches_json")"
          domain_names_json="$(aws amplify list-domain-associations \
            --app-id "$APP_ID" --max-results 50 \
            --query 'domainAssociations[].domainName' --output json)"
          expected_domain_present="$(jq 'index("olympuslabsml.com") != null' <<<"$domain_names_json")"
          test "$expected_domain_present" = true || {
            echo '::error::AETHER-production-web is missing the canonical olympuslabsml.com domain association'; exit 1;
          }

          domain_has_mappings=false
          mapfile -t domain_names < <(jq -r '.[]' <<<"$domain_names_json")
          for domain_name in "${domain_names[@]}"; do
            domain_json="$(aws amplify get-domain-association \
              --app-id "$APP_ID" --domain-name "$domain_name")"
            status="$(jq -r '.domainAssociation.domainStatus // empty' <<<"$domain_json")"
            test "$status" = AVAILABLE || {
              echo "::error::Amplify domain association ${domain_name} is ${status:-unknown}; refusing to bind"; exit 1;
            }
            settings_count="$(jq '[.domainAssociation.subDomains[]?.subDomainSetting] | map(select(. != null)) | length' <<<"$domain_json")"
            if [ "$settings_count" -gt 0 ]; then
              domain_has_mappings=true
            fi
          done

          if [ -z "$repository" ]; then
            if [ "$branch_count" -ne 0 ] || [ "$domain_has_mappings" = true ]; then
              echo '::error::AETHER-production-web is still in legacy manual state.'
              echo '::error::One-time administrative cleanup must remove its manual branches and detach domain mappings before CI can bind the repository.'
              exit 1
            fi
            echo 'The legacy status app is clean and unbound; this run will perform the one-time repository bootstrap.'
            printf 'bootstrap_required=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected_branches="$(jq -r --arg olympus "$OLYMPUS_BRANCH" 'map(select(. != "main" and . != $olympus)) | join(",")' <<<"$branches_json")"
          test -z "$unexpected_branches" || {
            echo "::error::repository-backed AETHER-production-web has unexpected branches: ${unexpected_branches}"; exit 1;
          }
          if [ "$domain_has_mappings" = false ]; then
            echo 'The status app is repository-backed but its canonical domain mapping is not restored yet; this run will stop before release.'
            printf 'bootstrap_required=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'bootstrap_required=false\n' >> "$GITHUB_OUTPUT"
          echo 'Status app is repository-backed with only the main and Olympus site branches; CI will verify its domain mapping without mutating it.'

      - name: Bind the production web app to the canonical repository
        id: bind
        env:
          APP_ID: ${{ steps.inputs.outputs.app_id }}
          AMPLIFY_GITHUB_ACCESS_TOKEN: ${{ secrets.TF_AMPLIFY_GITHUB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          web_build_spec="$(mktemp)"
          web_environment="$(mktemp)"
          web_rules="$(mktemp)"
          olympus_environment="$(mktemp)"
          trap 'rm -f "$web_build_spec" "$web_environment" "$web_rules" "$olympus_environment"' EXIT
          # The apps/site entry of amplify.yml: the unified site plus the
          # product built under /app.
          cat > "$web_build_spec" <<'YAML'
          version: 1
          applications:
            - appRoot: apps/site
              frontend:
                buildPath: /
                phases:
                  preBuild:
                    commands:
                      - npm ci
                      - npm run build --workspace=packages/shared
                      - npm run build --workspace=packages/web
                  build:
                    commands:
                      - npm run build --workspace=apps/site
                      - VITE_BASE_PATH=/app/ npm run build --workspace=apps/aether
                      - test -f apps/aether/dist/index.html
                      - mkdir -p apps/site/dist/app
                      - cp -R apps/aether/dist/. apps/site/dist/app/
                artifacts:
                  baseDirectory: apps/site/dist
                  files:
                    - '**/*'
                cache:
                  paths:
                    - node_modules/**/*
          YAML
          # Public production build settings (no secrets). Auth0 settings join
          # when the production backend and sign-in exist. Until then the site
          # is pilot-only (no sign-in, sign-up or status links; plan choices
          # become pilot requests) and its contact form posts to the always-on
          # lead intake (infra/aws/lead-intake). The API values are the ones
          # production will use; the pilot-only site does not call them.
          cat > "$web_environment" <<'JSON'
          {
            "AETHER_ENV": "production",
            "VITE_AETHER_ENV": "production",
            "VITE_PILOT_ONLY": "true",
            "VITE_LEAD_URL": "https://cbikbmj7wtuz6atqb62avzcn6e0bpquf.lambda-url.us-east-1.on.aws/",
            "VITE_API_BASE_URL": "https://api.olympuslabsml.com",
            "VITE_AETHER_ENDPOINT": "https://api.olympuslabsml.com",
            "VITE_PUBLISH_PRICES": "true",
            "VITE_SITE_AETHER_URL": "https://aether.olympuslabsml.com",
            "VITE_SITE_OLYMPUS_URL": "https://www.olympuslabsml.com",
            "VITE_STATUS_API_URL": "https://api.olympuslabsml.com/health",
            "VITE_STATUS_HISTORY_URL": "https://api.olympuslabsml.com/v1/status/history",
            "_LIVE_UPDATES": "[{\"pkg\":\"node\",\"type\":\"nvm\",\"version\":\"20\"}]"
          }
          JSON
          # Pilot-only routing: the product (/app and the legacy sign-in paths)
          # sends visitors to a pilot request until the production backend
          # exists. Every page is a prerendered file (/platform is served from
          # platform.html); a path with no file gets the app shell with a 404
          # status ("404-200"), and the app renders the route or its not-found
          # page. The rules are shared by both branches. When production opens,
          # restore the staging web app's product rules (Terraform main.tf).
          cat > "$web_rules" <<'JSON'
          [
            {"source": "/app", "target": "/contact?type=pilot", "status": "302"},
            {"source": "/app/<*>", "target": "/contact?type=pilot", "status": "302"},
            {"source": "/login", "target": "/contact?type=pilot", "status": "302"},
            {"source": "/signup", "target": "/contact?type=pilot", "status": "302"},
            {"source": "/forgot-password", "target": "/contact?type=pilot", "status": "302"},
            {"source": "/<*>", "target": "/index.html", "status": "404-200"}
          ]
          JSON
          # The Olympus Labs site: the same settings, built as the Olympus site.
          jq '. + {"VITE_SITE": "olympus"}' "$web_environment" > "$olympus_environment"
          jq -e 'type == "object"' "$web_environment" >/dev/null
          jq -e '.VITE_SITE == "olympus"' "$olympus_environment" >/dev/null
          jq -e 'type == "array" and length == 6' "$web_rules" >/dev/null
          aws amplify update-app \
            --app-id "$APP_ID" \
            --repository "$AMPLIFY_REPOSITORY" \
            --access-token "$AMPLIFY_GITHUB_ACCESS_TOKEN" \
            --build-spec "$(cat "$web_build_spec")" \
            --environment-variables "file://$web_environment" \
            --custom-rules "file://$web_rules" \
            --enable-branch-auto-build \
            >/dev/null
          branch_args=(
            --app-id "$APP_ID"
            --branch-name main
            --stage PRODUCTION
            --enable-auto-build
            --environment-variables "file://$web_environment"
          )
          if aws amplify get-branch --app-id "$APP_ID" --branch-name main >/dev/null 2>&1; then
            aws amplify update-branch "${branch_args[@]}" >/dev/null
          else
            aws amplify create-branch "${branch_args[@]}" >/dev/null
          fi
          # The Olympus branch builds only the commits this workflow mirrors and
          # releases; it does not auto-build on its own.
          olympus_args=(
            --app-id "$APP_ID"
            --branch-name "$OLYMPUS_BRANCH"
            --stage PRODUCTION
            --no-enable-auto-build
            --environment-variables "file://$olympus_environment"
          )
          if aws amplify get-branch --app-id "$APP_ID" --branch-name "$OLYMPUS_BRANCH" >/dev/null 2>&1; then
            aws amplify update-branch "${olympus_args[@]}" >/dev/null
          else
            aws amplify create-branch "${olympus_args[@]}" >/dev/null
          fi
          # Build settings apply only to jobs that start after this point; the
          # release step must not reuse a job started before it. Whole seconds:
          # the release step treats a job from this same second as stale.
          printf 'bound_at=%s\n' "$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "Bound the production web app to the reviewed repository, the site build with the product under /app, production settings and rules, and the PRODUCTION main and ${OLYMPUS_BRANCH} branches."

      - name: Verify canonical production domain mappings
        if: steps.state.outputs.bootstrap_required != 'true'
        env:
          APP_ID: ${{ steps.inputs.outputs.app_id }}
        run: |
          set -euo pipefail
          domain_json="$(aws amplify get-domain-association \
            --app-id "$APP_ID" --domain-name olympuslabsml.com)"
          status="$(jq -r '.domainAssociation.domainStatus // empty' <<<"$domain_json")"
          test "$status" = AVAILABLE || {
            echo "::error::production status domain association is ${status:-unknown}"; exit 1;
          }
          for prefix in www aether docs status app; do
            branch=main
            if [ "$prefix" = www ]; then branch="$OLYMPUS_BRANCH"; fi
            mapping_count="$(jq --arg prefix "$prefix" '[.domainAssociation.subDomains[]?.subDomainSetting] | map(select(.prefix == $prefix)) | length' <<<"$domain_json")"
            branch_mapping_count="$(jq --arg prefix "$prefix" --arg branch "$branch" '[.domainAssociation.subDomains[]?.subDomainSetting] | map(select(.prefix == $prefix and .branchName == $branch)) | length' <<<"$domain_json")"
            test "$mapping_count" = 1 && test "$branch_mapping_count" = 1 || {
              echo "::error::production domain must have exactly one ${prefix} mapping to the ${branch} branch"; exit 1;
            }
          done
          echo "Verified the production domain is AVAILABLE and maps www to ${OLYMPUS_BRANCH} and aether, docs, status and app to main, without a CI domain mutation."

      - name: Complete one-time status app bootstrap
        if: steps.state.outputs.bootstrap_required == 'true'
        run: |
          set -euo pipefail
          echo 'The status app is now repository-backed with a PRODUCTION main branch.'
          echo '::notice::One-time administrative action required: restore olympuslabsml.com status -> main, then dispatch this workflow for the first commit-pinned release.'
          echo 'Bootstrap intentionally stops before release so the domain association is restored before public provenance is claimed.'

      - name: Start the commit-pinned Amplify releases
        id: job
        if: steps.state.outputs.bootstrap_required != 'true'
        env:
          APP_ID: ${{ steps.inputs.outputs.app_id }}
          EXPECTED_COMMIT_SHA: ${{ steps.inputs.outputs.expected_commit_sha }}
          BOUND_AT: ${{ steps.bind.outputs.bound_at }}
        run: |
          set -euo pipefail
          # Repository-bound Amplify apps can auto-start a release for the push
          # before this workflow reaches the deploy job. Reusing the exact
          # commit's active job avoids Amplify's one-job-per-branch race while
          # preserving exact-commit provenance, but only a job that started
          # after the bind step: an earlier one was built with the previous
          # build settings (environment variables are read when a job starts).
          # Any other active job, including such a stale one, is waited out
          # before this reviewed commit starts.
          printf '%s' "$BOUND_AT" | grep -Eq '^[0-9]+$' || {
            echo '::error::the bind step did not record when the build settings were applied'; exit 1;
          }
          active_statuses='["PENDING", "QUEUED", "PROVISIONING", "RUNNING"]'

          release_branch() {
            local branch="$1" job_id="" jobs_json active_count start_output start_status
            local deadline=$((SECONDS + 2400))
            while [ "$SECONDS" -lt "$deadline" ]; do
              jobs_json="$(aws amplify list-jobs \
                --app-id "$APP_ID" \
                --branch-name "$branch" \
                --max-results 50 \
                --output json)"
              job_id="$(jq -r --arg expected "$EXPECTED_COMMIT_SHA" --argjson active "$active_statuses" --argjson bound "$BOUND_AT" \
                '[.jobSummaries[] | select(.commitId == $expected and (.status as $status | $active | index($status) != null)
                  and ((.startTime // "") | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | (try fromdateiso8601 catch 0)) > $bound)]
                | sort_by((.jobId | tonumber)) | last | .jobId // empty' <<<"$jobs_json")"
              if [ -n "$job_id" ]; then
                echo "Reusing active Amplify status deployment job ${job_id} on ${branch} for ${EXPECTED_COMMIT_SHA}." >&2
                break
              fi

              active_count="$(jq --argjson active "$active_statuses" \
                '[.jobSummaries[] | select(.status as $status | $active | index($status) != null)] | length' <<<"$jobs_json")"
              if [ "$active_count" -gt 0 ]; then
                echo "Another Amplify deployment is active on ${branch}; waiting for the branch to become available." >&2
                sleep 15
                continue
              fi

              start_output="$(mktemp)"
              if aws amplify start-job \
                --app-id "$APP_ID" \
                --branch-name "$branch" \
                --job-type RELEASE \
                --commit-id "$EXPECTED_COMMIT_SHA" \
                --query 'jobSummary.jobId' --output text >"$start_output" 2>&1; then
                job_id="$(tr -d '[:space:]' <"$start_output")"
                rm -f "$start_output"
                break
              else
                start_status=$?
                if grep -Fq 'already have pending or running jobs' "$start_output"; then
                  echo "Amplify reported a concurrent ${branch} job after the availability check; rechecking for the exact commit." >&2
                  rm -f "$start_output"
                  sleep 5
                  continue
                fi
                cat "$start_output" >&2
                rm -f "$start_output"
                return "$start_status"
              fi
            done
            test -n "$job_id" && test "$job_id" != None || {
              echo "::error::Amplify did not provide an active or newly-created ${branch} deployment job ID" >&2; return 1;
            }
            printf '%s' "$job_id"
          }

          main_job_id="$(release_branch main)"
          olympus_job_id="$(release_branch "$OLYMPUS_BRANCH")"
          printf 'main_job_id=%s\n' "$main_job_id" >> "$GITHUB_OUTPUT"
          printf 'olympus_job_id=%s\n' "$olympus_job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact deployments
        if: steps.state.outputs.bootstrap_required != 'true'
        env:
          APP_ID: ${{ steps.inputs.outputs.app_id }}
          EXPECTED_COMMIT_SHA: ${{ steps.inputs.outputs.expected_commit_sha }}
          MAIN_JOB_ID: ${{ steps.job.outputs.main_job_id }}
          OLYMPUS_JOB_ID: ${{ steps.job.outputs.olympus_job_id }}
        run: |
          set -euo pipefail
          wait_for() {
            local branch="$1" job_id="$2" job_json status commit
            local deadline=$((SECONDS + 2400))
            while [ "$SECONDS" -lt "$deadline" ]; do
              job_json="$(aws amplify get-job --app-id "$APP_ID" --branch-name "$branch" --job-id "$job_id")"
              status="$(jq -r '.job.summary.status // empty' <<<"$job_json")"
              commit="$(jq -r '.job.summary.commitId // empty' <<<"$job_json")"
              case "$status" in
                SUCCEED)
                  test "$commit" = "$EXPECTED_COMMIT_SHA" || {
                    echo "::error::Amplify ${branch} deployment succeeded for a different commit"; return 1;
                  }
                  echo "The ${branch} site deployed successfully for ${EXPECTED_COMMIT_SHA}."
                  return 0
                  ;;
                FAILED|CANCELLED|CANCELLING)
                  echo "::error::Amplify ${branch} deployment ended with ${status}"; return 1
                  ;;
                *)
                  echo "The ${branch} deployment job ${job_id} is ${status:-UNKNOWN}; waiting"
                  sleep 15
                  ;;
              esac
            done
            echo "::error::the ${branch} deployment exceeded the 40-minute deadline"; return 1
          }
          wait_for main "$MAIN_JOB_ID"
          wait_for "$OLYMPUS_BRANCH" "$OLYMPUS_JOB_ID"

      - name: Verify production status provenance and branch stage
        if: steps.state.outputs.bootstrap_required != 'true'
        run: |
          set -euo pipefail
          python scripts/release/check_amplify_app_contract.py \
            --mode production-status \
            --expected-commit '${{ steps.inputs.outputs.expected_commit_sha }}'
