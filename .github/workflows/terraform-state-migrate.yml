name: Migrate Terraform target-group state address

# The ALB lifecycle split has two literal resources. This workflow performs
# only the corresponding Terraform state-address migration; it never calls an
# AWS resource API and never applies a plan. Keeping it separate preserves the
# non-mutating contract of plan-only promotion jobs.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile whose state contains the legacy backend target-group address"
        type: choice
        options: [staging, production-lean, production-scale, enterprise-isolated, demo, preview]
        required: true
      confirm:
        description: "Type MIGRATE-TARGET-GROUP to authorize this state-only migration"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  # Share the promotion namespace so migration cannot race a plan or apply
  # for the same profile. The workflow's DynamoDB lock remains defense in depth.
  group: terraform-${{ inputs.profile }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: AWS Deployment/aether-aws/terraform

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reuse each profile's protected state boundary; a production state
    # migration must never be authorized by staging reviewers.
    environment:
      name: >-
        ${{ inputs.profile == 'staging' && 'staging-terraform'
        || inputs.profile == 'production-lean' && 'production-lean-terraform'
        || inputs.profile == 'production-scale' && 'production-scale-terraform'
        || inputs.profile == 'enterprise-isolated' && 'enterprise-terraform'
        || inputs.profile == 'demo' && 'demo-terraform'
        || inputs.profile == 'preview' && 'preview-terraform'
        || 'enterprise-terraform' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install policy validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate the reviewed Terraform state access contract
        run: |
          set -euo pipefail
          python3 scripts/release/check_terraform_state_access_policy.py \
            --manifest config/terraform_state_access_policy.yaml \
            --terraform-root "${TF_DIR}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify effective Terraform state permissions
        env:
          AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          python3 scripts/release/verify_terraform_state_role.py \
            --role-arn "$AWS_TERRAFORM_APPLY_ROLE_ARN" \
            --bucket "$TF_STATE_BUCKET" \
            --lock-table "$TF_LOCK_TABLE" \
            --account-id "$account_id"
      - name: Require explicit state-only confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = MIGRATE-TARGET-GROUP || {
            echo '::error::Refusing state migration: confirmation must be MIGRATE-TARGET-GROUP'
            exit 1
          }
      - name: Initialize the selected profile state
        working-directory: ${{ env.TF_DIR }}
        env:
          PROFILE: ${{ inputs.profile }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/release/terraform_init_retry.sh" -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=profiles/${PROFILE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
      - name: Migrate only the target-group state address
        working-directory: ${{ env.TF_DIR }}
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/release/migrate_alb_target_group_state.sh" "$PROFILE"
          if terraform state list | grep -Fxq 'module.alb.aws_lb_target_group.backend'; then
            echo '::error::legacy target-group state address remains after migration'
            exit 1
          fi
          terraform state list | grep -E 'module\.alb\.aws_lb_target_group\.(backend\[0\]|backend_replacement\[0\])' || true
          echo 'State address migration complete; create and review a fresh plan before apply.'
