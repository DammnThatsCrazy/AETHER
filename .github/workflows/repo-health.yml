name: Repo Health

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: repo-health-${{ github.ref }}
  cancel-in-progress: true

env:
  # Centralized paths so directory renames require a single-point update.
  BACKEND_DIR: "Backend Architecture/aether-backend"
  ML_DIR: "ML Models/aether-ml"
  AGENT_DIR: "Agent Layer"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security,backend,agent,ml]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      # ── Quality gates ──────────────────────────────────────────

      - name: Validate documentation versions
        run: python scripts/validate_docs.py

      - name: Validate documentation frontmatter
        # Fails on invalid OR missing frontmatter. Back-fill is complete as
        # of slice 3 (every tracked doc under docs/ declares visibility,
        # audience, etc.). See scripts/docs_schema.json for the canonical
        # schema and docs/_templates/page.template.mdx for new pages.
        run: python scripts/validate_frontmatter.py

      - name: Detect doc source drift
        # Hard-fails if a doc's `source_files:` frontmatter references a
        # path that doesn't exist (renamed or deleted module). Staleness
        # is advisory until `last_synced_commit` rollout completes.
        run: python scripts/docs_drift.py

      - name: Regenerate docs/_generated artifacts
        # Re-derives env.json, events.json, etc. from canonical sources.
        # The drift check below ensures the committed artifacts match.
        run: python scripts/docs_extract/run_all.py

      - name: Validate contract cross-consistency
        # Cross-checks the generated artifacts: every event's consent
        # purpose + family must exist in the canonical contracts. Runs
        # after the generators so it sees fresh JSON.
        run: python scripts/validate_contracts.py

      - name: Fail on uncommitted _generated drift
        run: |
          if [ -n "$(git status --porcelain docs/_generated/)" ]; then
            echo 'docs/_generated/*.json drift detected. Run: make extract-docs'
            git diff -- docs/_generated/
            exit 1
          fi

      - name: Regenerate generated docs
        run: python scripts/sync_docs.py

      - name: Run core tests (security + integration)
        run: python -m pytest tests/ -v --tb=short

      - name: Run ML model tests
        run: python -m pytest "$ML_DIR/tests/" -v --tb=short

      - name: Verify Python syntax (all modules)
        run: |
          python -m compileall security -q
          python -m compileall "$AGENT_DIR" -q
          python -m compileall "$BACKEND_DIR" -q

      - name: TypeScript type check
        run: npm run typecheck

      - name: TypeScript build
        run: npm run build

      - name: TypeScript tests
        run: npm run test

      - name: Circular dependency check (madge)
        run: npm run deps:circular

      - name: Check env vars documented
        run: |
          # Verify every ENABLE_* and *_SECRET_* env var in settings.py
          # has a corresponding entry in .env.example
          missing=0
          for var in $(grep -oP '"\K[A-Z_]+(?=")' "$BACKEND_DIR/config/settings.py" | sort -u); do
            if ! grep -q "^${var}=" .env.example 2>/dev/null; then
              echo "WARNING: $var not in .env.example"
            fi
          done

      # ── Doc drift detection ────────────────────────────────────

      - name: Detect uncommitted generated-doc drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain docs/REPO-INDEX.md docs/AUTOMATION.md)" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- docs/REPO-INDEX.md docs/AUTOMATION.md
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit generated docs on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.drift.outputs.drift == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/REPO-INDEX.md docs/AUTOMATION.md
          git commit -m 'docs: synchronize generated repository documentation'
          git push

      - name: Fail PRs on drift
        if: ${{ steps.drift.outputs.drift == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
        run: |
          echo 'Generated docs are out of date. Run: python scripts/sync_docs.py'
          exit 1
