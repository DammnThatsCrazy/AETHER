name: Repo Health

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: repo-health-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BACKEND_DIR: "Backend Architecture/aether-backend"
  ML_DIR: "ML Models/aether-ml"
  AGENT_DIR: "Agent Layer"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ml:
              - 'ML Models/**'

  pr-size:
    # Warn (non-blocking) when a PR exceeds 600 meaningful lines changed.
    # Generated artifacts, lockfiles, and docs stamps are excluded from the count.
    # Runs on PRs only; push events to main skip this check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count meaningful lines changed
        run: |
          CHANGED=$(git diff --shortstat "origin/${BASE_REF}...HEAD" -- \
            ':!docs/_generated/**' \
            ':!docs/REPO-INDEX.md' \
            ':!docs/AUTOMATION.md' \
            ':!package-lock.json' \
            ':!**/package-lock.json' \
            | awk '/insertion|deletion/{for(i=1;i<=NF;i++) if($i~/^[0-9]+$/ && ($(i+1)~/^insertion/ || $(i+1)~/^deletion/)) sum+=$i} END{print sum+0}' || echo 0)
          echo "Meaningful lines changed: ${CHANGED}"
          if [ "${CHANGED}" -gt 600 ]; then
            echo "::warning::PR changes ${CHANGED} lines (soft limit: 600 excluding generated/lockfiles). Consider splitting into smaller PRs for easier review."
          fi

  lint-docs:
    # Read-only validation job — runs on both PRs and pushes.
    # Has no write permissions so that attacker-controlled scripts in a PR
    # cannot push to the repository even if they escape the validation steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies (dev only)
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Validate documentation versions
        run: python scripts/validate_docs.py

      - name: Validate documentation frontmatter
        run: python scripts/validate_frontmatter.py

      - name: Detect doc source drift (strict)
        run: python scripts/docs_drift.py --strict

      - name: Regenerate docs/_generated artifacts
        run: python scripts/docs_extract/run_all.py

      - name: Validate contract cross-consistency
        run: python scripts/validate_contracts.py

      - name: Fail on uncommitted _generated drift
        run: |
          if [ -n "$(git status --porcelain docs/_generated/)" ]; then
            echo 'docs/_generated/*.json drift detected. Run: make extract-docs'
            git diff -- docs/_generated/
            exit 1
          fi

      - name: Regenerate generated docs
        run: python scripts/sync_docs.py

      - name: Check env vars documented
        run: |
          for var in $(grep -oP '"\K[A-Z_]+(?=")' "${BACKEND_DIR}/config/settings.py" | sort -u); do
            if ! grep -q "^${var}=" .env.example 2>/dev/null; then
              echo "WARNING: $var not in .env.example"
            fi
          done

      - name: Detect uncommitted generated-doc drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain docs/REPO-INDEX.md docs/AUTOMATION.md)" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- docs/REPO-INDEX.md docs/AUTOMATION.md
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail PRs on drift
        if: ${{ steps.drift.outputs.drift == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
        run: |
          echo 'Generated docs are out of date. Run: python scripts/sync_docs.py'
          exit 1

  docs-sync:
    # Write-capable job — auto-commits regenerated docs on push to main only.
    # Separated from lint-docs so that contents:write is never granted to a job
    # that checks out and executes PR-head scripts.
    needs: lint-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Always check out the canonical main SHA, never the PR head.
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies (dev only)
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Regenerate generated docs
        run: python scripts/sync_docs.py

      - name: Commit if drifted
        run: |
          if [ -n "$(git status --porcelain docs/REPO-INDEX.md docs/AUTOMATION.md)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/REPO-INDEX.md docs/AUTOMATION.md
            git commit -m 'docs: synchronize generated repository documentation [skip ci]'
            git push origin HEAD:refs/heads/main
          fi

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,security,backend,agent]"

      - name: Lint Python
        run: python -m ruff check .

      - name: Run core tests (security + integration)
        run: python -m pytest tests/ -n auto --tb=short

      - name: Verify Python syntax (all modules)
        run: |
          python -m compileall security -q
          python -m compileall "$AGENT_DIR" -q
          python -m compileall "$BACKEND_DIR" -q

  ml-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies (with ML extras)
        run: |
          pip install uv
          uv pip install --system -e ".[dev,security,backend,agent,ml]"

      - name: Run ML model tests
        run: python -m pytest "$ML_DIR/tests/" --tb=short

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript lint/static checks
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: TypeScript build
        run: npm run build

      - name: TypeScript tests
        run: npm run test

      - name: Circular dependency check (madge)
        run: npm run deps:circular

  validate:
    # Aggregate gate: required-status check for branch protection rules.
    # Passes only when all dependent jobs pass (or skip via path filter).
    # pr-size is advisory only — it runs independently and never blocks this gate.
    needs: [lint-docs, python-tests, ml-tests, typescript]
    if: always()
    runs-on: ubuntu-latest
    env:
      LINT_DOCS_RESULT:    ${{ needs.lint-docs.result }}
      PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
      TYPESCRIPT_RESULT:   ${{ needs.typescript.result }}
      ML_TESTS_RESULT:     ${{ needs.ml-tests.result }}
    steps:
      - name: Check job results
        run: |
          # If any job was cancelled the whole workflow was superseded by a
          # newer concurrency-group run. Exit 0 so the stale check doesn't
          # block the PR; the newer run will provide the authoritative result.
          for result in \
            "$LINT_DOCS_RESULT" \
            "$PYTHON_TESTS_RESULT" \
            "$TYPESCRIPT_RESULT" \
            "$ML_TESTS_RESULT"; do
            if [ "$result" = "cancelled" ]; then
              echo "Jobs cancelled — superseded by a newer run. Skipping."; exit 0
            fi
          done
          if [ "$LINT_DOCS_RESULT" != "success" ]; then
            echo "lint-docs failed: $LINT_DOCS_RESULT"; exit 1
          fi
          if [ "$PYTHON_TESTS_RESULT" != "success" ]; then
            echo "python-tests failed: $PYTHON_TESTS_RESULT"; exit 1
          fi
          if [ "$TYPESCRIPT_RESULT" != "success" ]; then
            echo "typescript failed: $TYPESCRIPT_RESULT"; exit 1
          fi
          # ml-tests is allowed to skip via path filter
          if [ "$ML_TESTS_RESULT" != "success" ] && [ "$ML_TESTS_RESULT" != "skipped" ]; then
            echo "ml-tests failed: $ML_TESTS_RESULT"; exit 1
          fi
          echo "All required jobs passed."
