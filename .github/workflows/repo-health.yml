name: Repo Health

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: repo-health-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_DIR: "Backend Architecture/aether-backend"
  ML_DIR: "ML Models/aether-ml"
  AGENT_DIR: "Agent Layer"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ml:
              - 'ML Models/**'
              - 'packages/shared/profile360-contract.ts'
              - 'packages/shared/entities.ts'
              - 'packages/shared/entity-extensions.ts'

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies (dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate documentation versions
        run: python scripts/validate_docs.py

      - name: Validate documentation frontmatter
        run: python scripts/validate_frontmatter.py

      - name: Detect doc source drift (strict)
        run: python scripts/docs_drift.py --strict

      - name: Regenerate docs/_generated artifacts
        run: python scripts/docs_extract/run_all.py

      - name: Validate contract cross-consistency
        run: python scripts/validate_contracts.py

      - name: Fail on uncommitted _generated drift
        run: |
          if [ -n "$(git status --porcelain docs/_generated/)" ]; then
            echo 'docs/_generated/*.json drift detected. Run: make extract-docs'
            git diff -- docs/_generated/
            exit 1
          fi

      - name: Regenerate generated docs
        run: python scripts/sync_docs.py

      - name: Check env vars documented
        run: |
          for var in $(grep -oP '"\K[A-Z_]+(?=")' "$BACKEND_DIR/config/settings.py" | sort -u); do
            if ! grep -q "^${var}=" .env.example 2>/dev/null; then
              echo "WARNING: $var not in .env.example"
            fi
          done

      - name: Detect uncommitted generated-doc drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain docs/REPO-INDEX.md docs/AUTOMATION.md)" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- docs/REPO-INDEX.md docs/AUTOMATION.md
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit generated docs on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.drift.outputs.drift == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/REPO-INDEX.md docs/AUTOMATION.md
          git commit -m 'docs: synchronize generated repository documentation'
          git push

      - name: Fail PRs on drift
        if: ${{ steps.drift.outputs.drift == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
        run: |
          echo 'Generated docs are out of date. Run: python scripts/sync_docs.py'
          exit 1

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security,backend,agent]"

      - name: Run core tests (security + integration)
        run: python -m pytest tests/ -n auto --tb=short

      - name: Verify Python syntax (all modules)
        run: |
          python -m compileall security -q
          python -m compileall "$AGENT_DIR" -q
          python -m compileall "$BACKEND_DIR" -q

  ml-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies (with ML extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run ML model tests
        run: python -m pytest "$ML_DIR/tests/" -n auto --tb=short

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type check
        run: npm run typecheck

      - name: TypeScript build
        run: npm run build

      - name: TypeScript tests
        run: npm run test

      - name: Circular dependency check (madge)
        run: npm run deps:circular

  validate:
    # Aggregate gate: required-status check for branch protection rules.
    # Passes only when all dependent jobs pass (or skip via path filter).
    needs: [lint-docs, python-tests, ml-tests, typescript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.lint-docs.result }}" != "success" ]; then
            echo "lint-docs failed: ${{ needs.lint-docs.result }}"; exit 1
          fi
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "python-tests failed: ${{ needs.python-tests.result }}"; exit 1
          fi
          if [ "${{ needs.typescript.result }}" != "success" ]; then
            echo "typescript failed: ${{ needs.typescript.result }}"; exit 1
          fi
          # ml-tests is allowed to skip via path filter
          if [ "${{ needs.ml-tests.result }}" != "success" ] && [ "${{ needs.ml-tests.result }}" != "skipped" ]; then
            echo "ml-tests failed: ${{ needs.ml-tests.result }}"; exit 1
          fi
          echo "All required jobs passed."
