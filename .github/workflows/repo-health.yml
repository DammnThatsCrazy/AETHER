name: Repo Health

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repo-health-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BACKEND_DIR: "Backend Architecture/aether-backend"
  ML_DIR: "ML Models/aether-ml"
  AGENT_DIR: "Agent Layer"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ml:
              - 'ML Models/**'
              - 'Backend Architecture/aether-backend/services/ml_serving/**'
              - 'security/model_extraction_defense/**'
              - 'scripts/validate_ml_registry.py'
              - 'scripts/generate_ml_manifest.py'
              - 'deploy/**'
              - 'AWS Deployment/**'
              - 'frontend/kyber/src/features/ml/**'
              - 'frontend/kyber/src/pages/ml/**'

  pr-size:
    # Warn (non-blocking) when a PR exceeds 600 meaningful lines changed.
    # Generated artifacts, lockfiles, and docs stamps are excluded from the count.
    # Runs on PRs only; push events to main skip this check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count meaningful lines changed
        run: |
          CHANGED=$(git diff --shortstat "origin/${BASE_REF}...HEAD" -- \
            ':!docs/_generated/**' \
            ':!docs/REPO-INDEX.md' \
            ':!docs/AUTOMATION.md' \
            ':!package-lock.json' \
            ':!**/package-lock.json' \
            | awk '/insertion|deletion/{for(i=1;i<=NF;i++) if($i~/^[0-9]+$/ && ($(i+1)~/^insertion/ || $(i+1)~/^deletion/)) sum+=$i} END{print sum+0}' || echo 0)
          echo "Meaningful lines changed: ${CHANGED}"
          if [ "${CHANGED}" -gt 600 ]; then
            echo "::warning::PR changes ${CHANGED} lines (soft limit: 600 excluding generated/lockfiles). Consider splitting into smaller PRs for easier review."
          fi

  lint-docs:
    # Read-only validation job — runs on both PRs and pushes.
    # Has no write permissions so that attacker-controlled scripts in a PR
    # cannot push to the repository even if they escape the validation steps.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run canonical docs consistency gate
        run: make docs-check

      - name: Print generated-doc diagnostics on failure
        if: failure()
        run: |
          git diff --stat -- docs/_generated docs/REPO-INDEX.md docs/AUTOMATION.md || true
          git diff --name-only -- docs/_generated docs/REPO-INDEX.md docs/AUTOMATION.md || true
          echo 'Remediation: make repo-doctor-fix && commit docs/_generated docs/REPO-INDEX.md docs/AUTOMATION.md'

  docs-sync:
    # Write-capable job — auto-commits regenerated docs on push to main only.
    # Separated from lint-docs so that contents:write is never granted to a job
    # that checks out and executes PR-head scripts.
    needs: lint-docs
    # always() so that a read-only lint-docs failure (e.g. generated drift it can
    # only report, never fix) does not skip the trusted-main auto-sync that fixes it.
    # Still strictly gated to pushes to main — never runs on PR-head, never write on PRs.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Always check out the canonical main SHA, never the PR head.
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Regenerate generated docs
        run: make docs-fix

      - name: Commit if drifted
        run: |
          if [ -n "$(git status --porcelain docs/_generated docs/REPO-INDEX.md docs/AUTOMATION.md)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/_generated docs/REPO-INDEX.md docs/AUTOMATION.md
            git commit -m 'docs: synchronize generated repository documentation [skip ci]'
            git push origin HEAD:refs/heads/main
          fi

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint Python
        run: python -m ruff check .

      - name: Run core tests (security + integration)
        run: python -m pytest tests/ -n auto --tb=short

      - name: Verify Python syntax (all modules)
        run: |
          python -m compileall security -q
          python -m compileall "$AGENT_DIR" -q
          python -m compileall "$BACKEND_DIR" -q

  backend-tests:
    # Full backend test tree (all 225 files / ~2600+ tests under
    # `$BACKEND_DIR/tests/`), not a hand-picked subset. Historically this job
    # ran only the Noesis-named files plus tests/contracts/ — everything else
    # under the backend tree (campaign, derivatives, semantic intelligence,
    # kyber, graph, value, etc.) never executed in CI. The invocation below is
    # generated from the canonical suite registry
    # (config/test_suites.yaml + scripts/lib/test_suites.py, owned by a sibling
    # workstream) when that registry is present, so the set of backend suites
    # is defined once and consumed here rather than hardcoded. Until that
    # registry lands, this falls back to running the full tree directly --
    # never to the old hardcoded subset.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOESIS_ENABLED: "true"
      NOESIS_LLM_ENABLED: "false"
      NOESIS_DEBUG_ENABLED: "false"
      AETHER_ENV: "local"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run full backend test tree (canonical suite registry, with full-tree fallback)
        run: |
          set -euo pipefail
          if python -c "import scripts.lib.test_suites" >/dev/null 2>&1; then
            echo "config/test_suites.yaml registry detected -- generating invocation from it"
            python - <<'PY'
          import subprocess
          import sys

          from scripts.lib.test_suites import build_command, load_suites, suites_for

          suites = load_suites("config/test_suites.yaml")
          backend_suites = suites_for(suites, "backend")
          if not backend_suites:
              sys.exit("config/test_suites.yaml declares no backend suites -- refusing to silently run nothing")
          for suite in backend_suites:
              cmd = build_command(suite)
              print(f"+ {cmd}")
              rc = subprocess.call(cmd, shell=isinstance(cmd, str))
              if rc != 0:
                  sys.exit(rc)
          PY
          else
            echo "config/test_suites.yaml / scripts/lib/test_suites.py not present yet in this tree" \
                 "(pending the canonical-suite-registry workstream) -- running the full backend tree directly."
            cd "$BACKEND_DIR"
            python -m pytest tests/ -v --tb=short -n auto
          fi

  ml-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # ml-docs-check runs docs_drift.py, which resolves each doc's
          # last_synced_commit against history. A shallow clone puts older
          # stamps beyond the fetch horizon, and the drift gate correctly
          # refuses to score an unverifiable stamp as fresh.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ML registry + contract validation
        run: make ml-validate

      - name: ML tests (unit + integration + training smoke)
        run: python -m pytest "$ML_DIR/tests/" -v --tb=short

      - name: ML docs consistency check
        run: make ml-docs-check

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build web package
        run: npm run build --workspace=packages/web

      - name: TypeScript lint/static checks
        run: npm run lint

      - name: TypeScript public export/package boundary validation
        run: npm run validate:ts-public-exports

      - name: TypeScript type check
        run: npm run typecheck

      - name: TypeScript build
        run: npm run build

      - name: TypeScript tests
        run: npm run test

      - name: Circular dependency check (madge)
        run: npm run deps:circular

      - name: Secret scanning
        run: npm run security:secrets

      - name: Dependency audit
        run: npm run security:deps

  e2e-tenant:
    needs: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tenant onboarding E2E tests
        run: cd frontend/aether && npm run e2e
        env:
          CI: true

  staging-preflight-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Bootstrap toolchain (.venv + fail-closed dependency gate)
        run: make bootstrap

      - name: Add project virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Staging preflight logic self-test (dry-run)
        run: python scripts/staging_preflight.py --dry-run

  validate:
    # Aggregate gate: required-status check for branch protection rules.
    # Passes only when every dependent job actually succeeded. A cancelled
    # job is treated as a FAILURE, not auto-passed: GitHub Actions required
    # status checks are scoped to the current head SHA, so a concurrency-
    # cancelled OLD run reporting failure cannot block a NEWER commit's
    # checks -- there is no safe reason to blanket-trust "cancelled == was
    # superseded". ml-tests is the only job allowed to conclude "skipped",
    # and only because detect-changes (verified success below) is what
    # decides whether ML paths were touched -- a "skipped" conclusion is
    # trustworthy only when the job that produced the skip condition itself
    # ran cleanly.
    # pr-size is advisory only — it runs independently and never blocks this gate.
    needs: [detect-changes, lint-docs, python-tests, backend-tests, ml-tests, typescript, e2e-tenant, staging-preflight-dry-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DETECT_CHANGES_RESULT:     ${{ needs.detect-changes.result }}
      LINT_DOCS_RESULT:          ${{ needs.lint-docs.result }}
      PYTHON_TESTS_RESULT:       ${{ needs.python-tests.result }}
      BACKEND_TESTS_RESULT:      ${{ needs.backend-tests.result }}
      TYPESCRIPT_RESULT:         ${{ needs.typescript.result }}
      ML_TESTS_RESULT:           ${{ needs.ml-tests.result }}
      E2E_TENANT_RESULT:         ${{ needs.e2e-tenant.result }}
      PREFLIGHT_DRY_RUN_RESULT:  ${{ needs.staging-preflight-dry-run.result }}
    steps:
      - name: Check job results
        run: |
          set -euo pipefail
          if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
            echo "detect-changes failed: $DETECT_CHANGES_RESULT"; exit 1
          fi
          if [ "$LINT_DOCS_RESULT" != "success" ]; then
            echo "lint-docs failed: $LINT_DOCS_RESULT"; exit 1
          fi
          if [ "$PYTHON_TESTS_RESULT" != "success" ]; then
            echo "python-tests failed: $PYTHON_TESTS_RESULT"; exit 1
          fi
          if [ "$BACKEND_TESTS_RESULT" != "success" ]; then
            echo "backend-tests failed: $BACKEND_TESTS_RESULT"; exit 1
          fi
          if [ "$TYPESCRIPT_RESULT" != "success" ]; then
            echo "typescript failed: $TYPESCRIPT_RESULT"; exit 1
          fi
          # ml-tests is allowed to skip via path filter -- trustworthy only
          # because detect-changes (checked above) is required to have
          # actually succeeded before we accept its "no ML paths" verdict.
          if [ "$ML_TESTS_RESULT" != "success" ] && [ "$ML_TESTS_RESULT" != "skipped" ]; then
            echo "ml-tests failed: $ML_TESTS_RESULT"; exit 1
          fi
          if [ "$E2E_TENANT_RESULT" != "success" ]; then
            echo "e2e-tenant failed: $E2E_TENANT_RESULT"; exit 1
          fi
          if [ "$PREFLIGHT_DRY_RUN_RESULT" != "success" ]; then
            echo "staging-preflight-dry-run failed: $PREFLIGHT_DRY_RUN_RESULT"; exit 1
          fi
          echo "All required jobs passed."

      - name: Record repo-health evidence
        run: |
          mkdir -p release-evidence
          printf '{"sha":"%s","job":"validate"}\n' "$GITHUB_SHA" > release-evidence/repo-health-validate.json

      - uses: actions/upload-artifact@v4
        with:
          name: repo-health-validate-evidence
          path: release-evidence/repo-health-validate.json
