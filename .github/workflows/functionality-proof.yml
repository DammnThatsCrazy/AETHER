name: Functionality Proof Spine (CI)

# ---------------------------------------------------------------------
# AETHER FUNCTIONALITY PROOF SPINE — CI GATE
# ---------------------------------------------------------------------
# This is the full-spectrum CI pipeline that proves the Aether
# functionality contract end-to-end: from lint/type-check through unit
# tests, contract verification, SDK tests, connector fixtures, integration,
# graph, e2e, and a final build.
#
# BLOCKING BEHAVIOR (merge gate):
#   - lint ........ fails the PR if any workspace has lint errors
#   - typecheck ... fails the PR if any TypeScript project has type errors
#   - test ........ fails the PR if any workspace unit/integration tests fail
#   - contracts ... FAIL FAST — contract assertion failures block merge.
#                   A contract failure means the functional contract between
#                   packages is broken; the PR must not land until contracts
#                   are restored.
#   - sdk ......... fails the PR if the Aether SDK (packages/web) tests fail
#   - connectors-fixtures ... fails the PR if connector fixture tests fail
#   - integration . fails the PR if integration tests fail
#   - graph ........ fails the PR if graph-related tests fail
#   - e2e ......... conditional: only runs on pushes to main or from the
#                   canonical repo (not external PR forks). E2E failures block
#                   merge when the job runs.
#   - build ....... fails the PR if the production build fails
#   - upload-artifacts ... final evidence collection; does not block merge
#                         but uploads proof artifacts and test results for
#                         audit and release-readiness review.
#
# PIPELINE FLOW:
#   lint → typecheck → test → contracts → sdk → connectors-fixtures →
#   integration → graph → e2e → build → upload-artifacts
#
# Each job re-checks out the code and runs pnpm install to ensure a clean,
# isolated environment. This is intentional: it prevents cross-job pollution
# and ensures each stage is reproducible.
# ---------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functionality-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  AETHER_ENV: ci

jobs:
  # -------------------------------------------------------------------
  # lint — Fast feedback gate. Catches style/format issues before heavier
  # stages consume CI minutes. Blocks merge on any lint error.
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run lint (proof-scoped packages)
        run: |
          pnpm -r --if-present \
               --filter '@aether/proof-contracts' \
               --filter '@aether/aether-marketing' \
               --filter '@olympus/olympus-marketing' \
               --filter '@aether/demo' \
               run lint

  # -------------------------------------------------------------------
  # typecheck — Catches type-level contract violations. Blocks merge on
  # any type error. Runs after lint so lint issues surface first.
  # -------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run typecheck (proof-scoped packages)
        run: |
          pnpm -r --if-present \
               --filter '@aether/proof-contracts' \
               --filter '@aether/aether-marketing' \
               --filter '@olympus/olympus-marketing' \
               --filter '@aether/demo' \
               run typecheck

  # -------------------------------------------------------------------
  # test — Unit and integration tests across all workspaces. Blocks merge
  # on any test failure. Runs after typecheck so type errors surface first.
  # -------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run tests (proof-scoped packages)
        run: |
          pnpm -r --if-present \
               --filter '@aether/aether-marketing' \
               --filter '@olympus/olympus-marketing' \
               run test

  # -------------------------------------------------------------------
  # contracts — CONTRACT FAIL FAST GATE.
  #
  # Contract tests assert the functional boundaries between packages:
  # shared types, API surface, event schemas, consent registry, etc.
  # A contract failure means the internal API contract is broken and the
  # PR MUST NOT merge until contracts are restored.
  #
  # Fail-fast: any contract failure immediately blocks merge.
  # This job runs after unit tests so that contract failures are not
  # masked by underlying test infrastructure issues.
  # -------------------------------------------------------------------
  contracts:
    name: Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run contract tests (FAIL FAST — blocks merge on failure)
        run: pnpm --filter '@aether/proof-contracts' run test

  # -------------------------------------------------------------------
  # sdk — SDK-specific tests for packages/web (@aether/web).
  # Blocks merge if SDK functionality is broken.
  # -------------------------------------------------------------------
  sdk:
    name: SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run SDK tests
        run: pnpm --filter '@aether/web' run test

  # -------------------------------------------------------------------
  # smoke-web — Smoke test the web SDK sample apps (web-next + web-script-tag)
  # against the local ingestion endpoint. Blocks merge if the canonical
  # first-value journey fails.
  # -------------------------------------------------------------------
  smoke-web:
    name: Web SDK Smoke (First-Value Journey)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run web SDK smoke tests (web-next + web-script-tag)
        run: |
          cd examples/web-next
          pnpm install --frozen-lockfile
          npx vitest run --config vitest.smoke.config.ts
          cd ../web-script-tag
          # script-tag smoke: validate the HTML snippet loads the SDK and
          # exercises the first-value journey (see scripts/smoke/web-sdk.ts)
          node ../../scripts/smoke/web-sdk.ts

  # -------------------------------------------------------------------
  # smoke-server — Smoke test the server-node example against the local
  # ingestion endpoint. Blocks merge if the server SDK first-value journey
  # fails.
  # -------------------------------------------------------------------
  smoke-server:
    name: Server SDK Smoke (First-Value Journey)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run server SDK smoke tests (server-node)
        run: |
          cd examples/server-node
          pnpm install --frozen-lockfile
          npx tsc --noEmit
          node ../../scripts/smoke/staging.ts
          # Run the server-node example against the local ingestion endpoint.
          # The example exercises init → heartbeat → event → commerce → flush.
          node src/index.ts

  # -------------------------------------------------------------------
  # connectors-fixtures — Tests connector fixtures resolve correctly.
  # Blocks merge if connector data fixtures are broken.
  # -------------------------------------------------------------------
  connectors-fixtures:
    name: Connector Fixtures Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run connector fixture tests
        run: pnpm --filter '@aether/proof-fixtures' run test

  # -------------------------------------------------------------------
  # integration — Full integration tests across services. Blocks merge
  # if integration scenarios fail.
  # -------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: connectors-fixtures
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run integration tests
        run: pnpm --filter '@aether/proof-runner' run test

  # -------------------------------------------------------------------
  # graph — Graph/analytics pipeline tests. Blocks merge if graph
  # operations are broken.
  # -------------------------------------------------------------------
  graph:
    name: Graph Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run graph tests
        run: pnpm --filter '@aether/proof-runner' run test

  # -------------------------------------------------------------------
  # e2e — End-to-end browser tests (Playwright/Cypress via frontend/kyber).
  #
  # CONDITIONAL EXECUTION: Only runs when the change comes from the
  # canonical repository (not external PR forks) OR when triggered by a
  # push to main. This prevents external contributors from triggering
  # expensive e2e runs while still gating merges from trusted sources.
  #
  # Blocks merge when it runs and fails.
  # -------------------------------------------------------------------
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: graph
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == 'DammnThatsCrazy/AETHER' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run e2e tests
        run: pnpm test:e2e

  # -------------------------------------------------------------------
  # build — Production build across all workspaces. Blocks merge if the
  # build fails. Runs after e2e so that the build is validated against
  # the code that passed all functional tests.
  # -------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Run production build
        run: pnpm build

  # -------------------------------------------------------------------
  # upload-artifacts — Collects and uploads proof artifacts and test
  # results for audit, release-readiness review, and post-mortem analysis.
  #
  # This is the terminal job. It does not block merge but provides the
  # evidence artifact that reviewers and release processes consume.
  # -------------------------------------------------------------------
  upload-artifacts:
    name: Upload Proof Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all test artifacts from upstream jobs
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - name: Collect proof artifacts
        run: |
          mkdir -p proof-artifacts
          # Copy any build outputs
          if [ -d "packages/web/dist" ]; then
            cp -r packages/web/dist proof-artifacts/web-dist/
          fi
          if [ -d "packages/shared/dist" ]; then
            cp -r packages/shared/dist proof-artifacts/shared-dist/
          fi
          # Copy test results if present
          if [ -d "artifacts" ]; then
            cp -r artifacts proof-artifacts/test-results/
          fi

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-functionality-proof-${{ github.run_id }}
          path: proof-artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results as separate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-test-results-${{ github.run_id }}
          path: |
            **/test-results/**
            **/coverage/**
          retention-days: 30
          if-no-files-found: warn
