name: Smart Contract Static Analysis

# Runs Slither on every PR or push that touches Smart Contracts/**
# so audit-relevant issues are caught before they reach main.
#
# Slither findings are uploaded as a SARIF artifact (not blocking CI)
# so reviewers can triage without every new finding hard-failing the build.
# Hard failure is reserved for HIGH / CRITICAL severity; MEDIUM and below
# are surfaced as warnings only.

on:
  pull_request:
    paths:
      - 'Smart Contracts/**'
      - '.github/workflows/smart-contract-analysis.yml'
  push:
    branches:
      - main
    paths:
      - 'Smart Contracts/**'

permissions:
  contents: read
  security-events: write  # needed for SARIF upload

concurrency:
  group: smart-contract-analysis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Smart Contracts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for Hardhat / solc)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'Smart Contracts/package-lock.json'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Compile contracts (Hardhat)
        run: npx hardhat compile
        env:
          REPORT_GAS: false

      - name: Set up Python (for Slither)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither — human-readable summary
        # --fail-high exits non-zero only for HIGH+ severity findings
        # --exclude-optimization suppresses optimizer false positives
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --print human-summary \
            || true

      - name: Run Slither — SARIF output
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --sarif results.sarif \
            || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: Smart Contracts/results.sarif
        continue-on-error: true

      - name: Fail on HIGH/CRITICAL findings
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --fail-high
