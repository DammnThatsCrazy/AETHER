name: Smart Contract Static Analysis

# Runs Slither on PR finalization or push to main when
# packages/contracts/smart-contracts/** is touched. The Hardhat contract tests run
# as the `smart-contracts` suite under ci.yml; Slither also runs there as the
# `contracts-slither` check, and this workflow keeps the SARIF upload to code
# scanning.
#
# Slither findings are uploaded as a SARIF artifact for reviewer triage.
# Hard failure is reserved for HIGH / CRITICAL severity; MEDIUM and below
# are surfaced as warnings only via the human-summary print. Every Slither
# invocation below fails the job on a real tool error (no `|| true`) --
# only finding-severity is filtered, never tool crashes/misconfiguration.

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'packages/contracts/smart-contracts/**'
      - '.github/workflows/smart-contract-analysis.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/contracts/smart-contracts/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # needed for SARIF upload

concurrency:
  group: smart-contract-analysis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: packages/contracts/smart-contracts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for Hardhat / solc)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'packages/contracts/smart-contracts/package-lock.json'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Compile contracts (Hardhat)
        run: npx hardhat compile
        env:
          REPORT_GAS: false

      - name: Set up Python (for Slither)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither — human-readable summary
        # No `|| true` here: a real Slither crash (bad artifacts, tool
        # misconfiguration) must fail the job, not be silently swallowed.
        # The summary printer never fails on findings; the blocking pass is the
        # SARIF step below.
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --print human-summary

      - name: Run Slither — SARIF output (blocking gate)
        # Blocks on MEDIUM and HIGH findings. Informational/low classes
        # (pragma spread, solc-version advisories, timestamp expiry checks,
        # assembly in ecrecover, cyclomatic complexity) are advisory and are
        # excluded from the exit code but still visible in the summary above.
        # Accepted medium findings are triaged IN SOURCE via
        # `slither-disable-next-line` with a written justification at the exact
        # site — never by weakening this invocation. A new medium or high
        # finding fails this job.
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --exclude-informational \
            --exclude-low \
            --sarif results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: packages/contracts/smart-contracts/results.sarif
        continue-on-error: true

      - name: Fail on HIGH/CRITICAL findings
        # --fail-high exits non-zero only for HIGH+ severity findings
        # --exclude-optimization suppresses optimizer false positives
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --fail-high

      - name: Record slither evidence
        run: |
          mkdir -p ../release-evidence
          printf '{"sha":"%s","job":"slither"}\n' "$GITHUB_SHA" > ../release-evidence/smart-contract-analysis.json

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # diagnostic upload; must not decide the verdict
        with:
          retention-days: 7
          name: smart-contract-analysis-evidence
          path: release-evidence/smart-contract-analysis.json
