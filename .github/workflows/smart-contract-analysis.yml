name: Smart Contract Static Analysis

# Runs Slither and the Hardhat contract test suite on every PR or push that
# touches Smart Contracts/** so audit-relevant issues are caught before they
# reach main.
#
# Slither findings are uploaded as a SARIF artifact for reviewer triage.
# Hard failure is reserved for HIGH / CRITICAL severity; MEDIUM and below
# are surfaced as warnings only via the human-summary print. Every Slither
# invocation below fails the job on a real tool error (no `|| true`) --
# only finding-severity is filtered, never tool crashes/misconfiguration.

on:
  pull_request:
    paths:
      - 'Smart Contracts/**'
      - '.github/workflows/smart-contract-analysis.yml'
  push:
    branches:
      - main
    paths:
      - 'Smart Contracts/**'

permissions:
  contents: read
  security-events: write  # needed for SARIF upload

concurrency:
  group: smart-contract-analysis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Smart Contracts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for Hardhat / solc)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'Smart Contracts/package-lock.json'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Compile contracts (Hardhat)
        run: npx hardhat compile
        env:
          REPORT_GAS: false

      - name: Set up Python (for Slither)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither — human-readable summary
        # No `|| true` here: a real Slither crash (bad artifacts, tool
        # misconfiguration) must fail the job, not be silently swallowed.
        # Only *finding severity* is filtered (via --fail-high below), never
        # tool errors.
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --print human-summary

      - name: Run Slither — SARIF output
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --sarif results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: Smart Contracts/results.sarif
        continue-on-error: true

      - name: Fail on HIGH/CRITICAL findings
        # --fail-high exits non-zero only for HIGH+ severity findings
        # --exclude-optimization suppresses optimizer false positives
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude-optimization \
            --exclude-dependencies \
            --fail-high

      - name: Record slither evidence
        run: |
          mkdir -p ../release-evidence
          printf '{"sha":"%s","job":"slither"}\n' "$GITHUB_SHA" > ../release-evidence/smart-contract-analysis.json

      - uses: actions/upload-artifact@v4
        with:
          name: smart-contract-analysis-evidence
          path: release-evidence/smart-contract-analysis.json

  contract-tests:
    # Smart Contracts/test/ was not run by any gate. This job closes that gap
    # by running the Hardhat contract test suite (npm test -> `hardhat test`)
    # on the same triggers as Slither.
    name: Hardhat contract test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Smart Contracts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for Hardhat / solc)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'Smart Contracts/package-lock.json'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Compile contracts (Hardhat)
        run: npx hardhat compile
        env:
          REPORT_GAS: false

      - name: Run Hardhat contract test suite
        run: npm test

      - name: Record contract-tests evidence
        run: |
          mkdir -p ../release-evidence
          printf '{"sha":"%s","job":"contract-tests"}\n' "$GITHUB_SHA" > ../release-evidence/contract-tests.json

      - uses: actions/upload-artifact@v4
        with:
          name: contract-tests-evidence
          path: release-evidence/contract-tests.json
