name: Publish Access Kit MCP image

# Publishes an immutable, scanned image only. Terraform remains the separate
# reviewed path for creating the repository and deploying the ECS service.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Account whose aether-access-mcp repository receives the image (each is published from its own protected environment)
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
      aws_region:
        description: AWS region containing the target Access MCP repository
        type: string
        required: true
        default: us-east-1

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-access-mcp-image-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  require-production-reviewers:
    # Production publishes only from main. Staging may publish from main or the
    # staging branch so a staging rehearsal can certify the exact staging SHA.
    if: >-
      github.ref == 'refs/heads/main'
      || (inputs.target == 'staging' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require configured reviewers on the target environment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in production|staging) ;; *) echo '::error::target must be production or staging'; exit 1 ;; esac
          if ! environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/${TARGET}")"; then
            echo "::error::Create ${TARGET} and configure at least one required reviewer before publishing an AWS image."
            exit 1
          fi
          if ! jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length > 0))' <<<"$environment_json" >/dev/null; then
            echo "::error::${TARGET} must have at least one required reviewer; a named environment alone is not an approval gate."
            exit 1
          fi

  publish:
    if: >-
      github.ref == 'refs/heads/main'
      || (inputs.target == 'staging' && github.ref == 'refs/heads/staging')
    needs: require-production-reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require configured publisher role and valid region
        env:
          PUBLISH_ROLE_ARN: ${{ secrets.AWS_ACCESS_MCP_PUBLISH_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || {
            echo '::error::Configure AWS_ACCESS_MCP_PUBLISH_ROLE_ARN in the protected target environment.'
            exit 1
          }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]] || {
            echo '::error::aws_region must be a valid AWS region identifier.'
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACCESS_MCP_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish and verify exact immutable image digest
        id: publish
        run: |
          set -euo pipefail
          digest="$(bash infra/aws/terraform/scripts/publish_access_mcp_image.sh)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/access-mcp-image-digest.txt"
          printf 'Source commit: `%s`\nImage digest: `%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest for the reviewed Terraform promotion
        uses: actions/upload-artifact@v4
        with:
          name: access-mcp-image-digest-${{ inputs.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/access-mcp-image-digest.txt
          if-no-files-found: error
