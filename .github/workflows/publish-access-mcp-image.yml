name: Publish Access Kit MCP image

# Publishes an immutable, scanned image only. Terraform remains the separate
# reviewed path for creating the repository and deploying the ECS service.
on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the production Access MCP repository
        type: string
        required: true
        default: us-east-1

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-access-mcp-image
  cancel-in-progress: false

jobs:
  require-production-reviewers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require configured production reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"; then
            echo '::error::Create production and configure at least one required reviewer before publishing an AWS image.'
            exit 1
          fi
          if ! jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length > 0))' <<<"$environment_json" >/dev/null; then
            echo '::error::production must have at least one required reviewer; a named environment alone is not an approval gate.'
            exit 1
          fi

  publish:
    if: github.ref == 'refs/heads/main'
    needs: require-production-reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AWS_REGION: ${{ inputs.aws_region }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require configured publisher role and valid region
        env:
          PUBLISH_ROLE_ARN: ${{ secrets.AWS_ACCESS_MCP_PUBLISH_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || {
            echo '::error::Configure AWS_ACCESS_MCP_PUBLISH_ROLE_ARN in the protected production environment.'
            exit 1
          }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]] || {
            echo '::error::aws_region must be a valid AWS region identifier.'
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACCESS_MCP_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish and verify exact immutable image digest
        id: publish
        run: |
          set -euo pipefail
          digest="$(bash infra/aws/terraform/scripts/publish_access_mcp_image.sh)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/access-mcp-image-digest.txt"
          printf 'Source commit: `%s`\nImage digest: `%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest for the reviewed Terraform promotion
        uses: actions/upload-artifact@v4
        with:
          name: access-mcp-image-digest-${{ github.sha }}
          path: ${{ runner.temp }}/access-mcp-image-digest.txt
          if-no-files-found: error
