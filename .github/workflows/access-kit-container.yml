name: Access Kit Container

# Build the exact linux/amd64 runtime artifact on a clean hosted runner. This
# keeps the cloud image build independently verifiable without AWS credentials,
# ECR publication, or a developer's local Docker storage. PRs follow the
# repository's ready-for-review cadence; use workflow_dispatch for a targeted
# rerun after a material fix, while push covers development/main after landing.
on:
  pull_request:
    types: [ready_for_review]
    paths:
      - '.github/workflows/access-kit-container.yml'
      - 'packages/access-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  push:
    branches: [development, main]
    paths:
      - '.github/workflows/access-kit-container.yml'
      - 'packages/access-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: access-kit-container-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build linux/amd64 image and smoke its cloud entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Verify customer npm package contents
        run: npm pack ./packages/access-kit --dry-run

      - name: Build the production container image
        run: >-
          docker buildx build
          --platform linux/amd64
          --load
          --file packages/access-kit/Dockerfile
          --tag aether-access-kit:ci
          .

      - name: Verify container health and headless CLI entrypoint
        run: |
          set -euo pipefail
          docker run --detach --name access-kit-container-check \
            --publish 127.0.0.1:18080:8080 \
            --env AETHER_API_URL=https://api.aether.io \
            --env AETHER_MCP_ALLOWED_HOSTS=localhost \
            aether-access-kit:ci
          cleanup() {
            docker logs access-kit-container-check || true
            docker rm --force access-kit-container-check >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --header 'Host: localhost' \
              http://127.0.0.1:18080/readyz >/tmp/access-kit-ready.json; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || {
            echo 'Access Kit container did not become ready.' >&2
            exit 1
          }
          jq -e '.status == "ready" and .path == "/v1/access/mcp"' \
            /tmp/access-kit-ready.json >/dev/null
          curl --fail --silent --show-error \
            --header 'Host: localhost' \
            http://127.0.0.1:18080/healthz \
            | jq -e '.status == "ok"' >/dev/null
          docker run --rm --entrypoint node aether-access-kit:ci \
            ./bin/aether.js --help >/dev/null
