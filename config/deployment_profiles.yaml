# =============================================================================
# Aether — Deployment Profile Matrix (canonical policy data)
#
# This file is the single source of truth for Aether's deployment profiles, the
# cost policy that governs each one, and the numeric budget each cost-capped
# profile must hold to. It is consumed by:
#   - scripts/release/check_profile_config.py        (schema + coherence)
#   - scripts/release/check_cost_policy.py            (forbidden-resource policy)
#   - scripts/release/check_cost_policy_terraform.py  (Terraform encodes the policy)
#   - scripts/release/check_cost_model.py             (numeric budget enforcement)
#   - docs/architecture/DEPLOYMENT-PROFILES.md                     (authored narrative)
#
# It is DATA, not infrastructure. The Terraform work that makes the profile
# selectable and asserts a `production` plan actually excludes the
# forbidden resources is tracked as config/implementation_ledger.yaml →
# FT-9-TERRAFORM-PROFILES. This file fixes the canonical policy and the numeric
# ceilings so every downstream gate scores against one stable target.
#
# Two distinct kinds of enforcement live here, and they must not be conflated:
#   - `cost_policy`  — SHAPE. Which resource classes a profile must/must not
#                      provision. Enforced against the plan inventory.
#   - `budget`       — MAGNITUDE. Currency ceilings in USD/month. Enforced by
#                      check_cost_model.py against config/aws_price_book.yaml.
# A plan can satisfy the shape policy and still blow the budget (an oversized
# instance class inside an allowed resource type), so both gates are required.
# =============================================================================

schema_version: 1
canonical_source: config/deployment_profiles.yaml

# The supported ceiling. Aether has two deployment profiles: `staging` and
# `production`. Production is one profile whose size is set by capacity inputs
# (config/runtime_deployment.yaml task counts and sizes, and the Aurora capacity
# in infra/aws/terraform/profiles/production.tfvars), not by switching profile.
# Heavy backends (Redis, Kafka, Neptune, ClickHouse, a dedicated ML service, a
# NAT gateway) are not part of either profile; adding one is a reviewed change
# made when a measured bottleneck justifies it, together with its cost policy.
# Dedicated customer infrastructure (a separate AWS account) is a provisioning
# pattern described in docs/architecture/DEPLOYMENT-PROFILES.md, not a profile.
max_supported_profile: production

# Canonical environment interface over the profiles below. Profiles describe
# environments (runtime shape, cost and isolation policy); capability flags
# describe capabilities (config/capability_overlays.yaml). There is no local
# profile: local development needs no deployment profile. The staging `pilot`
# lane is customer-pilot STAGING and must not be renamed into production.
canonical_environments:
  staging:
    profiles: [staging]
    lanes: [full, pilot]
    runtime_states: [awake, asleep]
  production:
    profiles: [production]

# Profiles that are deliberately not part of the canonical environment interface.
unmapped_profiles: []

profiles:
  staging:
    purpose: Release rehearsal.
    class: staging
    environment: staging
    cost_capped: true
    wake_sleep: true
    # `deployment_profile` remains the canonical Terraform/state identity.
    # `deployment_lane` is an additive staging-only overlay selector so the
    # customer-pilot path cannot fork or accidentally share a second state
    # namespace. Terraform and both staging workflows must pass one of these
    # exact tokens explicitly; `full` preserves the existing rehearsal.
    deployment_lane:
      default: full
      allowed: [full, pilot]
      valid_when:
        profile: staging
        environment: staging
    deployment_lanes:
      full:
        purpose: Existing complete staging release rehearsal.
        state_namespace: staging
        inherits: staging
      pilot:
        purpose: Complete lean AWS staging for customer-facing design partners and early pilots.
        base_lane: full
        state_namespace: staging
        required_surfaces:
          - olympus_marketing
          - aether_marketing
          - aether_docs
          - aether_app
          - aether_status
        required_controls:
          - aws_networking
          - durable_aurora_postgres
          - durable_persistence
          - tenant_isolation
          - secrets_manager
          - stripe_billing
          - stripe_webhooks
          - stripe_entitlements
          - cloudwatch_observability
          - wake_sleep_lifecycle
          - immutable_artifact_redeploy
          - database_migrations
          - full_staging_smoke
        deferred_capabilities:
          - kyber_operator_ui
          - kyber_workforce_identity
          - google_workforce_credentials
          - google_oidc
          - gcp_hosting
        stripe_contract:
          enabled: true
          fail_closed_if_unwired: true
          required_runtime_env:
            - STRIPE_BILLING_ENABLED
            - STRIPE_PRICE_ALPHA
            - STRIPE_PRICE_BETA
            - STRIPE_PRICE_GAMMA
            - STRIPE_PRICE_DELTA
            - STRIPE_CHECKOUT_SUCCESS_URL
            - STRIPE_CHECKOUT_CANCEL_URL
            - STRIPE_PORTAL_RETURN_URL
          required_secret_mounts:
            - stripe-secret-key
            - stripe-webhook-secret
            - stripe-price-alpha
            - stripe-price-beta
            - stripe-price-gamma
            - stripe-price-delta
          required_populated_secret_mounts:
            - stripe-price-alpha
            - stripe-price-beta
            - stripe-price-gamma
            - stripe-price-delta
          secret_registry_source: scripts/bootstrap_aws_secrets.py
          ecs_mount_source: infra/aws/terraform/modules/ecs/main.tf
          price_id_format: '^price_[A-Za-z0-9]+$'
    backends:
      database: aurora_postgres
      cache: dynamodb
      event: sns_sqs
      graph: postgres
      analytics: postgres
      object: s3
      ml: inline
    behavior: [wake-for-validation, deploy-exact-artifact, run-migrations, smoke-privacy-security-isolation-load, produce-evidence, sleep-after-validation]
    budget:
      currency: USD
      region: us-east-1
      # Staging is wake/sleep: hourly-accruing resources are only billed while
      # the environment is awake, so the cost model prorates them by this figure
      # rather than by pricing_hours_per_month. Per-month charges (KMS keys,
      # Secrets Manager secrets, alarms) accrue in full regardless of sleep.
      maximum_scheduled_awake_hours_per_month: 40
      target_monthly_spend: 25
      hard_monthly_spend: 50
      # Reference month length used to convert hourly prices to monthly ones.
      pricing_hours_per_month: 730
    cost_policy:
      # Staging rehearses the production release, so it provisions the same
      # resource shape. `alb` and the compute behind it are required for the plan
      # to be a faithful rehearsal; `always_on_staging_compute` below forbids
      # that compute from being scheduled 24/7, which is the actual cost control.
      required_resources:
        - cloudfront_s3_frontends
        - alb
        - explicit_runtime_role_services
        # aurora_serverless_v2 and postgres_graph are provisioned when
        # enable_aurora is true (the default).  They are omitted from this
        # list because skip_aurora lets a free-tier account rehearse
        # everything else while Aurora is deferred; production profiles
        # still list both as required.
        - sqs_sns
        - dynamodb
        - s3_object_lake
        - secrets_kms
        - credential_kms
        - inline_ml
      # Identical heavy-resource exclusions to production, plus the
      # always-on prohibition that makes the awake-hours budget meaningful.
      forbidden_resources:
        - msk
        - elasticache
        - neptune
        - clickhouse
        - dedicated_ml_service
        - frontend_ecs_services
        - legacy_rds
        - nat_gateway_unless_explicit
        - always_on_staging_compute
        - prometheus_grafana_servers

  production:
    purpose: First customer and early controlled production.
    class: production
    cost_capped: true
    founding_tenant_target: true
    backends:
      database: aurora_postgres
      cache: dynamodb
      event: sns_sqs
      graph: postgres
      analytics: postgres
      object: s3
      ml: inline
    cost_policy:
      # Resources that a production plan MUST provision.
      required_resources:
        - cloudfront_s3_frontends
        - alb
        - explicit_runtime_role_services
        - aurora_serverless_v2
        - sqs_sns
        - dynamodb
        - s3_object_lake
        - secrets_kms
        - credential_kms
        - cloudwatch_alarms
        - inline_ml
        - postgres_graph
      # Resources that a production plan MUST NOT provision. The cost-policy
      # validator asserts every one of these is present in this list; the future
      # Terraform gate asserts the plan excludes them.
      forbidden_resources:
        - msk
        - elasticache
        - neptune
        - clickhouse
        - dedicated_ml_service
        - frontend_ecs_services
        - legacy_rds
        - nat_gateway_unless_explicit
        - always_on_staging_compute
        - prometheus_grafana_servers
      # Estimated operational posture vs. the heavy default stack. Estimate only.
      estimated_cost_reduction_vs_heavy: "approximately 75-90% lower monthly infra cost"
      estimated_cost_reduction_vs_lean_ish: "approximately 50-70% lower monthly infra cost"
    budget:
      currency: USD
      region: us-east-1
      # The FIXED baseline — infrastructure that bills whether or not a single
      # request arrives. This is the number the gate enforces, because it is the
      # only part of the bill that is fully determined by the Terraform plan.
      # `target` is the design goal; exceeding it warns. `hard` is the ceiling;
      # exceeding it fails the release unless an active, time-bounded entry in
      # config/cost_exceptions.yaml covers the overage.
      target_fixed_monthly: 150
      hard_fixed_monthly: 200
      # Reference month length used to convert hourly prices to monthly ones.
      # production runs continuously, so the full 730h applies.
      pricing_hours_per_month: 730
      # Usage-driven cost (S3, DynamoDB on-demand, SQS/SNS, log ingestion, data
      # transfer) is NOT bounded by the ceilings above — it scales with tenant
      # traffic. It must still be modelled and reported as low/expected/high
      # scenarios so the total is never presented as just the fixed baseline.
      variable_cost_model_required: true
