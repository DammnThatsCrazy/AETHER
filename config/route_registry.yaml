# =============================================================================
# Kyber route declarations (schema v3)
#
# Each entry names the capability a Kyber route requires, the disclosure ceiling
# it may reveal, and the action class it performs. The middleware authorization
# boundary (middleware/middleware.py::_evaluate_route_policy) enforces these
# behind KYBER_BACKEND_AUTHZ_ENFORCED, which is what lets capability-level
# authority reach ~158 existing `require_kyber_operator` call sites without
# editing them.
#
#   route         "<METHOD> <fastapi path template>"; METHOD may be "*".
#   capability    MUST be in services/kyber/access/capabilities.py
#                 ALL_CAPABILITY_IDS — an unknown id fails at load.
#   disclosure    D0..D5 (services/kyber/access/disclosure.py).
#   action_class  0 read · 1 annotate · 2 retry · 3 recompute · 4 high impact
#                 · 5 fleet destructive.
#
# Capabilities marked tenant_scoped additionally require an active, purpose-bound
# tenant access scope; where the route carries a {tenant_id} the boundary matches
# the scope against that tenant.
#
# UNDECLARED IS NOT UNGUARDED: a Kyber route with no entry here still requires an
# operator (kyber_operator_required is derived from the path), it is simply not
# yet capability-classified. Routes are added here as their authority is mapped.
# =============================================================================
