  # ── INTEGRATOR INSERTION POINT ────────────────────────────────────────────
  # New Kyber routes (workforce identity, devices, sessions, scopes, the rest of
  # the command plane) are declared BELOW this line. Until a route is declared it
  # falls back to operator-required, so adding a route can never open it up —
  # but it also stays capability-unclassified, which is a gap, not a state to
  # leave a shipped route in.

  # ── Kyber workforce plane ─────────────────────────────────────────────────
  #
  # Four routes are deliberately absent because they establish identity in the
  # first place and therefore cannot require an established session:
  #   GET  /v1/kyber/auth/login
  #   GET  /v1/kyber/auth/callback
  #   POST /v1/kyber/workforce/invitations/accept
  #   POST /v1/kyber/auth/bootstrap
  # Each carries its own fail-closed control (OIDC claim validation against an
  # existing active principal; a single-use hashed invitation token bound to a
  # verified Google identity; an env-gated one-time bootstrap that refuses while
  # any principal exists). They are pinned as exact method+path pairs in
  # tests/security/test_kyber_boundary.py::_PREAUTH_ROUTES, and a stale entry
  # there fails the suite.

  # Self-inspection. Reveals only the caller's own identity and session state,
  # which is why it sits at D0 rather than a fleet level.
  - route: "GET /v1/kyber/me"
    capability: kyber.workforce.self.read
    disclosure: D0
    action_class: 0
  - route: "POST /v1/kyber/auth/logout"
    capability: kyber.workforce.self.read
    disclosure: D0
    action_class: 1
  - route: "GET /v1/kyber/auth/session"
