# =============================================================================
# Aether — Route Policy Registry (PR 2)
#
# Authorization is a protocol, not scattered route logic. `classify(path)` in
# services/security/route_registry.py derives a RoutePolicy for every mounted
# route from this catalog:
#   - longest matching entry in `known_prefixes` → the route's domain;
#   - policy fields are derived from the domain sets below;
#   - ANY path containing `/kyber` is a Kyber operator route
#     (kyber_operator_required + audit_required + high risk), regardless of prefix
#     (this covers `/v1/admin/kyber/*` as well as `/v1/kyber/*`);
#   - public paths come from shared/rate_limit/feature_gate.py.
#
# default_decision is `deny`: a mounted route whose 2-segment prefix is NOT in
# `known_prefixes` is UNCLASSIFIED and fails tests/unit/test_route_registry_coverage.py
# (the default-deny ratchet — a new route prefix must be classified here before it
# can ship). Validated for well-formedness by scripts/release/check_route_registry.py.
# =============================================================================

schema_version: 2
canonical_source: config/route_registry.yaml
enforcement_status: enforced
default_decision: deny
public_paths_source: shared/rate_limit/feature_gate.py

# Domains whose routes are sensitive (decisions should be audited).
sensitive_domains:
  - admin
  - kyber
  - security
  - audit
  - dsr
  - exports
  - governance
  - consent
  - delegations
  - auth
  - billing
  - me
  - referral-links
  - tenant
  - tenants
  - oracle

# Domains classified high risk.
high_risk_domains:
  - admin
  - kyber
  - security
  - auth
  - billing
  - dsr

# Infrastructure/liveness domains that are not tenant-scoped.
infra_domains:
  - health
  - ready
  - metrics

# Every mounted route's 2-segment path prefix must appear here. Adding a new
# route under a NEW prefix requires classifying it here first (default-deny).
