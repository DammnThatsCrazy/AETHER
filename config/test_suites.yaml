  - id: backend-observability
    subsystem: observability
    # One suite across all four *_observability services (two of the four —
    # agent_comm_observability and protocol_observability — currently ship no
    # test files at all; batching them into a single pytest invocation with
    # the other two avoids pytest's "no tests collected" exit code 5 that a
    # standalone per-service invocation would hit for those two).
    paths:
      [
        "Backend Architecture/aether-backend/services/agent_comm_observability/tests",
        "Backend Architecture/aether-backend/services/external_account_observability/tests",
        "Backend Architecture/aether-backend/services/agentic_observability/tests",
        "Backend Architecture/aether-backend/services/protocol_observability/tests",
      ]
    runner:
      [
        "python",
        "-m",
        "pytest",
        "Backend Architecture/aether-backend/services/agent_comm_observability/tests",
        "Backend Architecture/aether-backend/services/external_account_observability/tests",
        "Backend Architecture/aether-backend/services/agentic_observability/tests",
        "Backend Architecture/aether-backend/services/protocol_observability/tests",
        "-v",
        "--tb=short",
      ]
    requires:
      python_packages: []
      services: []
      docker: false
      credentials: []
    environments: [local, ci, release]
    skip_policy: never
    release_class: pr_gate
    evidence_artifact: null
    quarantine: null

  # ---------------------------------------------------------------------------
  # Non-pytest suites — NOT invoked by scripts/repo_doctor.py (its registry
  # wiring is pytest-only by design; see is_pytest_suite in
  # scripts/lib/test_suites.py). Each is exercised today by its own dedicated
  # GitHub Actions workflow rather than repo-health.yml, except
  # datalake-backend (quarantined below).
  # ---------------------------------------------------------------------------

  - id: smart-contracts
    subsystem: smart-contracts
    paths: ["Smart Contracts/test"]
    # Mirrors .github/workflows/smart-contract-analysis.yml's contract-tests
    # job (npm ci already run there before this executes).
    runner: ["bash", "-lc", "cd 'Smart Contracts' && npx hardhat test"]
    requires:
      python_packages: []
      services: []
      docker: false
      credentials: []
    environments: [local, ci, release]
    skip_policy: never
    release_class: pr_gate
    evidence_artifact: "release-evidence/contract-tests.json"
    quarantine: null

  - id: datalake-backend
    subsystem: datalake
    paths: ["Data Lake Architecture/aether-Datalake-backend/tests"]
    runner: ["bash", "-lc", "cd 'Data Lake Architecture/aether-Datalake-backend' && npm test"]
    requires:
      python_packages: []
      services: []
      docker: false
      credentials: []
    # Not "ci" today: no workflow installs this project's dependencies
    # (it is a standalone npm project outside the root package.json
    # workspaces). Verified 2026-07-30: `npm test` here fails immediately
    # with "vitest: not found" on a plain checkout, because node_modules is
    # never installed by any CI job. The source tests themselves are
    # self-contained (packages/events' createSink() falls back to an
    # in-process ConsoleSink for every configured sink type — no live Kafka/
    # S3/ClickHouse/Redis dependency), so once an install step is wired in
    # this suite is expected to just pass; it is quarantined for the missing
    # wiring, not for a live-infra blocker.
    environments: [local, release]
    skip_policy: documented_quarantine
    release_class: pr_gate
    evidence_artifact: null
    quarantine:
      reason: >-
        Standalone npm project outside the root package.json workspaces; no
        CI job installs its dependencies, so `npm test` fails today with
        "vitest: not found" on a clean checkout. Needs a dependency-install
        step wired into a CI job (or folding into the root workspaces).
      owner: platform
      expires: "2026-09-30"

