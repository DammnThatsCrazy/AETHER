    isolation: process
    lane: pr
    profiles: [local, ci, release]
    expected_runtime_seconds: 30
    hard_runtime_budget_seconds: 90
    # One suite across all four *_observability services (two of the four —
    # agent_comm_observability and protocol_observability — currently ship no
    # test files at all; batching them into a single pytest invocation with
    # the other two avoids pytest's "no tests collected" exit code 5 that a
    # standalone per-service invocation would hit for those two).
    paths:
      [
        "Backend Architecture/aether-backend/services/agent_comm_observability/tests",
        "Backend Architecture/aether-backend/services/external_account_observability/tests",
        "Backend Architecture/aether-backend/services/agentic_observability/tests",
        "Backend Architecture/aether-backend/services/protocol_observability/tests",
