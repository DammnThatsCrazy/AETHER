        "Backend Architecture/aether-backend/services/external_account_observability/tests",
        "Backend Architecture/aether-backend/services/agentic_observability/tests",
        "Backend Architecture/aether-backend/services/protocol_observability/tests",
        "--workers",
        "4",
      ]
    requires:
      python_packages: []
      services: []
      docker: false
      credentials: []
    environments: [local, ci, release]
    skip_policy: never
    release_class: pr_gate
    evidence_artifact: null
    quarantine: null

  # ---------------------------------------------------------------------------
  # Non-pytest suites — NOT invoked by scripts/repo_doctor.py (its registry
  # wiring is pytest-only by design; see is_pytest_suite in
