# =============================================================================
# Aether — Canonical Test-Suite Registry
#
# Single source of truth for every automated test suite in the repo: where it
# lives, how to run it, which environments (local/ci/release) it is expected
# to run in, and what happens when it can't run there (skip_policy).
#
# Loaded and strictly validated by scripts/lib/test_suites.py (load_suites);
# unknown keys, bad enum values, non-existent paths, and a
# documented_quarantine suite missing its quarantine block are all hard
# errors there, never silently defaulted.
#
# Consumed by:
#   - scripts/repo_doctor.py — registry-driven pytest-suite invocation
#     (replaces the two previously hardcoded `python -m pytest ...` calls).
#   - scripts/validate_test_suite_coverage.py — asserts no `environments`-
#     contains-ci pytest suite is missing from repo_doctor's invocation set.
#   - .github/workflows/repo-health.yml's backend-tests job (subsystem
#     lookup: suites_for(suites, "backend")).
#
# Field notes:
#   - paths: repo-root-relative paths this suite covers; validated to exist.
#   - runner: argv executed with cwd at the repo root (build_command()
#     returns it verbatim). Suites needing a different working directory
#     (Hardhat, standalone npm projects outside the root workspaces) encode
#     that themselves via a `bash -lc "cd '<dir>' && ..."` form.
#   - requires: python_packages (import names probed before running; missing
#     ones become a tolerated skip in `local` and a hard failure in `ci` when
#     skip_policy is `never`), services/docker/credentials (any of these
#     present means skip_policy can never be `never` — see
#     Requires.needs_live_infra in scripts/lib/test_suites.py).
#   - skip_policy: never (must always run; a skip is a bug, hard-failed in
#     ci), local_only (only ever exercised locally), documented_quarantine
#     (tolerated skip everywhere, requires the `quarantine` block).
#   - release_class: pr_gate (blocks a normal PR when applicable),
#     live_certification (needs a live/credentialed environment to mean
#     anything), advisory (informational, never blocks).
#   - runtime-aware metadata: owner, components, contracts, dependencies,
#     isolation, lane, profiles, expected_runtime_seconds, and
#     hard_runtime_budget_seconds are required for every suite. Runtime
#     budgets are authoritative here; config/ci_runtime_budgets.yaml contains
#     telemetry policy only and must not duplicate suite definitions.
# =============================================================================

schema_version: 1
canonical_source: config/test_suites.yaml

suites:

