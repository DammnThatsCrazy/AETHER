    runtime_class: heavy
    isolation: process
    lane: pr
    profiles: [local, ci, release]
    # The ML integration/training tests are correctness coverage, not a
    # skippable advisory lane. Their observed hosted runtime needs headroom
    # for xgboost/scikit-learn training on shared runners.
    expected_runtime_seconds: 150
    hard_runtime_budget_seconds: 240
    paths: ["services/ml/tests"]
    # Run from the ML package root so its local ``tests`` helpers and top-level
    # ML packages resolve without colliding with the repository test package.
    runner: ["python", "scripts/run_ml_tests.py"]
    requires:
      # Import names probed by repo_doctor.py before running. scikit-learn's
      # import name is "sklearn". Both ship in the "ml" extra
      # (pip install -e ".[ml,dev]"); `make bootstrap` installs ".[all]" so
      # CI always has them — a missing-deps skip here in --ci is therefore a
      # real environment misconfiguration, not an expected outcome.
      python_packages: ["joblib", "sklearn"]
      services: []
      docker: false
      credentials: []
    environments: [local, ci, release]
    skip_policy: never
    release_class: pr_gate
    evidence_artifact: "ci-evidence/suites/ml.json"
