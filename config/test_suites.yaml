    runtime_class: small
    isolation: process
    lane: pr
    profiles: [local, ci, release]
    expected_runtime_seconds: 20
    hard_runtime_budget_seconds: 60
    paths: [contracts]
    runner: [python, scripts/validate_contracts.py]
    requires:
      python_packages: []
      services: []
      docker: false
      credentials: []
    environments: [local, ci, release]
    skip_policy: never
    release_class: pr_gate
    evidence_artifact: "ci-evidence/suites/contracts.json"
