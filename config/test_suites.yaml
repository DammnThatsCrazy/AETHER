  # ---------------------------------------------------------------------------
  # Python / pytest suites — driven by scripts/repo_doctor.py
  # ---------------------------------------------------------------------------

  - id: root
    suite_role: aggregate
    subsystem: root
    owner: platform
    components: [repository]
    contracts: [repository-consistency]
    dependencies: []
    dependency_profile: python-root
    runtime_class: heavy
    isolation: process
    lane: regression
    profiles: [local, release]
    # The global authority run is intentionally conservative: the latest
    # hosted run exhausted 420 seconds for all 541 isolated files, while the
    # local 4-process baseline completes materially sooner.
    expected_runtime_seconds: 420
    hard_runtime_budget_seconds: 600
    paths: ["tests"]
    # Kyber and capability tests use process-global repositories. Execute each
    # file in its own process and parallelize files, preventing state leakage
    # without serializing the entire root estate. Keep the worker count below
    # the hosted runner's CPU ceiling; the previous 16-process fan-out could
    # make healthy isolated files miss the suite budget.
    runner: ["python", "scripts/run_pytest_files.py", "tests", "--workers", "4"]
    requires:
      python_packages: []
      services: []
      docker: false
      credentials: []
    environments: [local, release]
    skip_policy: never
    release_class: pr_gate
    evidence_artifact: "ci-evidence/suites/root.json"
    quarantine: null

