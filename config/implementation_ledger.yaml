  - id: FT-9-REVIEWED-PROMOTION
    title: Reviewed promotion is the only apply path — automatic production apply deleted
    domain: release-governance
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: No push, schedule or path trigger can change production infrastructure; an apply consumes a specific reviewed plan or it does not run.
    current_behavior: >
      Implemented in 2c290c8. infrastructure.yml previously carried an
      apply-production-lean job that applied production on every push to main
      and re-planned with -auto-approve rather than consuming the reviewed
      artifact. That job is deleted; infrastructure.yml is plan-and-validate
      only, and terraform-promote.yml is the sole apply path. A reviewed plan
      records and apply verifies the Terraform version, the .terraform.lock.hcl
      sha256, the backend state key (rejected unless it is
      profiles/<profile>/terraform.tfstate), a 24-hour expiry, the plan's own
      sha256, and the policy/cost/inventory reports; apply consumes the stored
      binary plan and never re-plans. Apply binds to the commit the plan was
      REVIEWED at rather than the dispatch ref — the previous binding could
      block a valid apply while proving nothing about the checked-out code —
      and per-profile GitHub environments replace the single
      production-terraform environment. A separate false-green defect was fixed
      at the same time: infrastructure.yml piped `terraform test` through tee
      with no pipefail and the file set none anywhere, so under GitHub's default
      shell the step's status was tee's and a failing Terraform test reported
      green. Every multi-line run block in both Terraform workflows now begins
      with `set -euo pipefail`, and because a comment merely containing the word
      "pipefail" once satisfied the test, the assertion now matches a real
      `set -...pipefail` directive.
    required_behavior: >
      No workflow applies infrastructure without an explicitly dispatched,
      reviewed, unexpired, checksum-matched plan for the named profile; the
      delivery path carries immutable image digests and exact task revisions,
      never a mutable :latest, and never defaults an absent input to production.
    affected_paths:
      - .github/workflows/terraform-promote.yml
      - .github/workflows/infrastructure.yml
      - .github/workflows/deploy.yml
      - tests/unit/test_release_workflow_controls.py
      - scripts/release/check_delivery_topology.py
    tests_required:
      - "make test-workflow-controls (tests/unit/test_release_workflow_controls.py)"
      - "make validate-delivery-topology"
    evidence_required:
      - "check_delivery_topology.py: PASS — 27 checks passed, including no mutable latest reference, exact task revisions, and no default-to-production"
      - "workflow-control assertions are mutation-verified (a comment containing the word pipefail no longer satisfies the pipefail test)"
    docs_required:
      - docs/CICD.md
      - docs/PRODUCTION-DEPLOYMENT.md
    owner: platform
    status: targeted_tests_pass
    blocked_by: [FT-9-PLAN-POLICY]
    exception: null
    last_verified_commit: null

  - id: FT-9-STAGING-LIFECYCLE
    title: Staging wake / validate / sleep with a TTL-guarded awake lease
    domain: release-governance
    severity: P1
    release_class: general_availability_blocker
    customer_impact: Staging can rehearse a release without becoming a second always-on production bill.
    current_behavior: >
      staging-lifecycle.yml drives the full wake to rehearse to sleep cycle
      through the reviewed-promotion path, with a fail-safe sleep phase under
      always() so staging returns to `asleep` even when the rehearsal fails,
      and it refuses to run against a profile that does not declare
      wake_sleep: true and both staging_state.states.awake and .asleep.
      staging-ttl-guard.yml enforces the awake lease on a schedule and treats a
      missing or unparseable lease as expired, so an unaccountable environment
      is driven to zero rather than left running. The asleep shape is verified
      out of the reviewed plan JSON rather than assumed, including the rule that
      an asleep plan may leave no autoscaling floor above zero.
    required_behavior: >
      Waking is a single input flip against an identically-shaped plan;
      sleeping drives desired counts, autoscaling floors and capacity-provider
      base counts to zero; the awake lease expires on its own and residual
      spend after sleep is measured, not assumed.
    affected_paths:
      - .github/workflows/staging-lifecycle.yml
      - .github/workflows/staging-ttl-guard.yml
      - config/runtime_deployment.yaml
      - AWS Deployment/aether-aws/terraform/profiles.tf
      - tests/unit/test_staging_lifecycle_controls.py
    tests_required:
      - "make test-staging-lifecycle (tests/unit/test_staging_lifecycle_controls.py)"
      - "terraform test run block staging_asleep_profile_plan"
    evidence_required:
      - release-evidence/lifecycle/staging-wake.json (credentialed wake — ABSENT)
      - release-evidence/lifecycle/sleep-residual.json (observed residual spend after a real sleep — ABSENT)
      - release-evidence/lifecycle/rehearsal-history.json (two completed rehearsals — ABSENT)
    docs_required:
      - docs/STAGING-WAKE-SLEEP.md
      - docs/DEPLOYMENT-PROFILES.md
    owner: platform
    status: externally_blocked
    blocked_by: [FT-9-LEAN-RUNTIME, FT-9-REVIEWED-PROMOTION]
    exception: >
      Externally blocked on things this repository cannot contain. The workflows
      and their structural controls are written and pass tests/unit/test_staging_lifecycle_controls.py,
      but NO staging environment exists: there are no AWS credentials, no
      remote-state backend, no ECS services to wake or sleep, and no billing
      data covering a sleep window. Specifically missing and unobtainable here —
      (1) a credentialed `terraform apply` that actually woke staging
      (COND-STAGING-WAKE-APPLIED); (2) two completed rehearsals with recorded
      migration, smoke, security-isolation and load results
      (COND-STAGING-TWO-REHEARSALS, STG-MIGRATIONS, STG-SMOKE, STG-LOAD,
      STG-SECURITY-ISOLATION); (3) a real sleep cycle with billing data proving
      residual spend is what the model predicts (COND-SLEEP-RESIDUAL). Until an
      AWS account is attached, every one of those controls scores zero on the
      externally-verified scorecard no matter what this ledger says, and the
      staging scorecard's externally-verified score is 0/100 today.
    last_verified_commit: null

