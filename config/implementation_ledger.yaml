  # ---- PR 1 — Trust containment (this session) ---------------------------
  - id: FT-1-NO-HUMAN-API-KEYS
    title: Human login / verify / SSO / recovery must not mint reusable API keys
    domain: trust-security
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Removes long-lived analytics-scoped keys handed out on every human login — the primary production auth blocker.
    current_behavior: verify-email, login, sso/callback return an ak_ key; legacy /v1/tenants returns one; recovery emails one.
    required_behavior: Under the founding-tenant posture, human paths issue durable server-side sessions (no reusable key); legacy registration is contained; recovery never emails a key.
    affected_paths:
      - Backend Architecture/aether-backend/services/auth/routes.py
      - Backend Architecture/aether-backend/services/registration/routes.py
      - Backend Architecture/aether-backend/services/auth/sessions/
      - Backend Architecture/aether-backend/middleware/middleware.py
      - Backend Architecture/aether-backend/config/settings.py
    tests_required: [tests/unit/test_trust_containment.py]
    evidence_required: [pytest trust-containment output]
    docs_required: [docs/FOUNDING-TENANT-PRODUCTION.md]
    owner: trust
    status: implemented
    blocked_by: []
    exception: null
    last_verified_commit: null

  - id: FT-1-SESSIONS-CREDENTIALS
    title: Durable sessions, scoped service credentials, non-secret public ingest identifiers
    domain: trust-security
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Separates human sessions from machine credentials and public ingest identifiers.
    current_behavior: Only reusable API keys existed; no durable session or credential-class separation.
    required_behavior: Server-side sessions (idle+absolute expiry, revocable) + scoped/rotatable service credentials + ingest-only public identifiers, behind staged-activation flags.
    affected_paths:
      - Backend Architecture/aether-backend/services/auth/sessions/
      - Backend Architecture/aether-backend/alembic/versions/
    tests_required: [tests/unit/test_trust_containment.py]
    evidence_required: [pytest trust-containment output, alembic upgrade/downgrade/upgrade]
    docs_required: [docs/FOUNDING-TENANT-PRODUCTION.md]
    owner: trust
    status: implemented
    blocked_by: []
    exception: null
    last_verified_commit: null

  # ---- PR 2..PR 10 — sequenced follow-ups (NOT implemented this session) --
  - id: FT-2-ROUTE-REGISTRY
    title: Route policy registry, default-deny, Kyber operator gate, status enforcement
    domain: trust-security
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Makes authorization a protocol with default-deny for unknown production routes.
    current_behavior: Governance is scattered (PolicyEngine, governance decisions, delegation) with no unified mounted-route registry; governance default-allow in one path.
    required_behavior: Every mounted route declared in a registry; unknown production routes deny; Kyber routes require operator identity; sensitive decisions audited.
    affected_paths:
      - Backend Architecture/aether-backend/services/security/
      - Backend Architecture/aether-backend/services/kyber_operator/
      - config/route_registry.yaml
    tests_required: [tests/unit/test_route_registry_coverage.py, tests/security/test_kyber_gate_consolidation.py, tests/security/test_route_policy_hook.py]
    evidence_required: [make validate-route-registry, pytest route registry + kyber gate output]
    docs_required: [docs/FOUNDING-TENANT-PRODUCTION.md]
    owner: trust
    status: implemented
    blocked_by: []
    exception: >
      Deferred to follow-ups: runtime default-deny for flag-gated routers (the CI
      coverage gate covers the default-mounted surface); request-time tenant
      "suspended"/org/membership status enforcement (PR 1 added no org/membership
      tables — session/credential revocation and tenant inactive are enforced;
      the runtime hook ships observe-mode by default).
    last_verified_commit: null

  - id: FT-3-AUTHORITATIVE-CONSENT
    title: Server-authoritative consent enforcement at ingestion
    domain: privacy-consent
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Absence of consent must not be permission; SDK snapshots become evidence, not authority.
    current_behavior: /v1/batch trusts the SDK per-event consent snapshot; server ConsentRepository is consulted only downstream.
    required_behavior: Ingestion loads server consent receipts + tenant compliance profile, enforces lawful processing with stable rejection codes.
    affected_paths:
      - Backend Architecture/aether-backend/services/ingestion/batch.py
      - Backend Architecture/aether-backend/services/consent/authority.py
      - Backend Architecture/aether-backend/shared/privacy/consent_enforcement.py
      - Backend Architecture/aether-backend/alembic/versions/20260723_consent_authority.py
      - Backend Architecture/aether-backend/config/settings.py
    tests_required: [tests/unit/test_consent_authority.py]
    evidence_required: [pytest consent-authority output, alembic upgrade/downgrade/upgrade]
    docs_required: [docs/CONSENT.md, docs/PRIVACY.md]
    owner: privacy
    status: implemented
    blocked_by: []
    exception: >
      Deferred to follow-ups (see services/consent/authority.py DEFERRED note):
      request-time DNT/GPC header suppression and per-event fingerprint-signal
      detection. GPC/DNT and fingerprinting authorization ARE enforced from the
      recorded consent-receipt / tenant-compliance-profile state; wiring the live
      Sec-GPC / DNT request headers and request-time fingerprint payload
      detection into the decision functions is the remaining work. The
      ingestion hot-path enforcement ships behind
      AUTHORITATIVE_CONSENT_ENFORCEMENT_ENABLED (default ON in staging/prod, OFF
      in local/dev).
    last_verified_commit: null

  - id: FT-4-RUNTIME-ROLES
    title: Runtime roles, profile/backend selectors, API/worker separation
    domain: execution
    severity: P1
    release_class: general_availability_blocker
    customer_impact: The API process must not start every worker/consumer/cron in production.
    current_behavior: FastAPI lifespan starts consumers, supervised workers, and crons in-process.
    required_behavior: AETHER_ROLE + explicit backend selectors; role-specific entrypoints; production rejects role=all and memory backends.
    affected_paths:
      - Backend Architecture/aether-backend/main.py
      - Backend Architecture/aether-backend/services/runtime/roles.py
      - Backend Architecture/aether-backend/services/runtime/run_role.py
      - Backend Architecture/aether-backend/config/settings.py
    tests_required: [tests/unit/test_runtime_roles.py]
    evidence_required: [pytest tests/unit/test_runtime_roles.py output, Settings() production role=all + memory-backend rejection]
    docs_required: [docs/BACKEND-EXECUTION-MODEL.md]
    owner: platform
    status: implemented
    blocked_by: []
    exception: >
      Deferred to follow-ups: dedicated supervised worker loops + stream-consumer
      attachment for the identity/graph/measurement worker roles (they currently
      ride the shared consumer, and run_role starts an empty supervisor for them);
      full per-worker-role process fan-out beyond the fully-wired api role. The
      lifespan worker/consumer split is gated behind WORKER_ROLES_ENABLED
      (default-on non-local, off = byte-identical to before); the "all" role and
      the flag-off path are unchanged. Production fail-closed rejection of
      AETHER_ROLE=all and in-memory cache/database backends is enforced in
      Settings.__post_init__.
    last_verified_commit: null

  - id: FT-5-INGESTION-V2
    title: Typed Bronze + transactional outbox + /v1/batch V2
    domain: ingestion
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Durable, bulk, idempotent ingestion; Redis not a correctness source.
    current_behavior: /v1/batch does per-event Bronze inserts, per-event Redis SET NX, fire-and-forget identity resolution, in-request broker publish.
    required_behavior: Bulk typed Bronze + transactional outbox in one transaction; DB uniqueness is correctness; feature-flagged V2 with canary.
    affected_paths:
      - Backend Architecture/aether-backend/services/ingestion/batch.py
      - Backend Architecture/aether-backend/repositories/lake.py
      - Backend Architecture/aether-backend/alembic/versions/
    tests_required: [bulk bronze + outbox transaction tests]
    evidence_required: [ingestion roundtrip output]
    docs_required: [docs/INGESTION_CONTRACT relatives]
    owner: ingestion
    status: not_started
    blocked_by: [FT-4-RUNTIME-ROLES]
    exception: null
    last_verified_commit: null

  - id: FT-6-OUTBOX-RELAY
    title: Outbox relay, stream workers, graph/attribution/materialization batching
    domain: execution
    severity: P1
    release_class: general_availability_blocker
    customer_impact: Downstream work moves out of the request lifecycle into replayable workers.
