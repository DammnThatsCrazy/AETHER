      - "artifacts/profile-resource-inventory.json + profile-policy-result.json emitted from the plan"
      - "eleven mutation fixtures, each of which the gate rejects"
    docs_required:
      - docs/DEPLOYMENT-PROFILES.md
      - docs/AWS-LEAN-PRODUCTION.md
    owner: platform
    status: targeted_tests_pass
    blocked_by: [FT-9-TERRAFORM-PROFILES, FT-COST-POLICY-DATA]
    exception: null
    last_verified_commit: null

  - id: FT-9-LEAN-RUNTIME
    title: Consolidated lean execution groups — 2 always-on tasks instead of 10
    domain: execution
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: The largest single line of the lean bill (Fargate) drops by roughly two thirds without giving up per-role queues, DLQs or restart isolation.
    current_behavior: >
      Implemented in 367f93a. production-lean and staging ran 10 always-on
      Fargate tasks (api x2 plus eight dedicated worker services); they now run
      2 — one api task and one lean-worker task hosting all eight logical roles.
      production-scale and enterprise-isolated stay dedicated. Consolidation
      moves the process boundary and nothing else: inside the packed task every
      role keeps its own queue, consumer group, DLQ, retry policy, backpressure
      budget, metrics label and restart behaviour, and each receive loop
      registers as a WorkerSpec on the existing supervisor so crash to metric to
      backoff-restart isolation is inherited rather than reimplemented.
      config/runtime_deployment.yaml moved to schema v2, whose unit is the ECS
      service rather than the role, and whose service key IS the AETHER_ROLE
      token. `staging_state: asleep` multiplies desired_count, the autoscaling
      min_capacity floor AND the capacity-provider base_count by zero — scaling
      desired count alone would have let Application Auto Scaling clamp the
      service back up within a cooldown, so staging would never actually have
      slept while appearing to. Seven defects were found and fixed that would
      each have shipped silently: keying consumers by (role, group_id) loses
      messages under SQS so keying is now broker-aware with a hard assertion
      that no two consumers in a process resolve to the same queue; a
      consolidated task needs eight queue URLs but the task definition passed
      one, so Terraform now emits the SQS_ROLE_QUEUE_URLS map the runtime
      already expected; EventConsumer._send_to_dlq referenced an undefined
      _kafka_producer so a durable DLQ publish silently degraded to an in-memory
      list; an explicitly selected sns_sqs broker with a missing queue fell
      through to Kafka and now fails closed; ConsumerSpec.topics under-declared
      what its factory subscribed to (1 vs 16); lean-worker was absent from
