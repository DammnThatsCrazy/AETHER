  - id: AAI-1-CANONICAL-INGESTION
    title: Route the agentic-observability plane through the canonical Bronze+outbox spine
    domain: agent-access-intelligence
    severity: P1
    release_class: general_availability_blocker
    customer_impact: Agentic observations become durable, replayable, and share one canonical Silver + graph lineage instead of a bespoke synchronous pipeline.
    current_behavior: Agentic-observability routes run a bespoke synchronous Bronze to Silver to canonical_activity to AgenticProjectionOutbox pipeline (services/agentic_observability/pipeline.py) writing obs_ bronze plus bespoke silver_agent_* fact tables.
