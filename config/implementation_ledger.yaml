  - id: KWI-1-BACKEND-AUTHZ
    title: Backend-authoritative Kyber capabilities, disclosure levels and route declarations
    domain: trust-security
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: >
      Least-privilege operator access is enforced on the backend, so hiding a control in
      the browser is no longer what stands between an operator and tenant data.
    current_behavior: >
      The Kyber frontend granted canViewAll to every role including kyber_observer, and
      its role vocabulary had no backend counterpart. The route registry classified only
      by path prefix, so every /kyber route carried identical authority. Two gates were
      dead code — operational_intelligence checked a TenantContext field that does not
      exist, and Noesis authorized cross-tenant access on Role.ADMIN plus natural-language
      substring matching.
    required_behavior: >
      A granular capability vocabulary resolving to the existing AccessControlService
      grant model, six ordered disclosure levels, and per-route capability declarations
      in config/route_registry.yaml enforced by the existing middleware boundary.
      require_kyber_operator becomes a compatibility adapter over require_kyber_access so
      all existing call sites keep working. Decisions are recorded through the existing
      PolicyEngine and audit ledger — no second policy engine, RBAC or audit trail.
      Production must not retain a legacy operator tenant allowlist as authoritative.
    affected_paths:
      - "Backend Architecture/aether-backend/services/kyber/access/capabilities.py"
      - "Backend Architecture/aether-backend/services/kyber/access/roles.py"
      - "Backend Architecture/aether-backend/services/security/route_registry.py"
      - "Backend Architecture/aether-backend/services/security/request_context.py"
      - "Backend Architecture/aether-backend/services/security/policy_engine.py"
