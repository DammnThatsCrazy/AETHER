# =============================================================================
# Aether — Founding-Tenant Production Implementation Ledger
#
# The canonical, honest record of the FOUNDING_TENANT_PRODUCTION release train.
# Each item maps to a monoprompt PR. This session implements PR 0 (control
# spine) and PR 1 (trust containment); every other PR is recorded here as a
# sequenced follow-up with `status: not_started` and its blockers. Nothing is
# marked complete that is not actually implemented and validated in-repo.
#
# Validated by scripts/release/check_foundation.py.
#
# severities:      P0 | P1 | P2 | P3
# release_class:   founding_tenant_release_blocker | general_availability_blocker
#                  | enterprise_ga_blocker | scale_blocker | audit_readiness_blocker
#                  | external_action | informational
# status:          not_started | reproduced | test_added | implementation_in_progress
#                  | implemented | targeted_tests_pass | subsystem_tests_pass
#                  | full_gate_pass | externally_blocked | verified_complete
# =============================================================================

schema_version: 1
release_train: FOUNDING_TENANT_PRODUCTION
canonical_source: config/implementation_ledger.yaml

items:

  # ---- PR 0 — Control spine (this session) -------------------------------
  - id: FT-0-CONTROL-SPINE
    title: Baseline, ledger, posture, control catalog, and founding-tenant gates
    domain: release-governance
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Establishes the auditable control plane every other item reports through.
    current_behavior: No root config/ ledger, posture, control catalog, deployment-profile data, or founding-tenant gates existed.
    required_behavior: Canonical ledger + control catalog + posture + deployment-profile matrix + release/validation scripts + Make gates exist and validate.
    affected_paths:
      - config/implementation_ledger.yaml
      - config/control_catalog.yaml
      - config/posture/founding_tenant_production.yaml
      - config/deployment_profiles.yaml
      - scripts/release/
