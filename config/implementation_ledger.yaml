      routes normalize to canonical *_observed events and delegate to the durable
      /v1/batch spine (bronze_sdk_events + event_outbox to outbox_relay to
      SilverDispatcher to AgentExecutionProjector to silver_agent_execution_facts,
      plus canonical_activity and SilverGraphProjector). Flag off preserves the
      current synchronous behavior byte-for-byte.
    affected_paths:
