  - id: KWI-1-DEVICE-TRUST
    title: BYOD device trust — WebAuthn, browser-bound proof key, server-issued grant
    domain: trust-security
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: >
      Operator access to tenant data requires a specific approved personal device, so a
      stolen password or a synced passkey alone cannot reach production.
    current_behavior: >
      No device concept existed. A valid identity signal was sufficient for full Kyber
      authority, and there was no way to revoke access for one machine.
    required_behavior: >
      A production Kyber session requires an approved device record, a WebAuthn platform
      credential with userVerification required, and a browser-profile-bound
      non-extractable ECDSA P-256 proof key. Self-approval is refused and audited.
      A second personal machine requires its own approval. Device revocation terminates
      every session bound to it. No company-owned hardware is required.
    affected_paths:
      - "Backend Architecture/aether-backend/services/kyber/devices/"
      - "frontend/kyber/src/features/device-trust/"
      - "pyproject.toml"
