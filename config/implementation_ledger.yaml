      in-repo work can supply: an AWS account and a remote-state backend for a
      credentialed `terraform plan` (OVR-TERRAFORM-ENFORCEMENT,
      LEAN-FORBIDDEN-EXCLUSION, LEAN-REQUIRED-PRESENCE); a promotion run that
      actually applied a reviewed plan (OVR-PLAN-CI-CORRECTNESS,
