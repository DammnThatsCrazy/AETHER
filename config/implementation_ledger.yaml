  - id: KWI-1-SESSIONS-SCOPES
    title: Durable Kyber sessions, step-up, and purpose-bound tenant access scopes
    domain: trust-security
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: >
      Operator access to a specific tenant is now durable, expiring, revocable and
      audited, instead of state that vanished on restart and was never enforced.
    current_behavior: >
      services/kyber_operator/routes.py kept tenant-entry scopes in a module-level
      _active_sessions dict — process-local, lost on restart, not shared across
      replicas, never read by anything else, and audited only by a log line. The
      returned session_id granted and scoped nothing. There was no operator session
      at all; cookie-authenticated humans were hardcoded to a tenant Role.EDITOR.
    required_behavior: >
      Durable server-side workforce sessions with sliding idle expiry and a hard
      absolute ceiling, opaque tokens stored only as sha256, __Host- prefixed cookies,
      rotation on privilege change, and step-up requiring a fresh WebAuthn assertion.
      Tenant access is a durable kyber_access_scopes row bound to session and device,
      naming exactly one tenant, with a purpose and expiry. A client-supplied tenant id
      never grants authority and a mismatch is a denial, never a silent rescope.
    affected_paths:
      - "Backend Architecture/aether-backend/services/kyber/sessions/"
      - "Backend Architecture/aether-backend/services/kyber/access/scopes.py"
      - "Backend Architecture/aether-backend/services/kyber/access/dependencies.py"
      - "docs/source-of-truth/KYBER_SESSIONS_AND_SCOPES.md"
      - "docs/runbooks/KYBER_SCOPE_LEAK.md"
