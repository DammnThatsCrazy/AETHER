  # ---- FT-9 — Deployment profile programme ---------------------------------
  #
  # Eight items. Nothing here is `verified_complete` and nothing here can be:
  # this repository has no AWS credentials, no applied infrastructure, no
  # billing history and no staging environment, so no credentialed plan, no
  # apply, no rehearsal and no observed bill exists or can exist. Items whose
  # remaining work is purely external carry `externally_blocked` plus an
  # exception naming exactly what is missing; items that are code-complete and
  # locally proven carry a terminal-but-unverified status naming the suite that
  # proved them. `last_verified_commit` is null throughout — a SHA here would
  # assert a verification that has not happened, and part of this programme is
  # still uncommitted in the working tree.

  - id: FT-9-TERRAFORM-PROFILES
    title: Deployment profile drives the Terraform resource graph, not just documentation
    domain: cost
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: A production-lean plan structurally cannot contain the resources its own cost policy forbids; the saving is a property of the graph rather than a claim in a doc.
    current_behavior: >
      Implemented in 318eea8. profiles.tf previously defined nine `enable_*`
      locals referenced by nothing outside the test file while main.tf
      instantiated module.rds / module.elasticache / module.msk /
      module.neptune unconditionally, so a production-lean plan provisioned
      every resource the policy forbids and local.lean / local.staging were
      dead. Those locals are now wired into module `count` and module inputs:
      normalized locals were introduced first, every consumer of
      module.msk.bootstrap_brokers_tls / module.elasticache.primary_endpoint /
      module.neptune.cluster_endpoint repointed at them, and only then was
      `count` added — which is what the deferred TODO claimed was impossible.
      network_egress_mode (public_ip|single_nat|ha_nat|vpc_endpoints|none)
      derives nat_mode and assign_public_ip, so lean and staging provision zero
      NAT gateways; the private default route moved out of the inline `route`
      block into a counted aws_route.private_nat so a private route table stays
      valid with no NAT at all. Backend selectors are real ECS inputs. Every
      dedicated-ML resource is count-gated rather than scaled to zero. A latent
      plan-breaking bug was fixed en route — passing module.elasticache[0].cluster_id
      into monitoring made `count` depend on an apply-time attribute and failed
      `terraform plan` outright on scale and enterprise. moved.tf covers all
      fourteen changed state addresses so an applied scale/enterprise workspace
      migrates instead of being destroyed, and DECOMMISSION.md documents the
      destroy-safety procedure and the one-time private-route migration hazard
      that `moved` cannot express.
    required_behavior: >
      `deployment_profile` selects real module cardinality. production-lean and
      staging plan zero NAT gateways and none of MSK, ElastiCache, Neptune,
      legacy RDS, dedicated ML or frontend ECS. Assertions read the planned
      module graph (`length(module.msk) == 0` and friends), never the locals
      that produced it, so a local that stops being wired into `count` fails
      rather than passes.
    affected_paths:
      - AWS Deployment/aether-aws/terraform/profiles.tf
      - AWS Deployment/aether-aws/terraform/main.tf
      - AWS Deployment/aether-aws/terraform/variables.tf
      - AWS Deployment/aether-aws/terraform/moved.tf
      - AWS Deployment/aether-aws/terraform/profiles/
      - AWS Deployment/aether-aws/terraform/modules/vpc/main.tf
      - AWS Deployment/aether-aws/terraform/modules/ecs/main.tf
      - AWS Deployment/aether-aws/terraform/modules/alb/main.tf
      - AWS Deployment/aether-aws/terraform/modules/monitoring/main.tf
      - AWS Deployment/aether-aws/terraform/tests/profile_plan.tftest.hcl
      - AWS Deployment/aether-aws/terraform/DECOMMISSION.md
      - config/terraform_resource_contracts.yaml
    tests_required:
      - "make test-terraform-profiles (terraform validate + terraform test over tests/profile_plan.tftest.hcl)"
      - tests/unit/test_terraform_resource_contracts.py
    evidence_required:
      - "terraform validate: Success, configuration is valid"
      - "terraform test: 5 run blocks over 4 profiles (staging, staging_asleep, production-lean, production-scale, enterprise-isolated) — 5 passed, 0 failed"
      - "mutation proof: forcing count = 1 fails with 'module.msk is tuple with 1 element'"
    docs_required:
      - docs/DEPLOYMENT-PROFILES.md
      - docs/AWS-LEAN-PRODUCTION.md
      - AWS Deployment/aether-aws/terraform/DECOMMISSION.md
    owner: platform
