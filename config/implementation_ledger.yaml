    evidence_required: [collect_evidence.py bundle index]
    docs_required: [docs/FOUNDING-TENANT-PRODUCTION.md, docs/DEPLOYMENT-PROFILES.md, docs/RELEASE-EVIDENCE.md]
    owner: platform
    status: implemented
    blocked_by: []
    exception: null
    last_verified_commit: null

  - id: FT-COST-POLICY-DATA
    title: Canonical production-lean cost policy (forbidden expensive resources)
    domain: cost
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Fixes the target that production-lean must exclude MSK/Neptune/ElastiCache/ClickHouse/dedicated-ML/frontend-ECS/NAT.
    current_behavior: Cost levers existed in Terraform but no single canonical forbidden-resource policy.
    required_behavior: deployment_profiles.yaml declares production-lean forbidden + required resources; a validator enforces well-formedness.
    affected_paths: [config/deployment_profiles.yaml, scripts/release/check_cost_policy.py]
    tests_required: [make validate-cost-policy]
    evidence_required: [cost policy validation output]
