    blocked_by: [FT-COST-POLICY-DATA]
    exception: null
    last_verified_commit: null

  - id: FT-9-PLAN-POLICY
    title: Plan-shaped policy enforcement — a real terraform show -json checked against the profile contract
    domain: cost
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: The compliance claim is now made against the plan that would be applied, not against the source that produced it.
    current_behavior: >
      Implemented in 2c290c8. check_cost_policy_terraform.py regex-parses
      profiles.tf and asserts local booleans are false — it never sees a plan,
      so it can only confirm that the source says the right thing.
      check_terraform_plan_policy.py maps a real `terraform show -json` onto the
      canonical policy keys in config/deployment_profiles.yaml via
      config/terraform_resource_contracts.yaml and asserts that forbidden
      resources have zero actively-planned instances, that required resources
      are present, and that ECS service cardinality, network mode and static
      frontend origins match the profile. It fails closed on an expensive
      resource type no matcher claims and on any canonical key without a
      matcher, so silence never reads as success; a resource being destroyed is
      correctly not a violation. Both gates are kept: the source gate and the
      plan gate fail differently and a drifted local is distinguishable from a
      drifted plan. Fifteen committed plan fixtures pin the behaviour — one
      valid lean plan, one valid scale plan, awake and asleep staging, and
      eleven mutations (msk, elasticache, neptune, legacy rds, dedicated ml,
      frontend ecs, nat gateway, missing aurora, eight worker services, unsized
      ECS service, unmatched expensive type, destroying msk). Fixing this
      surfaced a real gap at source: frontend_ecs_services was declared
      forbidden in the contracts file with `permitted_in: []` but absent from
      the scale and enterprise forbidden lists, so those plans were never
      actually checked for it.
    required_behavior: >
      A plan JSON, not a source file, is the input to the policy gate; every
      canonical required and forbidden key resolves to a matcher with a declared
      cardinality; an unmapped expensive resource type is a hard failure.
    affected_paths:
      - scripts/release/check_terraform_plan_policy.py
      - config/terraform_resource_contracts.yaml
      - tests/fixtures/terraform_plans/
      - tests/unit/test_terraform_plan_policy.py
      - tests/unit/test_terraform_resource_contracts.py
      - Makefile
    tests_required:
      - "make test-plan-policy (tests/unit/test_terraform_plan_policy.py + tests/unit/test_terraform_resource_contracts.py)"
      - "make validate-terraform-profile-policy against the committed lean fixture"
    evidence_required:
