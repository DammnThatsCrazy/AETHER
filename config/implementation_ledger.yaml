  - id: FT-9-DEPLOYMENT-EVIDENCE
    title: Evidence-backed deployment readiness scorecard, separating code-complete from externally verified
    domain: release-governance
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: Aether can state a readiness number only where an artifact on disk supports it, so the gap between what is built and what is proven is reported rather than absorbed.
    current_behavior: >
      config/deployment_readiness.yaml is the control table and
      scripts/release/check_deployment_readiness.py the checker. Weight is
      awarded only when a named artifact exists and validates — `status` is a
      record, not an input, so writing verified_complete on a control with no
      evidence file scores zero exactly as not_started would. Three numbers are
      reported and never merged: code-complete, externally-verified, and the gap
      between them. The `credentialed_artifact` evidence kind is unsatisfiable
      without credentials by construction (it requires a real account id, a real
      region, a captured_at timestamp, a commit sha and a source path outside
      any temp or scratchpad directory), which is what stops a synthetic plan or
      a hand-written JSON file from buying external-verification credit.
      CURRENT MEASURED RESULT, run at this working tree — overall 100/100
      code-complete and 20/100 externally-verified; production-lean 100/100 and
      20/100; staging 75/100 and 0/100; 19 controls built but unproven;
      1 of 17 hard gate conditions met; deployment_ready: false.
    required_behavior: >
      No deployment-readiness percentage is quotable unless the control table
      awards it from an artifact; controls that depend on an AWS account carry
      external_dependency.required and can never contribute to the
      externally-verified score from inside CI.
    affected_paths:
      - config/deployment_readiness.yaml
      - scripts/release/check_deployment_readiness.py
      - scripts/release/collect_evidence.py
      - tests/unit/test_deployment_readiness.py
    tests_required:
      - tests/unit/test_deployment_readiness.py
      - "make deployment-readiness-score"
    evidence_required:
      - "check_deployment_readiness.py control-table integrity: PASS — 5 checks passed"
      - release-evidence/ bundle with a checksummed manifest (ABSENT — COND-BUNDLE-CHECKSUM unmet)
      - release-evidence/terraform/lean-plan-provenance.json (credentialed lean plan — ABSENT)
      - release-evidence/terraform/promotion-provenance.json (a real reviewed apply — ABSENT)
      - "seven days of observed AWS billing for production-lean (ABSENT — COND-COST-OBSERVED-7D, COND-COST-RECONCILED unmet)"
    docs_required:
      - docs/RELEASE-EVIDENCE.md
      - docs/DEPLOYMENT-PROFILES.md
    owner: platform
    status: externally_blocked
    blocked_by: [FT-9-STAGING-LIFECYCLE, FT-9-REVIEWED-PROMOTION, FT-9-COST-ENFORCEMENT]
    exception: >
      Externally blocked by definition — this item's whole purpose is to hold
