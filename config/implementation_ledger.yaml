  - id: FT-9-COST-ENFORCEMENT
    title: Numeric cost ceiling enforced from a pinned, repo-owned price book
    domain: cost
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: The lean profile is gated on a currency figure rather than on a prose estimate, and the figure is reproducible offline.
    current_behavior: >
      Implemented in 2c290c8. Cost policy previously enforced SHAPE only
      (which resource classes may exist); a plan could satisfy the shape and
      still blow the budget through an oversized instance class inside an
      allowed type. check_cost_model.py prices the inventory emitted by the plan
      policy gate against config/aws_price_book.yaml — a pinned, region-scoped,
      repo-owned table, deliberately not a pricing API, so the same plan scores
      the same on every run and an upstream price change arrives as a reviewed
      diff rather than a surprise red build. Fixed cost (accrues on the clock,
      determined by the plan) is separated from usage-variable cost (driven by
      tenant traffic, modelled as scenarios and reported but never used as a
      ceiling). An unpriceable FIXED resource is a hard error and never a silent
      zero — which is how the rule proved itself, since secret rotation was
      unpriceable and the gate refused to pass until the book covered it, along
      with seven other types a real lean plan contains.
      MEASURED PRODUCTION-LEAN FIXED BASELINE: USD 184.13/month (Fargate
      121.10, Aurora 0.5-ACU floor 43.80, ALB 16.43, KMS 2.00, Secrets 0.80).
      That is USD 34.13 OVER the USD 150 design target and inside the USD 200
      hard ceiling. The gate therefore warns and passes. The overage is a
      deviation the user explicitly accepted and it is documented in
      docs/COST-OPTIMIZATION.md rather than silently absorbed by re-targeting;
      config/cost_exceptions.yaml declares no active exception because none is
      needed under the hard ceiling.
    required_behavior: >
      A deterministic, offline, fail-closed estimator scores each cost-capped
      profile's fixed baseline against its declared target and hard ceiling;
      exceeding the ceiling fails the release unless an active, time-bounded
      entry in config/cost_exceptions.yaml covers it; usage-variable cost is
      always reported alongside so the total is never presented as just the
      fixed baseline.
    affected_paths:
      - config/aws_price_book.yaml
      - config/cost_exceptions.yaml
      - config/deployment_profiles.yaml
      - scripts/release/check_cost_model.py
      - tests/unit/test_cost_model.py
    tests_required:
      - "make test-cost-model (tests/unit/test_cost_model.py)"
      - "make validate-cost-model against the committed lean plan fixture"
    evidence_required:
      - "check_cost_model.py --profile production-lean: PASS — 6 checks passed"
      - "fixed USD 184.13/mo separated from usage-variable USD 107.22/mo (expected scenario); 17 fixed, 15 usage-variable, 29 zero-cost resources all resolved"
      - "warning recorded: fixed cost exceeds the USD 150.00 target, under the USD 200.00 ceiling"
      - reports/cost/cost-report.json
    docs_required:
      - docs/COST-OPTIMIZATION.md
      - docs/DEPLOYMENT-PROFILES.md
    owner: platform
    status: targeted_tests_pass
    blocked_by: [FT-9-PLAN-POLICY, FT-COST-POLICY-DATA]
    exception: null
