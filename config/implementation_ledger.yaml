  - id: FIN-CRED-1-AUTHORITY
    title: Durable, encrypted, multi-slot provider-credential authority + API + KMS-ready cipher
    domain: financial-observability
    severity: P0
    release_class: founding_tenant_release_blocker
    customer_impact: >
      Tenant provider credentials become durable, encrypted, multi-slot and
      tenant-isolated — the prerequisite for enabling any payment/stablecoin
      integration. Replaces the process-local, single-key in-memory vault as the
      credential authority for the financial cohort.
    current_behavior: >
      BYOKKeyVault stored one undifferentiated api_key per (tenant, provider) in a
      process-memory dict (lost on restart, not shared across replicas), with
      Fernet/base64 and no KMS. The generic key API disagreed with the vault
      (dict-as-object AttributeError; missing category TypeError). Coinbase/MoonPay/
      Bridge each need two credentials the single-slot vault could not hold.
    required_behavior: >
      A durable provider_credential_versions table (JSONB, partial-unique
      active/previous/version indexes) backs a CredentialAuthority state machine
      (create_pending/test/activate/rotate/revoke/delete/purge) with bounded
      webhook-secret overlap, optimistic concurrency, and a version-keyed decrypt
      cache. A CredentialCipher abstraction (LocalCredentialCipher AES-GCM +
      AwsKmsEnvelopeCredentialCipher) binds tenant/provider/environment/slot/version
      as authenticated context and fails closed in staging/production. A slot-aware,
      write-only /v1/providers/credentials API (idempotency, optimistic concurrency,
      tenant-admin authz, sanitized audit) never returns a secret. Tenant deletion
      cascades credential rows. KMS IaC (terraform modules/kms_credentials) is
      defined. The legacy generic key API is repaired and deprecated.
    affected_paths:
      - "Backend Architecture/aether-backend/services/providers/credentials/authority.py"
      - "Backend Architecture/aether-backend/services/providers/credentials/repository.py"
      - "Backend Architecture/aether-backend/services/providers/credentials/slot_registry.py"
      - "Backend Architecture/aether-backend/services/providers/credentials/schema.py"
      - "Backend Architecture/aether-backend/services/providers/credentials/routes.py"
      - "Backend Architecture/aether-backend/services/providers/credentials/models.py"
      - "Backend Architecture/aether-backend/services/providers/credentials/startup.py"
      - "Backend Architecture/aether-backend/shared/providers/credential_cipher.py"
      - "Backend Architecture/aether-backend/alembic/versions/20260812_provider_credential_versions.py"
      - "Backend Architecture/aether-backend/services/providers/routes.py"
      - "Backend Architecture/aether-backend/shared/privacy/retention.py"
      - "config/storage_policies.yaml"
      - "AWS Deployment/aether-aws/terraform/modules/kms_credentials"
    tests_required:
