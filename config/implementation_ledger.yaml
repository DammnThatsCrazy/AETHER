      - Backend Architecture/aether-backend/shared/outbox.py
    tests_required: [relay + worker tests]
    evidence_required: [worker tests]
    docs_required: [docs/BACKEND-EXECUTION-MODEL.md]
    owner: platform
    status: not_started
    blocked_by: [FT-5-INGESTION-V2]
    exception: null
    last_verified_commit: null

