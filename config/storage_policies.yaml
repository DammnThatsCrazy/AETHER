  # ── Kyber Graph, fleet projections and cohorts ────────────────────────────
  #
  # The Kyber Graph is a PROJECTION of the graph mutation ledger, not a source
  # of record: every node and edge is rebuildable from the ledger by replaying
  # from offset zero. That is why these carry `standard` rather than `legal` and
  # `hard_delete` rather than `preserve` — preserving a derivable row buys no
  # evidence and costs storage forever. The evidence lives in the ledger and in
  # the audit trail, both of which are already `legal`.
  #
  # None of them requires consent invalidation: the graph stores platform
  # topology and REFERENCES into tenant data, never tenant record contents.
  - resource_type: kyber_graph_nodes
    authoritative_store: postgres
    metadata_store: postgres
    projection_stores: []
    codec: none
    format: row
    cache_ttl_seconds: 0
    materialization_mode: none
    retention_class: standard
    delete_behavior: hard_delete
    legal_hold_supported: true
    allow_adaptive_materialization: false
    allow_object_externalization: false
