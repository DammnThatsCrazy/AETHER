  # Everything that records a DECISION or a STATE CHANGE is `legal` and
  # `preserve`, because "no privileged access or command without durable
  # evidence" is worth nothing if the evidence is on a 365-day clock while the
  # blast radius it justified is permanent.

  # The operator's working queue. Resolved and suppressed items age out.
  - resource_type: kyber_exceptions
    authoritative_store: postgres
    metadata_store: postgres
    projection_stores: []
    codec: none
    format: row
    cache_ttl_seconds: 0
