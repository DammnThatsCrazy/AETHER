  # ---------------------------------------------------------------------------
  # Kyber workforce identity, device trust, sessions and access evidence.
  #
  # Two retention shapes, split on one question: does the row explain a past
  # access decision, or merely carry a current one?
  #
  #   legal + preserve   — evidence. Security evidence must outlive the session
  #                        that produced it; a session expiring must never erase
  #                        why access was granted.
  #   short_lived        — operational state (sessions, elevations, single-use
  #                        challenges) whose whole purpose ends with the session.
  #
  # Nothing here is externalizable to object storage and nothing is
  # consent-invalidated: an Olympus operator is not an Aether data subject, so
  # tenant consent revocation has no bearing on these rows.
  # ---------------------------------------------------------------------------

  # Who an operator is. Tombstoned rather than hard-deleted so an offboarded
    # principal's audit trail keeps resolving to a real identity.
  - resource_type: olympus_workforce_principals
    authoritative_store: postgres
    metadata_store: postgres
    projection_stores: []
    codec: none
    format: row
    cache_ttl_seconds: 0
    materialization_mode: none
    retention_class: standard
    delete_behavior: tombstone
    legal_hold_supported: true
    allow_adaptive_materialization: false
    allow_object_externalization: false
    allow_historical_table_storage: true
    requires_consent_invalidation: false
    requires_permission_hash: true

