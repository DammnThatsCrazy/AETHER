# =============================================================================
# Aether — Storage Policy Registry (enforced)
#
# One policy per persistent resource type (FT-7-STORAGE-DESCRIPTORS). The
# inventory is derived from the repo itself — BaseRepository store names in
# repositories/repos.py plus every table created by alembic/versions/*.py —
# and scripts/release/check_storage_policies.py fails CI when a persistent
# type has no policy here (or a policy no longer maps to a real type).
#
# The PR-0 seed's representative policies were carried forward onto their
# concrete resource types: bronze_sdk_event -> bronze_sdk_events,
# consent_record -> consent_records, and audit_log -> the concrete audit /
# evidence tables in the audit section below.
#
# Consumed at runtime by shared/storage/manager.py (StorageManager), which
# fails closed (KeyError) for resource types without a policy.
# =============================================================================

schema_version: 1
canonical_source: config/storage_policies.yaml
enforcement_status: enforced   # coverage gate: check_storage_policies.py

policies:

  # ---------------------------------------------------------------------------
  # Raw event payload stores — high-volume, compressible, externalizable
  # to object storage (packed jsonl + zstd); consent revocation must
  # invalidate derived materializations.
  # ---------------------------------------------------------------------------

  - resource_type: bronze_sdk_events
    authoritative_store: postgres
    metadata_store: postgres
    projection_stores: [clickhouse]
    codec: zstd
    format: jsonl
    cache_ttl_seconds: 0
    materialization_mode: on_demand
    retention_class: standard
    delete_behavior: hard_delete
    legal_hold_supported: true
    allow_adaptive_materialization: false
    allow_object_externalization: true
    allow_historical_table_storage: true
    requires_consent_invalidation: true
    requires_permission_hash: false

