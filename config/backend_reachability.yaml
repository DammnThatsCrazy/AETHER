schema_version: 1
authority: backend-reachability
root: services/backend
entries:
  - main
dynamic_packages:
  - path: alembic
    reason: alembic loads every revision from the versions directory by file
  - path: services.providers
    reason: provider modules are imported by provider id (services/identity/provider_evidence.py)
  - path: services.measurement.connectors
    reason: connector modules are imported by name (services/measurement/connectors/ad_accounts.py)
generated_globs:
  - '(^|/)generated_[^/]*\.py$'
allow_unreachable:
  - package: services
    modules: [communication360]
    ledger: product-backend-unmounted-code-pending
    reason: no test or document uses it and no route, worker or import path reaches it; it sits in a package with live code, so removing it is an owner decision
  - package: services.communication360
    modules: [authority, contracts, fidelity, knowledge, provider, reader, registry, repository, resolution, routes]
    ledger: product-backend-unmounted-code-pending
    reason: implemented, but no route, worker or import path reaches it; some modules are only tested, some only documented, some neither
  - package: services.crossdomain
    modules: [models]
    ledger: product-backend-unmounted-code-pending
    reason: implemented and tested, but no route, worker or import path reaches it
