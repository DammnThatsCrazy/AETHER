schema_version: 1
authority: backend-reachability
root: services/api
entries:
  - main
dynamic_packages:
  - path: alembic
    reason: alembic loads every revision from the versions directory by file
  - path: connectors.providers
    reason: provider modules are imported by provider id (services/api/identity/identity/provider_evidence.py)
  - path: journeys.measurement.connectors
    reason: connector modules are imported by name (services/api/journeys/measurement/connectors/ad_accounts.py)
generated_globs:
  - '(^|/)generated_[^/]*\.py$'
allow_unreachable:
  - package: governance.model_extraction_defense
    modules: [admin_cli, mesh_config]
    ledger: product-backend-unmounted-code-pending
    reason: formerly the repo-root security/ package (outside the scanned tree); admin_cli is an operator `python -m` entry point and mesh_config has no import path, so removal is an owner decision
  - package: journeys.communication360
    modules: [authority, fidelity, knowledge, registry, resolution]
    ledger: product-backend-unmounted-code-pending
    reason: authority, fidelity, knowledge, registry, and resolution remain unmounted; contracts, provider, reader, repository, and routes are reachable through the mounted Communication360 path
  - package: graph.crossdomain
    modules: [models]
    ledger: product-backend-unmounted-code-pending
    reason: implemented and tested, but no route, worker or import path reaches it
  - package: ingestion.data_exchange
    modules: [events]
    ledger: product-backend-unmounted-code-pending
    reason: documented, but no route, worker or import path reaches it
