# Reviewed contract for the narrow role used only to validate the payload shape
# of application secrets before a staging plan, wake, or smoke run. This role
# is intentionally separate from lifecycle: lifecycle may stop cost and inspect
# task metadata, but must never read application secret values.
version: 1
profile: staging
role: AetherStagingSecretPreflight
region: us-east-1
statements:
  - sid: ReadStagingApplicationSecretPayloads
    actions:
      - secretsmanager:GetSecretValue
    resource: arn:aws:secretsmanager:us-east-1:${account_id}:secret:aether/*
    scope: staging-name-prefix
  - sid: DecryptStagingApplicationSecrets
    actions:
      - kms:Decrypt
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-secrets-kms-key
    conditions:
      StringEquals:
        aws:ResourceTag/Environment: staging
      ForAnyValue:StringLike:
        kms:ResourceAliases:
          - alias/aether-staging-secrets

forbidden_actions:
  - secretsmanager:PutSecretValue
  - secretsmanager:UpdateSecret
  - secretsmanager:DeleteSecret
  - secretsmanager:RotateSecret
  # kms:Decrypt above is the sole permitted KMS operation. Keep every other
  # KMS capability forbidden, including future broad grants on this role.
  - kms:*
  - iam:*
