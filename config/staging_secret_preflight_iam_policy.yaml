# Reviewed contract for the narrow role used only to validate the payload shape
# of application secrets before a staging plan, wake, or smoke run. This role
# is intentionally separate from lifecycle: lifecycle may stop cost and inspect
# task metadata, but must never read application secret values.
version: 1
profile: staging
role: AetherStagingSecretPreflight
region: us-east-1
statements:
  - sid: ReadStagingApplicationSecretPayloads
    actions:
      - secretsmanager:GetSecretValue
    resource: arn:aws:secretsmanager:us-east-1:${account_id}:secret:aether/*
    scope: staging-name-prefix

forbidden_actions:
  - secretsmanager:PutSecretValue
  - secretsmanager:UpdateSecret
  - secretsmanager:DeleteSecret
  - secretsmanager:RotateSecret
  - kms:*
  - iam:*
