# Least-privilege role for the development web app (AETHER-development-web):
# per-PR previews (.github/workflows/frontend-preview.yml) and the persistent
# Development build (.github/workflows/development-web.yml). The role can only
# manage the pr-* branches and the one `development` branch of that app, plus
# read the staging web app's public VITE_* build settings. It cannot touch the staging or
# production apps, the backend, data, or Terraform state.
#
# Placeholders: ${account_id}; ${frontend_preview_app_id} is the Terraform
# output frontend_preview_app_id; ${staging_aether_app_id} is the id of
# AETHER-staging-web (the one staging app, which builds the product under
# /app). The workflow finds both apps by name (ListApps
# cannot be resource-scoped); the role ARN is the repository variable
# FRONTEND_PREVIEW_ROLE_ARN.
version: 1
profile: staging
role: AetherStagingFrontendPreview
region: us-east-1
trust:
  # GitHub OIDC for this repository only: its pull_request (ready_for_review)
  # runs, and runs of the workflow on main (dispatch refresh, merge and
  # scheduled cleanup). Pull requests from forks receive no OIDC token, and
  # every deploy path also requires the head repository to be this one.
  provider: token.actions.githubusercontent.com
  audience: sts.amazonaws.com
  subjects:
    - repo:DammnThatsCrazy/AETHER:pull_request
    - repo:DammnThatsCrazy/AETHER:ref:refs/heads/main
    - repo:DammnThatsCrazy/AETHER:ref:refs/heads/Development
statements:
  - sid: DiscoverPreviewAndStagingApps
    actions:
      - amplify:ListApps
    resource: '*'
    scope: global-read-required-by-api
  - sid: ReadPreviewAndStagingAppSettings
    actions:
      - amplify:GetApp
    resource:
      - arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}
      - arn:aws:amplify:us-east-1:${account_id}:apps/${staging_aether_app_id}
    scope: frontend-preview-app-read
  - sid: ListPreviewBranches
    # Amplify authorizes ListBranches against the app's branches/* ARN, not
    # the app ARN (an app-ARN grant is denied).
    actions:
      - amplify:ListBranches
    resource: arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}/branches/*
    scope: frontend-preview-app-read
  - sid: ManagePreviewBranches
    actions:
      - amplify:CreateBranch
      - amplify:GetBranch
      - amplify:DeleteBranch
      - amplify:CreateDeployment
      - amplify:StartDeployment
    resource:
      - arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}/branches/pr-*
      - arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}/branches/development
      # CreateDeployment and StartDeployment authorize on the deployments child.
      - arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}/branches/development/deployments/*
    scope: frontend-preview-branches
  - sid: ReadPreviewDeploymentJobs
    actions:
      - amplify:GetJob
    resource:
      - arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}/branches/pr-*/jobs/*
      - arn:aws:amplify:us-east-1:${account_id}:apps/${frontend_preview_app_id}/branches/development/jobs/*
    scope: frontend-preview-jobs
