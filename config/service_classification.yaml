# Service classification registry — every backend service directory has exactly
# one lifecycle class, so a new directory cannot appear unclassified.
#
# Class (whether it directly supports the proof path
# tenant -> source -> evidence -> normalization -> resolution -> graph ->
# intelligence -> explanation -> action -> outcome):
#   core          supports the proof path or the tenant-facing core product
#   beta          shipped product surface that is not yet core
#   experimental  flag-gated, observation-only or unproven; may change or go
#   internal      Olympus/operator plane, not a tenant surface
#   deprecated    superseded; must have a row in config/debt_retirement_ledger.yaml
#   archived      kept for history, outside the runtime authority graph
#   removed       tombstone for a deleted directory (kept out of the tree)
#
# stage is the primary runtime-spine stage, or control-plane / product / tenant.
#
# STATUS: proposed. The classes below are a first pass derived from each
# package's own docstring and the maintainer's core / beta / experimental lists.
# They are not a readiness claim. The maintainer reviews and changes them in a
# normal PR; `scripts/validate_service_classification.py` enforces coverage,
# vocabulary and the deprecated-needs-a-ledger-row rule.

