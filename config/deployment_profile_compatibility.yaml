schema_version: 1
profiles:
  staging:
    require_https: true
    allow_placeholder_endpoints: false
  production-lean:
    require_https: true
    allow_placeholder_endpoints: false
  production-scale:
    require_https: true
    allow_placeholder_endpoints: false
  enterprise-isolated:
    require_https: true
    allow_placeholder_endpoints: false
required_frontend_fields:
  - api_url
  - websocket_url
  - identity_issuer
  - identity_audience
  - identity_client_id
  - identity_scopes
  - redirect_urls
  - tenant_bootstrap_url
  - operator_url
  - tenant_url
placeholder_tokens: [localhost, 127.0.0.1, example.com, changeme, placeholder]
