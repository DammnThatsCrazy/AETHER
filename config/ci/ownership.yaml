# CI V2 selection rules. Suite ids, paths and runner commands come from
# config/test_suites.yaml; this file only adds what the registry cannot say.
# A changed path selects every registered suite whose `paths` contain it, plus
# the matches below. Anything unmatched fails closed to every PR-lane suite.
version: 2
fallback: broad-safe

# Always selected when any non-text-only file changes. Owners cannot opt out.
critical:
  - backend-identity
  - compliance
  - root-unit-security

# Text-only paths: selected suite is `docs` (static consistency) and nothing else.
text_only:
  - "**/*.md"
  - "docs/**"
  - "LICENSE"
  - "reports/**"

# Fan-out: root/toolchain config, lockfiles, shared packages, CI itself.
# A change here selects every PR-lane suite.
fanout:
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "pyproject.toml"
  - "tsconfig.json"
  - "eslint.config.mjs"
  - "vitest.config.*"
  - "Makefile"
  - "config/test_suites.yaml"
  - "config/ci/**"
  - "scripts/**"
  - ".github/workflows/**"
  - "packages/shared/**"
  - "packages/config/**"
  - "packages/ui/**"

# Extra path -> suite mappings for source the registry `paths` do not cover.
# services/api is one tightly coupled runtime (shared graph/identity/tenancy
# code is imported everywhere), so any change under it selects the whole
# backend group. Parity replay against the legacy impact graph showed narrower
# per-subdirectory rules missed suites (agent-layer, contracts, journey-service).
extra:
  - include: ["services/api/**"]
    suites: [backend-identity, backend-ingestion, backend-campaigns, backend-profile360,
             backend-agent, backend-computation, backend-value, backend-observability,
             agent-layer, contracts, journey-service, root-unit-control,
             root-unit-identity-profile, root-unit-ingestion, root-unit-graph,
             root-unit-commerce-value, root-unit-security, root-unit-operations,
             root-unit-platform, root-unit-frontend-sdk]
  - include: ["packages/sdk/**"]
    suites: [backend-ingestion, root-unit-ingestion, functionality-proof-ts]
  - include: ["infra/**", "amplify.yml", "docker-compose.yml"]
    suites: [root-unit-operations]

# Non-suite checks: commands that protect an invariant but are not registered
# test suites (type checks, browser e2e). Selected when a changed path matches
# `include`, or for every check on a broad-safe selection. Each mirrors the
# command of the legacy workflow named in `replaces`; that workflow's PR trigger
# is retired only after hosted parity (see docs/engineering/ci-v2/).
checks:
  - id: aether-web-typecheck
    replaces: aether-test.yml
    include: ["apps/aether-web/**"]
    run: ["npm run typecheck --workspace=apps/aether-web"]
  - id: kyber-web-e2e
    replaces: kyber-e2e.yml
    include: ["apps/kyber-web/**", "packages/sdk/web/**"]
    setup: ["npm run build --workspace=packages/sdk/web",
            "npx playwright install --with-deps chromium"]
    run: ["npm run test:integration --workspace=apps/kyber-web",
          "npm run test:e2e --workspace=apps/kyber-web"]
    env: {CI: "true"}
  - id: identity-continuity
    replaces: identity-continuity-gates.yml
    # Gates 1 and 6 (static) plus the Gate 2/3 tests that no registry suite runs.
    # Gates 2-5 and the pytest half of Gate 7 are already covered by the
    # backend-identity and backend-computation suites. The pnpm proof-package
    # half of Gate 7 is the `identity-proof-packages` check below.
    include: ["services/api/identity/**", "services/api/tests/identity/**",
              "services/api/tests/providers/**", "packages/shared/contracts/identity/**",
              "apps/aether-web/src/features/identity/**", "scripts/generate_contracts.py",
              "scripts/identity_confidence_calibration_evaluation.py",
              "scripts/ci_check_identity_continuity.py",
              "tests/unit/test_identity_continuity_calibration_workflow.py"]
    node: false
    python_extra: "dev,backend"
    run: ["python scripts/ci_check_identity_continuity.py",
          "python scripts/generate_contracts.py --check",
          # Separate sessions: services/api/tests and tests/ each have a conftest.py that
          # cannot be imported together (pytest ImportPathMismatchError).
          "python -m pytest services/api/tests/providers/test_identity_evidence.py services/api/tests/providers/test_commerce_identity_evidence.py -v",
          "python -m pytest tests/unit/test_identity_continuity_calibration_workflow.py -v",
          "python scripts/identity_confidence_calibration_evaluation.py --help > /dev/null"]
  - id: identity-proof-packages
    replaces: identity-continuity-gates.yml
    # pnpm half of Gate 7: tsc builds of the proof packages plus the
    # @aether/proof-reporting build and vitest run (no other workflow runs reporting).
    include: ["tests/e2e/proof/**", "pnpm-lock.yaml", "pnpm-workspace.yaml",
              "packages/shared/contracts/identity/**"]
    node: false
    pnpm: true
    run: ["pnpm --filter @aether/proof-contracts build",
          "pnpm --filter @aether/proof-fixtures build",
          "pnpm --filter @aether/proof-runner build",
          "pnpm --filter @aether/proof-reporting build",
          "pnpm --filter @aether/proof-reporting test"]
  - id: functionality-proof
    replaces: functionality-proof.yml
    # The gating jobs of the legacy pipeline (lint, typecheck, test, contracts, sdk,
    # fixtures, runner, build). Its smoke jobs end in `|| echo` and cannot fail, so
    # they gate nothing and are not ported; Playwright e2e and graph move to the
    # post-merge tier (see the retirement ledger).
    include: ["tests/e2e/proof/**", "apps/marketing-aether/**", "apps/marketing-olympus/**",
              "apps/demo/**", "apps/docs/**", "apps/status/**", "packages/sdk/web/**",
              "packages/shared/**", "packages/config/**", "pnpm-lock.yaml",
              "pnpm-workspace.yaml", ".github/workflows/functionality-proof.yml"]
    node: false
    pnpm: true
    env:
      AETHER_ENV: ci
      VITE_AETHER_ENV: production
      VITE_KYBER_ENV: production
      VITE_DEMO_ENV: production
      VITE_API_BASE_URL: https://api.invalid
      VITE_AETHER_ENDPOINT: https://api.invalid
      VITE_WS_BASE_URL: wss://api.invalid
      VITE_GRAPHQL_URL: https://api.invalid/v1/analytics/graphql
      VITE_OIDC_AUTHORITY: https://identity.invalid
      VITE_OIDC_CLIENT_ID: workspace-build
      VITE_OIDC_REDIRECT_URI: https://app.invalid/callback
      VITE_DEMO_TENANT_ID: certification-demo
      VITE_DEMO_SEED_NAMESPACE: certification
      VITE_AETHER_URL: https://app.invalid
      VITE_KYBER_URL: https://operator.invalid
    run:
      - "pnpm -r --if-present --filter '@aether/proof-contracts' --filter '@aether/aether-marketing' --filter '@olympus/olympus-marketing' --filter '@aether/demo' run lint"
      - "pnpm -r --if-present --filter '@aether/proof-contracts' --filter '@aether/aether-marketing' --filter '@olympus/olympus-marketing' --filter '@aether/demo' run typecheck"
      - "pnpm -r --if-present --filter '@aether/aether-marketing' --filter '@olympus/olympus-marketing' run test"
      - "pnpm --filter '@aether/proof-contracts' run test"
      - "pnpm --filter '@aether/web' run test"
      - "pnpm --filter '@aether/proof-fixtures' run test"
      - "pnpm --filter '@aether/proof-runner' run test"
      # demo/ui import @aether/shared without declaring it, so pnpm's topological order
      # does not build it first; build it explicitly.
      - "pnpm --filter '@aether/shared' run build"
      - "pnpm -r --if-present --filter '@aether/docs' --filter '@aether/demo' --filter '@olympus/status' --filter '@olympus/olympus-marketing' --filter '@aether/aether-marketing' --filter '@aether/web' --filter '@aether/shared' --filter '@aether/config' --filter '@olympus/brand' run build"
  - id: access-kit-container
    replaces: access-kit-container.yml
    include: ["packages/access-kit/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc",
              "scripts/ci_access_kit_smoke.sh"]
    node: false
    run: ["npm pack ./packages/access-kit --dry-run",
          "docker buildx build --platform linux/amd64 --load --file packages/access-kit/Dockerfile --tag aether-access-kit:ci .",
          "bash scripts/ci_access_kit_smoke.sh"]
  - id: contracts-slither
    replaces: smart-contract-analysis.yml
    # Static analysis only: the hardhat test half (`contract-tests`) duplicates suite
    # `smart-contracts` and is retired with the workflow. SARIF upload to code scanning
    # stays in the retained push-to-main workflow.
    include: ["packages/contracts/smart-contracts/**"]
    run:
      - "python3 -m venv /tmp/slither-venv && /tmp/slither-venv/bin/pip install --quiet slither-analyzer"
      - "cd packages/contracts/smart-contracts && npm ci --ignore-scripts && npx hardhat compile"
      - "cd packages/contracts/smart-contracts && PATH=/tmp/slither-venv/bin:$PATH slither . --hardhat-artifacts-directory artifacts --exclude-optimization --exclude-dependencies --fail-high"
  - id: control-gates
    replaces: repo-consistency.yml
    # The legacy `universal-fast` job: the router's `fast` lane validators plus
    # `contracts`, run on every non-empty change including docs-only ones.
    always: true
    node: false
    python: true
    run: ["python scripts/ci_control_gates.py"]
  - id: build-selected
    replaces: repo-consistency.yml
    # Legacy `build-node` and `build-backend-image`: build only the workspaces and
    # backend image that Build Selection v2 derives from the diff. Nothing is archived.
    include: ["**"]
    base: true
    python: true
    run: ["python scripts/ci_build_selected.py"]
    env:
      VITE_AETHER_ENV: production
      VITE_KYBER_ENV: production
      VITE_DEMO_ENV: production
      VITE_API_BASE_URL: https://api.invalid
      VITE_AETHER_ENDPOINT: https://api.invalid
      VITE_WS_BASE_URL: wss://api.invalid
      VITE_GRAPHQL_URL: https://api.invalid/v1/analytics/graphql
      VITE_OIDC_AUTHORITY: https://identity.invalid
      VITE_OIDC_CLIENT_ID: workspace-build
      VITE_OIDC_REDIRECT_URI: https://app.invalid/callback
      VITE_DEMO_TENANT_ID: certification-demo
      VITE_DEMO_SEED_NAMESPACE: certification
      VITE_AETHER_URL: https://app.invalid
      VITE_KYBER_URL: https://operator.invalid
