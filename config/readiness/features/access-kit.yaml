# Feature readiness record — see config/readiness/schema.json.
# Legacy area: 'Access Kit (MCP / CLI / API)' in scripts/production_status.py.
feature_id: access-kit
title: Access Kit (MCP / CLI / API)
owning_system: aether
summary: 'Governed read access for agents and operators: a closed operation table shared by the CLI, local
  stdio MCP, hosted Streamable HTTP MCP and the Node client; named Profile360 reads (search, frame, slots,
  evidence) with per-slot source-watermark freshness; delegated MCP OAuth with an exact read allowlist and
  an opt-in read-only client-registration path; per-credential rate limits, audit/usage correlation,
  reconciliation and signed webhooks. Staging can run the hosted MCP under the wake/sleep lifecycle. Not
  yet exercised by a real tenant, a deployed hosted MCP, or a published npm package.'
scope:
  id: access-kit-design-partner-v1
  version: 1
  title: Access Kit read-only V1 for a design partner
  target: design-partner-pilot
  included:
  - contracts-and-schemas
  - core-behavior
  - runtime-wiring
  - authorization-and-tenant-isolation
  - persistence-and-migrations
  excluded:
  - governed-external-actions
  - billable-intelligence-operations
  deferred:
  - surfaces-beyond-profile360
repository_ceiling:
  type: VERIFIED
  achieved: false
  remaining_after_ceiling:
  - Run the hosted ci / verdict on the design-partner branch and record it.
  - Certify a real tenant end to end (W3) in staging over API, CLI, local MCP and hosted MCP.
  - Publish the npm prerelease and prove the four MCP host families.
  remaining_is_repository_controlled: false
  evidence:
  - packages/access-kit/
  - services/api/shared/freshness/
  - services/api/middleware/middleware.py
  - docs/architecture/target/mcp-api-cli-access-kit.md
  - docs/architecture/target/access-kit-360-w0-matrix.md
  - docs/operations/runbooks/ACCESS_KIT_W3_CERTIFICATION.md
implementation:
  state: RUNTIME_INTEGRATED
  denominator: in-scope repository controls
  controls:
  - id: contracts-and-schemas
    description: closed operation table, bounded inputs, typed client and drift-tested 360 catalog
    weight: 20
    satisfied: true
  - id: core-behavior
    description: Profile360 search, frame, slot and evidence reads with server-reported state preserved
    weight: 20
    satisfied: true
  - id: runtime-wiring
    description: CLI, local MCP, hosted MCP and Node client dispatch through the same owning routes
    weight: 20
    satisfied: true
  - id: authorization-and-tenant-isolation
    description: credential-derived tenant, read-semantic route policy, delegated MCP read allowlist
    weight: 20
    satisfied: true
  - id: persistence-and-migrations
    description: per-tenant source watermarks and atomic idempotency claims on durable stores
    weight: 20
    satisfied: true
  remaining_work: []
productionization:
  denominator: in-scope productionization controls
  controls:
  - id: security-controls
    description: tenant from credential only, identifier in body, read-only third-party grant
    weight: 25
    satisfied: true
  - id: observability-metrics-logs
    description: audit and usage events with request correlation; daily reconciliation
    weight: 25
    satisfied: true
  - id: reliability-idempotency-retry
    description: single-attempt adapter, per-credential rate limit, staging wake/sleep coverage
    weight: 25
    satisfied: true
  - id: ci-and-release-gates
    description: hosted verdict on this slice, npm publication and hosted MCP image promotion
    weight: 25
    satisfied: false
  remaining_work:
  - hosted ci / verdict on the design-partner branch
  - npm prerelease publication and staging aether-access-mcp image publication
activation:
  state: ENVIRONMENT_VALIDATION_PENDING
  blockers:
  - type: ENVIRONMENT_VALIDATION_PENDING
    description: No real tenant has completed install, sign-in, a Profile360 read, cross-tenant denial
      and usage reconciliation in staging (W3).
    owner: platform-ops
    required_action: Run docs/operations/runbooks/ACCESS_KIT_W3_CERTIFICATION.md in staging and record the
      evidence.
    source_code_change_expected: false
    affected_environments:
    - staging
    affected_release_profiles:
    - staging
    - pilot
    evidence_required: W3 certification report with request IDs for every step
  - type: INFRASTRUCTURE_WAITING
    description: The staging aether-access-mcp repository, image and enabled service do not exist yet, and
      the live AetherStagingDeploy policy must match the reviewed manifest.
    owner: platform-ops
    required_action: Follow the ordered staging enablement in docs/operations/STAGING-WAKE-SLEEP.md.
    source_code_change_expected: true
    affected_environments:
    - staging
    affected_release_profiles:
    - staging
    evidence_required: applied staging plan with the MCP service and a passing wake rehearsal
dependencies:
