feature_id: pattern-discovery
title: Pattern Discovery
owning_system: aether
summary: 'Governed discovery of patterns nobody defined in advance: schema-on-read extraction (PII digested),
  tenant baselines, deterministic detectors with cross-domain correlation, a lifecycle that surfaces patterns
  automatically and keeps them reviewable (curation, optional verdicts), what''s-new digests, pattern subgraphs,
  360 sections and segment lenses, DSR erasure and consent gates, promotion into attributed Risk360 signals,
  and Kyber/Aether surfaces. The master flag defaults OFF and no detector has measured precision or recall
  on labelled production data.'
