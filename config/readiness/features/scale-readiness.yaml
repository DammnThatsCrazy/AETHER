# Feature readiness record — see config/readiness/schema.json.
# Migration-derived from scripts/production_status.py (legacy area: 'scale readiness'). The 0-5 maturity score is decomposed across the model's
# independent dimensions; an external blocker never reduces implementation.
feature_id: scale-readiness
title: Scale Readiness
owning_system: aether
summary: Architecture is scale-shaped (Kafka, ClickHouse, medallion lake, partitioned S3).
scope:
  id: scale-readiness-v1
  version: 1
  title: Scale Readiness V1
  target: founding-tenant-production
  included:
  - contracts-and-schemas
  - core-behavior
  - runtime-wiring
  - persistence-and-migrations
  - authorization-and-tenant-isolation
  excluded: []
  deferred: []
repository_ceiling:
  type: VERIFIED
  achieved: true
  remaining_after_ceiling:
  - Provision the required cloud backend (apply Terraform for the target profile).
  - Record the staging load baseline (make load-smoke against staging) in docs/operations/LOAD-BASELINES.md.
  remaining_is_repository_controlled: false
  evidence:
  - tests/load/
  - scripts/load_smoke.py
  - docs/operations/LOAD-BASELINES.md
  - services/api/tests/scale/test_ingest_concurrency.py
implementation:
  state: VERIFIED
  denominator: in-scope repository controls (migration-derived)
  controls:
  - id: contracts-and-schemas
    description: contracts and schemas
    weight: 20
    satisfied: true
  - id: core-behavior
    description: core behavior
    weight: 20
    satisfied: true
  - id: runtime-wiring
    description: runtime wiring
    weight: 20
    satisfied: true
  - id: persistence-and-migrations
    description: persistence and migrations
    weight: 20
    satisfied: true
  - id: authorization-and-tenant-isolation
    description: authorization and tenant isolation
    weight: 20
    satisfied: true
    rationale: Isolation is proven while the system is loaded, not only at rest. Concurrent multi-tenant SDK batches
      leave each tenant holding exactly its own events, and a reused event id in another tenant is neither a duplicate
      nor visible across tenants; concurrent graph traversals and fraud evaluations never leak across tenants.
    evidence:
    - services/api/tests/scale/test_ingest_concurrency.py
    - tests/load/test_graph_load.py
    - tests/load/test_fraud_evaluation_load.py
  remaining_work: []
productionization:
  denominator: in-scope productionization controls (migration-derived)
  controls:
  - id: security-controls
    description: security controls
    weight: 25
    satisfied: true
  - id: observability-metrics-logs
    description: observability metrics logs
    weight: 25
    satisfied: true
  - id: reliability-idempotency-retry
    description: reliability idempotency retry
    weight: 25
    satisfied: true
    rationale: The real ingestion handler is exercised with concurrent duplicate and overlapping batches (an event is
      accepted and published exactly once, Bronze holds one row per event), a bus publish failure releases its claim so
      a retry is accepted rather than stranded as a duplicate, and a claim-store outage degrades as declared (events fail
      open, identify fails closed). Each test fails when its guarded behavior is removed.
    evidence:
    - services/api/tests/scale/test_ingest_concurrency.py
    - tests/load/locustfile.py
  - id: ci-and-release-gates
    description: ci and release gates
    weight: 25
    satisfied: true
    rationale: The load gate cannot silently lose coverage. Every exercised endpoint must carry a threshold and the gate
      fails closed on an unreachable backend or no traffic (unit-tested), the synthetic baseline runs in the unit suite,
      the new concurrency proofs run in the backend suite, and the staging lifecycle workflow runs the live smoke.
    evidence:
    - tests/unit/test_load_smoke_contract.py
    - tests/unit/test_load_synthetic.py
    - services/api/tests/scale/test_ingest_concurrency.py
    - scripts/load_smoke.py
    - .github/workflows/staging-lifecycle.yml
  remaining_work: []
