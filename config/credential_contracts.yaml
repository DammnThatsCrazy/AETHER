# Credential contracts — mobile / notification / distribution providers.
#
# Purpose (monoprompt §21): a canonical, machine-readable registry of every credential the
# mobile/notification/continuity program consumes, so that supplying a credential requires ONLY
# secret insertion + environment binding + provider verification — NEVER a source-code change.
#
# This file is DATA that REFERENCES the existing credential platform
# (Backend Architecture/aether-backend/shared/credentials/). It does NOT define a second
# credential store. Secret VALUES never appear here. Precedent:
# docs/integration-control-plane/DEPLOYMENT_CONTRACT.yaml.
#
# Field contract per credential (monoprompt §21):
#   id, provider, capability, environment, required_for_profiles, secret_reference, format,
#   validation_method, rotation_method, least_privilege_scope, owner, documentation, local_fake,
#   production_fake_forbidden, activation_smoke, evidence_required
#
# STATUS: contracts are declared in C0; the provider adapters + preflight that consume them land in
# C3. Every entry below is externally_blocked (see reports/mobile-productization/external-blockers.json)
# until real credentials are supplied. externally_blocked != implementation-incomplete and != production-ready.

schema_version: 1

credential_backend:
  # config-only switch into the existing platform; no provider code change.
  selector_env: AETHER_CREDENTIAL_BACKEND
  implementations: [in_memory, local_encrypted, aws_secrets_manager]
  reference: "Backend Architecture/aether-backend/shared/credentials/"

credentials:
  - id: apns
    provider: apple_push_notification_service
    capability: ios_push_delivery
    environment: [staging, production]
    required_for_profiles: [staging, production-lean, production-scale]
    secret_reference: "byok:notification:apns"        # resolved via credential_service.byok_ref
    format: "APNs auth key (.p8 token key: key_id + team_id + p8) OR provider cert"
    validation_method: "credentials-preflight: parse key, assert topic/bundle-id + environment (sandbox|production); no live send"
    rotation_method: "insert new .p8 alongside previous; drain window; revoke old"
    least_privilege_scope: "single APNs topic (app bundle id)"
    owner: mobile-platform
    documentation: "docs/source-of-truth/CREDENTIAL_ACTIVATION.md"
    local_fake: "provider-shaped APNs fake (accepts, returns synthetic apns-id receipt) — C3"
    production_fake_forbidden: true
    activation_smoke: "credentials-activation-smoke: sandbox device token accept + delivery receipt"
    evidence_required: "live APNs accept + delivery receipt in rehearsal"

  - id: fcm
    provider: firebase_cloud_messaging
    capability: android_push_delivery
    environment: [staging, production]
    required_for_profiles: [staging, production-lean, production-scale]
    secret_reference: "byok:notification:fcm"
    format: "FCM service-account JSON (project_id + private_key + client_email)"
    validation_method: "credentials-preflight: parse service account, assert project_id; no live send"
    rotation_method: "rotate service-account key in Google IAM; re-insert"
    least_privilege_scope: "FCM send scope for the single project"
    owner: mobile-platform
    documentation: "docs/source-of-truth/CREDENTIAL_ACTIVATION.md"
    local_fake: "provider-shaped FCM fake (accepts, returns synthetic message name) — C3"
    production_fake_forbidden: true
    activation_smoke: "credentials-activation-smoke: registration token accept + delivery receipt"
    evidence_required: "live FCM accept + delivery receipt in rehearsal"

  - id: web_push_vapid
    provider: web_push_vapid
    capability: web_push_delivery
    environment: [staging, production]
    required_for_profiles: [staging, production-lean, production-scale]
    secret_reference: "byok:notification:web_push_vapid"
    format: "VAPID keypair (public + private, P-256)"
    validation_method: "credentials-preflight: assert valid P-256 keypair + subject; no live send"
    rotation_method: "generate new keypair; re-subscribe clients"
    least_privilege_scope: "web push for the app origin"
    owner: mobile-platform
    documentation: "docs/source-of-truth/CREDENTIAL_ACTIVATION.md"
    local_fake: "provider-shaped Web Push fake — C3"
    production_fake_forbidden: true
    activation_smoke: "credentials-activation-smoke: subscription accept"
    evidence_required: "live web push accept"

  - id: email_ses
    provider: aws_ses            # SMTP fallback supported via the same adapter
    capability: transactional_email_delivery
    environment: [staging, production]
    required_for_profiles: [staging, production-lean, production-scale]
    secret_reference: "byok:notification:email"
    format: "AWS SES access (IAM) OR SMTP host+user+password; plus a verified sender domain"
    validation_method: "credentials-preflight: assert verified sender + credentials present; no live send"
    rotation_method: "rotate IAM/SMTP secret; re-insert"
    least_privilege_scope: "ses:SendEmail for the verified domain only"
    owner: notification-backend
    documentation: "docs/source-of-truth/CREDENTIAL_ACTIVATION.md"
    local_fake: "provider-shaped email fake (accepts, returns synthetic message id; bounce hook) — C3"
    production_fake_forbidden: true
    activation_smoke: "credentials-activation-smoke: send to a mailbox + delivery/bounce receipt"
    evidence_required: "live send + delivery/bounce receipt"

  - id: apple_signing
    provider: apple_developer_program
    capability: ios_build_signing_and_distribution
    environment: [production]
    required_for_profiles: []          # distribution pipeline is C8 (staged); iOS-sim compile needs no signing
    secret_reference: "byok:distribution:apple_signing"
    format: "signing certificate(s) + provisioning profile(s) + App Store Connect API key"
    validation_method: "credentials-preflight: assert cert validity + bundle-id match; no upload"
    rotation_method: "renew cert/profile in Apple Developer portal; re-insert"
    least_privilege_scope: "single app record; App Store Connect API key with least role"
    owner: release-infra
    documentation: "docs/source-of-truth/CREDENTIAL_ACTIVATION.md"
    local_fake: "n/a (signing is not faked; unsigned simulator builds are the local path)"
    production_fake_forbidden: true
    activation_smoke: "signed .ipa + TestFlight upload (rehearsal)"
    evidence_required: "TestFlight internal build available"

  - id: google_play_signing
    provider: google_play_console
    capability: android_build_signing_and_distribution
    environment: [production]
    required_for_profiles: []          # distribution pipeline is C8 (staged); Android-emulator compile needs no store signing
    secret_reference: "byok:distribution:google_play_signing"
    format: "upload key + Play app-signing enrollment + Play Developer API service account"
    validation_method: "credentials-preflight: assert keystore validity + package match; no upload"
    rotation_method: "rotate upload key via Play; re-insert"
    least_privilege_scope: "single package; Play API service account with least role"
    owner: release-infra
    documentation: "docs/source-of-truth/CREDENTIAL_ACTIVATION.md"
    local_fake: "n/a (unsigned emulator builds are the local path)"
    production_fake_forbidden: true
    activation_smoke: "signed AAB + Play internal-track upload (rehearsal)"
    evidence_required: "Play internal-track build available"

# Referenced-but-owned-elsewhere credentials (AWS infra, database, object storage, auth provider,
# workforce identity) are declared by the existing deployment contract
# (docs/integration-control-plane/DEPLOYMENT_CONTRACT.yaml) and the credential platform; this program
# does not redeclare them.
referenced_elsewhere:
  - aws_deployment: "docs/integration-control-plane/DEPLOYMENT_CONTRACT.yaml"
  - credential_backend: "Backend Architecture/aether-backend/shared/credentials/"
  - workforce_identity: "Backend Architecture/aether-backend/services/kyber/identity/oidc.py (Google Workspace)"
