version: 1
allowed_terminal_conclusions: [success]
branch_protection:
  repository: origin
  branch: main
  verification_required_for_release: true
  unavailable_action: >-
    A repository administrator must require every merge-blocking check on main
    (path-scoped checks block only when their paths are touched) and attach
    exported GitHub ruleset evidence to the release bundle.
checks:
  - id: sdk-js
    workflow: .github/workflows/sdk-release-validation.yml
    job: sdk-js
    applicability: [shared_contracts, web_sdk, react_native_sdk, sdk_metadata]
    blocks_pr_merge_when_paths_touched: true
    blocks_sdk_release: true
    blocks_founding_tenant_release: true
    runner_class: ubuntu
    evidence_artifact: sdk-js-release-evidence
  - id: android
    workflow: .github/workflows/sdk-release-validation.yml
    job: android
    applicability: [shared_contracts, android_sdk, sdk_metadata]
    blocks_pr_merge_when_paths_touched: true
    blocks_sdk_release: true
    blocks_founding_tenant_release: true
    runner_class: ubuntu
    evidence_artifact: android-release-evidence
  - id: ios
    workflow: .github/workflows/sdk-release-validation.yml
    job: ios
    applicability: [shared_contracts, ios_sdk, react_native_sdk, sdk_metadata]
    blocks_pr_merge_when_paths_touched: true
    blocks_sdk_release: true
    blocks_founding_tenant_release: true
    runner_class: macos
    evidence_artifact: ios-release-evidence
  - id: repo-health-validate
    workflow: .github/workflows/repo-health.yml
    job: validate
    applicability: [backend, ml, frontend, e2e_tenant, docs]
    blocks_pr_merge: true
    blocks_founding_tenant_release: true
    runner_class: ubuntu
    evidence_artifact: repo-health-validate-evidence
  - id: hardening-release-gate
    workflow: .github/workflows/hardening-release-gate.yml
    job: canonical-gates
    applicability: [release_gate, ci_check]
    blocks_pr_merge: true
    blocks_founding_tenant_release: true
    runner_class: ubuntu
    evidence_artifact: hardening-release-gate-evidence
  - id: repo-consistency
    workflow: .github/workflows/repo-consistency.yml
    job: repo-consistency
    applicability: [repo_consistency, docs, contracts]
    blocks_pr_merge: true
    blocks_founding_tenant_release: true
    runner_class: ubuntu
    evidence_artifact: repo-consistency-evidence
  - id: smart-contract-analysis
    workflow: .github/workflows/smart-contract-analysis.yml
    job: slither
    applicability: [smart_contracts]
    blocks_pr_merge_when_paths_touched: true
    runner_class: ubuntu
    evidence_artifact: smart-contract-analysis-evidence
  - id: smart-contract-tests
    workflow: .github/workflows/smart-contract-analysis.yml
    job: contract-tests
    applicability: [smart_contracts]
    blocks_pr_merge_when_paths_touched: true
    runner_class: ubuntu
    evidence_artifact: contract-tests-evidence
