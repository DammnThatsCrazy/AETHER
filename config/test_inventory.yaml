schema_version: 1
defaults:
  owner: quality
  domain: platform
  risk: medium
  contract_protected: false
  runtime_budget_seconds: 30
  dependencies: []
  flakiness: stable
  last_meaningful_failure: null
  execution_lane: pr
  duplicate_of: null
  status: active
  disposition: KEEP
rules:
  - paths: ["tests/**"]
    dependencies: ["scripts/**", "config/**", "packages/**", "docs/archive/legacy-architecture/backend/**"]
  - paths: ["docs/archive/legacy-architecture/backend/**/tests/**"]
    owner: backend
    domain: backend
    dependencies: ["docs/archive/legacy-architecture/backend/**"]
  - paths: ["frontend/**"]
    owner: frontend
    domain: frontend
    dependencies: ["frontend/**", "packages/shared/**"]
  - paths: ["packages/**"]
    owner: sdk
    domain: sdk
    dependencies: ["packages/**"]
  - paths: ["services/ml/**/tests/**"]
    owner: ml
    domain: machine_learning
    dependencies: ["services/ml/**"]
quarantines: []
