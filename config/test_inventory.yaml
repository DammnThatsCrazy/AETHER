schema_version: 1
defaults:
  owner: quality
  domain: platform
  risk: medium
  contract_protected: false
  runtime_budget_seconds: 30
  dependencies: []
  flakiness: stable
  last_meaningful_failure: null
  execution_lane: pr
  duplicate_of: null
  status: active
  disposition: KEEP
rules:
  - paths: ["tests/**"]
    dependencies: ["scripts/**", "config/**", "packages/**", "Backend Architecture/**"]
  - paths: ["Backend Architecture/**/tests/**"]
    owner: backend
    domain: backend
    dependencies: ["Backend Architecture/**"]
  - paths: ["frontend/**"]
    owner: frontend
    domain: frontend
    dependencies: ["frontend/**", "packages/shared/**"]
  - paths: ["packages/**"]
    owner: sdk
    domain: sdk
    dependencies: ["packages/**"]
  - paths: ["ML Models/**/tests/**"]
    owner: ml
    domain: machine_learning
    dependencies: ["ML Models/**"]
quarantines: []
