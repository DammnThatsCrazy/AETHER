schema_version: 1
default_lane: pr
lanes:
  fast: [ci_control_toolchain, repository_metadata, test_inventory, delivery_metadata, verification_policy, impact_graph, telemetry_contracts, workflow_authority, ci_execution_contracts]
  pr: [ci_control_toolchain, repository_metadata, test_inventory, delivery_metadata, contracts]
  integration: [toolchain, repository_metadata, contracts, integration]
  regression: [toolchain, repository_metadata, contracts, integration, regression]
  release: [toolchain, repository_metadata, contracts, integration, regression, release]

checks:
  ci_control_toolchain:
    owner: platform
    risk: critical
    command: [python, scripts/validate_ci_control_toolchain.py]
    runtime_budget_seconds: 15
  toolchain:
    owner: platform
    risk: critical
    command: [python, scripts/validate_toolchain.py]
    runtime_budget_seconds: 15
  repository_metadata:
    owner: platform
    risk: high
    command: [python, scripts/validate_makefile.py]
    runtime_budget_seconds: 5
  test_inventory:
    owner: quality
    risk: high
    command: [python, scripts/test_inventory.py, --summary]
    runtime_budget_seconds: 10
  delivery_metadata:
    owner: release
    risk: critical
    command: [python, scripts/validate_delivery_profiles.py, --check-registry]
    runtime_budget_seconds: 5
  verification_policy:
    owner: platform
    risk: critical
    command: [python, scripts/validate_verification_policy.py]
    runtime_budget_seconds: 5
  impact_graph:
    owner: platform
    risk: critical
    command: [python, scripts/validate_impact_graph.py]
    runtime_budget_seconds: 15
  telemetry_contracts:
    owner: platform
    risk: high
    command: [python, scripts/validate_telemetry_contracts.py]
    runtime_budget_seconds: 10
  workflow_authority:
    owner: platform
    risk: critical
    command: [python, scripts/release/check_delivery_workflow_authority.py]
    runtime_budget_seconds: 15
  ci_execution_contracts:
    owner: platform
    risk: critical
    command: [python, scripts/validate_ci_execution_contracts.py]
    runtime_budget_seconds: 15
  docs:
    owner: docs
    risk: high
    command: [make, docs-check]
    runtime_budget_seconds: 60
  contracts:
    owner: platform
    risk: critical
    command: [python, scripts/validate_contracts.py]
    runtime_budget_seconds: 30
  integration:
    owner: platform
    risk: high
    command: [make, integration-durable]
    runtime_budget_seconds: 600
  regression:
    owner: quality
    risk: high
    command: [make, test]
    runtime_budget_seconds: 3600
  release:
    owner: release
    risk: critical
    command: [make, release-gate]
    runtime_budget_seconds: 7200

domains:
  delivery:
    owner: platform
    paths: [Makefile, scripts/**, config/**, .github/workflows/**]
    checks: [toolchain, repository_metadata, delivery_metadata]
    path_checks:
      .github/workflows/**: [workflow_authority]
      config/delivery_workflow_authority.yaml: [workflow_authority]
      scripts/release/check_delivery_workflow_authority.py: [workflow_authority]
    minimum_lane: fast
  backend:
    owner: backend
    paths: [services/backend/**, services/agents/**, services/compliance/**, docs/archive/legacy-architecture/backend/**, tests/**]
    # Component suites are the ordinary-PR authority. The aggregate backend
    # suite remains registered for regression/release lanes only.
    checks: [backend-identity, backend-ingestion, backend-campaigns, backend-profile360, backend-agent, backend-computation, backend-value, agent-layer, compliance, journey-service, backend-observability, root-unit-control, root-unit-identity-profile, root-unit-ingestion, root-unit-graph, root-unit-frontend-sdk, root-unit-commerce-value, root-unit-security, root-unit-operations, root-unit-platform]
    path_checks:
      services/backend/services/identity/**: [backend-identity]
      services/backend/services/ingestion/**: [backend-ingestion]
      services/backend/services/campaign/**: [backend-campaigns]
      services/backend/services/profile/**: [backend-profile360]
      services/backend/services/profile360_workers/**: [backend-profile360]
      services/backend/services/agent/**: [backend-agent]
      services/backend/services/computation/**: [backend-computation]
      services/backend/services/value/**: [backend-value]
      services/backend/tests/valuation/**: [backend-value]
      services/backend/services/agent_comm_observability/**: [backend-observability]
      services/backend/services/external_account_observability/**: [backend-observability]
      services/backend/services/agentic_observability/**: [backend-observability]
      services/backend/services/protocol_observability/**: [backend-observability]
      services/agents/**: [agent-layer]
      services/compliance/**: [compliance]
      docs/archive/legacy-architecture/backend/services/journey-service/**: [journey-service]
      tests/**: [root-unit-control, root-unit-identity-profile, root-unit-ingestion, root-unit-graph, root-unit-frontend-sdk, root-unit-commerce-value, root-unit-security, root-unit-operations, root-unit-platform]
    minimum_lane: pr
  frontend:
    owner: frontend
    paths: [frontend/**]
    checks: [frontend-aether, frontend-kyber, frontend-shared]
    path_checks:
      frontend/aether/**: [frontend-aether]
      frontend/kyber/**: [frontend-kyber]
      frontend/shared/**: [frontend-shared]
      frontend/docs/**: [frontend-docs]
      frontend/demo/**: [frontend-demo]
      frontend/aether-marketing/**: [frontend-aether-marketing]
      frontend/olympus-marketing/**: [frontend-olympus-marketing]
    minimum_lane: pr
  sdk:
    owner: sdk
    paths: [packages/**]
    checks: [sdk-shared, sdk-web, sdk-server, sdk-react-native, contracts]
    path_checks:
      packages/shared/**: [sdk-shared]
      packages/web/**: [sdk-web]
      packages/server/**: [sdk-server]
      packages/react-native/**: [sdk-react-native]
    minimum_lane: pr
  machine_learning:
    owner: ml
    paths: [services/ml/**]
    checks: [ml]
    minimum_lane: pr
  infrastructure:
    owner: platform
    paths: [docs/archive/legacy-architecture/aws-deployment/**, deploy/**, docker-compose.yml]
    checks: [integration]
    minimum_lane: integration
  documentation:
    owner: docs
    paths: [docs/**, README.md, DEVELOPMENT.md, CONTRIBUTING.md, ARCHITECTURE.md, RELEASES.md, SECURITY.md, VERSION, CHANGELOG.md, .github/CODEOWNERS, .github/pull_request_template.md, AGENTS.md, CLAUDE.md, .codex/instructions.md]
    checks: [docs]
    minimum_lane: fast

global_scopes:
  verification_control_plane:
    owner: platform
    paths:
      - .github/workflows/**
      - config/verification_router.yaml
      - config/impact_graph.json
      - config/test_suites.yaml
      - config/test_suites.schema.json
      - config/ci_runtime_budgets.yaml
      - config/dependency_profiles.yaml
      - config/ci_performance_policy.yaml
      - config/telemetry_contracts.json
      - contracts/delivery/**
      - scripts/check_router.py
      - scripts/impact_graph.py
      - scripts/verification_disposition.py
      - scripts/verification_execution_plan.py
      - scripts/aggregate_verification_evidence.py
      - scripts/lib/ci_performance.py
      - scripts/suite_worker.py
      - scripts/universal_fast.py
      - scripts/validate_ci_performance_policy.py
      - scripts/validate_execution_plan.py
      - scripts/verify_candidate_evidence.py
      - scripts/validate_ci_execution_contracts.py
      - scripts/lib/verification_router.py
      - scripts/lib/impact_graph.py
      - scripts/lib/build_selection.py
      - scripts/lib/test_suites.py
      - scripts/validate_ci_control_toolchain.py
    checks:
      - repository_metadata
      - test_inventory
      - delivery_metadata
      - verification_policy
      - impact_graph
      - telemetry_contracts
      - workflow_authority
      - ci_execution_contracts
    minimum_lane: integration
    domains: [delivery]
  python_dependency_graph:
    owner: platform
    paths: [pyproject.toml]
    checks: [toolchain, repository_metadata, test_inventory, delivery_metadata, contracts]
    minimum_lane: pr
    domains: [delivery, backend, machine_learning]
  node_dependency_graph:
    owner: platform
    paths: [package.json, package-lock.json]
    checks: [toolchain, repository_metadata, test_inventory, delivery_metadata, contracts]
    minimum_lane: pr
    domains: [delivery, frontend, sdk]
  shared_runtime_contract:
    owner: platform
    paths: [packages/shared/contracts/**]
    checks: [contracts]
    minimum_lane: pr
    domains: [backend, frontend, sdk]
