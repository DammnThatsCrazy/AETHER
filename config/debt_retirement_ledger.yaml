# Technical-debt retirement ledger — the enforceable cutover registry for the
# architecture reset (docs/blueprints/architecture-reset/technical-debt-retirement.md).
#
# One row per duplicated authority. A cutover is finished when the replaced path
# is gone, not when the new path works. `scripts/validate_debt_retirement_ledger.py`
# enforces this file (run by `make repo-doctor`); `--report` prints repository size
# against the baseline below.
#
# Fields
#   id               stable slug
#   domain           runtime-spine stage or control-plane area
#   classification   core | beta | experimental | internal | deprecated | archived | removed
#   state            retain | converge | deprecated | deletion-ready | removed
#   authority        the single canonical owner after the cutover
#   current          paths that implement the authority today (must exist until removed)
#   duplicates       whole paths that disappear at cutover (must exist until removed;
#                    must be gone when state is removed)
#   retire           what is retired when it is not a whole path (a function, a table, a flag)
#   consumers        paths that keep the duplicate alive today; deletion-ready needs []
#   compatibility    API / SDK / data compatibility that must survive
#   mechanism        adapter | dual-write | dual-read | alias | migration | delete | none
#   parity_evidence  what shows the new path behaves the same (required to delete)
#   usage_evidence   what shows the old path is unused (required to delete)
#   rollback         what happens if the new authority fails
#   removal_pr       the PR that physically deletes it (required when removed)
#   deadline         ISO date; converge / deprecated / deletion-ready rows must have one,
#                    and an expired deadline fails validation so a compatibility layer
#                    cannot become permanent
#
# Source of the structural claims: docs/blueprints/architecture-reset/
# {runtime-authority-map,delivery-authority-map,cutover-inventory}.md.

