mobile:
  apps_enabled: false
  distribution_posture: design_partner_dev_only
  react_native_sdk:
    release_policy: conditional_on_gate_pass
    intended_release: 1.0.0-alpha.0
    required_gates:
      - scripts/validate_sdk_release_alignment.py
      - scripts/release/sdk_conformance.py
      - npm run typecheck --workspace=packages/react-native
      - native compile on hosted macOS/Android toolchains
  apps:
    - aether-mobile: design_partner_dev_only
    - kyber-mobile: design_partner_dev_only
access_boundary:
  aether_tenant_admin:
    can_access_kyber: false
    can_access_aether: true
  kyber_internal_operator:
    workforce_identity_required: true
    legacy_tenant_operator_path: false
    public_dns: none
release_surface:
  included:
    - Web Aether tenant application and authentication threshold
    - canonical SDK ingestion via POST /v1/batch
    - identity, profile, graph, consent, DSR, exports, and bounded operations routes
    - Olympus Labs and Aether public marketing shells
    - Amplify-hosted docs, app, and public status surface
  credential_gated:
    - AETHER_CONNECTOR_BYOK_ENABLED
    - AETHER_COMMS_INGESTION_ENABLED
    - AETHER_COMMS_CAMPAIGN_PROJECTION_ENABLED
    - AETHER_COMMS_JOURNEYS_ENABLED
    - AETHER_COMMS_GRAPH_ENABLED
    - AETHER_COMMS_PROFILE360_ENABLED
    - AETHER_COMMS_CAMPAIGN360_ENABLED
    - AETHER_COMMS_NOESIS_ENABLED
    - AETHER_DELIVERY_WORKER_ENABLED
    - PROVIDER_GATEWAY_ENABLED
    - AETHER_PROVIDER_RUNTIME_ENABLED
    - AETHER_CONNECTORS_ENABLED
    - AETHER_CONNECTOR_ACTIONS_ENABLED
    - AETHER_EXTERNAL_BILLING_ENABLED
    - AETHER_STRIPE_BILLING_ENABLED
  excluded_from_first_release:
    - AETHER_MOBILE_ENABLED
    - AETHER_PAYMENT_RAILS_ENABLED
    - AETHER_STABLECOIN_INTELLIGENCE_ENABLED
    - AETHER_DERIVATIVES_RUNTIME_ENABLED
    - AETHER_INTEROP_INGESTION_ENABLED
    - AETHER_AGENT_RUNTIME_DURABLE_ENABLED
    - AETHER_CATALYST_CYCLE_AUTOMATION_ENABLED
hosting:
  canonical_domains:
    olympus_marketing: https://www.olympuslabsml.com
    aether_marketing: https://aether.olympuslabsml.com
    docs: https://docs.olympuslabsml.com
    app: https://app.olympuslabsml.com
    status: https://status.olympuslabsml.com
    api: https://api.olympuslabsml.com
  kyber: internal_only_no_public_dns
  staging_custom_domain: enabled
cost_guardrails:
  seven_consecutive_observed_days_required: true
  evidence_mode: observed_only
  monthly_target_usd: 25
  monthly_hard_cap_usd: 50
  status_api_url: "https://api.staging.olympuslabsml.com/health"
sdk_release:
  package_families:
    - "@aether/shared"
    - "@aether/web"
    - "@aether/react-native"
    - AetherSDK (CocoaPods)
    - com.aether:sdk-android
  publish_workflow: .github/workflows/publish-sdk.yml
  publish_mode: manual_workflow_dispatch_with_dry_run
  mobile_apps_included: false
notes:
  - Source defaults are resolved explicitly here; unlisted flags are denied by policy.
  - Credential-gated capabilities may be exercised only after tenant/provider credentials pass the connection self-check.
  - These manifests authorize a bounded alpha posture and do not claim production readiness.
