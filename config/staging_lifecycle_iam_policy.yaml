# Reviewed contract for the role used by staging-lifecycle.yml and
# staging-ttl-guard.yml. This is deliberately separate from the Terraform
# apply role: lifecycle may observe, wake, and sleep staging, but may not
# provision infrastructure or read application secrets. The only secret-value
# exception is the one-time first-admin bootstrap token, scoped by its exact
# Secrets Manager name prefix and matching Secrets Manager KMS context.
version: 1
profile: staging
role: AetherStagingLifecycle
region: us-east-1
statements:
  - sid: InspectStagingEcsCluster
    actions:
      - ecs:DescribeClusters
    resource: arn:aws:ecs:us-east-1:${account_id}:cluster/AETHER-staging
    scope: staging-cluster
  - sid: ListStagingServices
    actions:
      - ecs:ListServices
    resource: '*'
    scope: staging-cluster
    conditions:
      ArnEquals:
        ecs:cluster: arn:aws:ecs:us-east-1:${account_id}:cluster/AETHER-staging
  - sid: ListStagingTasks
    actions:
      - ecs:ListTasks
    resource: '*'
    scope: staging-cluster
    conditions:
      ArnEquals:
        ecs:cluster: arn:aws:ecs:us-east-1:${account_id}:cluster/AETHER-staging
  - sid: InspectStagingServices
    actions:
      - ecs:DescribeServices
    resource: arn:aws:ecs:us-east-1:${account_id}:service/AETHER-staging/AETHER-staging-*
    scope: staging-service
  - sid: InspectStagingTasks
    actions:
      - ecs:DescribeTasks
    resource: arn:aws:ecs:us-east-1:${account_id}:task/AETHER-staging/*
    scope: staging-task
  - sid: StopStagingTasks
    actions:
      - ecs:StopTask
    resource: arn:aws:ecs:us-east-1:${account_id}:task/AETHER-staging/*
    scope: staging-task
    conditions:
      ArnEquals:
        ecs:cluster: arn:aws:ecs:us-east-1:${account_id}:cluster/AETHER-staging
  - sid: InspectStagingTaskDefinitions
    actions:
      - ecs:DescribeTaskDefinition
    resource: '*'
    scope: global-read-required-by-api
  - sid: MutateStagingEcs
    actions:
      - ecs:UpdateService
    resource: arn:aws:ecs:us-east-1:${account_id}:service/AETHER-staging/AETHER-staging-*
    scope: staging-service
  - sid: RunStagingMigrationTasks
    actions:
      - ecs:RunTask
    resource:
      - arn:aws:ecs:us-east-1:${account_id}:task-definition/AETHER-staging-*
      - arn:aws:ecs:us-east-1:${account_id}:cluster/AETHER-staging
    scope: staging-migration
    conditions:
      ArnEquals:
        ecs:cluster: arn:aws:ecs:us-east-1:${account_id}:cluster/AETHER-staging
  - sid: PassOnlyStagingTaskRoles
    actions:
      - iam:PassRole
    resource:
      - arn:aws:iam::${account_id}:role/AETHER-staging-ecs-task-role
      - arn:aws:iam::${account_id}:role/AETHER-staging-ecs-execution-role
    scope: staging-task-roles
    conditions:
      StringEquals:
        iam:PassedToService:
          - ecs-tasks.amazonaws.com
  - sid: ManageStagingAwakeLease
    actions:
      - ssm:GetParameter
      - ssm:PutParameter
      - ssm:DeleteParameter
    resource: arn:aws:ssm:us-east-1:${account_id}:parameter/aether/staging/lifecycle/awake-until
    scope: staging-lease
  - sid: ReadStagingStaticBucketParameters
    actions:
      - ssm:GetParameter
    resource:
      - arn:aws:ssm:us-east-1:${account_id}:parameter/aether/staging/AETHER_STATIC_BUCKET
      - arn:aws:ssm:us-east-1:${account_id}:parameter/aether/staging/KYBER_STATIC_BUCKET
    scope: staging-static-bucket-parameters
  - sid: PublishStagingStaticArtifacts
    actions:
      - s3:ListBucket
      - s3:GetObject
      - s3:PutObject
      - s3:DeleteObject
    resource:
      - arn:aws:s3:::aether-staging-*
      - arn:aws:s3:::aether-staging-*/*
    scope: staging-static-assets
  - sid: InspectStagingLogs
    actions:
      - logs:DescribeLogGroups
    resource: '*'
    scope: global-read-required-by-api
  - sid: ReadStagingLogEvents
    actions:
      - logs:GetLogEvents
    resource: arn:aws:logs:us-east-1:${account_id}:log-group:/ecs/AETHER-staging/*:log-stream:*
    scope: staging-log-streams
  - sid: InspectStagingMetrics
    actions:
      - cloudwatch:ListMetrics
    resource: '*'
    scope: global-read-required-by-api
  - sid: InspectStagingAutoscalingTargets
    actions:
      - application-autoscaling:DescribeScalableTargets
    resource: '*'
    scope: global-read-required-by-api
  - sid: ReadStagingAutoscalingTargetTags
    actions:
      - application-autoscaling:ListTagsForResource
    resource: arn:aws:application-autoscaling:us-east-1:${account_id}:scalable-target/*
    scope: staging-autoscaling-targets
  - sid: PreventAutoscalingRevival
    actions:
      - application-autoscaling:RegisterScalableTarget
    resource: arn:aws:application-autoscaling:us-east-1:${account_id}:scalable-target/*
    scope: staging-ecs-scalable-targets
    conditions:
      StringEquals:
        application-autoscaling:service-namespace:
          - ecs
        application-autoscaling:scalable-dimension:
          - ecs:service:DesiredCount
        aws:ResourceTag/Environment:
          - staging
        aws:ResourceTag/Project:
          - AETHER
  - sid: ReadFirstAdminBootstrapToken
    actions:
      - secretsmanager:GetSecretValue
    resource: arn:aws:secretsmanager:us-east-1:544471417928:secret:aether/first-admin-bootstrap-token-*
    scope: first-admin-bootstrap-token
  - sid: DecryptFirstAdminBootstrapToken
    actions:
      - kms:Decrypt
    resource: arn:aws:kms:us-east-1:544471417928:key/91753780-d694-4e5a-9e80-7123af974554
    scope: first-admin-bootstrap-token-cmk
    conditions:
      StringEquals:
        kms:ViaService: secretsmanager.us-east-1.amazonaws.com
      StringLike:
        kms:EncryptionContext:SecretARN: arn:aws:secretsmanager:us-east-1:544471417928:secret:aether/first-admin-bootstrap-token-*
  - sid: ReadStagingBudgetLeaseEvidence
    actions:
      - sts:GetCallerIdentity
    resource: '*'
    scope: identity-verification

forbidden_actions:
  - terraform:*
  - secretsmanager:*
  - iam:CreateRole
  - iam:PutRolePolicy
  - iam:AttachRolePolicy
  - ec2:*
  - rds:*
  - kms:*
allowed_action_exceptions:
  - ReadFirstAdminBootstrapToken
  - DecryptFirstAdminBootstrapToken
