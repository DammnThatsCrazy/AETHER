# Reviewed contract for the staging Terraform apply role.
#
# This is intentionally a contract, not an automatically attached broad IAM
# policy. The bootstrap/console attachment must resolve the account-specific
# ARNs and preserve these scopes. Unknown actions fail validation rather than
# being silently added to the role.
version: 1
profile: staging
role: AetherStagingDeploy
region: us-east-1
statements:
  - sid: ConfigureStagingBuckets
    actions:
      - s3:PutEncryptionConfiguration
      - s3:PutLifecycleConfiguration
    resource: arn:aws:s3:::aether-staging-*
    scope: staging-name-prefix
  - sid: TagStagingRepositories
    actions:
      - ecr:TagResource
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  - sid: ReadStagingRepositoryTags
    actions:
      - ecr:ListTagsForResource
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  - sid: InspectStagingRepositories
    actions:
      - ecr:DescribeRepositories
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  - sid: ConfigureStagingRepositoryScanning
    actions:
      - ecr:PutImageScanningConfiguration
      - ecr:DescribeImageScanFindings
      - ecr:GetImageScanningConfiguration
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  - sid: ManageStagingEcrLifecyclePolicies
    actions:
      - ecr:GetLifecyclePolicy
      - ecr:PutLifecyclePolicy
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  - sid: ManageStagingEcrRepositoryPolicies
    actions:
      - ecr:GetRepositoryPolicy
      - ecr:SetRepositoryPolicy
      - ecr:DeleteRepositoryPolicy
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  - sid: TagStagingSecrets
    actions:
      - secretsmanager:TagResource
    resource: arn:aws:secretsmanager:us-east-1:${account_id}:secret:aether/*
    scope: staging-name-prefix
  - sid: VerifyStagingSecretVersions
    actions:
      - secretsmanager:DescribeSecret
      - secretsmanager:GetResourcePolicy
      - secretsmanager:ListSecretVersionIds
    resource: arn:aws:secretsmanager:us-east-1:${account_id}:secret:aether/*
    scope: staging-name-prefix
  - sid: ManageStagingSecrets
    actions:
      - secretsmanager:CreateSecret
      - secretsmanager:UpdateSecret
      - secretsmanager:DeleteSecret
    resource: arn:aws:secretsmanager:us-east-1:${account_id}:secret:aether/*
    scope: staging-name-prefix
  - sid: ConfigureStagingSecretRotation
    actions:
      - secretsmanager:RotateSecret
    resource: arn:aws:secretsmanager:us-east-1:${account_id}:secret:aether/*
    scope: staging-name-prefix
  - sid: TagStagingParameters
    actions:
      - ssm:AddTagsToResource
      - ssm:ListTagsForResource
    resource: arn:aws:ssm:us-east-1:${account_id}:parameter/aether/staging/*
    scope: staging-name-prefix
  - sid: CreateStagingKmsKeys
    actions:
      - kms:CreateKey
    resource: '*'
    scope: staging-kms-request-tag
    conditions:
      aws:RequestTag/Environment: staging
  - sid: TagStagingKmsKeys
    actions:
      - kms:TagResource
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: TagStagingKmsKeysOnCreate
    actions:
      - kms:TagResource
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-request-tag
    conditions:
      aws:RequestTag/Environment: staging
  - sid: CreateStagingKmsAliasResource
    actions:
      - kms:CreateAlias
    resource: arn:aws:kms:us-east-1:${account_id}:alias/aether-staging-*
    scope: staging-kms-alias-prefix
    conditions:
      kms:RequestAlias: alias/aether-staging-*
    condition_operators:
      kms:RequestAlias: StringLike
  - sid: CreateStagingKmsAliasTarget
    actions:
      - kms:CreateAlias
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: DiscoverStagingKmsAliases
    actions:
      - kms:ListAliases
    resource: '*'
    scope: global-read-required-by-api
  - sid: CreateStagingKmsGrants
    actions:
      - kms:CreateGrant
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: UpdateStagingKmsPolicies
    actions:
      - kms:PutKeyPolicy
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: UseStagingKmsKeysForEncryptedResources
    actions:
      - kms:GenerateDataKey
      - kms:Decrypt
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: ReadStagingBucketEncryption
    actions:
      - s3:GetEncryptionConfiguration
      - s3:GetReplicationConfiguration
    resource: arn:aws:s3:::aether-staging-*
    scope: staging-name-prefix
  - sid: DiscoverVpcSecurityGroupsForStagingAlb
    actions:
      - ec2:GetSecurityGroupsForVpc
    resource: '*'
    scope: global-read-required-by-api
  - sid: ReadAccountFreeTierPlan
    actions:
      - freetier:GetAccountPlanState
    resource: '*'
    scope: global-read-required-by-api
  - sid: ReadStagingKeyRotation
    actions:
      - kms:GetKeyRotationStatus
    resource: '*'
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: ReadStagingKeyMetadata
    actions:
      - kms:DescribeKey
      - kms:GetKeyPolicy
      - kms:ListResourceTags
    resource: arn:aws:kms:us-east-1:${account_id}:key/*
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
  - sid: ScheduleDeletionForReviewedStagingKeys
    actions:
      - kms:ScheduleKeyDeletion
    resource: '*'
    scope: staging-kms-resource-tag
    conditions:
      aws:ResourceTag/Environment: staging
      kms:ScheduleKeyDeletionPendingWindowInDays: "30"
  - sid: ModifyStagingTargetGroups
    actions:
      - elasticloadbalancing:ModifyTargetGroupAttributes
    resource: arn:aws:elasticloadbalancing:us-east-1:${account_id}:targetgroup/aether-staging-*
    scope: staging-name-prefix
  - sid: DiscoverStagingTargetGroups
    actions:
      - elasticloadbalancing:DescribeTargetGroups
    resource: '*'
    scope: global-read-required-by-api
  - sid: DiscoverStagingLoadBalancers
    actions:
      - elasticloadbalancing:DescribeLoadBalancers
    resource: '*'
    scope: global-read-required-by-api
  - sid: DiscoverStagingListeners
    actions:
      - elasticloadbalancing:DescribeListeners
    resource: '*'
    scope: global-read-required-by-api
  - sid: VerifyTerraformStateAccess
    actions:
      - iam:SimulatePrincipalPolicy
    resource: '*'
    scope: policy-verification-only
  - sid: ModifyStagingLoadBalancers
    actions:
      - elasticloadbalancing:ModifyLoadBalancerAttributes
    resource: arn:aws:elasticloadbalancing:us-east-1:${account_id}:loadbalancer/app/aether-staging-*
    scope: staging-name-prefix
  - sid: ReadStagingDynamoTags
    actions:
      - dynamodb:ListTagsOfResource
    resource: arn:aws:dynamodb:us-east-1:${account_id}:table/AETHER-staging-*
    scope: staging-name-prefix
  - sid: ConfigureStagingNotifications
    actions:
      - sns:SetTopicAttributes
      - sns:DeleteTopic
      - sns:Subscribe
    resource:
      - arn:aws:sns:us-east-1:${account_id}:aether-staging-*
      - arn:aws:sns:us-east-1:${account_id}:AETHER-staging-*
    scope: project-staging-name-prefix
  - sid: EnsureEcsServiceLinkedRole
    actions:
      - iam:CreateServiceLinkedRole
    resource: '*'
    conditions:
      iam:AWSServiceName: ecs.amazonaws.com
    scope: ecs-service-linked-role-only
  - sid: ReadEcsServiceLinkedRole
    actions:
      - iam:GetRole
    resource: arn:aws:iam::${account_id}:role/aws-service-role/ecs.amazonaws.com/AWSServiceRoleForECS
    scope: ecs-service-linked-role-only
  - sid: PassOnlyStagingEcsTaskRole
    actions:
      - iam:PassRole
    resource: arn:aws:iam::${account_id}:role/AETHER-staging-ecs-task-role
    conditions:
      iam:PassedToService:
        - ecs-tasks.amazonaws.com
    scope: staging-name-prefix
  - sid: PassOnlyStagingEcsExecutionRole
    actions:
      - iam:PassRole
    resource: arn:aws:iam::${account_id}:role/AETHER-staging-ecs-execution-role
    conditions:
      iam:PassedToService:
        - ecs-tasks.amazonaws.com
    scope: staging-name-prefix
  - sid: PassOnlyStagingFlowLogsRole
    actions:
      - iam:PassRole
    resource: arn:aws:iam::${account_id}:role/AETHER-staging-vpc-flow-logs-role
    conditions:
      iam:PassedToService:
        - vpc-flow-logs.amazonaws.com
    scope: staging-flow-logs-role
  - sid: PassOnlyStagingDriftLambdaRole
    actions:
      - iam:PassRole
    resource: arn:aws:iam::${account_id}:role/AETHER-staging-drift-lambda
    conditions:
      iam:PassedToService:
        - lambda.amazonaws.com
    scope: staging-drift-lambda-role
  - sid: TagOnlyStagingDriftLambda
    actions:
      - lambda:TagResource
    resource:
      - arn:aws:lambda:us-east-1:${account_id}:function:AETHER-staging-ml-drift
      - arn:aws:lambda:us-east-1:${account_id}:function:AETHER-staging-secret-rotation
    conditions:
      aws:RequestTag/Environment: staging
    scope: staging-name-prefix
  - sid: DiscoverStagingDriftRuleTargets
    actions:
      - events:ListTargetsByRule
    resource: arn:aws:events:us-east-1:${account_id}:rule/AETHER-staging-*
    scope: staging-name-prefix
  - sid: CreateStagingLogGroups
    actions:
      - logs:CreateLogGroup
    resource:
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/lambda/AETHER-staging-*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/ecs/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/vpc/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aether/AETHER-staging/*
    scope: staging-log-groups
  - sid: TagStagingLogGroups
    actions:
      - logs:TagResource
    resource:
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/lambda/AETHER-staging-*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/ecs/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/vpc/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aether/AETHER-staging/*
    scope: staging-log-groups
  - sid: DiscoverStagingLogGroups
    actions:
      - logs:DescribeLogGroups
    resource: '*'
    scope: global-read-required-by-api
  - sid: ManageStagingLogGroupLifecycle
    actions:
      - logs:PutRetentionPolicy
      - logs:DeleteLogGroup
    resource:
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/lambda/AETHER-staging-*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/ecs/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/vpc/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aether/AETHER-staging/*
    scope: staging-log-groups
  - sid: ManageStagingLambdaFunctions
    actions:
      - lambda:CreateFunction
      - lambda:GetFunction
      - lambda:GetFunctionCodeSigningConfig
      - lambda:UpdateFunctionCode
      - lambda:UpdateFunctionConfiguration
      - lambda:DeleteFunction
      - lambda:AddPermission
      - lambda:RemovePermission
      - lambda:GetPolicy
      - lambda:ListTags
      - lambda:GetFunctionConfiguration
    resource:
      - arn:aws:lambda:us-east-1:${account_id}:function:AETHER-staging-ml-drift
      - arn:aws:lambda:us-east-1:${account_id}:function:AETHER-staging-secret-rotation
    scope: staging-name-prefix
  - sid: ManageStagingLambdaRoles
    actions:
      - iam:CreateRole
      - iam:GetRole
      - iam:DeleteRole
      - iam:TagRole
      - iam:PutRolePolicy
      - iam:GetRolePolicy
      - iam:DeleteRolePolicy
      - iam:AttachRolePolicy
      - iam:DetachRolePolicy
      - iam:ListAttachedRolePolicies
      - iam:ListRolePolicies
      - iam:ListInstanceProfilesForRole
    resource:
      - arn:aws:iam::${account_id}:role/AETHER-staging-drift-lambda
      - arn:aws:iam::${account_id}:role/AETHER-staging-secret-rotation
    scope: staging-lambda-roles
  - sid: PassOnlyStagingRotationLambdaRole
    actions:
      - iam:PassRole
    resource: arn:aws:iam::${account_id}:role/AETHER-staging-secret-rotation
    conditions:
      iam:PassedToService:
        - lambda.amazonaws.com
    scope: staging-rotation-role
  - sid: ManageStagingEventRules
    actions:
      - events:PutRule
      - events:DeleteRule
      - events:DescribeRule
      - events:PutTargets
      - events:RemoveTargets
      - events:TagResource
    resource: arn:aws:events:us-east-1:${account_id}:rule/AETHER-staging-*
    scope: staging-name-prefix
  # ----- VPC (module.vpc) -----
  - sid: ManageStagingVpcNetwork
    actions:
      - ec2:CreateVpc
      - ec2:DeleteVpc
      - ec2:ModifyVpcAttribute
      - ec2:CreateTags
      - ec2:DeleteTags
      - ec2:CreateSubnet
      - ec2:DeleteSubnet
      - ec2:CreateInternetGateway
      - ec2:AttachInternetGateway
      - ec2:DetachInternetGateway
      - ec2:DeleteInternetGateway
      - ec2:AllocateAddress
      - ec2:ReleaseAddress
      - ec2:CreateNatGateway
      - ec2:DeleteNatGateway
      - ec2:CreateRouteTable
      - ec2:DeleteRouteTable
      - ec2:CreateRoute
      - ec2:DeleteRoute
      - ec2:AssociateRouteTable
      - ec2:DisassociateRouteTable
      - ec2:ReplaceRouteTableAssociation
      - ec2:CreateSecurityGroup
      - ec2:DeleteSecurityGroup
      - ec2:AuthorizeSecurityGroupIngress
      - ec2:AuthorizeSecurityGroupEgress
      - ec2:RevokeSecurityGroupIngress
      - ec2:RevokeSecurityGroupEgress
      - ec2:CreateFlowLogs
      - ec2:DeleteFlowLogs
    resource: '*'
    scope: staging-write-required-by-api
  - sid: ReadStagingVpcResources
    actions:
      - ec2:DescribeVpcs
      - ec2:DescribeSubnets
      - ec2:DescribeSecurityGroups
      - ec2:DescribeSecurityGroupRules
      - ec2:DescribeRouteTables
      - ec2:DescribeInternetGateways
      - ec2:DescribeNatGateways
      - ec2:DescribeAddresses
      - ec2:DescribeVpcAttribute
      - ec2:DescribeNetworkInterfaces
      - ec2:DescribeFlowLogs
      - ec2:DescribeNetworkAcls
      - ec2:DescribeVpcEndpoints
      - ec2:DescribeAvailabilityZones
    resource: '*'
    scope: global-read-required-by-api
  # ----- ECS (module.ecs) -----
  - sid: ManageStagingEcsResources
    actions:
      - ecs:CreateCluster
      - ecs:DeleteCluster
      - ecs:UpdateCluster
      - ecs:TagResource
      - ecs:RegisterTaskDefinition
      - ecs:DeregisterTaskDefinition
      - ecs:CreateService
      - ecs:DeleteService
      - ecs:UpdateService
      - ecs:PutClusterCapacityProviders
    resource: '*'
    scope: staging-write-required-by-api
  - sid: ReadStagingEcsResources
    actions:
      - ecs:DescribeServices
      - ecs:DescribeTaskDefinition
      - ecs:DescribeClusters
      - ecs:ListServices
      - ecs:ListTagsForResource
    resource: '*'
    scope: global-read-required-by-api
  # ----- ALB (module.alb) -----
  - sid: ManageStagingAlbResources
    actions:
      - elasticloadbalancing:CreateLoadBalancer
      - elasticloadbalancing:DeleteLoadBalancer
      - elasticloadbalancing:CreateTargetGroup
      - elasticloadbalancing:DeleteTargetGroup
      - elasticloadbalancing:CreateListener
      - elasticloadbalancing:DeleteListener
      - elasticloadbalancing:ModifyListener
      - elasticloadbalancing:CreateRule
      - elasticloadbalancing:DeleteRule
      - elasticloadbalancing:ModifyRule
      - elasticloadbalancing:AddTags
      - elasticloadbalancing:RemoveTags
      - elasticloadbalancing:SetSecurityGroups
      - elasticloadbalancing:SetSubnets
      - elasticloadbalancing:RegisterTargets
      - elasticloadbalancing:DeregisterTargets
      - elasticloadbalancing:DescribeLoadBalancerAttributes
      - elasticloadbalancing:DescribeListenerCertificates
      - elasticloadbalancing:DescribeTargetGroupAttributes
      - elasticloadbalancing:DescribeTags
      - elasticloadbalancing:DescribeRules
      - elasticloadbalancing:DescribeListenerAttributes
    resource: '*'
    scope: staging-write-required-by-api
  # ----- Aurora (module.aurora) -----
  - sid: ManageStagingAuroraCluster
    actions:
      - rds:CreateDBCluster
      - rds:DeleteDBCluster
      - rds:ModifyDBCluster
      - rds:CreateDBInstance
      - rds:DeleteDBInstance
      - rds:ModifyDBInstance
      - rds:CreateDBSubnetGroup
      - rds:DeleteDBSubnetGroup
      - rds:ModifyDBSubnetGroup
      - rds:CreateDBClusterParameterGroup
      - rds:DeleteDBClusterParameterGroup
      - rds:ModifyDBClusterParameterGroup
      - rds:AddTagsToResource
      - rds:RemoveTagsFromResource
      - rds:DescribeDBClusters
      - rds:DescribeDBSubnetGroups
      - rds:DescribeDBClusterParameterGroups
      - rds:DescribeDBClusterParameters
      - rds:DescribeDBInstances
      - rds:ListTagsForResource
    resource: '*'
    scope: staging-write-required-by-api
  # ----- DynamoDB (module.dynamodb_cache) -----
  - sid: ManageStagingDynamoResources
    actions:
      - dynamodb:CreateTable
      - dynamodb:DeleteTable
      - dynamodb:UpdateTable
      - dynamodb:TagResource
      - dynamodb:UntagResource
      - dynamodb:UpdateContinuousBackups
      - dynamodb:UpdateTimeToLive
      - dynamodb:DescribeTable
      - dynamodb:DescribeContinuousBackups
      - dynamodb:DescribeTimeToLive
    resource: arn:aws:dynamodb:us-east-1:${account_id}:table/AETHER-staging-*
    scope: staging-name-prefix
  # ----- SQS (module.sqs) -----
  - sid: ManageStagingSqsQueues
    actions:
      - sqs:CreateQueue
      - sqs:DeleteQueue
      - sqs:SetQueueAttributes
      - sqs:TagQueue
      - sqs:UntagQueue
      - sqs:GetQueueAttributes
      - sqs:GetQueueUrl
      - sqs:ListQueueTags
    resource: arn:aws:sqs:us-east-1:${account_id}:AETHER-staging-*
    scope: staging-name-prefix
  # ----- SNS (module.monitoring, module.sqs) -----
  - sid: ExtendStagingSnsTopics
    actions:
      - sns:CreateTopic
      - sns:TagResource
      - sns:Unsubscribe
      - sns:GetTopicAttributes
      - sns:ListTagsForResource
      - sns:GetSubscriptionAttributes
    resource:
      - arn:aws:sns:us-east-1:${account_id}:aether-staging-*
      - arn:aws:sns:us-east-1:${account_id}:AETHER-staging-*
    scope: project-staging-name-prefix
  # ----- S3 (module.s3, module.monitoring) -----
  - sid: ManageStagingBuckets
    actions:
      - s3:CreateBucket
      - s3:DeleteBucket
      - s3:PutBucketPolicy
      - s3:DeleteBucketPolicy
      - s3:PutBucketVersioning
      - s3:PutBucketLogging
      - s3:PutBucketTagging
      - s3:PutPublicAccessBlock
      - s3:PutBucketAcl
      - s3:GetBucketPolicy
      - s3:GetBucketAcl
      - s3:GetBucketCORS
      - s3:GetBucketWebsite
      - s3:GetBucketVersioning
      - s3:GetBucketLogging
      - s3:GetBucketLocation
      - s3:GetBucketTagging
      - s3:GetBucketPublicAccessBlock
      - s3:GetBucketObjectLockConfiguration
      - s3:GetAccelerateConfiguration
      - s3:GetBucketRequestPayment
      - s3:GetBucketNotification
      - s3:GetBucketOwnershipControls
      - s3:ListBucket
    resource: arn:aws:s3:::aether-staging-*
    scope: staging-name-prefix
  # ----- CloudWatch (module.monitoring) -----
  - sid: ManageStagingAlarms
    actions:
      - cloudwatch:PutMetricAlarm
      - cloudwatch:DeleteAlarms
      - cloudwatch:TagResource
      - cloudwatch:PutDashboard
      - cloudwatch:DeleteDashboards
      - cloudwatch:DescribeAlarms
      - cloudwatch:GetDashboard
      - cloudwatch:ListTagsForResource
    resource: '*'
    scope: staging-write-required-by-api
  # ----- CloudWatch Logs metric filters (module.monitoring) -----
  - sid: ManageStagingLogMetricFilters
    actions:
      - logs:PutMetricFilter
      - logs:DeleteMetricFilter
    resource:
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/lambda/AETHER-staging-*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/ecs/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aws/vpc/AETHER-staging/*
      - arn:aws:logs:us-east-1:${account_id}:log-group:/aether/AETHER-staging/*
    scope: staging-log-groups
  - sid: ReadStagingLogDetails
    actions:
      - logs:DescribeMetricFilters
      - logs:ListTagsForResource
    resource: '*'
    scope: global-read-required-by-api
  # ----- Application Auto Scaling (module.ecs, module.dynamodb_cache) -----
  - sid: ManageStagingAutoScaling
    actions:
      - application-autoscaling:RegisterScalableTarget
      - application-autoscaling:DeregisterScalableTarget
      - application-autoscaling:PutScalingPolicy
      - application-autoscaling:DeleteScalingPolicy
      - application-autoscaling:TagResource
      - application-autoscaling:DescribeScalableTargets
      - application-autoscaling:DescribeScalingPolicies
    resource: '*'
    scope: staging-write-required-by-api
  # ----- SSM Parameters (root main.tf) -----
  - sid: ManageStagingParameters
    actions:
      - ssm:PutParameter
      - ssm:DeleteParameter
      - ssm:GetParameter
      - ssm:GetParameters
    resource: arn:aws:ssm:us-east-1:${account_id}:parameter/aether/staging/*
    scope: staging-name-prefix
  - sid: DiscoverStagingParameterMetadata
    actions:
      - ssm:DescribeParameters
    resource: '*'
    scope: global-read-required-by-api
  # ----- ECR repositories (module.ecr) -----
  - sid: ManageStagingEcrRepositories
    actions:
      - ecr:CreateRepository
      - ecr:DeleteRepository
    resource: arn:aws:ecr:us-east-1:${account_id}:repository/aether-*
    scope: staging-name-prefix
  # ----- Secrets Manager discovery -----
  - sid: DiscoverStagingSecrets
    actions:
      - secretsmanager:ListSecrets
    resource: '*'
    scope: global-read-required-by-api
  # ----- STS (data.aws_caller_identity) -----
  - sid: VerifyCallerIdentity
    actions:
      - sts:GetCallerIdentity
    resource: '*'
    scope: global-read-required-by-api
  # ----- IAM infrastructure roles (module.ecs, module.vpc, module.aurora) -----
  - sid: ManageStagingInfraRoles
    actions:
      - iam:CreateRole
      - iam:GetRole
      - iam:DeleteRole
      - iam:TagRole
      - iam:PutRolePolicy
      - iam:GetRolePolicy
      - iam:DeleteRolePolicy
      - iam:AttachRolePolicy
      - iam:DetachRolePolicy
      - iam:ListAttachedRolePolicies
      - iam:ListRolePolicies
      - iam:ListInstanceProfilesForRole
    resource:
      - arn:aws:iam::${account_id}:role/AETHER-staging-ecs-task-role
      - arn:aws:iam::${account_id}:role/AETHER-staging-ecs-execution-role
