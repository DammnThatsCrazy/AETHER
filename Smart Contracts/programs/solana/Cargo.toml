# Anchor workspace manifest for the Aether Solana reward program.
#
# `domain` is a dependency-free crate with its OWN workspace root (so it builds
# and tests fully offline in isolation). The program depends on it by path; it is
# intentionally excluded from this Anchor workspace's resolution.
[workspace]
members = ["programs/*"]
exclude = ["domain"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
