version: 1
# Standalone Amplify Hosting build spec for this app deployed on its own
# (Amplify app root = frontend/olympus-marketing). For the monorepo multi-app
# setup where one Amplify app builds all four frontends from the repo root,
# use the root-level /amplify.yml instead — this file mirrors that app's
# olympus-marketing entry so either deployment shape works unmodified.
frontend:
  phases:
    preBuild:
      commands:
        # npm workspaces resolve from the repo root, so `ci` runs two levels
        # up even though this Amplify app's root is this directory.
        - cd ../.. && npm ci
    build:
      commands:
        - cd ../.. && npm run build --workspace=frontend/olympus-marketing
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
